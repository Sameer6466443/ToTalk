<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#05020d">

<title>ToTalk</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
  background:#03020a;
}

body{
  min-height:100dvh;

  color:#f8f5ff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  overflow-x:hidden;

  background:
    radial-gradient(
      circle at 75% 12%,
      rgba(112,48,218,.16),
      transparent 27%
    ),
    radial-gradient(
      circle at 10% 78%,
      rgba(91,34,186,.14),
      transparent 31%
    ),
    radial-gradient(
      circle at 50% 100%,
      rgba(70,26,150,.10),
      transparent 35%
    ),
    linear-gradient(
      145deg,
      #020108 0%,
      #070313 48%,
      #03020a 100%
    );
}

button,
input,
textarea{
  font:inherit;
  -webkit-tap-highlight-color:transparent;
}

button{
  cursor:pointer;
}

::selection{
  background:rgba(151,82,255,.35);
}


/* =========================================================
   GALAXY BACKGROUND
========================================================= */

body::before{
  content:"";

  position:fixed;
  inset:0;

  pointer-events:none;

  z-index:0;

  opacity:.48;

  background-image:
    radial-gradient(
      circle,
      rgba(255,255,255,.72) 1px,
      transparent 1.6px
    ),
    radial-gradient(
      circle,
      rgba(195,166,255,.58) 1px,
      transparent 1.6px
    ),
    radial-gradient(
      circle,
      rgba(255,255,255,.42) 1px,
      transparent 1.5px
    );

  background-size:
    125px 125px,
    190px 190px,
    270px 270px;

  background-position:
    20px 28px,
    80px 110px,
    145px 52px;
}

body::after{
  content:"";

  position:fixed;

  width:430px;
  height:430px;

  left:50%;
  top:46%;

  transform:translate(-50%,-50%);

  border-radius:50%;

  pointer-events:none;

  background:
    radial-gradient(
      circle,
      rgba(116,51,214,.075),
      transparent 67%
    );

  z-index:0;
}


/* =========================================================
   LOADING
========================================================= */

#loading{
  position:fixed;
  inset:0;

  z-index:999999;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(117,59,230,.18),
      transparent 28%
    ),
    #020108;

  transition:
    opacity .35s ease,
    visibility .35s ease;
}

#loading.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.loading-orbit{
  position:relative;

  width:112px;
  height:112px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.loading-orbit::before{
  content:"";

  position:absolute;

  inset:0;

  border:
    1px solid
    rgba(161,108,255,.35);

  border-radius:50%;

  transform:rotate(25deg) scaleX(1.6);

  animation:
    orbitOne
    4s linear infinite;
}

.loading-orbit::after{
  content:"";

  position:absolute;

  inset:0;

  border:
    1px solid
    rgba(132,72,239,.25);

  border-radius:50%;

  transform:rotate(-25deg) scaleX(1.6);

  animation:
    orbitTwo
    5s linear infinite reverse;
}

.loading-moon{
  width:53px;
  height:53px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 32% 28%,
      #fff,
      #eeeaff 55%,
      #cbc6da
    );

  box-shadow:
    0 0 20px rgba(255,255,255,.18),
    0 0 45px rgba(131,76,255,.25);

  animation:
    moonFloat
    2.8s ease-in-out infinite;
}

.loading-title{
  margin-top:19px;

  font-size:25px;
  font-weight:900;
  letter-spacing:-.7px;
}

.loading-subtitle{
  margin-top:8px;

  color:#888096;

  font-size:12px;
}

.loading-dots{
  display:flex;
  gap:6px;

  margin-top:15px;
}

.loading-dots span{
  width:5px;
  height:5px;

  border-radius:50%;

  background:#b88cff;

  animation:
    loadingDot
    1.1s ease-in-out infinite;
}

.loading-dots span:nth-child(2){
  animation-delay:.15s;
}

.loading-dots span:nth-child(3){
  animation-delay:.3s;
}

@keyframes loadingDot{
  0%,100%{
    opacity:.25;
    transform:translateY(0);
  }

  50%{
    opacity:1;
    transform:translateY(-4px);
  }
}

@keyframes moonFloat{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-4px);
  }
}

@keyframes orbitOne{
  to{
    transform:rotate(385deg) scaleX(1.6);
  }
}

@keyframes orbitTwo{
  to{
    transform:rotate(-385deg) scaleX(1.6);
  }
}


/* =========================================================
   APP HEADER
========================================================= */

header{
  position:relative;

  z-index:20;

  height:78px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:
    0 24px;

  background:
    rgba(3,2,10,.91);

  border-bottom:
    1px solid
    rgba(145,76,255,.34);

  box-shadow:
    0 8px 30px rgba(0,0,0,.18);
}

.brand{
  color:#fff;

  font-size:26px;
  font-weight:900;

  letter-spacing:-.9px;
}

.header-right{
  display:flex;
  align-items:center;

  gap:9px;
}

#userName{
  max-width:130px;

  overflow:hidden;

  color:#aaa3bb;

  font-size:12px;
  font-weight:700;

  white-space:nowrap;
  text-overflow:ellipsis;
}

.header-btn{
  height:43px;

  padding:
    0 15px;

  display:flex;
  align-items:center;
  gap:7px;

  border:
    1px solid
    rgba(161,110,255,.28);

  border-radius:14px;

  background:
    linear-gradient(
      145deg,
      rgba(25,15,48,.86),
      rgba(10,6,24,.86)
    );

  color:#f5f1ff;

  font-size:12px;
  font-weight:800;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.025),
    0 5px 16px rgba(0,0,0,.16);

  transition:
    border-color .16s ease,
    background .16s ease,
    transform .16s ease;
}

.header-btn:hover{
  border-color:
    rgba(170,112,255,.58);

  background:
    rgba(102,52,187,.16);
}

.header-btn:active{
  transform:scale(.97);
}

.header-icon{
  color:#a970ff;

  font-size:19px;
}


/* =========================================================
   MAIN LAYOUT
========================================================= */

.app{
  position:relative;

  z-index:2;

  width:100%;

  min-height:
    calc(100dvh - 78px);

  padding:16px;
}


/* =========================================================
   CHAT PANEL
========================================================= */

.chat-panel{
  position:relative;

  width:100%;
  max-width:920px;

  min-height:
    calc(100dvh - 110px);

  margin:0 auto;

  overflow:hidden;

  border:
    1px solid
    rgba(145,76,255,.42);

  border-radius:18px;

  background:
    linear-gradient(
      145deg,
      rgba(12,7,27,.96),
      rgba(5,3,14,.97) 58%,
      rgba(10,5,22,.96)
    );

  box-shadow:
    0 0 0 1px rgba(255,255,255,.012),
    0 20px 60px rgba(0,0,0,.35),
    0 0 35px rgba(102,46,200,.10);

  isolation:isolate;
}

.chat-panel::before{
  content:"";

  position:absolute;

  width:440px;
  height:300px;

  left:50%;
  top:130px;

  transform:translateX(-50%);

  pointer-events:none;

  background:
    radial-gradient(
      ellipse,
      rgba(121,48,206,.14),
      rgba(87,32,164,.05) 42%,
      transparent 72%
    );

  z-index:-1;
}


/* =========================================================
   CHAT HEADER
========================================================= */

.chat-heading{
  padding:
    22px
    20px
    18px;

  border-bottom:
    1px solid
    rgba(145,76,255,.20);

  background:
    linear-gradient(
      180deg,
      rgba(18,9,39,.70),
      rgba(8,4,19,.48)
    );
}

.chat-heading-row{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;

  gap:15px;
}

.chat-heading h1{
  font-size:21px;

  line-height:1.1;

  letter-spacing:-.4px;
}

.chat-heading p{
  margin-top:7px;

  color:#8e879f;

  font-size:11px;
}


/* =========================================================
   SEARCH
========================================================= */

.search-area{
  display:flex;

  gap:9px;

  margin-top:17px;
}

.search-box{
  position:relative;

  flex:1;
}

.search-box input{
  width:100%;
  height:49px;

  padding:
    0 15px;

  border:
    1px solid
    rgba(145,76,255,.31);

  border-radius:14px;

  outline:none;

  background:
    linear-gradient(
      145deg,
      rgba(26,17,43,.80),
      rgba(13,8,27,.92)
    );

  color:#fff;

  font-size:12px;
  font-weight:600;

  transition:
    border-color .18s ease,
    box-shadow .18s ease;
}

.search-box input::placeholder{
  color:#746d82;
}

.search-box input:focus{
  border-color:
    rgba(167,109,255,.72);

  box-shadow:
    0 0 0 3px
    rgba(139,73,255,.09);
}

.search-button{
  width:49px;
  height:49px;

  flex:0 0 49px;

  border:0;

  border-radius:14px;

  background:
    linear-gradient(
      145deg,
      #9a4fff,
      #7130df
    );

  color:#fff;

  font-size:20px;

  box-shadow:
    0 8px 20px
    rgba(108,46,215,.25);

  transition:
    transform .15s ease,
    box-shadow .15s ease;
}

.search-button:hover{
  box-shadow:
    0 10px 25px
    rgba(108,46,215,.38);
}

.search-button:active{
  transform:scale(.94);
}


/* =========================================================
   RECENT TITLE
========================================================= */

.recent-header{
  display:flex;
  align-items:center;

  gap:10px;

  margin:
    20px 0
    10px;

  padding:
    0 1px;
}

.recent-header span{
  color:#9389a6;

  font-size:10px;
  font-weight:900;

  letter-spacing:.5px;
}

.recent-header::after{
  content:"";

  height:1px;

  flex:1;

  background:
    linear-gradient(
      90deg,
      rgba(145,76,255,.22),
      rgba(145,76,255,.04)
    );
}


/* =========================================================
   CONVERSATION LIST
========================================================= */

.conversation-list{
  padding:
    0 12px
    18px;
}

.empty-state{
  min-height:300px;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  text-align:center;

  color:#746d82;
}

.empty-icon{
  width:54px;
  height:54px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-bottom:13px;

  border:
    1px solid
    rgba(145,76,255,.22);

  border-radius:18px;

  background:
    rgba(145,76,255,.07);

  color:#9b62f4;

  font-size:23px;
}

.empty-state h3{
  color:#b9b0c8;

  font-size:14px;
}

.empty-state p{
  margin-top:6px;

  font-size:11px;
}


/* =========================================================
   CONVERSATION CARD
========================================================= */

.conversation{
  position:relative;

  width:100%;

  min-height:88px;

  display:flex;
  align-items:center;

  gap:12px;

  margin-bottom:9px;

  padding:
    12px 12px 12px 13px;

  overflow:hidden;

  border:
    1px solid
    rgba(145,76,255,.24);

  border-radius:20px;

  background:
    linear-gradient(
      135deg,
      rgba(25,15,47,.91),
      rgba(11,7,26,.95) 70%,
      rgba(19,9,39,.90)
    );

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.025),
    0 8px 22px rgba(0,0,0,.18);

  transition:
    transform .16s ease,
    border-color .16s ease,
    background .16s ease,
    box-shadow .16s ease;
}

.conversation::before{
  content:"";

  position:absolute;

  width:120px;
  height:120px;

  left:-45px;
  top:-45px;

  border-radius:50%;

  pointer-events:none;

  background:
    radial-gradient(
      circle,
      rgba(130,57,233,.12),
      transparent 70%
    );
}

.conversation:hover{
  transform:translateY(-1px);

  border-color:
    rgba(155,91,255,.42);

  background:
    linear-gradient(
      135deg,
      rgba(30,17,57,.96),
      rgba(13,8,30,.96)
    );

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.035),
    0 10px 28px rgba(0,0,0,.25),
    0 0 22px rgba(107,49,203,.08);
}

.conversation:active{
  transform:scale(.992);
}

.conversation.unread{
  border-color:
    rgba(158,95,255,.42);
}


/* =========================================================
   AVATAR
========================================================= */

.avatar-wrap{
  position:relative;

  flex:0 0 68px;

  width:68px;
  height:68px;
}

.avatar{
  width:68px;
  height:68px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:
    1px solid
    rgba(205,170,255,.28);

  border-radius:50%;

  background:
    linear-gradient(
      145deg,
      #a35aff,
      #6724db
    );

  color:#fff;

  font-size:27px;
  font-weight:900;

  box-shadow:
    0 0 22px
    rgba(138,68,244,.28),
    inset 0 1px 2px
    rgba(255,255,255,.16);
}

.online-dot{
  position:absolute;

  width:14px;
  height:14px;

  right:0;
  bottom:1px;

  border:
    3px solid
    #100822;

  border-radius:50%;

  background:#52e69a;

  box-shadow:
    0 0 8px
    rgba(82,230,154,.45);
}


/* =========================================================
   CONVERSATION CONTENT
========================================================= */

.conversation-content{
  min-width:0;

  flex:1;

  align-self:stretch;

  display:flex;
  flex-direction:column;

  justify-content:center;
}

.conversation-top{
  display:flex;
  align-items:center;

  min-width:0;

  gap:6px;
}

.person-name{
  min-width:0;

  overflow:hidden;

  color:#f6f1ff;

  font-size:16px;
  font-weight:900;

  white-space:nowrap;
  text-overflow:ellipsis;
}

.conversation-time{
  flex:0 0 auto;

  margin-left:auto;

  color:#8c839a;

  font-size:10px;
}

.conversation-bottom{
  min-width:0;

  display:flex;
  align-items:center;

  gap:6px;

  margin-top:5px;
}

.last-message{
  min-width:0;

  overflow:hidden;

  color:#9b92a9;

  font-size:12px;

  white-space:nowrap;
  text-overflow:ellipsis;
}


/* =========================================================
   STATUS BADGES
   THESE REPLACE THE UGLY ICONS BESIDE THE NAME
========================================================= */

.status-badges{
  display:flex;

  align-items:center;

  gap:4px;

  flex:0 0 auto;
}

.status-badge{
  width:20px;
  height:20px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:
    1px solid
    rgba(154,96,239,.28);

  border-radius:7px;

  background:
    rgba(116,57,205,.10);

  color:#a977f1;

  font-size:10px;

  box-shadow:
    inset 0 1px 0
    rgba(255,255,255,.025);
}

.status-badge.muted{
  color:#9c89ba;
}

.status-badge.unread{
  color:#c59cff;

  border-color:
    rgba(181,135,255,.34);
}


/* =========================================================
   MORE BUTTON
========================================================= */

.more-button{
  position:relative;

  z-index:3;

  width:36px;
  height:36px;

  flex:0 0 36px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:
    1px solid
    rgba(155,102,238,.20);

  border-radius:11px;

  background:
    rgba(255,255,255,.025);

  color:#a79db5;

  font-size:18px;

  transition:
    background .15s ease,
    color .15s ease,
    border-color .15s ease;
}

.more-button:hover{
  color:#fff;

  border-color:
    rgba(168,111,255,.45);

  background:
    rgba(145,76,255,.13);
}


/* =========================================================
   PINNED CONVERSATION
========================================================= */

.conversation.pinned{
  border-color:
    rgba(168,108,255,.36);
}

.conversation.pinned::after{
  content:"";

  position:absolute;

  left:0;
  top:13px;
  bottom:13px;

  width:2px;

  border-radius:3px;

  background:
    linear-gradient(
      180deg,
      #ad70ff,
      #7132d9
    );

  box-shadow:
    0 0 10px
    rgba(161,94,255,.4);
}


/* =========================================================
   UNREAD DOT
========================================================= */

.unread-dot{
  width:7px;
  height:7px;

  flex:0 0 7px;

  border-radius:50%;

  background:#a867ff;

  box-shadow:
    0 0 7px
    rgba(168,103,255,.55);
}


/* =========================================================
   MENU OVERLAY
========================================================= */

.menu-backdrop{
  position:fixed;
  inset:0;

  z-index:90;

  display:none;

  background:
    rgba(0,0,0,.18);
}

.menu-backdrop.show{
  display:block;
}


/* =========================================================
   CONVERSATION MENU
========================================================= */

.conversation-menu{
  position:fixed;

  z-index:100;

  width:min(
    calc(100vw - 40px),
    340px
  );

  padding:9px;

  border:
    1px solid
    rgba(178,126,255,.38);

  border-radius:20px;

  background:
    linear-gradient(
      145deg,
      rgba(27,15,51,.98),
      rgba(11,6,25,.99)
    );

  box-shadow:
    0 25px 70px
    rgba(0,0,0,.65),
    0 0 30px
    rgba(113,57,208,.13);

  backdrop-filter:
    blur(18px);

  -webkit-backdrop-filter:
    blur(18px);

  opacity:0;

  visibility:hidden;

  transform:
    translateY(8px)
    scale(.97);

  transform-origin:
    top right;

  transition:
    opacity .13s ease,
    visibility .13s ease,
    transform .13s ease;
}

.conversation-menu.show{
  opacity:1;

  visibility:visible;

  transform:
    translateY(0)
    scale(1);
}

.menu-title{
  padding:
    9px 12px 11px;

  color:#fff;

  font-size:17px;
  font-weight:900;
}

.menu-subtitle{
  padding:
    0 12px 10px;

  color:#80768f;

  font-size:10px;
}

.menu-action{
  width:100%;
  min-height:54px;

  display:flex;
  align-items:center;

  gap:12px;

  padding:
    8px 11px;

  border:
    1px solid
    rgba(165,110,244,.13);

  border-radius:14px;

  background:
    rgba(255,255,255,.025);

  color:#f2edf9;

  text-align:left;

  margin-top:7px;

  transition:
    background .14s ease,
    border-color .14s ease,
    transform .14s ease;
}

.menu-action:hover{
  border-color:
    rgba(165,110,244,.30);

  background:
    rgba(132,70,222,.12);
}

.menu-action:active{
  transform:scale(.985);
}

.menu-action-icon{
  width:36px;
  height:36px;

  flex:0 0 36px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:
    1px solid
    rgba(169,112,249,.24);

  border-radius:11px;

  background:
    rgba(131,67,220,.11);

  color:#b383ff;

  font-size:17px;
}

.menu-action-text{
  flex:1;

  min-width:0;
}

.menu-action-title{
  font-size:13px;
  font-weight:800;
}

.menu-action-description{
  margin-top:3px;

  color:#81778f;

  font-size:9px;
}

.menu-action.danger{
  color:#ffb2c7;
}

.menu-action.danger .menu-action-icon{
  color:#ff9fbd;

  border-color:
    rgba(255,130,167,.24);

  background:
    rgba(180,48,91,.10);
}

.menu-divider{
  height:1px;

  margin:
    10px 2px 4px;

  background:
    rgba(145,76,255,.13);
}

.menu-cancel{
  width:100%;
  height:48px;

  margin-top:7px;

  border:
    1px solid
    rgba(145,76,255,.16);

  border-radius:13px;

  background:
    rgba(255,255,255,.018);

  color:#a79daf;

  font-size:12px;
  font-weight:800;
}

.menu-cancel:hover{
  color:#fff;

  background:
    rgba(145,76,255,.07);
}


/* =========================================================
   REMOVE CONFIRMATION
========================================================= */

.confirm-overlay{
  position:fixed;
  inset:0;

  z-index:200;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:
    rgba(0,0,0,.64);

  backdrop-filter:
    blur(7px);

  -webkit-backdrop-filter:
    blur(7px);

  opacity:0;
  visibility:hidden;

  transition:
    opacity .15s ease,
    visibility .15s ease;
}

.confirm-overlay.show{
  opacity:1;
  visibility:visible;
}

.confirm-box{
  width:min(100%,370px);

  padding:22px;

  border:
    1px solid
    rgba(178,126,255,.38);

  border-radius:21px;

  background:
    linear-gradient(
      145deg,
      #1a0d31,
      #0a0518
    );

  box-shadow:
    0 25px 70px
    rgba(0,0,0,.65);

  transform:
    scale(.95)
    translateY(7px);

  transition:
    transform .16s ease;
}

.confirm-overlay.show .confirm-box{
  transform:
    scale(1)
    translateY(0);
}

.confirm-icon{
  width:48px;
  height:48px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-bottom:14px;

  border-radius:15px;

  background:
    rgba(188,60,103,.10);

  border:
    1px solid
    rgba(255,125,165,.20);

  color:#ff9fbd;

  font-size:22px;
}

.confirm-box h3{
  font-size:18px;
}

.confirm-box p{
  margin-top:8px;

  color:#8d849a;

  font-size:11px;

  line-height:1.5;
}

.confirm-actions{
  display:flex;

  gap:8px;

  margin-top:19px;
}

.confirm-actions button{
  flex:1;

  height:44px;

  border-radius:12px;

  font-size:12px;
  font-weight:800;
}

.confirm-cancel{
  border:
    1px solid
    rgba(145,76,255,.20);

  background:
    rgba(255,255,255,.035);

  color:#ddd6e8;
}

.confirm-remove{
  border:
    1px solid
    rgba(255,125,165,.28);

  background:
    linear-gradient(
      145deg,
      #9b3159,
      #76203f
    );

  color:#fff;
}

    transform .18s ease,

></div>

>

  >
    Sameer
  </div>

      📌

        Pin conversation

    </span>

  </button>

    type="button"

      🔕
    </span>

    <span class="menu-action-text">

      <span
        id="muteTitle"

        Mute notifications

      <span class="menu-action-description">
        Stop notifications for this chat

    </span>

    id="unreadBtn"

    </span>

    <span class="menu-action-text">

      <span class="menu-action-title">
        Remove conversation

      <span class="menu-action-description">
        Remove this chat from your conversations

        class="confirm-remove"
        type="button"
      >

      </button>

    </div>

  </div>

</div>
