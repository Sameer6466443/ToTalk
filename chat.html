<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>ToTalk Sameer</title>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    :root {

      --black: #020108;
      --dark: #05020f;
      --panel: rgba(8, 5, 20, 0.95);

      --purple: #914cff;
      --purple-light: #aa69ff;
      --purple-dark: #6324ca;

      --yellow: #ffe34f;

      --white: #f8f5ff;
      --muted: #928ba8;

      --green: #52e69a;

      --border: rgba(145, 76, 255, 0.45);

    }


    html,
    body {

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: var(--black);

    }


    body {

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: var(--white);

      background:

        radial-gradient(
          ellipse at 70% 25%,
          rgba(111, 36, 191, 0.28),
          transparent 32%
        ),

        radial-gradient(
          ellipse at 15% 85%,
          rgba(81, 29, 160, 0.20),
          transparent 30%
        ),

        linear-gradient(
          135deg,
          #020108,
          #070313 50%,
          #020108
        );

      min-height: 100dvh;

    }


    /* ======================================
       GLOBAL STARS
    ====================================== */

    body::before {

      content: "";

      position: fixed;

      inset: 0;

      pointer-events: none;

      z-index: 0;

      opacity: 0.75;

      background-image:

        radial-gradient(
          circle,
          rgba(255,255,255,.9) 1px,
          transparent 1.5px
        ),

        radial-gradient(
          circle,
          rgba(210,190,255,.8) 1px,
          transparent 1.5px
        ),

        radial-gradient(
          circle,
          rgba(255,255,255,.65) 1px,
          transparent 1.5px
        );

      background-size:
        115px 115px,
        175px 175px,
        245px 245px;

      background-position:
        15px 25px,
        70px 90px,
        130px 45px;

    }


    /* ======================================
       HEADER
    ====================================== */

    header {

      position: relative;

      z-index: 20;

      height: 78px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0 24px;

      background:
        rgba(3, 2, 10, 0.96);

      border-bottom:
        1px solid var(--border);

      box-shadow:
        0 0 25px rgba(104, 42, 190, 0.12);

    }


    .brand {

      font-size: 26px;

      font-weight: 900;

      letter-spacing: -0.8px;

    }


    .brand-main {

      color: var(--white);

    }


    .brand-name {

      color: var(--purple-light);

    }


    .header-right {

      display: flex;

      align-items: center;

      gap: 16px;

    }


    #userName {

      color: #aaa3bb;

      font-size: 13px;

      font-weight: 700;

    }


    #logoutBtn {

      padding:
        9px 16px;

      border-radius: 10px;

      border:
        1px solid var(--border);

      background:
        rgba(20, 10, 42, 0.85);

      color: var(--white);

      font-size: 12px;

      font-weight: 800;

      cursor: pointer;

      transition: 0.2s;

    }


    #logoutBtn:hover {

      border-color:
        var(--purple-light);

      box-shadow:
        0 0 20px rgba(145, 76, 255, 0.25);

    }


    /* ======================================
       MAIN
    ====================================== */

    .chat-layout {

      position: relative;

      z-index: 2;

      width: 100%;

      height:
        calc(100dvh - 78px);

      padding: 16px;

      display: grid;

      grid-template-columns:
        235px minmax(0, 1fr);

      gap: 14px;

    }


    /* ======================================
       SIDEBAR
    ====================================== */

    .sidebar {

      position: relative;

      min-width: 0;

      overflow: hidden;

      border:
        1px solid var(--border);

      border-radius: 14px;

      background:
        linear-gradient(
          180deg,
          rgba(9, 6, 23, .97),
          rgba(3, 2, 12, .98)
        );

      box-shadow:
        0 0 30px rgba(95, 35, 180, .10);

    }


    .sidebar-title {

      padding:
        22px 20px 18px;

      border-bottom:
        1px solid rgba(145,76,255,.18);

    }


    .sidebar-title h2 {

      font-size: 18px;

      margin-bottom: 7px;

    }


    .sidebar-title p {

      color: var(--muted);

      font-size: 11px;

    }


    .chat-person {

      margin:
        17px 15px;

      padding: 13px;

      display: flex;

      align-items: center;

      gap: 11px;

      border:
        1px solid rgba(145,76,255,.32);

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          rgba(95,37,165,.35),
          rgba(27,12,59,.65)
        );

    }


    .avatar {

      width: 43px;
      height: 43px;

      flex: 0 0 43px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #a45cff,
          #6321d8
        );

      font-size: 17px;

      font-weight: 900;

      box-shadow:
        0 0 20px rgba(145,76,255,.45);

    }


    .person-name {

      font-size: 13px;

      font-weight: 800;

    }


    .online {

      margin-top: 5px;

      color: var(--green);

      font-size: 10px;

      font-weight: 700;

    }


    /* ======================================
       CHAT BOX
    ====================================== */

    .chat-box {

      position: relative;

      min-width: 0;
      min-height: 0;

      display: flex;

      flex-direction: column;

      overflow: hidden;

      border:
        1px solid var(--border);

      border-radius: 14px;

      background:
        rgba(3,2,12,.93);

      box-shadow:
        0 0 35px rgba(98,38,190,.14);

    }


    /* ======================================
       CHAT HEADER
    ====================================== */

    .chat-top {

      position: relative;

      z-index: 5;

      min-height: 75px;

      padding:
        13px 20px;

      display: flex;

      align-items: center;

      gap: 12px;

      background:
        rgba(8,5,20,.97);

      border-bottom:
        1px solid rgba(145,76,255,.25);

    }


    .chat-avatar {

      width: 43px;
      height: 43px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #9d56ff,
          #6322d3
        );

      font-weight: 900;

      box-shadow:
        0 0 18px rgba(145,76,255,.38);

    }


    .chat-title {

      font-size: 15px;

      font-weight: 900;

    }


    .chat-status {

      margin-top: 4px;

      color: var(--green);

      font-size: 10px;

      font-weight: 700;

    }


    .top-star {

      margin-left: auto;

      color: var(--yellow);

      font-size: 27px;

      line-height: 1;

      text-shadow:
        0 0 12px rgba(255,227,79,.75);

    }


    /* ======================================
       SPACE
    ====================================== */

    .space {

      position: relative;

      flex: 1;

      min-height: 0;

      overflow: hidden;

      background:

        radial-gradient(
          ellipse at 58% 27%,
          rgba(124,40,195,.32),
          transparent 30%
        ),

        radial-gradient(
          ellipse at 90% 60%,
          rgba(83,27,148,.18),
          transparent 30%
        ),

        linear-gradient(
          180deg,
          #03020b,
          #050213 55%,
          #020108
        );

    }


    .space::before {

      content: "";

      position: absolute;

      inset: 0;

      pointer-events: none;

      opacity: .75;

      background-image:

        radial-gradient(
          circle,
          rgba(255,255,255,.9) 1px,
          transparent 1.5px
        ),

        radial-gradient(
          circle,
          rgba(220,200,255,.8) 1px,
          transparent 1.5px
        ),

        radial-gradient(
          circle,
          rgba(255,255,255,.7) 1px,
          transparent 1.5px
        );

      background-size:
        125px 125px,
        195px 195px,
        280px 280px;

      background-position:
        15px 20px,
        80px 60px,
        140px 100px;

    }


    /* ======================================
       PURPLE NEBULA
    ====================================== */

    .nebula {

      position: absolute;

      width: 390px;
      height: 280px;

      top: 75px;
      left: 30%;

      pointer-events: none;

      background:
        radial-gradient(
          ellipse,
          rgba(153,54,224,.30),
          rgba(93,29,145,.12),
          transparent 70%
        );

      filter:
        blur(20px);

    }


    /* ======================================
       MOON
    ====================================== */

    .moon {

      position: absolute;

      top: 27px;
      left: 58px;

      width: 76px;
      height: 76px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 35%,
          #fffbd0,
          #ffe43e 58%,
          #e4a700 100%
        );

      box-shadow:
        0 0 28px rgba(255,220,47,.45);

      z-index: 2;

    }


    .moon::after {

      content: "";

      position: absolute;

      width: 75px;
      height: 75px;

      left: 22px;
      top: -5px;

      border-radius: 50%;

      background:
        #03020b;

    }


    /* ======================================
       PLANET
    ====================================== */

    .planet {

      position: absolute;

      top: 64px;
      right: 40px;

      width: 105px;
      height: 105px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 32% 28%,
          #566083,
          #1d2140 45%,
          #050510 78%
        );

      box-shadow:
        0 0 35px rgba(101,75,170,.26);

      z-index: 2;

    }


    .planet::after {

      content: "";

      position: absolute;

      width: 182px;
      height: 43px;

      left: -39px;
      top: 30px;

      border:
        1px solid rgba(181,143,255,.52);

      border-radius: 50%;

      transform:
        rotate(-16deg);

      box-shadow:
        0 0 8px rgba(145,76,255,.22);

    }


    /* ======================================
       SHOOTING STAR
    ====================================== */

    .shooting-star {

      position: absolute;

      width: 90px;
      height: 2px;

      right: 17%;
      bottom: 17%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.9)
        );

      transform:
        rotate(-40deg);

      box-shadow:
        0 0 8px rgba(255,255,255,.75);

      z-index: 2;

    }


    /* ======================================
       MESSAGES
    ====================================== */

    #messages {

      position: absolute;

      z-index: 4;

      inset: 0;

      overflow-y: auto;

      padding:
        24px 22px 115px;

      display: flex;

      flex-direction: column;

      gap: 10px;

      scroll-behavior: smooth;

      -webkit-overflow-scrolling: touch;

    }


    #messages::-webkit-scrollbar {

      width: 5px;

    }


    #messages::-webkit-scrollbar-track {

      background: transparent;

    }


    #messages::-webkit-scrollbar-thumb {

      background:
        rgba(145,76,255,.38);

      border-radius: 10px;

    }


    .welcome-message {

      margin: auto;

      max-width: 430px;

      padding: 30px;

      text-align: center;

      color: var(--muted);

    }


    .welcome-message h3 {

      color: var(--white);

      font-size: 20px;

      margin-bottom: 10px;

    }


    .welcome-message p {

      font-size: 12px;

      line-height: 1.7;

    }


    .message {
      position: relative;
      max-width: min(70%, 520px);
      align-self: flex-start;
      padding: 10px 13px 9px;
      padding-right: 42px;
      border-radius: 15px;
      background: rgba(19,13,40,.94);
      border: 1px solid rgba(145,76,255,.25);
      color: var(--white);
      font-size: 13px;
      line-height: 1.45;
      word-break: break-word;
    }

    .message.mine {
      position: relative;
    }

    .message-text {
      display: block;
      white-space: pre-wrap;
    }

    .message-menu-wrap {
      position: absolute;
      top: 7px;
      right: 7px;
      z-index: 20;
    }

    .message-menu-btn {
      width: 24px;
      height: 24px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
      color: rgba(255,255,255,.72);
      font-size: 16px;
      line-height: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .18s, color .18s;
    }

    .message-menu-btn:hover,
    .message-menu-btn:focus-visible {
      background: rgba(255,255,255,.16);
      color: #fff;
      outline: none;
    }

    .message-menu {
      position: absolute;
      top: 29px;
      right: 0;
      min-width: 92px;
      padding: 5px;
      border: 1px solid rgba(165,102,255,.35);
      border-radius: 10px;
      background: rgba(13,8,30,.98);
      box-shadow: 0 10px 28px rgba(0,0,0,.45), 0 0 18px rgba(125,55,220,.18);
      display: none;
    }

    .message-menu.open {
      display: block;
    }

    .message-menu button {
      width: 100%;
      border: 0;
      background: transparent;
      color: rgba(255,255,255,.82);
      text-align: left;
      padding: 7px 9px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .message-menu button:hover,
    .message-menu button:focus-visible {
      background: rgba(145,76,255,.18);
      color: #fff;
      outline: none;
    }

    .message-menu .menu-delete {
      color: rgba(255,190,205,.82);
    }

    .message-menu .menu-delete:hover,
    .message-menu .menu-delete:focus-visible {
      background: rgba(255,90,125,.10);
      color: #ffd6df;
    }


    .message.mine {
      align-self: flex-end;
      min-width: 118px;
      background: linear-gradient(135deg, #8e47f0, #6226c8);
      border: 1px solid rgba(188,142,255,.45);
      box-shadow: 0 5px 20px rgba(91,35,177,.25);
    }


    .message-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
      margin-top: 7px;
    }

    .message-action-btn {
      border: 0;
      background: rgba(255,255,255,.08);
      color: rgba(255,255,255,.78);
      border-radius: 7px;
      padding: 5px 9px;
      font-size: 10px;
      line-height: 1.2;
      font-weight: 600;
      cursor: pointer;
    }

    .message-action-btn:hover {
      background: rgba(255,255,255,.14);
      color: #fff;
    }

    .message-action-btn:disabled {
      cursor: default;
      opacity: .5;
    }

    .edit-message-area {
      width: 100%;
      box-sizing: border-box;
      min-height: 58px;
      resize: vertical;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 9px;
      background: rgba(5,7,20,.65);
      color: #fff;
      padding: 9px 10px;
      font: inherit;
      line-height: 1.45;
      outline: none;
    }

    .edit-message-area:focus {
      border-color: rgba(255,255,255,.45);
    }

    .message.deleting {
      opacity: 0 !important;
      transform: scale(.96) !important;
      transition: opacity .22s ease, transform .22s ease;
    }

    .message-time {
      display: block;
      margin-top: 3px;
      text-align: right;
      font-size: 8px;
      line-height: 1;
      opacity: .55;
      white-space: nowrap;
    }

    @media (max-width:800px) {
      .message {
        max-width: 78%;
        padding-right: 40px;
      }
      .message-menu-btn {
        width: 23px;
        height: 23px;
        font-size: 15px;
      }
      .message-time {
        font-size: 8px;
      }
    }

    .reaction-picker {
      position: absolute;
      right: 8px;
      top: 34px;
      z-index: 50;
      display: none;
      align-items: center;
      gap: 3px;
      padding: 5px 6px;
      border: 1px solid rgba(165,102,255,.35);
      border-radius: 12px;
      background: rgba(13,8,30,.98);
      box-shadow: 0 10px 28px rgba(0,0,0,.45);
    }

    .reaction-picker.open { display: flex; }

    .reaction-picker button {
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #fff;
      font-size: 17px;
      cursor: pointer;
    }

    .reaction-picker button:hover,
    .reaction-picker button:focus-visible {
      background: rgba(145,76,255,.20);
      outline: none;
    }

    .reaction-summary {
      display: none;
      align-items: center;
      gap: 3px;
      margin-top: 4px;
      min-height: 18px;
    }

    .reaction-summary.has-reactions { display: flex; }

    .reaction-chip {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      min-height: 18px;
      padding: 1px 6px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 9px;
      background: rgba(7,5,18,.58);
      color: rgba(255,255,255,.86);
      font-size: 10px;
      line-height: 1;
    }

    .reaction-chip.mine {
      border-color: rgba(188,142,255,.55);
      background: rgba(145,76,255,.20);
    }

    .message.reaction-target {
      box-shadow: 0 0 0 1px rgba(188,142,255,.65), 0 8px 26px rgba(91,35,177,.30);
    }

    /* ======================================
       INPUT
    ====================================== */

    .input-area {

      position: absolute;

      z-index: 10;

      left: 16px;
      right: 16px;
      bottom: 14px;

      display: flex;

      gap: 9px;

      padding: 7px;

      background:
        rgba(17,10,35,.96);

      border:
        1px solid rgba(145,76,255,.50);

      border-radius: 14px;

      box-shadow:
        0 0 25px rgba(92,31,177,.25);

      backdrop-filter:
        blur(12px);

    }


    #messageInput {

      flex: 1;

      min-width: 0;

      border: none;

      outline: none;

      background: transparent;

      color: var(--white);

      padding:
        10px 9px;

      font-size: 13px;

    }


    #messageInput::placeholder {

      color: #77718d;

    }


    #sendButton {

      min-width: 72px;

      padding:
        0 15px;

      border: none;

      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          #a45cff,
          #7029df
        );

      color: white;

      font-size: 12px;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 0 18px rgba(145,76,255,.34);

      transition: .2s;

    }


    #sendButton:hover {

      transform:
        translateY(-1px);

      box-shadow:
        0 0 25px rgba(145,76,255,.55);

    }


    #sendButton:disabled {

      opacity: .55;

      cursor: wait;

      transform: none;

    }


    /* ======================================
       STATUS
    ====================================== */

    #status {

      position: fixed;

      z-index: 50;

      left: 50%;
      bottom: 92px;

      transform:
        translateX(-50%);

      display: none;

      max-width:
        calc(100% - 30px);

      padding:
        10px 15px;

      border-radius: 10px;

      background:
        rgba(20,10,38,.97);

      border:
        1px solid rgba(145,76,255,.50);

      color: #ded7ef;

      font-size: 11px;

      text-align: center;

    }


    /* ======================================
       LOADING
    ====================================== */

    #loading {

      position: fixed;

      inset: 0;

      z-index: 9999;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;

      background:
        radial-gradient(circle at 50% 44%, rgba(91,35,170,.28), transparent 34%),
        radial-gradient(circle at 18% 78%, rgba(38,20,100,.20), transparent 30%),
        #03020b;

      color: var(--white);

      text-align: center;

      opacity: 1;

      visibility: visible;

      transition: opacity .7s ease, visibility .7s ease;

    }

    #loading::before,
    #loading::after {

      content: "";

      position: absolute;

      border-radius: 50%;

      pointer-events: none;

    }

    #loading::before {

      width: 2px;
      height: 2px;
      top: 18%;
      left: 17%;
      background: rgba(255,255,255,.9);
      box-shadow:
        72vw 10vh 0 rgba(255,255,255,.65),
        18vw 62vh 0 rgba(255,255,255,.7),
        78vw 72vh 0 rgba(255,255,255,.55),
        44vw 18vh 0 rgba(255,255,255,.5),
        60vw 84vh 0 rgba(255,255,255,.45),
        90vw 38vh 0 rgba(255,255,255,.65),
        8vw 36vh 0 rgba(255,255,255,.5);

    }

    #loading::after {

      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(116,53,220,.10), transparent 68%);
      filter: blur(8px);

    }

    #loading.fade-out {

      opacity: 0;
      visibility: hidden;

    }

    .loading-content {

      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      transform: translateY(-4px);

    }

    .loading-moon {

      width: 82px;
      height: 82px;
      border-radius: 50%;
      position: relative;
      background: radial-gradient(circle at 34% 30%, #ffffff, #ddd8ea 48%, #9d93b9 100%);
      box-shadow: 0 0 28px rgba(194,178,255,.42), 0 0 80px rgba(112,51,220,.24);
      animation: loadingMoonFloat 2.8s ease-in-out infinite;

    }

    .loading-moon::before {

      content: "";
      position: absolute;
      inset: -15px;
      border: 1px solid rgba(187,160,255,.32);
      border-radius: 50%;
      border-left-color: transparent;
      border-bottom-color: transparent;
      animation: loadingOrbit 3.6s linear infinite;

    }

    .loading-moon::after {

      content: "";
      position: absolute;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: rgba(117,91,160,.22);
      top: 22px;
      left: 25px;

<body>

        <span></span>
        <span></span>

      </div>

  <!-- ======================================
       HEADER

  <!-- ======================================
       MAIN
  ====================================== -->

  <main class="chat-layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="sidebar-title">

        <h2>
          Sameer's Chats
        </h2>

        <p>
          Your personal conversation space
        </p>

      </div>


      <div class="chat-person">

        <div class="avatar">
          S
        </div>


        <div>

          <div
            class="person-name"
            id="sideName"
          >
            Sameer
          </div>

          <div class="online">
            Online
          </div>

        </div>

      </div>

    </aside>


    <!-- CHAT -->

    <section class="chat-box">


      <!-- CHAT HEADER -->

      <div class="chat-top">

        <div class="chat-avatar">
          S
        </div>


        <div>

          <div class="chat-title">

          </div>

          <div class="chat-status">

          </div>

        </div>

        </div>

      </div>


      <!-- SPACE -->

      <div class="space">

        <!-- MESSAGES -->

          >

              Your conversation space is ready.

            type="button"
          >
            Send
          </button>

        </div>

      </div>

  </main>


  <!-- STATUS -->

  <div id="status"></div>


  <script>


    /* ======================================
       SUPABASE
    ====================================== */

    const SUPABASE_URL =
      "https://qiynczbrhpxwuabwuyiy.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_eUPz4c_nYckgINEK-AIWqw_JAXIHozd";


    /*
      IMPORTANT

      The homepage uses Supabase OAuth.

      This chat page uses PKCE and manually
      exchanges the Google OAuth code.

      This makes logout -> login again work
      correctly instead of depending on an
      old browser session.
    */

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {

          auth: {

            persistSession: true,

            autoRefreshToken: true,

            detectSessionInUrl: false,

            flowType: "pkce"

          }

        }
      );


    /* ======================================
       ELEMENTS
    ====================================== */

    const loading =
      document.getElementById(
        "loading"
      );


    const userName =
      document.getElementById(
        "userName"
      );


    const sideName =
      document.getElementById(
        "sideName"
      );


    const logoutBtn =
      document.getElementById(
        "logoutBtn"
      );


    const messageInput =
      document.getElementById(
        "messageInput"
      );


    const sendButton =
      document.getElementById(
        "sendButton"
      );


    const messages =
      document.getElementById(
        "messages"
      );


    const status =
      document.getElementById(
        "status"
      );


    let currentUser =
      null;


    let authReady =
      false;


    let realtimeChannel =
      null;


    /* ======================================
       STATUS
    ====================================== */

    function showStatus(text) {

      status.textContent =
        text;

      status.style.display =
        "block";


      clearTimeout(
        showStatus.timer
      );


      showStatus.timer =
        setTimeout(
          () => {

            status.style.display =
              "none";

          },
          3500
        );

    }


    /* ======================================
       LOGIN ERROR
    ====================================== */

    function showLoginError(text) {

      loading.innerHTML = `

        <div class="login-error">

          <h2>
            Unable to open chat
          </h2>

          <p>
            ${text}
          </p>

          <a
            class="back-button"
            href="./index.html"
          >
            Back to ToTalk
          </a>

        </div>

      `;


      loading.style.display =
        "flex";

    }


    /* ======================================
       USER
    ====================================== */

    function showUser(user) {

      currentUser =
        user;


      const name =
        user.user_metadata?.full_name ||
        user.user_metadata?.name ||
        user.email?.split("@")[0] ||
        "Sameer";


      userName.textContent =
        name;


      sideName.textContent =
        name;


      authReady =
        true;

    }


    /* ======================================
       FINISH CHAT LOADING
    ====================================== */

    function finishLoading() {

      if (
        loading.classList.contains("fade-out")
      ) {
        return;
      }

      loading.classList.add("fade-out");

      setTimeout(() => {
        loading.style.display = "none";
      }, 700);

    }


    /* ======================================
       MESSAGE ELEMENT
    ====================================== */

    function addMessage(messageData, animate = false, delay = 0) {

      const welcome =
        document.getElementById(
          "welcomeMessage"
        );


      if (welcome) {

        welcome.remove();

      }


      /*
        Prevent duplicate realtime
        messages.
      */

      if (messageData.id) {

        const existing =
          document.querySelector(
            `[data-message-id="${messageData.id}"]`
          );


        if (existing) {

          return;

        }

      }


      const message =
        document.createElement(
          "div"
        );


      message.className =
        (
          currentUser &&
          messageData.sender_id ===
            currentUser.id
        )
          ? "message mine"
          : "message";

      if (animate) {

        message.style.animationDelay =
          delay + "ms";

        message.classList.add(
          "message-enter"
        );

      } else {

        message.style.opacity = "1";

        message.style.transform = "none";

      }


      if (messageData.id) {

        message.dataset.messageId =
          messageData.id;

      }


      const text =
        document.createElement(
          "div"
        );


      text.className = "message-text";
      text.textContent =
        messageData.content;


      const time =
        document.createElement(
          "span"
        );


      time.className =
        "message-time";


      if (messageData.created_at) {

        const date =
          new Date(
            messageData.created_at
          );

        const timeText =
          date.toLocaleTimeString(
            [],
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          );

        time.textContent =
          messageData.edited_at
            ? timeText + " · edited"
            : timeText;

      }


      message.appendChild(text);
      message.appendChild(time);

      if (currentUser && messageData.sender_id === currentUser.id && messageData.id) {
        const menuWrap = document.createElement("div");
        menuWrap.className = "message-menu-wrap";

        const menuButton = document.createElement("button");
        menuButton.className = "message-menu-btn";
        menuButton.type = "button";
        menuButton.setAttribute("aria-label", "Message options");
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.textContent = "⋮";

        const menu = document.createElement("div");
        menu.className = "message-menu";

        const reactButton = document.createElement("button");
        reactButton.type = "button";
        reactButton.textContent = "React";
        reactButton.addEventListener("click", (event) => {
          event.stopPropagation();
          menu.classList.remove("open");
          menuButton.setAttribute("aria-expanded", "false");
          toggleReactionPicker(message, reactionPicker);
        });

        const reactionPicker = createReactionPicker(messageData.id, message);
        message.appendChild(reactionPicker);

        const editButton = document.createElement("button");
        editButton.type = "button";
        editButton.textContent = "Edit";
        editButton.addEventListener("click", (event) => {
          event.stopPropagation();
          menu.classList.remove("open");
          menuButton.setAttribute("aria-expanded", "false");
          editMessage(messageData.id, message, text);
        });

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "menu-delete";
        deleteButton.textContent = "Delete";
        deleteButton.addEventListener("click", (event) => {
          event.stopPropagation();
          menu.classList.remove("open");
          menuButton.setAttribute("aria-expanded", "false");
          deleteMessage(messageData.id, message);
        });

        menu.appendChild(reactButton);
        menu.appendChild(editButton);
        menu.appendChild(deleteButton);
        menuWrap.appendChild(menuButton);
        menuWrap.appendChild(menu);
        message.appendChild(menuWrap);

        menuButton.addEventListener("click", (event) => {
          event.stopPropagation();
          const isOpen = menu.classList.toggle("open");
          menuButton.setAttribute("aria-expanded", String(isOpen));
        });
      }

      const reactionPicker = message.querySelector(".reaction-picker");
      if (!reactionPicker) {
        const picker = createReactionPicker(messageData.id, message);
        message.appendChild(picker);
      }

      const reactionSummary = document.createElement("div");
      reactionSummary.className = "reaction-summary";
      reactionSummary.dataset.reactionSummary = "true";
      message.appendChild(reactionSummary);

      attachReactionGestures(message, messageData.id);
      messages.appendChild(message);

    }


    /* ======================================
       SCROLL TO BOTTOM
    ====================================== */

    function scrollToBottom(
      smooth = true
    ) {

      requestAnimationFrame(
        () => {

          messages.scrollTo({

            top:
              messages.scrollHeight,

            behavior:
              smooth
                ? "smooth"
                : "auto"

          });

        }
      );

    }


    /* ======================================
       REACTIONS
    ====================================== */

    const REACTIONS = ["👍", "❤️", "😂", "😮", "😢", "😡"];

    function createReactionPicker(messageId, messageElement) {
      const picker = document.createElement("div");
      picker.className = "reaction-picker";
      picker.dataset.messageId = messageId || "";

      REACTIONS.forEach((reaction) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = reaction;
        button.setAttribute("aria-label", "React " + reaction);
        button.addEventListener("click", async (event) => {
          event.stopPropagation();
          await toggleReaction(messageId, reaction, messageElement);
          picker.classList.remove("open");
          messageElement.classList.remove("reaction-target");
        });
        picker.appendChild(button);
      });

      return picker;
    }

    function toggleReactionPicker(messageElement, picker) {
      if (!picker) return;
      document.querySelectorAll(".reaction-picker.open").forEach((other) => {
        if (other !== picker) other.classList.remove("open");
      });
      document.querySelectorAll(".reaction-target").forEach((other) => {
        if (other !== messageElement) other.classList.remove("reaction-target");
      });
      const open = picker.classList.toggle("open");
      messageElement.classList.toggle("reaction-target", open);
    }

    function attachReactionGestures(messageElement, messageId) {
      if (!messageId) return;
      let pressTimer = null;

      messageElement.addEventListener("contextmenu", (event) => {
        event.preventDefault();
        const picker = messageElement.querySelector(".reaction-picker");
        toggleReactionPicker(messageElement, picker);
      });

      messageElement.addEventListener("touchstart", () => {
        pressTimer = setTimeout(() => {
          const picker = messageElement.querySelector(".reaction-picker");
          toggleReactionPicker(messageElement, picker);
        }, 550);
      }, { passive: true });

      ["touchend", "touchmove", "touchcancel"].forEach((eventName) => {
        messageElement.addEventListener(eventName, () => {
          if (pressTimer) clearTimeout(pressTimer);
          pressTimer = null;
        }, { passive: true });
      });
    }

    async function toggleReaction(messageId, reaction, messageElement) {
      if (!messageId || !currentUser) return;

      const { data: existing, error: existingError } = await supabaseClient
        .from("message_reactions")
        .select("id, reaction")
        .eq("message_id", messageId)
        .eq("user_id", currentUser.id)
        .maybeSingle();

      if (existingError) {
        console.error("Reaction lookup error:", existingError);
        showStatus("Reaction could not be changed.");
        return;
      }

      let error = null;

      if (existing && existing.reaction === reaction) {
        const result = await supabaseClient
          .from("message_reactions")
          .delete()
          .eq("id", existing.id)
          .eq("user_id", currentUser.id);
        error = result.error;
      } else {
        // Use separate delete + insert instead of upsert.
        // This works cleanly with the RLS policies on this table.
        if (existing) {
          const removeResult = await supabaseClient
            .from("message_reactions")
            .delete()
            .eq("id", existing.id)
            .eq("user_id", currentUser.id);

          if (removeResult.error) {
            console.error("Reaction replace error:", removeResult.error);
            showStatus("Reaction could not be changed.");
            return;
          }
        }

        const insertResult = await supabaseClient
          .from("message_reactions")
          .insert({
            message_id: messageId,
            user_id: currentUser.id,
            reaction: reaction
          });

        error = insertResult.error;
      }

      if (error) {
        console.error("Reaction save error:", error);
        showStatus("Reaction could not be changed.");
        return;
      }

      await refreshReactionForMessage(messageId);
    }

    async function refreshReactionForMessage(messageId) {
      if (!messageId) return;

      const { data, error } = await supabaseClient
        .from("message_reactions")
        .select("user_id, reaction")
        .eq("message_id", messageId);

      if (error) {
        console.error("Reaction load error:", error);
        return;
      }

      renderReactionSummary(messageId, data || []);
    }

    function renderReactionSummary(messageId, reactions) {
      const messageElement = document.querySelector(`[data-message-id="${messageId}"]`);
      if (!messageElement) return;

      let summary = messageElement.querySelector(".reaction-summary");
      if (!summary) {
        summary = document.createElement("div");
        summary.className = "reaction-summary";
        summary.dataset.reactionSummary = "true";
        messageElement.appendChild(summary);
      }

      const counts = {};
      const mine = new Set();
      reactions.forEach((item) => {
        counts[item.reaction] = (counts[item.reaction] || 0) + 1;
        if (currentUser && item.user_id === currentUser.id) mine.add(item.reaction);
      });

      summary.innerHTML = "";
      REACTIONS.forEach((reaction) => {
        if (!counts[reaction]) return;
        const chip = document.createElement("span");
        chip.className = "reaction-chip" + (mine.has(reaction) ? " mine" : "");
        chip.textContent = reaction + " " + counts[reaction];
        summary.appendChild(chip);
      });

      summary.classList.toggle("has-reactions", Object.keys(counts).length > 0);
    }

    async function loadAllReactions() {
      const { data, error } = await supabaseClient
        .from("message_reactions")
        .select("message_id, user_id, reaction");

      if (error) {
        console.error("Load reactions error:", error);
        return;
      }

      const grouped = {};
      (data || []).forEach((item) => {
        if (!grouped[item.message_id]) grouped[item.message_id] = [];
        grouped[item.message_id].push(item);
      });

      document.querySelectorAll("[data-message-id]").forEach((messageElement) => {
        const id = messageElement.dataset.messageId;
        renderReactionSummary(id, grouped[id] || []);
      });
    }

    document.addEventListener("click", (event) => {
      if (!event.target.closest(".message-menu-wrap") && !event.target.closest(".reaction-picker")) {
        document.querySelectorAll(".message-menu.open").forEach((menu) => menu.classList.remove("open"));
        document.querySelectorAll(".reaction-picker.open").forEach((picker) => picker.classList.remove("open"));
        document.querySelectorAll(".reaction-target").forEach((message) => message.classList.remove("reaction-target"));
      }
    });

    /* ======================================
       EDIT MESSAGE
    ====================================== */

    async function editMessage(messageId, messageElement, textElement) {
      if (!messageId || !currentUser || !textElement) return;
      if (messageElement.querySelector(".edit-message-area")) return;

      const menuWrap = messageElement.querySelector(".message-menu-wrap");

      const editor = document.createElement("textarea");
      editor.className = "edit-message-area";
      const originalContent = textElement.textContent;
      editor.value = originalContent;
      editor.maxLength = 5000;

      textElement.replaceWith(editor);
      if (menuWrap) menuWrap.style.display = "none";
      editor.focus();
      editor.setSelectionRange(editor.value.length, editor.value.length);

      const saveRow = document.createElement("div");
      saveRow.className = "message-actions";

      const saveButton = document.createElement("button");
      saveButton.className = "message-action-btn";
      saveButton.type = "button";
      saveButton.textContent = "Save";

      const cancelButton = document.createElement("button");
      cancelButton.className = "message-action-btn";
      cancelButton.type = "button";
      cancelButton.textContent = "Cancel";

      saveRow.appendChild(saveButton);
      saveRow.appendChild(cancelButton);
      messageElement.appendChild(saveRow);

      const cancelEdit = () => {
        editor.replaceWith(textElement);
        saveRow.remove();
        if (menuWrap) menuWrap.style.display = "block";
      };

      cancelButton.addEventListener("click", cancelEdit);

      saveButton.addEventListener("click", async () => {
        const newContent = editor.value.trim();
        if (!newContent) { showStatus("Message cannot be empty."); editor.focus(); return; }
        if (newContent === originalContent) { cancelEdit(); return; }

        saveButton.disabled = true;
        cancelButton.disabled = true;
        saveButton.textContent = "Saving...";

        const { data, error } = await supabaseClient
          .from("messages")
          .update({ content: newContent, edited_at: new Date().toISOString() })
          .eq("id", messageId)
          .eq("sender_id", currentUser.id)
          .select("id, sender_id, content, created_at, edited_at")
          .single();

        if (error) {
          console.error("Edit message error:", error);
          saveButton.disabled = false;
          cancelButton.disabled = false;
          saveButton.textContent = "Save";
          showStatus("Message could not be edited.");
          return;
        }

        textElement.textContent = data.content;

        const timeElement =
          messageElement.querySelector(".message-time");

        if (timeElement) {
          const editedDate =
            data.created_at
              ? new Date(data.created_at)
              : null;

          const editedTimeText =
            editedDate
              ? editedDate.toLocaleTimeString(
                  [],
                  {
                    hour: "2-digit",
                    minute: "2-digit"
                  }
                )
              : timeElement.textContent.split(" · ")[0];

          timeElement.textContent =
            editedTimeText + " · edited";
        }

        editor.replaceWith(textElement);
        saveRow.remove();
        if (menuWrap) menuWrap.style.display = "block";
      });

      editor.addEventListener("keydown", (event) => {
        if (event.key === "Escape") { event.preventDefault(); cancelEdit(); }
        if ((event.ctrlKey || event.metaKey) && event.key === "Enter") { event.preventDefault(); saveButton.click(); }
      });
    }


    /* ======================================
       DELETE MESSAGE
    ====================================== */

    async function deleteMessage(messageId, messageElement) {
      if (!messageId || !currentUser) return;

      if (!window.confirm("Delete this message?")) return;

      const menuButton = messageElement.querySelector(".message-menu-btn");
      if (menuButton) {
        menuButton.disabled = true;
      }

      const { error } = await supabaseClient
        .from("messages")
        .delete()
        .eq("id", messageId)
        .eq("sender_id", currentUser.id);

      if (error) {
        console.error("Delete message error:", error);
        if (menuButton) {
          menuButton.disabled = false;
        }
        showStatus("Message could not be deleted.");
        return;
      }

      messageElement.classList.add("deleting");
      setTimeout(() => {
        messageElement.remove();
        if (!messages.querySelector(".message")) {
          messages.innerHTML = `<div class="welcome-message" id="welcomeMessage"><h3>Welcome to ToTalk</h3><p>Your conversation space is ready. Write a message below to begin.</p></div>`;
        }
      }, 220);
    }


    /* ======================================
       LOAD SAVED MESSAGES
    ====================================== */

    async function loadMessages() {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("messages")
          .select(
            "id, sender_id, content, created_at, edited_at"
          )
          .order(
            "created_at",
            {
              ascending: true
            }
          );


      if (error) {

        console.error(
          "Load messages error:",
          error
        );


        showStatus(
          "Messages could not be loaded."
        );


        return;

      }


      messages.innerHTML =
        "";


      if (
        !data ||
        data.length === 0
      ) {

        messages.innerHTML = `

          <div
            class="welcome-message"
            id="welcomeMessage"
          >

            <h3>
              Welcome to ToTalk
            </h3>

            <p>
              Your conversation space is ready.
              Write a message below to begin.
            </p>

          </div>

        `;


        return;

      }


      data.forEach(
        (messageData, index) => {

          addMessage(
            messageData,
            true,
            Math.min(index * 75, 900)
          );

        }
      );


      /*
        Open chat at newest message.
      */

      scrollToBottom(
        false
      );

      await loadAllReactions();

    }


    /* ======================================
       SEND MESSAGE
    ====================================== */

    async function sendMessage() {

      const text =
        messageInput.value.trim();


      if (!text) {

        return;

      }


      if (
        !authReady ||
        !currentUser
      ) {

        showStatus(
          "Your login session is not ready."
        );


        return;

      }


      sendButton.disabled =
        true;


      sendButton.textContent =
        "Saving";


      try {


        /* -------------------------------
           GET CURRENT SESSION
        ------------------------------- */

        const {
          data: sessionData,
          error: sessionError
        } =
          await supabaseClient.auth
            .getSession();


        if (
          sessionError ||
          !sessionData ||
          !sessionData.session ||
          !sessionData.session.user
        ) {

          showStatus(
            "Login session expired. Please sign in again."
          );


          return;

        }


        const user =
          sessionData.session.user;


        currentUser =
          user;


        /* -------------------------------
           SAVE TO SUPABASE
        ------------------------------- */

        const {
          data,
          error
        } =
          await supabaseClient
            .from("messages")
            .insert([
              {

                sender_id:
                  user.id,

                content:
                  text

              }
            ])
            .select(
              "id, sender_id, content, created_at, edited_at"
            )
            .single();


        if (error) {

          console.error(
            "Supabase INSERT ERROR:",
            error
          );


          showStatus(
            "Message was not saved: " +
            error.message
          );


          return;

        }


        /* -------------------------------
           SHOW SAVED MESSAGE
        ------------------------------- */

        addMessage(
          data
        );


        messageInput.value =
          "";


        /*
          Automatically scroll to
          newest message.
        */

        scrollToBottom(
          true
        );


      } catch (error) {

        console.error(
          "Send message error:",
          error
        );


        showStatus(
          "Something went wrong while saving."
        );


      } finally {

        sendButton.disabled =
          false;


        sendButton.textContent =
          "Send";

      }

    }


    /* ======================================
       REAL-TIME MESSAGES
    ====================================== */

    function startRealtime() {

      /*
        Remove old channel if one exists.
      */

      if (realtimeChannel) {

        supabaseClient
          .removeChannel(
            realtimeChannel
          );

      }


      realtimeChannel =
        supabaseClient
          .channel(
            "totalk-messages"
          )


          .on(
            "postgres_changes",
            {
              event: "*",
              schema: "public",
              table: "messages"
            },
            (payload) => {
              if (payload.eventType === "INSERT") {
                addMessage(payload.new);
                scrollToBottom(true);
                return;
              }

              if (payload.eventType === "UPDATE" && payload.new?.id) {
                const updatedMessage = document.querySelector(`[data-message-id="${payload.new.id}"]`);
                if (updatedMessage) {
                  const updatedText = updatedMessage.querySelector(".message-text");
                  if (updatedText) updatedText.textContent = payload.new.content;

                  const updatedTime = updatedMessage.querySelector(".message-time");
                  if (updatedTime && payload.new.created_at) {
                    const updatedDate = new Date(payload.new.created_at);
                    const updatedTimeText = updatedDate.toLocaleTimeString(
                      [],
                      {
                        hour: "2-digit",
                        minute: "2-digit"
                      }
                    );
                    updatedTime.textContent =
                      payload.new.edited_at
                        ? updatedTimeText + " · edited"
                        : updatedTimeText;
                  }
                }
                return;
              }

              if (payload.eventType === "DELETE" && payload.old?.id) {
                const deletedMessage = document.querySelector(`[data-message-id="${payload.old.id}"]`);
                if (deletedMessage) {
                  deletedMessage.classList.add("deleting");
                  setTimeout(() => deletedMessage.remove(), 220);
                }
              }
            }
          )

          .on(
            "postgres_changes",
            {
              event: "*",
              schema: "public",
              table: "message_reactions"
            },
            async (payload) => {
              const messageId = payload.new?.message_id || payload.old?.message_id;
              if (messageId) await refreshReactionForMessage(messageId);
            }
          )

          .subscribe();

    }


    /* ======================================
       START CHAT / GOOGLE CALLBACK
    ====================================== */

    async function startChat() {

      try {


        /*
          Google/Supabase sends us back
          to chat.html with:

          ?code=........
        */

        const params =
          new URLSearchParams(
            window.location.search
          );


        const code =
          params.get("code");


        /* -------------------------------
           EXCHANGE GOOGLE CODE
        ------------------------------- */

        if (code) {


          const {
            data,
            error
          } =
            await supabaseClient.auth
              .exchangeCodeForSession(
                code
              );


          if (error) {

            console.error(
              "OAuth code exchange error:",
              error
            );


            showLoginError(
              "Google login could not be completed. Please return to the homepage and try again."
            );


            return;

          }


          /*
            Remove ?code=... from URL.

            This also prevents the same
            OAuth code being processed again
            if the page is refreshed.
          */

          window.history.replaceState(
            {},
            document.title,
            window.location.pathname
          );


        }


        /* -------------------------------
           GET SESSION
        ------------------------------- */

        const {
          data,
          error
        } =
          await supabaseClient.auth
            .getSession();


        if (error) {

          console.error(
            "Session error:",
            error
          );


          showLoginError(
            "ToTalk could not read your login session. Please return to the homepage and try again."
          );


          return;

        }


        if (
          !data ||
          !data.session ||
          !data.session.user
        ) {


          /*
            Give Supabase a short moment
            in case the browser is still
            finishing the OAuth callback.
          */

          setTimeout(
            async () => {

              const {
                data: retryData,
                error: retryError
              } =
                await supabaseClient
                  .auth
                  .getSession();


              if (
                !retryError &&
                retryData?.session?.user
              ) {

                currentUser =
                  retryData.session.user;


                showUser(
                  retryData.session.user
                );


                await loadMessages();

                finishLoading();


                startRealtime();


                return;

              }


              showLoginError(
                "No active Google login session was found. Please return to the homepage and tap Continue with Google again."
              );


            },
            1200
          );


          return;

        }


        /* -------------------------------
           LOGIN SUCCESS
        ------------------------------- */

        currentUser =
          data.session.user;


        showUser(
          currentUser
        );


        /* -------------------------------
           LOAD DATABASE MESSAGES
        ------------------------------- */

        await loadMessages();

        finishLoading();


        /* -------------------------------
           START REALTIME
        ------------------------------- */

        startRealtime();


      } catch (error) {

        console.error(
          "Chat startup error:",
          error
        );


        showLoginError(
          "ToTalk could not finish opening your chat. Please return to the homepage and sign in again."
        );

      }

    }


    /* ======================================
       LOGOUT
    ====================================== */

    logoutBtn.addEventListener(
      "click",
      async () => {

        logoutBtn.disabled =
          true;


        logoutBtn.textContent =
          "Logging out";


        /*
          Stop realtime before logout.
        */

        if (realtimeChannel) {

          await supabaseClient
            .removeChannel(
              realtimeChannel
            );

          realtimeChannel =
            null;

        }


        /*
          Sign out completely.
        */

        const {
          error
        } =
          await supabaseClient.auth
            .signOut();


        if (error) {

          console.error(
            "Logout error:",
            error
          );


          logoutBtn.disabled =
            false;


          logoutBtn.textContent =
            "Logout";


          showStatus(
            "Logout failed. Please try again."
          );


          return;

        }


        /*
          Go back to homepage.
        */

        window.location.replace(
          "./index.html"
        );

      }
    );


    /* ======================================
       SEND BUTTON
    ====================================== */

    sendButton.addEventListener(
      "click",
      sendMessage
    );


    /* ======================================
       ENTER KEY
    ====================================== */

    messageInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* ======================================
       AUTH STATE LISTENER
    ====================================== */

    supabaseClient.auth
      .onAuthStateChange(
        (event, session) => {

          console.log(
            "Supabase auth event:",
            event
          );


          if (
            session &&
            session.user &&
            !currentUser
          ) {

            currentUser =
              session.user;

          }

        }
      );


    /* ======================================
       START EVERYTHING
    ====================================== */

    startChat();

  </script>
