<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>ToTalk Sameer</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #03020b;
      --panel: rgba(8, 6, 22, 0.94);
      --panel2: rgba(13, 9, 31, 0.96);
      --purple: #914cff;
      --purple2: #6d2cff;
      --purple-soft: rgba(145, 76, 255, 0.22);
      --yellow: #ffe34f;
      --white: #f7f4ff;
      --muted: #8d88a6;
      --green: #55e89a;
      --border: rgba(145, 76, 255, 0.42);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: var(--white);
      background:
        radial-gradient(
          circle at 72% 20%,
          rgba(119, 42, 196, 0.25),
          transparent 28%
        ),
        radial-gradient(
          circle at 20% 85%,
          rgba(75, 24, 150, 0.18),
          transparent 25%
        ),
        linear-gradient(
          135deg,
          #020109,
          #060313 45%,
          #020108
        );

      min-height: 100dvh;
    }

    /* --------------------------------
       STAR FIELD
    -------------------------------- */

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      opacity: 0.75;

      background-image:
        radial-gradient(circle, white 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,.8) 1px, transparent 1px),
        radial-gradient(circle, rgba(173,119,255,.8) 1px, transparent 1px);

      background-size:
        105px 105px,
        165px 165px,
        230px 230px;

      background-position:
        20px 15px,
        80px 60px,
        120px 100px;
    }

    body::after {
      background:
        radial-gradient(
          ellipse at 70% 25%,
          rgba(148, 60, 255, 0.20),
          transparent 32%
        ),
        radial-gradient(
          ellipse at 40% 75%,
          rgba(95, 30, 180, 0.13),
          transparent 30%
        );
    }

    /* --------------------------------
       HEADER
    -------------------------------- */

    header {
      position: relative;
      z-index: 5;

      height: 78px;

      padding:
        0 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background:
        rgba(3, 2, 11, 0.94);

      border-bottom:
        1px solid var(--border);

      box-shadow:
        0 0 25px rgba(104, 42, 190, 0.12);
    }

    .brand {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .brand-main {
      color: var(--white);
    }

    .brand-name {
      color: #a86cff;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    #userName {
      color: #a7a1bd;
      font-size: 14px;
      font-weight: 700;
    }

    #logoutBtn {
      border: 1px solid var(--border);
      background: rgba(22, 11, 45, 0.8);
      color: var(--white);

      padding: 10px 17px;

      border-radius: 10px;

      font-size: 13px;
      font-weight: 800;

      cursor: pointer;

      transition: 0.2s;
    }

    #logoutBtn:hover {
      border-color: var(--purple);
      box-shadow:
        0 0 18px rgba(145, 76, 255, 0.25);
    }

    /* --------------------------------
       MAIN LAYOUT
    -------------------------------- */

    .chat-layout {
      position: relative;
      z-index: 2;

      width: 100%;
      height: calc(100dvh - 78px);

      padding: 16px;

      display: grid;
      grid-template-columns: 235px minmax(0, 1fr);

      gap: 14px;
    }

    /* --------------------------------
       SIDEBAR
    -------------------------------- */

    .sidebar {
      position: relative;

      min-width: 0;

      background:
        linear-gradient(
          180deg,
          rgba(9, 6, 23, 0.96),
          rgba(3, 2, 12, 0.98)
        );

      border:
        1px solid var(--border);

      border-radius: 14px;

      overflow: hidden;

      box-shadow:
        0 0 25px rgba(95, 35, 180, 0.10);
    }

    .sidebar::after {
      content: "";

      position: absolute;

      width: 110px;
      height: 45px;

      left: 35px;
      bottom: 40px;

      background:
        radial-gradient(
          ellipse,
          rgba(151, 63, 255, 0.85),
          rgba(96, 25, 180, 0.15),
          transparent 70%
        );

      filter: blur(6px);

      transform: rotate(-10deg);
    }

    .sidebar-title {
      padding: 22px 20px 18px;

      border-bottom:
        1px solid rgba(145, 76, 255, 0.18);
    }

    .sidebar-title h2 {
      font-size: 18px;
      margin-bottom: 7px;
    }

    .sidebar-title p {
      color: var(--muted);
      font-size: 11px;
    }

    .chat-person {
      margin: 17px 15px;

      padding: 13px;

      border:
        1px solid rgba(145, 76, 255, 0.32);

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          rgba(95, 37, 165, 0.35),
          rgba(27, 12, 59, 0.65)
        );

      display: flex;
      align-items: center;
      gap: 11px;
    }

    .avatar {
      width: 43px;
      height: 43px;

      flex: 0 0 43px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #a45cff,
          #6321d8
        );

      font-weight: 900;
      font-size: 17px;

      box-shadow:
        0 0 20px rgba(145, 76, 255, 0.45);
    }

    .person-name {
      font-size: 13px;
      font-weight: 800;
    }

    .online {
      margin-top: 5px;

      color: var(--green);

      font-size: 10px;
      font-weight: 700;
    }

    /* --------------------------------
       CHAT BOX
    -------------------------------- */

    .chat-box {
      position: relative;

      min-width: 0;
      min-height: 0;

      display: flex;
      flex-direction: column;

      background:
        rgba(3, 2, 12, 0.91);

      border:
        1px solid var(--border);

      border-radius: 14px;

      overflow: hidden;

      box-shadow:
        0 0 35px rgba(98, 38, 190, 0.14);
    }

    /* --------------------------------
       CHAT TOP
    -------------------------------- */

    .chat-top {
      position: relative;
      z-index: 3;

      min-height: 75px;

      padding: 13px 20px;

      display: flex;
      align-items: center;

      gap: 12px;

      background:
        rgba(8, 5, 20, 0.96);

      border-bottom:
        1px solid rgba(145, 76, 255, 0.25);
    }

    .chat-avatar {
      width: 43px;
      height: 43px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #9d56ff,
          #6322d3
        );

      font-weight: 900;

      box-shadow:
        0 0 18px rgba(145, 76, 255, 0.38);
    }

    .chat-title {
      font-size: 15px;
      font-weight: 900;
    }

    .chat-status {
      margin-top: 4px;

      color: var(--green);

      font-size: 10px;
      font-weight: 700;
    }

    .top-star {
      margin-left: auto;

      color: var(--yellow);

      font-size: 24px;

      text-shadow:
        0 0 12px rgba(255, 227, 79, 0.75);
    }

    /* --------------------------------
       SPACE BACKGROUND
    -------------------------------- */

    .space {
      position: relative;

      flex: 1;

      min-height: 0;

      overflow: hidden;

      background:
        radial-gradient(
          ellipse at 58% 27%,
          rgba(124, 40, 195, 0.32),
          transparent 30%
        ),
        radial-gradient(
          ellipse at 90% 60%,
          rgba(83, 27, 148, 0.18),
          transparent 30%
        ),
        linear-gradient(
          180deg,
          #03020b,
          #050213 55%,
          #020108
        );
    }

    .space::before {
      content: "";

      position: absolute;
      inset: 0;

      opacity: 0.7;

      background-image:
        radial-gradient(circle, #ffffff 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,.7) 1px, transparent 1px),
        radial-gradient(circle, rgba(167,104,255,.8) 1px, transparent 1px);

      background-size:
        130px 130px,
        210px 210px,
        275px 275px;

      background-position:
        20px 10px,
        75px 50px,
        120px 90px;
    }

    /* --------------------------------
       MOON
    -------------------------------- */

    .moon {
      position: absolute;

      top: 28px;
      left: 60px;

      width: 74px;
      height: 74px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 35%,
          #fffbd0,
          #ffe43e 58%,
          #e4a700 100%
        );

      box-shadow:
        0 0 25px rgba(255, 220, 47, 0.42);
    }

    .moon::after {
      content: "";

      position: absolute;

      width: 73px;
      height: 73px;

      left: 22px;
      top: -5px;

      border-radius: 50%;

      background: #03020b;
    }

    /* --------------------------------
       PLANET
    -------------------------------- */

    .planet {
      position: absolute;

      top: 65px;
      right: 40px;

      width: 104px;
      height: 104px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 32% 28%,
          #566083,
          #1d2140 45%,
          #050510 78%
        );

      box-shadow:
        0 0 35px rgba(101, 75, 170, 0.26);
    }

    .planet::after {
      content: "";

      position: absolute;

      width: 180px;
      height: 42px;

      left: -38px;
      top: 30px;

      border:
        1px solid rgba(181, 143, 255, 0.52);

      border-radius: 50%;

      transform:
        rotate(-16deg);

      box-shadow:
        0 0 8px rgba(145, 76, 255, 0.22);
    }

    /* --------------------------------
       NEBULA
    -------------------------------- */

    .nebula {
      position: absolute;

      width: 360px;
      height: 250px;

      top: 80px;
      left: 32%;

      background:
        radial-gradient(
          ellipse,
          rgba(153, 54, 224, 0.27),
          rgba(93, 29, 145, 0.13),
          transparent 70%
        );

      filter: blur(20px);

      pointer-events: none;
    }

    /* --------------------------------
       SHOOTING STAR
    -------------------------------- */

    .shooting-star {
      position: absolute;

      width: 90px;
      height: 2px;

      right: 17%;
      bottom: 17%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.85)
        );

      transform:
        rotate(-40deg);

      box-shadow:
        0 0 8px rgba(255,255,255,.75);
    }

    /* --------------------------------
       MESSAGES
    -------------------------------- */

    #messages {
      position: absolute;
      z-index: 2;

      inset: 0;

      overflow-y: auto;

      padding:
        24px 22px 95px;

      display: flex;
      flex-direction: column;

      gap: 10px;

      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar {
      width: 5px;
    }

    #messages::-webkit-scrollbar-track {
      background: transparent;
    }

    #messages::-webkit-scrollbar-thumb {
      background: rgba(145, 76, 255, 0.35);
      border-radius: 10px;
    }

    .welcome-message {
      margin: auto;

      max-width: 400px;

      text-align: center;

      color: var(--muted);

      padding: 30px;
    }

    .welcome-message h3 {
      color: var(--white);

      font-size: 19px;

      margin-bottom: 9px;
    }

    .welcome-message p {
      font-size: 12px;
      line-height: 1.7;
    }

    .message {
      max-width: min(70%, 520px);

      padding:
        11px 15px;

      border-radius: 15px;

      font-size: 13px;
      line-height: 1.5;

      word-wrap: break-word;

      background:
        rgba(19, 13, 40, 0.92);

      border:
        1px solid rgba(145, 76, 255, 0.24);

      color: var(--white);

      align-self: flex-start;
    }

    .message.mine {
      align-self: flex-end;

      background:
        linear-gradient(
          135deg,
          #8e47f0,
          #6226c8
        );

      border:
        1px solid rgba(188, 142, 255, 0.45);

      box-shadow:
        0 5px 20px rgba(91, 35, 177, 0.22);
    }

    .message-time {
      display: block;

      margin-top: 4px;

      font-size: 9px;

      opacity: 0.58;

      text-align: right;
    }

    /* --------------------------------
       INPUT
    -------------------------------- */

    .input-area {
      position: absolute;

      z-index: 10;

      left: 16px;
      right: 16px;
      bottom: 14px;

      display: flex;

      gap: 9px;

      padding: 7px;

      background:
        rgba(17, 10, 35, 0.94);

      border:
        1px solid rgba(145, 76, 255, 0.48);

      border-radius: 14px;

      box-shadow:
        0 0 25px rgba(92, 31, 177, 0.22);

      backdrop-filter: blur(10px);
    }

    #messageInput {
      flex: 1;

      min-width: 0;

      border: none;
      outline: none;

      background: transparent;

      color: var(--white);

      padding:
        10px 9px;

      font-size: 13px;
    }

    #messageInput::placeholder {
      color: #77718d;
    }

    #sendButton {
      border: none;

      min-width: 52px;

      padding: 0 17px;

      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          #a45cff,
          #7029df
        );

      color: white;

      font-size: 12px;
      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 0 18px rgba(145, 76, 255, 0.34);

      transition: 0.2s;
    }

    #sendButton:hover {
      transform: translateY(-1px);

      box-shadow:
        0 0 25px rgba(145, 76, 255, 0.55);
    }

    #sendButton:disabled {
      opacity: 0.55;
      cursor: wait;
      transform: none;
    }

    /* --------------------------------
       STATUS
    -------------------------------- */

    #status {
      position: fixed;

      z-index: 30;

      left: 50%;
      bottom: 90px;

      transform: translateX(-50%);

      max-width: calc(100% - 30px);

      padding: 10px 15px;

      border-radius: 10px;

      background:
        rgba(20, 10, 38, 0.96);

      border:
        1px solid rgba(145, 76, 255, 0.5);

      color: #ded7ef;

      font-size: 11px;

      display: none;
    }

    /* --------------------------------
       LOADING
    -------------------------------- */

    #loading {
      position: fixed;

      inset: 0;

      z-index: 100;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at center,
          rgba(86, 27, 142, 0.25),
          #03020b 55%
        );

      color: var(--white);

      font-size: 14px;
      font-weight: 800;

      text-align: center;
    }

    .login-error {
      width: min(430px, calc(100% - 35px));

      padding: 25px;

      border:
        1px solid rgba(145, 76, 255, 0.45);

      border-radius: 16px;

      background:
        rgba(10, 6, 25, 0.96);

      box-shadow:
        0 0 35px rgba(90, 30, 180, 0.2);
    }

    .login-error h2 {
      margin-bottom: 10px;

      color: var(--white);

      font-size: 20px;
    }

    .login-error p {
      color: #a7a0ba;

      font-size: 12px;

      line-height: 1.7;
    }

    .back-button {
      display: inline-block;

      margin-top: 17px;

      padding:
        10px 16px;

      border-radius: 10px;

      background:
        linear-gradient(
          135deg,
          #a45cff,
          #7029df
        );

      color: white;

      text-decoration: none;

      font-size: 12px;
      font-weight: 800;
    }

    /* --------------------------------
       MOBILE
    -------------------------------- */

    @media (max-width: 800px) {

      html,
      body {
        overflow: hidden;
      }

      header {
        height: 64px;

        padding:
          0 13px;
      }

      .brand {
        font-size: 20px;
      }

      #userName {
        display: none;
      }

      #logoutBtn {
        padding:
          8px 12px;

        font-size: 11px;
      }

      .chat-layout {
        height: calc(100dvh - 64px);

        padding:
          8px;

        display: block;
      }

      .sidebar {
        display: none;
      }

      .chat-box {
        width: 100%;
        height: 100%;

        border-radius: 13px;
      }

      .chat-top {
        min-height: 67px;

        padding:
          10px 14px;
      }

      .chat-avatar {
        width: 39px;
        height: 39px;
      }

      .chat-title {
        font-size: 14px;
      }

      .top-star {
        font-size: 20px;
      }

      .moon {
        left: 32px;
        top: 25px;

        width: 60px;
        height: 60px;
      }

      .moon::after {
        width: 59px;
        height: 59px;

        left: 18px;
        top: -4px;
      }

      .planet {
        right: 18px;
        top: 54px;

        width: 78px;
        height: 78px;
      }

      .planet::after {
        width: 130px;
        height: 31px;

        left: -26px;
        top: 23px;
      }

      .nebula {
        width: 250px;
        height: 180px;

        left: 25%;
        top: 70px;
      }

      #messages {
        padding:
          18px 14px 85px;
      }

      .message {
        max-width: 82%;
        font-size: 13px;
      }

      .input-area {
        left: 9px;
        right: 9px;
        bottom: 8px;
      }

      #messageInput {
        font-size: 13px;
      }

      #sendButton {
        min-width: 48px;
        padding: 0 13px;
      }
    }
  </style>
</head>

<body>

  <!-- LOADING / LOGIN CHECK -->

  <div id="loading">
    Opening ToTalk...
  </div>


  <!-- HEADER -->

  <header>

    <div class="brand">
      <span class="brand-main">ToTalk</span>
      <span class="brand-name">Sameer</span>
    </div>

    <div class="header-right">

      <div id="userName">
        Loading...
      </div>

      <button id="logoutBtn">
        Logout
      </button>

    </div>

  </header>


  <!-- CHAT -->

  <main class="chat-layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="sidebar-title">
        <h2>Sameer's Chats</h2>

        <p>
          Your personal conversation space
        </p>
      </div>


      <div class="chat-person">

        <div class="avatar">
          S
        </div>

        <div>

          <div
            class="person-name"
            id="sideName"
          >
            Sameer
          </div>

          <div class="online">
            Online
          </div>

        </div>

      </div>

    </aside>


    <!-- CHAT BOX -->

    <section class="chat-box">

      <div class="chat-top">

        <div class="chat-avatar">
          S
        </div>

        <div>

          <div class="chat-title">
            Sameer's ToTalk
          </div>

          <div class="chat-status">
            Online
          </div>

        </div>

        <div class="top-star">
          *
        </div>

      </div>


      <!-- SPACE -->

      <div class="space">

        <div class="nebula"></div>

        <div class="moon"></div>

        <div class="planet"></div>

        <div class="shooting-star"></div>


        <!-- MESSAGES -->

        <div id="messages">

          <div
            class="welcome-message"
            id="welcomeMessage"
          >

            <h3>
              Welcome to ToTalk
            </h3>

            <p>
              Your conversation space is ready.
              Write a message below to begin.
            </p>

          </div>

        </div>


        <!-- INPUT -->

        <div class="input-area">

          <input
            id="messageInput"
            type="text"
            placeholder="Write a message..."
            autocomplete="off"
            maxlength="2000"
          >

          <button id="sendButton">
            Send
          </button>

        </div>

      </div>

    </section>

  </main>


  <!-- STATUS -->

  <div id="status"></div>


  <script>

    /* =========================================
       SUPABASE
    ========================================= */

    const SUPABASE_URL =
      "https://qiynczbrhpxwuabwuyiy.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_eUPz4c_nYckgINEK-AIWqw_JAXIHozd";


    /*
      IMPORTANT:

      We keep the normal Supabase browser client.

      This matches the homepage Google login.
    */

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================================
       ELEMENTS
    ========================================= */

    const loading =
      document.getElementById(
        "loading"
      );

    const userName =
      document.getElementById(
        "userName"
      );

    const sideName =
      document.getElementById(
        "sideName"
      );

    const logoutBtn =
      document.getElementById(
        "logoutBtn"
      );

    const messageInput =
      document.getElementById(
        "messageInput"
      );

    const sendButton =
      document.getElementById(
        "sendButton"
      );

    const messages =
      document.getElementById(
        "messages"
      );

    const status =
      document.getElementById(
        "status"
      );


    let currentUser = null;

    let authReady = false;


    /* =========================================
       STATUS MESSAGE
    ========================================= */

    function showStatus(text) {

      status.textContent = text;

      status.style.display = "block";

      clearTimeout(
        showStatus.timer
      );

      showStatus.timer =
        setTimeout(() => {

          status.style.display =
            "none";

        }, 3500);

    }


    /* =========================================
       LOGIN ERROR
    ========================================= */

    function showLoginError(text) {

      loading.innerHTML = `
        <div class="login-error">

          <h2>
            Unable to open chat
          </h2>

          <p>
            ${text}
          </p>

          <a
            class="back-button"
            href="./index.html"
          >
            Back to ToTalk
          </a>

        </div>
      `;

      loading.style.display =
        "flex";
    }


    /* =========================================
       SHOW USER
    ========================================= */

    function showUser(user) {

      currentUser = user;

      const name =
        user.user_metadata?.full_name ||
        user.user_metadata?.name ||
        user.email?.split("@")[0] ||
        "Sameer";

      userName.textContent =
        name;

      sideName.textContent =
        name;

      loading.style.display =
        "none";

      authReady = true;

    }


    /* =========================================
       CREATE MESSAGE ELEMENT
    ========================================= */

    function addMessage(
      messageData
    ) {

      const welcome =
        document.getElementById(
          "welcomeMessage"
        );

      if (welcome) {
        welcome.remove();
      }


      const message =
        document.createElement(
          "div"
        );


      const mine =
        currentUser &&
        messageData.sender_id ===
          currentUser.id;


      message.className =
        mine
          ? "message mine"
          : "message";


      const text =
        document.createElement(
          "div"
        );

      text.textContent =
        messageData.content;


      const time =
        document.createElement(
          "span"
        );

      time.className =
        "message-time";


      if (messageData.created_at) {

        const date =
          new Date(
            messageData.created_at
          );

        time.textContent =
          date.toLocaleTimeString(
            [],
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          );

      }


      message.appendChild(
        text
      );

      message.appendChild(
        time
      );

      messages.appendChild(
        message
      );

    }


    /* =========================================
       LOAD SAVED MESSAGES
    ========================================= */

    async function loadMessages() {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("messages")
          .select(
            "id, sender_id, content, created_at"
          )
          .order(
            "created_at",
            {
              ascending: true
            }
          );


      if (error) {

        console.error(
          "Load messages error:",
          error
        );

        showStatus(
          "Messages could not be loaded."
        );

        return;
      }


      const welcome =
        document.getElementById(
          "welcomeMessage"
        );

      if (welcome) {
        welcome.remove();
      }


      messages.innerHTML = "";


      if (!data || data.length === 0) {

        messages.innerHTML = `
          <div
            class="welcome-message"
            id="welcomeMessage"
          >
            <h3>
              Welcome to ToTalk
            </h3>

            <p>
              Your conversation space is ready.
              Write a message below to begin.
            </p>
          </div>
        `;

        return;
      }


      data.forEach(
        (messageData) => {

          addMessage(
            messageData
          );

        }
      );


      messages.scrollTop =
        messages.scrollHeight;

    }


    /* =========================================
       SEND MESSAGE
    ========================================= */

    async function sendMessage() {

      const text =
        messageInput.value.trim();


      if (!text) {
        return;
      }


      if (!authReady || !currentUser) {

        showStatus(
          "Your login session is not ready."
        );

        return;
      }


      sendButton.disabled =
        true;

      sendButton.textContent =
        "Saving";


      try {

        /*
          Get the current session again.

          This makes sure the database request
          is authenticated.
        */

        const {
          data: sessionData,
          error: sessionError
        } =
          await supabaseClient.auth.getSession();


        if (
          sessionError ||
          !sessionData ||
          !sessionData.session ||
          !sessionData.session.user
        ) {

          console.error(
            "Session error:",
            sessionError
          );

          showStatus(
            "Login session expired. Please sign in again."
          );

          return;
        }


        const user =
          sessionData.session.user;


        /*
          THIS IS THE IMPORTANT PART.

          The message is actually inserted
          into the Supabase messages table.
        */

        const {
          data,
          error
        } =
          await supabaseClient
            .from("messages")
            .insert([
              {
                sender_id:
                  user.id,

                content:
                  text
              }
            ])
            .select(
              "id, sender_id, content, created_at"
            )
            .single();


        if (error) {

          console.error(
            "Supabase INSERT ERROR:",
            error
          );

          showStatus(
            "Message was not saved: " +
            error.message
          );

          return;
        }


        /*
          Only show the message after
          Supabase successfully saved it.
        */

        addMessage(
          data
        );


        messageInput.value =
          "";


        messages.scrollTop =
          messages.scrollHeight;


      } catch (error) {

        console.error(
          "Send message error:",
          error
        );

        showStatus(
          "Something went wrong while saving."
        );

      } finally {

        sendButton.disabled =
          false;

        sendButton.textContent =
          "Send";

      }

    }


    /* =========================================
       GOOGLE LOGIN / SESSION
    ========================================= */

    async function startChat() {

      let foundSession =
        false;


      /*
        Listen BEFORE checking getSession().
        This helps when Supabase is still
        finishing the Google callback.
      */

      supabaseClient.auth.onAuthStateChange(
        (event, session) => {

          console.log(
            "Auth event:",
            event
          );


          if (
            session &&
            session.user
          ) {

            foundSession =
              true;

            showUser(
              session.user
            );

            loadMessages();

          }

        }
      );


      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth.getSession();


        if (error) {

          console.error(
            "getSession error:",
            error
          );

        }


        if (
          data &&
          data.session &&
          data.session.user
        ) {

          foundSession =
            true;

          showUser(
            data.session.user
          );

          await loadMessages();

          return;

        }


        /*
          Give Supabase a little time to
          finish the Google OAuth callback.
        */

        setTimeout(
          async () => {

            if (foundSession) {
              return;
            }


            const {
              data: retryData,
              error: retryError
            } =
              await supabaseClient
                .auth
                .getSession();


            if (retryError) {

              console.error(
                "Retry session error:",
                retryError
              );

            }


            if (
              retryData &&
              retryData.session &&
              retryData.session.user
            ) {

              foundSession =
                true;

              showUser(
                retryData.session.user
              );

              await loadMessages();

              return;

            }


            showLoginError(
              "No active Google login session was found. Please return to the homepage and tap Continue with Google again."
            );

          },
          3000
        );


      } catch (error) {

        console.error(
          "Chat startup error:",
          error
        );


        showLoginError(
          "ToTalk could not finish opening your chat. Please return to the homepage and sign in again."
        );

      }

    }


    /* =========================================
       LOGOUT
    ========================================= */

    logoutBtn.addEventListener(
      "click",
      async () => {

        await supabaseClient
          .auth
          .signOut();


        window.location.replace(
          "./index.html"
        );

      }
    );


    /* =========================================
       SEND BUTTON
    ========================================= */

    sendButton.addEventListener(
      "click",
      sendMessage
    );


    /* =========================================
       ENTER KEY
    ========================================= */

    messageInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* =========================================
       START
    ========================================= */

    startChat();

  </script>

</body>
