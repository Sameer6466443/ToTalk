<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToTalk Sameer Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#050611;color:#fff;min-height:100vh}
header{height:72px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #22243a;background:#070816}
.logo{font-size:23px;font-weight:900}.logo span{color:#a879ff}
.logout{border:1px solid #34364e;background:#111326;color:#fff;border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer}
.layout{max-width:1100px;height:calc(100vh - 105px);min-height:520px;margin:16px auto;padding:0 16px;display:grid;grid-template-columns:250px 1fr;gap:16px}
.side,.chat{background:#0a0c1b;border:1px solid #25283e;border-radius:20px;overflow:hidden}
.side{padding:22px}.side h2{font-size:18px}.side p{color:#777b91;font-size:12px;margin-top:5px}
.profile{margin-top:28px;padding:15px;border-radius:15px;background:#111329;display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;border-radius:50%;background:#a879ff;color:#090a15;display:flex;align-items:center;justify-content:center;font-weight:900}
.online{color:#8fdfaa;font-size:11px;margin-top:3px}
.chat{display:flex;flex-direction:column}
.chathead{padding:18px 20px;border-bottom:1px solid #25283e;display:flex;align-items:center;gap:12px}
.chathead strong{font-size:15px}.chathead small{display:block;color:#8fdfaa;margin-top:4px}
.messages{flex:1;padding:22px;overflow:auto}
.welcome{text-align:center;max-width:430px;margin:90px auto;color:#9b9fb3}
.welcome .big{font-size:42px;margin-bottom:14px}
.welcome h2{color:#fff;margin-bottom:8px}
.message{max-width:75%;padding:11px 15px;margin-bottom:12px;border-radius:16px;background:#171a30;line-height:1.5}
.mine{margin-left:auto;background:#7e55d9}
.input{display:flex;gap:10px;padding:14px;border-top:1px solid #25283e}
input{flex:1;background:#111329;border:1px solid #2b2e48;color:#fff;padding:13px 15px;border-radius:12px;outline:none}
.send{width:50px;border:0;border-radius:12px;background:#a879ff;color:#090a15;font-weight:900;font-size:18px;cursor:pointer}
#error{display:none;position:fixed;left:15px;right:15px;bottom:15px;background:#35121b;border:1px solid #a9435c;color:#ffdce4;padding:15px;border-radius:14px;font-size:13px;line-height:1.5;z-index:20}
#error b{display:block;margin-bottom:5px}
@media(max-width:700px){.layout{grid-template-columns:1fr;height:calc(100vh - 90px);min-height:0}.side{display:none}.welcome{margin:70px auto}.user{display:none}}
</style>
</head>
<body>
<header>
  <div class="logo">ToTalk <span>Sameer</span></div>
  <div>
    <span class="user" id="userName" style="color:#8d91a8;font-size:13px;margin-right:12px">Loading...</span>
    <button class="logout" id="logoutBtn">Logout</button>
  </div>
</header>

<div class="layout">
  <aside class="side">
    <h2>Sameer's Chats</h2>
    <p>Your personal conversation space</p>
    <div class="profile">
      <div class="avatar">S</div>
      <div><strong>Sameer</strong><div class="online">● Ready to chat</div></div>
    </div>
  </aside>

  <section class="chat">
    <div class="chathead">
      <div class="avatar">S</div>
      <div><strong>Sameer's ToTalk</strong><small>● Online</small></div>
    </div>

    <div class="messages" id="messages">
      <div class="welcome">
        <div class="big">🌙</div>
        <h2>Welcome to Sameer's ToTalk</h2>
        <p>You're signed in. This is Sameer's personal chat space.</p>
      </div>
    </div>

    <div class="input">
      <input id="messageInput" placeholder="Write a message to Sameer..." autocomplete="off">
      <button class="send" id="sendButton">➤</button>
    </div>
  </section>
</div>

<div id="error"><b>Login problem</b><span id="errorText"></span></div>

<script>
const SUPABASE_URL="https://qiynczbrhpxwuabwuyiy.supabase.co";
const SUPABASE_KEY="sb_publishable_eUPz4c_nYckgINEK-AIWqw_JAXIHozd";

const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
  auth:{
    persistSession:true,
    autoRefreshToken:true,
    detectSessionInUrl:true,
    flowType:"pkce"
  }
});

function showError(message){
  document.getElementById("errorText").textContent=message;
  document.getElementById("error").style.display="block";
  console.error(message);
}

function showUser(session){
  if(!session){ showError("Supabase did not return a session."); return; }
  const user=session.user;
  const name=user.user_metadata?.full_name || user.user_metadata?.name || user.email?.split("@")[0] || "You";
  document.getElementById("userName").textContent=name;
}

async function init(){
  try{
    const params=new URLSearchParams(window.location.search);
    const authError=params.get("error_description") || params.get("error");
    if(authError){
      showError(decodeURIComponent(authError.replace(/\+/g," ")));
      return;
    }

    const {data,error}=await supabaseClient.auth.getSession();
    if(error){ showError("getSession error: "+error.message); return; }

    if(data.session){
      showUser(data.session);
      return;
    }

    // Supabase may still be processing the OAuth callback.
    const result=await new Promise(resolve=>{
      let done=false;
      const finish=session=>{
        if(done)return;
        done=true;
        clearTimeout(timer);
        try{sub.unsubscribe()}catch(e){}
        resolve(session);
      };
      const {data:{subscription:sub}}=supabaseClient.auth.onAuthStateChange((event,session)=>{
        if(event==="INITIAL_SESSION" || event==="SIGNED_IN") finish(session);
      });
      const timer=setTimeout(async()=>{
        const {data}=await supabaseClient.auth.getSession();
        finish(data?.session||null);
      },5000);
    });

    if(result) showUser(result);
    else showError("Google login returned to chat.html, but no Supabase session was found. Do not start a second login tab. If this appears, send me the exact URL shown in your browser.");
  }catch(e){
    showError(e?.message || String(e));
  }
}

document.getElementById("logoutBtn").onclick=async()=>{
  await supabaseClient.auth.signOut();
  window.location.replace("./index.html");
};

function sendMessage(){
  const input=document.getElementById("messageInput");
  const text=input.value.trim();
  if(!text)return;
  const welcome=document.querySelector(".welcome");
  if(welcome)welcome.remove();
  const div=document.createElement("div");
  div.className="message mine";
  div.textContent=text;
  document.getElementById("messages").appendChild(div);
  input.value="";
  document.getElementById("messages").scrollTop=document.getElementById("messages").scrollHeight;
}
document.getElementById("sendButton").onclick=sendMessage;
document.getElementById("messageInput").addEventListener("keydown",e=>{if(e.key==="Enter")sendMessage()});

init();
</script>
</body>
</html>
