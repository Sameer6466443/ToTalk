<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>ToTalk Sameer</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #03030d;
    --panel: rgba(9, 8, 28, 0.88);
    --panel2: rgba(16, 10, 40, 0.88);
    --purple: #9b5cff;
    --purple2: #6f35e8;
    --violet: #c084ff;
    --white: #ffffff;
    --muted: #9b9ab5;
    --border: rgba(155, 92, 255, 0.38);
    --green: #63e6a2;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 80% 20%, rgba(102, 44, 190, 0.22), transparent 28%),
        radial-gradient(circle at 20% 75%, rgba(63, 31, 145, 0.20), transparent 30%),
        #03030d;
    color: var(--white);
    overflow-x: hidden;
}

/* ---------- STAR FIELD ---------- */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -3;

    background-image:
        radial-gradient(circle, rgba(255,255,255,.85) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(170,120,255,.8) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,.5) 1px, transparent 1.5px);

    background-size:
        120px 120px,
        180px 180px,
        250px 250px;

    background-position:
        10px 20px,
        60px 100px,
        130px 40px;

    opacity: .55;
}

/* ---------- GALAXY GLOW ---------- */

body::after {
    content: "";
    position: fixed;
    width: 900px;
    height: 500px;
    left: 50%;
    top: 45%;
    transform: translate(-50%, -50%) rotate(-18deg);
    pointer-events: none;
    z-index: -2;

    background:
        radial-gradient(
            ellipse,
            rgba(141, 61, 255, .25) 0%,
            rgba(92, 32, 170, .15) 25%,
            transparent 68%
        );

    filter: blur(20px);
}

/* ---------- APP ---------- */

.app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* ---------- HEADER ---------- */

.topbar {
    height: 78px;
    padding: 0 28px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-bottom: 1px solid rgba(155,92,255,.25);

    background:
        linear-gradient(
            90deg,
            rgba(4,4,16,.96),
            rgba(10,5,28,.86),
            rgba(4,4,16,.96)
        );

    backdrop-filter: blur(15px);
}

.brand {
    display: flex;
    align-items: center;
    gap: 9px;

    font-size: 27px;
    font-weight: 800;
    letter-spacing: -1px;
}

.brand-main {
    color: white;
}

.brand-name {
    color: var(--purple);
}

.brand-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #a96cff;
    box-shadow: 0 0 14px #9b5cff;
}

.user-area {
    display: flex;
    align-items: center;
    gap: 18px;
}

.user-name {
    color: #c3bfd6;
    font-size: 15px;
}

.logout-btn {
    border: 1px solid var(--purple);
    color: white;
    background: rgba(90, 35, 160, .16);

    border-radius: 10px;
    padding: 11px 18px;

    font-size: 14px;
    cursor: pointer;

    transition: .2s;
}

.logout-btn:hover {
    background: rgba(155,92,255,.25);
    box-shadow: 0 0 20px rgba(155,92,255,.25);
}

/* ---------- MAIN ---------- */

.main {
    flex: 1;

    display: grid;
    grid-template-columns: 270px minmax(0, 1fr);
    gap: 16px;

    padding: 18px;
    min-height: calc(100vh - 78px);
}

/* ---------- SIDEBAR ---------- */

.sidebar {
    min-height: 0;

    border: 1px solid var(--border);
    border-radius: 17px;

    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(91,39,170,.12),
            transparent 45%
        ),
        rgba(4,4,17,.87);

    overflow: hidden;

    position: relative;
}

.sidebar::before {
    content: "";
    position: absolute;
    width: 150px;
    height: 150px;
    left: 35px;
    bottom: 45px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 35%,
            #7133c9,
            #25104e 45%,
            #070711 70%
        );

    box-shadow:
        0 0 35px rgba(137,65,255,.25);

    opacity: .6;
}

.sidebar-content {
    position: relative;
    z-index: 2;
    padding: 25px 18px;
}

.sidebar-title {
    font-size: 20px;
    font-weight: 700;
}

.sidebar-subtitle {
    margin-top: 7px;
    color: var(--muted);
    font-size: 13px;
}

.contact {
    margin-top: 28px;

    display: flex;
    align-items: center;
    gap: 12px;

    padding: 16px;

    border: 1px solid rgba(155,92,255,.22);
    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            rgba(101,44,186,.25),
            rgba(34,15,75,.30)
        );
}

.avatar {
    width: 44px;
    height: 44px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    color: white;
    font-size: 19px;
    font-weight: bold;

    background:
        linear-gradient(
            135deg,
            #b46cff,
            #6121d5
        );

    box-shadow:
        0 0 18px rgba(155,92,255,.35);
}

.contact-name {
    font-size: 15px;
    font-weight: 700;
}

.online {
    margin-top: 5px;
    color: var(--green);
    font-size: 12px;
}

.online::before {
    content: "";
    display: inline-block;

    width: 6px;
    height: 6px;

    border-radius: 50%;
    background: var(--green);

    margin-right: 5px;
}

/* ---------- CHAT ---------- */

.chat {
    min-width: 0;
    min-height: 0;

    display: flex;
    flex-direction: column;

    border: 1px solid var(--border);
    border-radius: 17px;

    overflow: hidden;

    position: relative;

    background:
        radial-gradient(
            ellipse at 75% 18%,
            rgba(125,46,207,.25),
            transparent 30%
        ),
        radial-gradient(
            ellipse at 20% 75%,
            rgba(74,38,166,.18),
            transparent 30%
        ),
        #03030d;
}

/* large galaxy band */

.chat::before {
    content: "";
    position: absolute;

    width: 120%;
    height: 240px;

    left: -10%;
    top: 35%;

    background:
        radial-gradient(
            ellipse,
            rgba(137,54,240,.23),
            rgba(74,28,145,.13) 30%,
            transparent 70%
        );

    transform: rotate(-12deg);
    filter: blur(18px);

    pointer-events: none;
}

/* moon */

.moon {
    position: absolute;

    width: 110px;
    height: 110px;

    right: 45px;
    top: 110px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ddd8ff,
            #8580a8 38%,
            #302d54 72%,
            #0c0b18 100%
        );

    box-shadow:
        -12px 0 30px rgba(148,120,255,.35),
        inset -15px -10px 25px rgba(0,0,0,.5);

    opacity: .7;
}

.moon::after {
    content: "";

    position: absolute;
    width: 100%;
    height: 100%;

    border-radius: 50%;

    background:
        radial-gradient(circle at 25% 40%, rgba(0,0,0,.18) 5px, transparent 6px),
        radial-gradient(circle at 62% 28%, rgba(0,0,0,.16) 7px, transparent 8px),
        radial-gradient(circle at 55% 67%, rgba(0,0,0,.18) 6px, transparent 7px);
}

/* ---------- CHAT HEADER ---------- */

.chat-header {
    height: 90px;

    flex-shrink: 0;

    padding: 18px 24px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-bottom: 1px solid rgba(155,92,255,.24);

    background: rgba(3,3,15,.60);

    backdrop-filter: blur(12px);

    position: relative;
    z-index: 5;
}

.chat-person {
    display: flex;
    align-items: center;
    gap: 13px;
}

.chat-avatar {
    width: 46px;
    height: 46px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: linear-gradient(
        135deg,
        #b36cff,
        #6325d9
    );

    font-weight: 700;
    font-size: 19px;

    box-shadow:
        0 0 20px rgba(155,92,255,.3);
}

.chat-title {
    font-size: 18px;
    font-weight: 700;
}

.chat-status {
    margin-top: 5px;
    color: var(--green);
    font-size: 12px;
}

.chat-actions {
    color: #c7c0da;
    font-size: 21px;
}

/* ---------- MESSAGES ---------- */

.messages {
    flex: 1;

    min-height: 250px;

    overflow-y: auto;

    padding: 28px 24px;

    position: relative;
    z-index: 3;

    display: flex;
    flex-direction: column;
    gap: 12px;
}

.welcome {
    margin: auto;

    text-align: center;

    max-width: 650px;

    padding: 30px 15px;
}

.welcome-line {
    width: 100px;
    height: 1px;

    margin: 20px auto;

    background:
        linear-gradient(
            90deg,
            transparent,
            #9b5cff,
            transparent
        );
}

.welcome h1 {
    font-size: 31px;
    line-height: 1.2;
}

.welcome h1 span {
    color: var(--purple);
}

.welcome p {
    margin-top: 13px;

    color: #a6a1bb;

    font-size: 15px;
}

.message {
    max-width: 72%;

    padding: 12px 15px;

    border-radius: 15px;

    font-size: 15px;
    line-height: 1.45;

    word-break: break-word;
}

.message.mine {
    align-self: flex-end;

    color: white;

    background:
        linear-gradient(
            135deg,
            #7939e8,
            #4d20a9
        );

    border-bottom-right-radius: 4px;

    box-shadow:
        0 5px 20px rgba(94,36,202,.20);
}

.message.other {
    align-self: flex-start;

    color: #e9e6f2;

    background: rgba(24,20,47,.9);

    border: 1px solid rgba(155,92,255,.22);

    border-bottom-left-radius: 4px;
}

.message-time {
    display: block;

    margin-top: 5px;

    font-size: 10px;

    opacity: .55;
}

/* ---------- INPUT ---------- */

.input-area {
    position: relative;
    z-index: 5;

    padding: 14px 18px;

    border-top: 1px solid rgba(155,92,255,.24);

    background: rgba(3,3,15,.80);

    backdrop-filter: blur(14px);
}

.input-box {
    display: flex;
    align-items: center;
    gap: 10px;

    padding: 7px 8px 7px 16px;

    border: 1px solid rgba(155,92,255,.42);

    border-radius: 15px;

    background:
        rgba(14,10,34,.95);

    box-shadow:
        0 0 25px rgba(95,38,180,.08);
}

.message-input {
    flex: 1;

    min-width: 0;

    border: none;
    outline: none;

    background: transparent;

    color: white;

    font-size: 15px;
}

.message-input::placeholder {
    color: #77738d;
}

.send-btn {
    width: 46px;
    height: 42px;

    flex-shrink: 0;

    border: none;

    border-radius: 12px;

    color: white;

    background:
        linear-gradient(
            135deg,
            #a85dff,
            #6726d9
        );

    cursor: pointer;

    font-size: 17px;
    font-weight: bold;

    box-shadow:
        0 0 18px rgba(139,67,255,.28);

    transition: .2s;
}

.send-btn:hover {
    transform: translateY(-1px);
}

.send-btn:disabled {
    opacity: .45;
    cursor: not-allowed;
}

/* ---------- LOADING / ERROR ---------- */

.loading {
    position: fixed;
    inset: 0;

    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #03030d;

    font-size: 16px;
    color: #c5bed8;
}

.login-error {
    display: none;

    position: fixed;
    inset: 0;

    z-index: 200;

    align-items: center;
    justify-content: center;

    padding: 25px;

    background: #03030d;
}

.error-box {
    width: min(430px, 100%);

    padding: 30px;

    text-align: center;

    border: 1px solid rgba(155,92,255,.4);

    border-radius: 18px;

    background:
        rgba(13,9,30,.96);

    box-shadow:
        0 0 50px rgba(92,35,190,.18);
}

.error-box h2 {
    margin-bottom: 12px;
}

.error-box p {
    color: #aaa5bb;
    font-size: 14px;
    line-height: 1.5;
}

.back-btn {
    margin-top: 20px;

    padding: 11px 18px;

    border: 1px solid #9b5cff;

    border-radius: 10px;

    color: white;

    background: rgba(115,48,210,.18);

    cursor: pointer;
}

/* ---------- MOBILE ---------- */

@media (max-width: 760px) {

    body {
        overflow-y: auto;
    }

    .topbar {
        height: 66px;
        padding: 0 15px;
    }

    .brand {
        font-size: 21px;
    }

    .brand-dot {
        width: 5px;
        height: 5px;
    }

    .user-area {
        gap: 8px;
    }

    .user-name {
        font-size: 12px;
        max-width: 75px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    .logout-btn {
        padding: 8px 11px;
        font-size: 12px;
    }

    .main {
        display: block;
        padding: 9px;

        min-height: calc(100vh - 66px);
    }

    .sidebar {
        display: none;
    }

    .chat {
        height: calc(100vh - 84px);
        min-height: 500px;

        border-radius: 14px;
    }

    .chat-header {
        height: 72px;
        padding: 13px 14px;
    }

    .chat-avatar {
        width: 39px;
        height: 39px;
        font-size: 16px;
    }

    .chat-title {
        font-size: 15px;
    }

    .chat-status {
        font-size: 11px;
    }

    .moon {
        width: 70px;
        height: 70px;

        right: 18px;
        top: 100px;
    }

    .messages {
        padding: 18px 12px;
        gap: 9px;
    }

    .welcome {
        padding: 15px 8px;
    }

    .welcome h1 {
        font-size: 24px;
    }

    .welcome p {
        font-size: 13px;
        line-height: 1.5;
    }

    .message {
        max-width: 84%;
        font-size: 14px;
    }

    .input-area {
        padding: 9px;
    }

    .input-box {
        padding-left: 12px;
    }

    .message-input {
        font-size: 14px;
    }

    .send-btn {
        width: 43px;
        height: 39px;
    }
}

@media (max-width: 380px) {

    .brand {
        font-size: 18px;
    }

    .user-name {
        display: none;
    }

    .chat-title {
        font-size: 14px;
    }

    .welcome h1 {
        font-size: 21px;
    }
}
</style>
</head>

<body>

<!-- LOGIN LOADING -->
<div id="loading" class="loading">
    Opening your chat...
</div>

<!-- LOGIN ERROR -->
<div id="loginError" class="login-error">
    <div class="error-box">
        <h2>Unable to open chat</h2>
        <p id="errorText">
            The login session could not be loaded.
        </p>

        <button class="back-btn" onclick="goHome()">
            Back to ToTalk
        </button>
    </div>
</div>

<div id="app" class="app" style="display:none;">

    <!-- HEADER -->
    <header class="topbar">

        <div class="brand">
            <span class="brand-main">ToTalk</span>
            <span class="brand-name">Sameer</span>
            <span class="brand-dot"></span>
        </div>

        <div class="user-area">
            <span id="userName" class="user-name">Sameer</span>

            <button id="logoutBtn" class="logout-btn">
                Logout
            </button>
        </div>

    </header>


    <!-- MAIN -->
    <main class="main">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="sidebar-content">

                <div class="sidebar-title">
                    Sameer's Chats
                </div>

                <div class="sidebar-subtitle">
                    Your personal conversation space
                </div>

                <div class="contact">

                    <div class="avatar">
                        S
                    </div>

                    <div>
                        <div class="contact-name">
                            Sameer
                        </div>

                        <div class="online">
                            Ready to chat
                        </div>
                    </div>

                </div>

            </div>

        </aside>


        <!-- CHAT -->
        <section class="chat">

            <div class="moon"></div>

            <!-- CHAT HEADER -->
            <div class="chat-header">

                <div class="chat-person">

                    <div class="chat-avatar">
                        S
                    </div>

                    <div>
                        <div class="chat-title">
                            Sameer's ToTalk
                        </div>

                        <div class="chat-status">
                            Online
                        </div>
                    </div>

                </div>

                <div class="chat-actions">
                    ···
                </div>

            </div>


            <!-- MESSAGES -->
            <div id="messages" class="messages">

                <div id="welcome" class="welcome">

                    <h1>
                        Welcome to
                        <span>Sameer's ToTalk</span>
                    </h1>

                    <p>
                        You're signed in. This is Sameer's personal chat space.
                    </p>

                    <div class="welcome-line"></div>

                </div>

            </div>


            <!-- INPUT -->
            <div class="input-area">

                <div class="input-box">

                    <input
                        id="messageInput"
                        class="message-input"
                        type="text"
                        placeholder="Write a message..."
                        autocomplete="off"
                    >

                    <button
                        id="sendBtn"
                        class="send-btn"
                        type="button"
                    >
                        →
                    </button>

                </div>

            </div>

        </section>

    </main>

</div>


<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://qiynczbrhpxwuabwuyiy.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_eUPz4c_nYckgINEK-AIWqw_JAXIHozd";


const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            flowType: "implicit"
        }
    }
);


/* =========================================================
   VARIABLES
========================================================= */

let currentUser = null;
let authReady = false;
let loadingMessages = false;


/* =========================================================
   ELEMENTS
========================================================= */

const loading = document.getElementById("loading");
const app = document.getElementById("app");
const loginError = document.getElementById("loginError");
const errorText = document.getElementById("errorText");

const userName = document.getElementById("userName");

const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");

const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");

const logoutBtn = document.getElementById("logoutBtn");


/* =========================================================
   SHOW CHAT
========================================================= */

function showChat(user) {

    currentUser = user;
    authReady = true;

    loading.style.display = "none";
    loginError.style.display = "none";
    app.style.display = "flex";

    const name =
        user.user_metadata?.full_name ||
        user.user_metadata?.name ||
        user.email?.split("@")[0] ||
        "Sameer";

    userName.textContent = name;

    loadMessages();
}


/* =========================================================
   LOGIN ERROR
========================================================= */

function showLoginError(message) {

    loading.style.display = "none";
    app.style.display = "none";

    errorText.textContent = message;

    loginError.style.display = "flex";
}


/* =========================================================
   AUTH STATE
========================================================= */

supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

        if (session && session.user) {

            showChat(session.user);

        } else if (
            event === "SIGNED_OUT"
        ) {

            goHome();

        }
    }
);


/* =========================================================
   CHECK LOGIN
========================================================= */

async function checkLogin() {

    try {

        /*
         * First allow Supabase a moment to process
         * Google's OAuth callback.
         */

        await new Promise(resolve => {
            setTimeout(resolve, 700);
        });


        const {
            data,
            error
        } = await supabaseClient.auth.getSession();


        if (error) {

            console.error(error);

            showLoginError(
                "Google sign-in was completed, but the login session could not be loaded. Please go back and try once more."
            );

            return;
        }


        if (data && data.session) {

            showChat(data.session.user);

            return;
        }


        /*
         * Sometimes mobile browsers need a little
         * extra time after returning from Google.
         */

        setTimeout(async () => {

            const result =
                await supabaseClient.auth.getSession();

            if (
                result.data &&
                result.data.session
            ) {

                showChat(
                    result.data.session.user
                );

            } else {

                showLoginError(
                    "No active Google login session was found. Please return to the homepage and tap Continue with Google again."
                );

            }

        }, 2500);

    } catch (err) {

        console.error(err);

        showLoginError(
            "Something went wrong while opening your chat."
        );
    }
}


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages() {

    if (!currentUser || loadingMessages) {
        return;
    }

    loadingMessages = true;

    try {

        const {
            data,
            error
        } = await supabaseClient
            .from("messages")
            .select("id, sender_id, content, created_at")
            .order("created_at", {
                ascending: true
            });


        if (error) {

            console.error(
                "Message loading error:",
                error
            );

            loadingMessages = false;

            return;
        }


        /*
         * Remove existing messages but keep
         * the welcome screen temporarily.
         */

        messages.innerHTML = "";


        if (!data || data.length === 0) {

            messages.appendChild(
                createWelcome()
            );

        } else {

            data.forEach(message => {

                addMessageToScreen(message);

            });

        }


        scrollToBottom();

    } catch (err) {

        console.error(err);

    } finally {

        loadingMessages = false;
    }
}


/* =========================================================
   WELCOME SCREEN
========================================================= */

function createWelcome() {

    const div =
        document.createElement("div");

    div.className = "welcome";

    div.innerHTML = `
        <h1>
            Welcome to
            <span>Sameer's ToTalk</span>
        </h1>

        <p>
            You're signed in. This is Sameer's personal chat space.
        </p>

        <div class="welcome-line"></div>
    `;

    return div;
}


/* =========================================================
   ADD MESSAGE TO SCREEN
========================================================= */

function addMessageToScreen(message) {

    /*
     * If welcome screen exists, remove it
     * when the first message appears.
     */

    const existingWelcome =
        messages.querySelector(".welcome");

    if (existingWelcome) {
        existingWelcome.remove();
    }


    const div =
        document.createElement("div");


    const mine =
        message.sender_id === currentUser.id;


    div.className =
        mine
            ? "message mine"
            : "message other";


    const text =
        document.createElement("div");

    text.textContent =
        message.content;


    const time =
        document.createElement("span");

    time.className =
        "message-time";


    const date =
        new Date(message.created_at);


    time.textContent =
        date.toLocaleTimeString(
            [],
            {
                hour: "numeric",
                minute: "2-digit"
            }
        );


    div.appendChild(text);
    div.appendChild(time);

    messages.appendChild(div);
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    if (!currentUser) {
        return;
    }


    const content =
        messageInput.value.trim();


    if (!content) {
        return;
    }


    sendBtn.disabled = true;


    try {

        const {
            data,
            error
        } = await supabaseClient
            .from("messages")
            .insert([
                {
                    sender_id:
                        currentUser.id,

                    content:
                        content
                }
            ])
            .select()
            .single();


        if (error) {

            console.error(
                "Send message error:",
                error
            );

            alert(
                "Message could not be sent. Please try again."
            );

            return;
        }


        messageInput.value = "";


        if (data) {

            addMessageToScreen(data);

            scrollToBottom();

        }

    } catch (err) {

        console.error(err);

        alert(
            "Message could not be sent."
        );

    } finally {

        sendBtn.disabled = false;

        messageInput.focus();
    }
}


/* =========================================================
   SEND BUTTON
========================================================= */

sendBtn.addEventListener(
    "click",
    sendMessage
);


/* =========================================================
   ENTER TO SEND
========================================================= */

messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);


/* =========================================================
   SCROLL
========================================================= */

function scrollToBottom() {

    setTimeout(() => {

        messages.scrollTop =
            messages.scrollHeight;

    }, 50);
}


/* =========================================================
   LOGOUT
========================================================= */

logoutBtn.addEventListener(
    "click",
    async function() {

        logoutBtn.disabled = true;

        await supabaseClient.auth.signOut();

        window.location.href =
            "index.html";
    }
);


/* =========================================================
   GO HOME
========================================================= */

function goHome() {

    window.location.href =
        "index.html";
}


/* =========================================================
   START
========================================================= */

checkLogin();

</script>
