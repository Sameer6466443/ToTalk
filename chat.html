<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ToTalk Sameer</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --purple: #a56cff;
      --purple-light: #c59aff;
      --purple-dark: #6f3fd0;
      --yellow: #ffe45c;
      --white: #ffffff;
      --muted: #aaa8bd;
      --dark: #070713;
      --dark2: #0d0a20;
      --panel: rgba(20, 15, 42, 0.82);
      --border: rgba(170, 105, 255, 0.28);
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--white);

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(104, 45, 190, 0.30),
          transparent 32%
        ),
        radial-gradient(
          circle at 80% 70%,
          rgba(84, 38, 180, 0.30),
          transparent 35%
        ),
        radial-gradient(
          circle at 50% 110%,
          rgba(154, 82, 255, 0.20),
          transparent 40%
        ),
        linear-gradient(
          135deg,
          #05050d,
          #0a0718 45%,
          #100b2a
        );

      position: relative;
      overflow-x: hidden;
    }

    /* STAR FIELD */

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .7;

      background-image:
        radial-gradient(circle, rgba(255,255,255,.75) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(197,154,255,.55) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,.45) 1px, transparent 1.5px);

      background-size:
        120px 120px,
        190px 190px,
        260px 260px;

      background-position:
        20px 30px,
        70px 90px,
        120px 20px;
    }

    /* HEADER */

    header {
      height: 82px;
      padding: 0 5%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid rgba(255,255,255,.10);

      background: rgba(5, 5, 15, .72);

      backdrop-filter: blur(18px);

      position: relative;
      z-index: 2;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 11px;

      font-size: 25px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .logo-box {
      width: 43px;
      height: 43px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--yellow);
      color: #151020;

      border-radius: 13px;

      font-size: 21px;

      box-shadow:
        0 0 25px rgba(255, 228, 92, .20);
    }

    .logo span {
      color: var(--purple-light);
    }

    .right-header {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .user-name {
      color: #cfcce0;
      font-size: 14px;
      font-weight: 800;
    }

    .logout {
      border: 1px solid rgba(165,108,255,.35);

      background: rgba(165,108,255,.10);

      color: var(--white);

      padding: 10px 16px;

      border-radius: 12px;

      font-weight: 800;

      cursor: pointer;

      transition: .2s;
    }

    .logout:hover {
      background: rgba(165,108,255,.22);
      border-color: rgba(165,108,255,.65);
    }

    /* MAIN */

    .chat-layout {
      max-width: 1250px;

      min-height: calc(100vh - 122px);

      margin: 20px auto;

      padding: 0 20px;

      display: grid;

      grid-template-columns: 290px 1fr;

      gap: 18px;

      position: relative;

      z-index: 1;
    }

    /* SIDEBAR */

    .sidebar {
      min-height: 620px;

      background:
        linear-gradient(
          145deg,
          rgba(27,20,55,.88),
          rgba(10,8,25,.88)
        );

      border: 1px solid var(--border);

      border-radius: 24px;

      overflow: hidden;

      box-shadow:
        0 0 50px rgba(99,44,190,.12);

      backdrop-filter: blur(18px);
    }

    .sidebar-title {
      padding: 24px;

      border-bottom:
        1px solid rgba(255,255,255,.08);
    }

    .sidebar-title h2 {
      font-size: 21px;
      margin-bottom: 5px;
    }

    .sidebar-title p {
      color: var(--muted);
      font-size: 12px;
    }

    .profile {
      margin: 15px 10px;

      padding: 14px;

      border-radius: 17px;

      background:
        linear-gradient(
          135deg,
          rgba(165,108,255,.18),
          rgba(255,228,92,.05)
        );

      border:
        1px solid rgba(165,108,255,.18);

      display: flex;

      align-items: center;

      gap: 12px;
    }

    .avatar {
      width: 46px;
      height: 46px;

      border-radius: 50%;

      background: var(--yellow);

      color: #161020;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 21px;

      box-shadow:
        0 0 22px rgba(255,228,92,.15);
    }

    .profile strong {
      display: block;

      font-size: 14px;

      color: white;
    }

    .online {
      color: #8ee6a8;

      font-size: 11px;

      font-weight: 700;

      margin-top: 4px;
    }

    /* CHAT WINDOW */

    .chat-box {
      min-height: 620px;

      background:
        linear-gradient(
          145deg,
          rgba(20,15,42,.90),
          rgba(7,6,18,.90)
        );

      border:
        1px solid var(--border);

      border-radius: 24px;

      overflow: hidden;

      display: flex;

      flex-direction: column;

      box-shadow:
        0 0 65px rgba(104,48,200,.15);

      backdrop-filter: blur(20px);
    }

    .chat-top {
      min-height: 78px;

      padding: 15px 22px;

      border-bottom:
        1px solid rgba(255,255,255,.08);

      display: flex;

      align-items: center;

      gap: 13px;

      background:
        rgba(10,8,24,.55);
    }

    .chat-avatar {
      width: 46px;
      height: 46px;

      border-radius: 50%;

      background:
        rgba(165,108,255,.18);

      border:
        1px solid rgba(165,108,255,.40);

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 21px;
    }

    .chat-top strong {
      display: block;

      font-size: 16px;
    }

    .chat-top small {
      color: #8ee6a8;

      font-weight: 700;

      font-size: 11px;
    }

    /* MESSAGES */

    .messages {
      flex: 1;

      overflow-y: auto;

      padding: 28px;

      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(103,47,196,.13),
          transparent 42%
        );
    }

    .welcome-message {
      text-align: center;

      margin: 80px auto;

      max-width: 440px;
    }

    .welcome-icon {
      width: 72px;
      height: 72px;

      margin: auto auto 20px;

      border-radius: 22px;

      background: var(--yellow);

      color: #171020;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 32px;

      box-shadow:
        0 0 35px rgba(255,228,92,.14);
    }

    .welcome-message h3 {
      font-size: 23px;

      margin-bottom: 10px;
    }

    .welcome-message p {
      color: var(--muted);

      font-size: 14px;

      line-height: 1.7;
    }

    /* MESSAGE */

    .message {
      max-width: 70%;

      margin-bottom: 15px;

      padding: 13px 17px;

      border-radius: 18px;

      font-size: 14px;

      line-height: 1.5;
    }

    .message.mine {
      margin-left: auto;

      color: white;

      background:
        linear-gradient(
          135deg,
          #8f55e9,
          #6f3fd0
        );

      border:
        1px solid rgba(197,154,255,.35);

      border-bottom-right-radius: 5px;

      box-shadow:
        0 7px 25px rgba(111,63,208,.18);
    }

    /* INPUT */

    .input-area {
      padding: 15px;

      border-top:
        1px solid rgba(255,255,255,.08);

      display: flex;

      gap: 10px;

      background:
        rgba(5,5,15,.70);
    }

    #messageInput {
      flex: 1;

      border:
        1px solid rgba(165,108,255,.20);

      outline: none;

      background:
        rgba(255,255,255,.055);

      color: white;

      padding: 14px 16px;

      border-radius: 14px;

      font-size: 14px;
    }

    #messageInput::placeholder {
      color: #77758a;
    }

    #messageInput:focus {
      border-color:
        rgba(165,108,255,.65);

      box-shadow:
        0 0 18px rgba(165,108,255,.10);
    }

    #sendButton {
      width: 52px;

      border: none;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          #a56cff,
          #7040d3
        );

      color: white;

      font-size: 20px;

      cursor: pointer;

      box-shadow:
        0 0 20px rgba(165,108,255,.20);

      transition: .2s;
    }

    #sendButton:hover {
      transform: translateY(-1px);

      box-shadow:
        0 0 30px rgba(165,108,255,.35);
    }

    /* LOADING */

    #loading {
      position: fixed;

      inset: 0;

      background:
        radial-gradient(
          circle at 50% 50%,
          #21124b,
          #070713 65%
        );

      display: flex;

      align-items: center;

      justify-content: center;

      z-index: 100;

      font-weight: 900;

      color: white;

      letter-spacing: 1px;
    }

    /* MOBILE */

    @media (max-width: 800px) {

      header {
        height: 72px;

        padding: 0 18px;
      }

      .logo {
        font-size: 22px;
      }

      .logo-box {
        width: 40px;
        height: 40px;
      }

      .user-name {
        display: none;
      }

      .chat-layout {
        min-height:
          calc(100vh - 92px);

        height:
          calc(100vh - 92px);

        margin: 10px auto;

        padding: 0 10px;

        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .chat-box {
        min-height: 0;

        height: 100%;

        border-radius: 20px;
      }

      .messages {
        padding: 18px;
      }

      .welcome-message {
        margin: 70px auto 30px;
      }

      .welcome-message h3 {
        font-size: 20px;
      }

      .message {
        max-width: 84%;
      }

      .input-area {
        padding: 10px;
      }
    }

  </style>
</head>

<body>

  <!-- LOADING -->

  <div id="loading">
    Opening ToTalk...
  </div>


  <!-- HEADER -->

  <header>

    <div class="logo">

      <div class="logo-box">
        💬
      </div>

      To<span>Talk</span>

    </div>


    <div class="right-header">

      <div
        class="user-name"
        id="userName"
      >
        Loading...
      </div>

      <button
        class="logout"
        id="logoutBtn"
      >
        Logout
      </button>

    </div>

  </header>


  <!-- CHAT -->

  <main class="chat-layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="sidebar-title">

        <h2>
          Chats
        </h2>

        <p>
          Your conversations
        </p>

      </div>


      <div class="profile">

        <div class="avatar">
          😊
        </div>

        <div>

          <strong id="sideName">
            You
          </strong>

          <div class="online">
            ● Online
          </div>

        </div>

      </div>

    </aside>


    <!-- CHAT BOX -->

    <section class="chat-box">


      <div class="chat-top">

        <div class="chat-avatar">
          💬
        </div>

        <div>

          <strong>
            ToTalk Chat
          </strong>

          <small>
            ● Ready to chat
          </small>

        </div>

      </div>


      <!-- MESSAGES -->

      <div
        class="messages"
        id="messages"
      >

        <div class="welcome-message">

          <div class="welcome-icon">
            💬
          </div>

          <h3>
            Welcome to ToTalk
          </h3>

          <p>
            You're in! This is your chat space.
            Start by writing a message below.
          </p>

        </div>

      </div>


      <!-- INPUT -->

      <div class="input-area">

        <input
          type="text"
          id="messageInput"
          placeholder="Write a message..."
          autocomplete="off"
        >

        <button
          id="sendButton"
        >
          ➤
        </button>

      </div>

    </section>

  </main>


  <!-- SUPABASE -->

  <script>

    const SUPABASE_URL =
      "https://qiynczbrhpxwuabwuyiy.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_eUPz4c_nYckgINEK-AIWqw_JAXIHozd";


    /*
      KEEPING THE CURRENT WORKING
      GOOGLE LOGIN CONFIGURATION.
    */

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            flowType: "implicit"
          }
        }
      );


    /*
      CHECK LOGIN
    */

    async function startChat() {

      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth.getSession();


        if (error) {

          console.error(
            "Session error:",
            error
          );

          window.location.replace(
            "./index.html"
          );

          return;
        }


        if (!data.session) {

          window.location.replace(
            "./index.html"
          );

          return;
        }


        const user =
          data.session.user;


        const name =
          user.user_metadata?.full_name ||
          user.user_metadata?.name ||
          user.email?.split("@")[0] ||
          "Sameer";


        document.getElementById(
          "userName"
        ).textContent = name;


        document.getElementById(
          "sideName"
        ).textContent = name;


        document.getElementById(
          "loading"
        ).style.display = "none";


      } catch (error) {

        console.error(
          "Login error:",
          error
        );

        window.location.replace(
          "./index.html"
        );

      }

    }


    /*
      LOGOUT
    */

    document
      .getElementById("logoutBtn")
      .addEventListener(
        "click",
        async () => {

          await supabaseClient
            .auth
            .signOut();


          window.location.replace(
            "./index.html"
          );

        }
      );


    /*
      SEND MESSAGE
    */

    const input =
      document.getElementById(
        "messageInput"
      );


    const sendButton =
      document.getElementById(
        "sendButton"
      );


    const messages =
      document.getElementById(
        "messages"
      );


    function sendMessage() {

      const text =
        input.value.trim();


      if (!text) {
        return;
      }


      const welcome =
        document.querySelector(
          ".welcome-message"
        );


      if (welcome) {
        welcome.remove();
      }


      const message =
        document.createElement(
          "div"
        );


      message.className =
        "message mine";


      message.textContent =
        text;


      messages.appendChild(
        message
      );


      input.value = "";


      messages.scrollTop =
        messages.scrollHeight;

    }


    sendButton.addEventListener(
      "click",
      sendMessage
    );


    input.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /*
      START
    */

    startChat();

  </script>

</body>
</html>
