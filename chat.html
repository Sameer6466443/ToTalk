<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ToTalk Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --blue:#1596dc;
  --deep:#075d91;
  --yellow:#ffe36b;
  --text:#173d57;
  --muted:#78909f;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at 5% 5%,#c9f0ff,transparent 25%),
    radial-gradient(circle at 95% 95%,#fff3a6,transparent 25%),
    linear-gradient(135deg,#eefbff,#fffef1);
}

#loading{
  position:fixed;
  inset:0;
  background:#eefbff;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:12px;
  z-index:1000;
  color:var(--deep);
  font-weight:900;
}

.loader{
  width:38px;
  height:38px;
  border:4px solid #d7eff9;
  border-top-color:var(--blue);
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

header{
  height:75px;
  padding:0 5%;
  background:rgba(255,255,255,.9);
  border-bottom:1px solid #e4f0f5;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:24px;
  font-weight:900;
  color:var(--deep);
}

.logo-box{
  width:42px;
  height:42px;
  border-radius:13px;
  background:var(--yellow);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
}

.right-header{
  display:flex;
  align-items:center;
  gap:15px;
}

.user-name{
  font-size:14px;
  font-weight:800;
  color:var(--muted);
}

.logout{
  border:0;
  background:#edf8fd;
  color:var(--deep);
  padding:10px 15px;
  border-radius:11px;
  font-weight:800;
  cursor:pointer;
}

.chat-layout{
  max-width:1150px;
  height:calc(100vh - 115px);
  min-height:600px;
  margin:20px auto;
  padding:0 20px;
  display:grid;
  grid-template-columns:300px 1fr;
  gap:18px;
}

.sidebar,
.chat-box{
  background:rgba(255,255,255,.92);
  border:1px solid #e2eff5;
  border-radius:25px;
  box-shadow:0 15px 45px rgba(27,105,139,.08);
}

.sidebar{
  overflow:hidden;
}

.sidebar-title{
  padding:22px;
  border-bottom:1px solid #edf3f6;
}

.sidebar-title h2{
  font-size:20px;
  margin-bottom:5px;
}

.sidebar-title p{
  color:var(--muted);
  font-size:12px;
}

.search{
  margin:15px;
  background:#f3f9fc;
  border-radius:13px;
  padding:12px 14px;
  color:#91a5b1;
  font-size:13px;
}

.profile{
  margin:8px;
  padding:14px;
  border-radius:17px;
  background:#eaf8ff;
  display:flex;
  align-items:center;
  gap:12px;
}

.avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  background:var(--yellow);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
}

.profile strong{
  display:block;
  font-size:14px;
}

.online{
  color:#35b867;
  font-size:11px;
  font-weight:700;
  margin-top:4px;
}

.chat-box{
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.chat-top{
  min-height:75px;
  padding:15px 22px;
  border-bottom:1px solid #edf3f6;
  display:flex;
  align-items:center;
  gap:13px;
}

.chat-avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#dff6ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
}

.chat-top strong{
  display:block;
  font-size:15px;
}

.chat-top small{
  color:#35b867;
  font-weight:700;
  font-size:11px;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:25px;
  background:#fbfeff;
}

.welcome-message{
  text-align:center;
  margin:35px auto;
  max-width:390px;
}

.welcome-icon{
  width:65px;
  height:65px;
  margin:auto auto 15px;
  border-radius:20px;
  background:var(--yellow);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
}

.welcome-message h3{
  margin-bottom:8px;
}

.welcome-message p{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}

.message{
  max-width:70%;
  width:max-content;
  margin-bottom:14px;
  padding:12px 16px;
  border-radius:17px;
  font-size:14px;
  line-height:1.5;
}

.message.mine{
  margin-left:auto;
  background:var(--blue);
  color:white;
  border-bottom-right-radius:5px;
}

.message.theirs{
  background:#e7f7fd;
  color:#315a70;
  border-bottom-left-radius:5px;
}

.input-area{
  padding:15px;
  border-top:1px solid #edf3f6;
  display:flex;
  gap:10px;
  background:white;
}

#messageInput{
  flex:1;
  border:0;
  outline:0;
  background:#f2f8fb;
  padding:14px 16px;
  border-radius:14px;
  font-size:14px;
}

#sendButton{
  width:50px;
  border:0;
  border-radius:14px;
  background:var(--blue);
  color:white;
  font-size:20px;
  cursor:pointer;
}

@media(max-width:800px){

  .user-name{
    display:none;
  }

  .chat-layout{
    height:calc(100vh - 95px);
    min-height:0;
    margin:10px auto;
    padding:0 10px;
    grid-template-columns:1fr;
  }

  .sidebar{
    display:none;
  }

  .chat-box{
    border-radius:20px;
  }

  .messages{
    padding:18px;
  }

  .message{
    max-width:82%;
  }

}

</style>

</head>

<body>

<div id="loading">

  <div class="loader"></div>

  <div id="loadingText">
    Opening ToTalk...
  </div>

</div>


<header>

  <div class="logo">

    <div class="logo-box">
      💬
    </div>

    ToTalk

  </div>


  <div class="right-header">

    <div
      class="user-name"
      id="userName">
      Loading...
    </div>

    <button
      class="logout"
      id="logoutBtn">
      Logout
    </button>

  </div>

</header>


<main class="chat-layout">


  <aside class="sidebar">

    <div class="sidebar-title">

      <h2>Chats</h2>

      <p>
        Your ToTalk space
      </p>

    </div>


    <div class="search">
      🔎 Search chats
    </div>


    <div class="profile">

      <div class="avatar">
        😊
      </div>

      <div>

        <strong id="sideName">
          You
        </strong>

        <div class="online">
          ● Online
        </div>

      </div>

    </div>

  </aside>


  <section class="chat-box">


    <div class="chat-top">

      <div class="chat-avatar">
        💬
      </div>

      <div>

        <strong>
          ToTalk Chat
        </strong>

        <small>
          ● Ready to chat
        </small>

      </div>

    </div>


    <div
      class="messages"
      id="messages">

      <div class="welcome-message">

        <div class="welcome-icon">
          💬
        </div>

        <h3>
          Welcome to ToTalk
        </h3>

        <p>
          You're in! Start your conversation
          by writing a message below.
        </p>

      </div>

    </div>


    <div class="input-area">

      <input
        type="text"
        id="messageInput"
        placeholder="Write a message..."
        autocomplete="off">

      <button id="sendButton">
        ➤
      </button>

    </div>


  </section>

</main>


<script>

const SUPABASE_URL =
"https://qiynczbrhpxwuabwuyiy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_eUPz4c_nYckgINEK-AIWqw_JAXIHozd";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);


let currentUser = null;


function showLoading(text){

  document.getElementById(
    "loadingText"
  ).textContent = text;

}


function openChat(user){

  currentUser = user;

  const name =
    user.user_metadata?.full_name ||
    user.user_metadata?.name ||
    user.email?.split("@")[0] ||
    "Sameer";

  document.getElementById(
    "userName"
  ).textContent = name;

  document.getElementById(
    "sideName"
  ).textContent = name;

  document.getElementById(
    "loading"
  ).style.display = "none";

}


async function checkLogin(){

  showLoading("Checking your login...");

  /*
    Give Supabase JS time to process the
    Google OAuth callback.
  */

  await new Promise(
    resolve => setTimeout(resolve,1000)
  );


  const {
    data,
    error
  } =
  await supabaseClient.auth.getSession();


  if(error){

    console.error(
      "Session error:",
      error
    );

    showLoading(
      "Login could not be verified."
    );

    setTimeout(() => {

      window.location.replace(
        "./index.html"
      );

    },1500);

    return;
  }


  if(data && data.session){

    openChat(
      data.session.user
    );

    return;
  }


  /*
    One more check in case the OAuth
    callback is still being processed.
  */

  await new Promise(
    resolve => setTimeout(resolve,1500)
  );


  const second =
    await supabaseClient.auth.getSession();


  if(second.data.session){

    openChat(
      second.data.session.user
    );

    return;
  }


  showLoading(
    "No login session found."
  );


  setTimeout(() => {

    window.location.replace(
      "./index.html"
    );

  },1500);

}


supabaseClient.auth.onAuthStateChange(
  (event, session) => {

    console.log(
      "Auth event:",
      event
    );

    if(session && !currentUser){

      openChat(
        session.user
      );

    }

  }
);


document
.getElementById("logoutBtn")
.addEventListener(
  "click",
  async () => {

    await supabaseClient.auth.signOut();

    window.location.replace(
      "./index.html"
    );

  }
);


const input =
document.getElementById(
  "messageInput"
);

const sendButton =
document.getElementById(
  "sendButton"
);

const messages =
document.getElementById(
  "messages"
);


function sendMessage(){

  const text =
    input.value.trim();

  if(!text){
    return;
  }


  const welcome =
    document.querySelector(
      ".welcome-message"
    );

  if(welcome){
    welcome.remove();
  }


  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message mine";

  message.textContent =
    text;

  messages.appendChild(
    message
  );

  input.value = "";

  messages.scrollTop =
    messages.scrollHeight;

}


sendButton.addEventListener(
  "click",
  sendMessage
);


input.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* START */

checkLogin();

</script>

</body>
</html>
