<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020108">
<title>ToTalk</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --black:#020108;
  --dark:#070313;
  --panel:#090517;
  --panel2:#0d071b;
  --purple:#914cff;
  --purple2:#aa69ff;
  --purple3:#6324ca;
  --white:#f8f5ff;
  --muted:#928ba8;
  --green:#52e69a;
  --yellow:#ffe34f;
  --border:rgba(145,76,255,.40);
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020108;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--white);

  background:
    radial-gradient(
      ellipse at 70% 25%,
      rgba(111,36,191,.20),
      transparent 32%
    ),
    radial-gradient(
      ellipse at 15% 85%,
      rgba(81,29,160,.15),
      transparent 30%
    ),
    linear-gradient(
      135deg,
      #020108,
      #070313 50%,
      #020108
    );
}

/* =====================================================
   PERFORMANCE OPTIMIZATION
===================================================== */

button,
input,
textarea{
  -webkit-tap-highlight-color:transparent;
}

.chat-box,
.sidebar,
.input-area,
.chat-top,
#messages{
  transform:translateZ(0);
}

.chat-box{
  contain:layout paint;
}

.sidebar{
  contain:layout paint;
}

/* =====================================================
   BACKGROUND STARS
===================================================== */

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  opacity:.58;

  background-image:
    radial-gradient(
      circle,
      rgba(255,255,255,.78) 1px,
      transparent 1.5px
    ),
    radial-gradient(
      circle,
      rgba(210,190,255,.65) 1px,
      transparent 1.5px
    ),
    radial-gradient(
      circle,
      rgba(255,255,255,.50) 1px,
      transparent 1.5px
    );

  background-size:
    115px 115px,
    175px 175px,
    245px 245px;

  background-position:
    15px 25px,
    70px 90px,
    130px 45px;

  contain:strict;
}

/* =====================================================
   LOADING
===================================================== */

#loading{
  position:fixed;
  inset:0;
  z-index:999999;

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 44%,
      rgba(113,63,255,.16),
      transparent 28%
    ),
    radial-gradient(
      circle at 20% 80%,
      rgba(71,42,175,.10),
      transparent 32%
    ),
    #020108;

  opacity:1;
  visibility:visible;

  transition:
    opacity .42s ease,
    visibility .42s ease;
}

#loading.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.loading-stars{
  position:absolute;
  inset:0;
  pointer-events:none;

  background-image:
    radial-gradient(
      circle at 8% 14%,
      rgba(255,255,255,.75) 0 1px,
      transparent 1.6px
    ),
    radial-gradient(
      circle at 18% 48%,
      rgba(185,151,255,.7) 0 1px,
      transparent 1.6px
    ),
    radial-gradient(
      circle at 28% 82%,
      rgba(255,255,255,.65) 0 1px,
      transparent 1.6px
    ),
    radial-gradient(
      circle at 38% 22%,
      rgba(255,255,255,.72) 0 1px,
      transparent 1.6px
    ),
    radial-gradient(
      circle at 55% 72%,
      rgba(185,151,255,.6) 0 1px,
      transparent 1.6px
    ),
    radial-gradient(
      circle at 66% 16%,
      rgba(255,255,255,.7) 0 1px,
      transparent 1.6px
    ),
    radial-gradient(
      circle at 78% 62%,
      rgba(255,255,255,.65) 0 1px,
      transparent 1.6px
    ),
    radial-gradient(
      circle at 92% 24%,
      rgba(185,151,255,.65) 0 1px,
      transparent 1.6px
    );
}

.loading-nebula{
  position:absolute;
  width:330px;
  height:330px;
  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(126,73,255,.16),
      rgba(76,42,180,.06) 46%,
      transparent 70%
    );

  /* Removed expensive blur */
  animation:loadingNebula 4s ease-in-out infinite;
}

.loading-system{
  position:relative;
  width:190px;
  height:145px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.loading-orbit{
  position:absolute;
  width:170px;
  height:58px;

  border:1px solid rgba(174,132,255,.36);
  border-radius:50%;

  animation:loadingOrbit 7s linear infinite;
}

.loading-orbit.two{
  width:182px;
  height:64px;

  border-color:rgba(145,95,255,.18);

  animation:
    loadingOrbitTwo
    9s linear infinite reverse;
}

.loading-moon{
  width:62px;
  height:62px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 31% 25%,
      #fff,
      #eeeaff 52%,
      #d5d0e5 100%
    );

  box-shadow:
    0 0 15px rgba(255,255,255,.20),
    0 0 35px rgba(127,72,255,.22);

  animation:
    loadingFloat
    3.5s ease-in-out infinite;
}

.loading-moon:before,
.loading-moon:after{
  content:"";
  position:absolute;
  border-radius:50%;
  background:rgba(130,120,160,.16);
}

.loading-moon:before{
  width:10px;
  height:10px;
  left:15px;
  top:19px;
}

.loading-moon:after{
  width:15px;
  height:15px;
  right:12px;
  top:29px;
}

.loading-title{
  position:relative;
  margin-top:4px;

  font-size:25px;
  line-height:1;
  font-weight:800;
  letter-spacing:-.5px;
  text-align:center;
}

.loading-subtitle{
  position:relative;
  margin-top:10px;

  color:#9d96ae;
  font-size:13px;
  text-align:center;
}

.loading-dots{
  position:relative;

  display:flex;
  gap:7px;
  margin-top:15px;
}

.loading-dots span{
  width:6px;
  height:6px;

  border-radius:50%;
  background:#bfa4ff;

  animation:
    loadingDot
    1.25s ease-in-out infinite;
}

.loading-dots span:nth-child(2){
  animation-delay:.16s;
}

.loading-dots span:nth-child(3){
  animation-delay:.32s;
}

@keyframes loadingDot{
  0%,100%{
    transform:translateY(0);
    opacity:.25;
  }

  50%{
    transform:translateY(-4px);
    opacity:.9;
  }
}

@keyframes loadingFloat{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-4px);
  }
}

@keyframes loadingOrbit{
  from{
    transform:rotate(-16deg) rotate(0deg);
  }

  to{
    transform:rotate(-16deg) rotate(360deg);
  }
}

@keyframes loadingOrbitTwo{
  from{
    transform:rotate(25deg) rotate(0deg);
  }

  to{
    transform:rotate(25deg) rotate(360deg);
  }
}

@keyframes loadingNebula{
  0%,100%{
    transform:scale(.96);
    opacity:.65;
  }

  50%{
    transform:scale(1.04);
    opacity:.9;
  }
}

/* =====================================================
   HEADER
===================================================== */

header{
  position:relative;
  z-index:20;

  height:78px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 24px;

  background:rgba(3,2,10,.96);

  border-bottom:1px solid var(--border);

  box-shadow:
    0 0 20px rgba(104,42,190,.10);
}

.brand{
  font-size:26px;
  font-weight:900;
  letter-spacing:-.8px;
}

.brand-main{
  color:#fff;
}

.header-right{
  display:flex;
  align-items:center;
  gap:15px;
}

#userName{
  color:#aaa3bb;
  font-size:13px;
  font-weight:700;
}

#logoutBtn{
  width:104px;
  height:42px;

  border:1px solid rgba(160,120,255,.24);

  background:rgba(255,255,255,.035);

  color:#fff;

  padding:0;

  border-radius:14px;

  font:inherit;
  font-size:13px;
  font-weight:700;

  cursor:pointer;

  transition:
    border-color .18s ease,
    background .18s ease;
}

#logoutBtn:hover{
  border-color:rgba(166,116,255,.52);
  background:rgba(125,76,255,.1);
}

/* =====================================================
   MAIN
===================================================== */

.chat-layout{
  position:relative;
  z-index:2;

  width:100%;
  height:calc(100dvh - 78px);

  padding:16px;

  display:grid;

  grid-template-columns:
    235px
    minmax(0,1fr);

  gap:14px;
}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
  min-width:0;
  overflow:hidden;

  border:1px solid var(--border);
  border-radius:14px;

  background:
    linear-gradient(
      180deg,
      rgba(9,6,23,.97),
      rgba(3,2,12,.98)
    );

  box-shadow:
    0 0 22px rgba(95,35,180,.08);
}

.sidebar-title{
  padding:22px 20px 18px;

  border-bottom:
    1px solid rgba(145,76,255,.18);
}

.sidebar-title h2{
  font-size:18px;
  margin-bottom:7px;
}

.sidebar-title p{
  color:var(--muted);
  font-size:11px;
}

.chat-person{
  position:relative;

  margin:17px 15px;
  padding:13px;

  display:flex;
  align-items:center;
  gap:11px;

  border:1px solid rgba(145,76,255,.32);
  border-radius:12px;

  background:
    linear-gradient(
      135deg,
      rgba(95,37,165,.35),
      rgba(27,12,59,.65)
    );
}

.avatar,
.chat-avatar{
  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      #a45cff,
      #6321d8
    );

  font-weight:900;

  box-shadow:
    0 0 16px rgba(145,76,255,.32);
}

.avatar{
  width:43px;
  height:43px;
  flex:0 0 43px;
}

.person-name{
  font-size:13px;
  font-weight:800;
}

.presence{
  margin-top:5px;

  display:flex;
  align-items:center;
  gap:6px;

  color:#bda8ff;

  font-size:10px;
  font-weight:700;
}

.chat-presence-icon{
  font-size:15px;
  line-height:1;
}

/* =====================================================
   CHAT BOX
===================================================== */

.chat-box{
  position:relative;

  min-width:0;
  min-height:0;

  overflow:hidden;

  border:1px solid var(--border);
  border-radius:14px;

  background:rgba(3,2,12,.88);

  box-shadow:
    0 0 24px rgba(95,35,180,.10);
}

.chat-top{
  height:64px;

  display:flex;
  align-items:center;
  gap:11px;

  padding:10px 16px;

  border-bottom:
    1px solid rgba(145,76,255,.28);

  background:rgba(5,3,14,.94);

  position:relative;
  z-index:5;
}

.chat-avatar{
  width:40px;
  height:40px;
  flex:0 0 40px;
}

.chat-title{
  font-size:14px;
  font-weight:900;
}

.chat-status{
  display:flex;
  align-items:center;
  gap:6px;

  margin-top:4px;

  color:#bda8ff;

  font-size:10px;
  font-weight:700;
}

.chat-actions{
  margin-left:auto;

  display:flex;
  align-items:center;
  gap:12px;
}

.search-btn,
.star-btn{
  border:0;
  background:transparent;
  color:#d9d0ed;
  cursor:pointer;
  font-size:22px;
}

.search-btn{
  font-size:19px;
}

/* =====================================================
   MESSAGE AREA
===================================================== */

#messages{
  position:absolute;

  inset:64px 0 0 0;

  overflow-y:auto;

  padding:
    20px
    20px
    100px;

  scroll-behavior:auto;

  overscroll-behavior:contain;

  -webkit-overflow-scrolling:touch;

  contain:
    layout
    paint
    style;
}

#messages::-webkit-scrollbar{
  width:5px;
}

#messages::-webkit-scrollbar-thumb{
  background:rgba(145,76,255,.22);
  border-radius:10px;
}

/* =====================================================
   GALAXY CHAT BACKGROUND
===================================================== */

.chat-space{
  position:absolute;

  inset:64px 0 0;

  pointer-events:none;

  overflow:hidden;

  contain:strict;
}

.chat-moon{
  position:absolute;

  left:55px;
  top:28px;

  width:64px;
  height:64px;

  border-radius:50%;

  background:#fff9a8;

  box-shadow:
    0 0 25px rgba(255,225,60,.28);
}

.chat-moon:after{
  content:"";

  position:absolute;

  width:64px;
  height:64px;

  border-radius:50%;

  background:#05020f;

  left:20px;
  top:-4px;
}

.chat-planet{
  position:absolute;

  right:35px;
  top:55px;

  width:78px;
  height:78px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 30% 30%,
      #6d739a,
      #252841 70%,
      #17182b
    );

  box-shadow:
    0 0 20px rgba(100,100,180,.20);
}

.chat-planet:after{
  content:"";

  position:absolute;

  width:130px;
  height:30px;

  border:
    1px solid
    rgba(173,135,255,.40);

  border-radius:50%;

  left:-26px;
  top:23px;

  transform:rotate(-14deg);
}

.nebula{
  position:absolute;

  width:320px;
  height:230px;

  left:50%;
  top:100px;

  transform:translateX(-50%);

  border-radius:50%;

  /* No blur filter */
  background:
    radial-gradient(
      ellipse,
      rgba(115,39,190,.20),
      rgba(80,30,150,.08) 40%,
      transparent 70%
    );
}

.welcome-message{
  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-42%);

  width:min(90%,500px);

  text-align:center;

  z-index:2;
}

.welcome-message h3{
  font-size:18px;
  margin-bottom:8px;
}

.welcome-message p{
  color:#777187;
  font-size:11px;
}

/* =====================================================
   MESSAGES
===================================================== */

.message-row{
  position:relative;

  display:flex;

  margin-bottom:13px;

  z-index:3;

  contain:layout;
}

.message-row.mine{
  justify-content:flex-end;
}

.message{
  position:relative;

  max-width:min(70%,560px);

  padding:11px 13px 8px;

  border:
    1px solid
    rgba(145,76,255,.25);

  border-radius:
    15px 15px 15px 4px;

  background:
    linear-gradient(
      135deg,
      rgba(15,8,31,.96),
      rgba(25,11,47,.94)
    );

  box-shadow:
    0 4px 15px rgba(0,0,0,.16);

  animation:
    messageIn .25s ease both;
}

.mine .message{
  border-radius:
    15px 15px 4px 15px;

  background:
    linear-gradient(
      135deg,
      #5620b0,
      #7c3ee1
    );

  border-color:
    rgba(184,143,255,.55);
}

.message-text{
  white-space:pre-wrap;
  word-break:break-word;

  font-size:13px;
  line-height:1.45;

  padding-right:30px;
}

.message-time{
  display:inline-block;

  margin-top:5px;

  color:rgba(255,255,255,.52);

  font-size:9px;
}

.message-status{
  display:inline-block;

  margin-left:7px;

  color:rgba(255,255,255,.62);

  font-size:9px;
}

.message-status.seen{
  color:#d8c5ff;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(6px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

.message.deleting{
  opacity:0;

  transform:scale(.95);

  transition:
    opacity .18s ease,
    transform .18s ease;
}

/* =====================================================
   EDIT MESSAGE UI
===================================================== */

.message.editing{
  padding:10px;
  background:rgba(17,10,35,.96) !important;
  border:1px solid rgba(174,125,255,.55) !important;
  box-shadow:0 10px 30px rgba(0,0,0,.28);
}

.edit-editor{
  display:block;
  width:100%;
  min-height:58px;
  max-height:180px;
  resize:vertical;
  box-sizing:border-box;
  padding:11px 12px;
  border:1px solid rgba(190,151,255,.35);
  border-radius:12px;
  background:rgba(7,5,18,.72);
  color:#fff;
  font:inherit;
  font-size:13px;
  line-height:1.45;
  outline:none;
}

.edit-editor:focus{
  border-color:rgba(184,143,255,.8);
  box-shadow:0 0 0 3px rgba(142,76,255,.12);
}

.edit-actions{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:8px;
  margin-top:9px;
}

.edit-action{
  min-width:72px;
  padding:8px 14px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:10px;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
  transition:transform .15s ease,opacity .15s ease,background .15s ease;
}

.edit-action:hover{transform:translateY(-1px);}

.edit-save{
  border-color:rgba(184,143,255,.5);
  background:linear-gradient(135deg,#7b3fe0,#a15cff);
  color:#fff;
}

.edit-cancel{
  background:rgba(255,255,255,.07);
  color:#eee9f8;
}

.edit-action:disabled{
  opacity:.55;
  cursor:default;
  transform:none;
}
.edit-action:disabled{
  opacity:.55;
  cursor:default;
  transform:none;
}

/* Edit is an inline state: it must stay above the message itself,
   but never allow floating menus to stack over it. */
.message.editing{
  position:relative;
  z-index:20;
}

.message.editing .edit-editor{
  max-height:140px;
  overflow-y:auto;
}

.message.editing .message-menu-btn{
  display:none;
}

/* =====================================================
   REPLY
===================================================== */

.reply-preview{
  margin-bottom:7px;

  padding:6px 8px;

  border-left:
    2px solid
    #c39cff;

  border-radius:5px;

  background:rgba(255,255,255,.08);
}

.reply-name{
  font-size:9px;
  font-weight:800;

  color:#d0b8ff;

  margin-bottom:2px;
}

.reply-text{
  color:rgba(255,255,255,.65);

  font-size:9px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* =====================================================
   MESSAGE MENU
===================================================== */

.message-menu-btn{
  position:absolute;
  z-index:101;

  right:5px;
  top:5px;

  width:25px;
  height:25px;

  border:0;

  border-radius:50%;

  background:rgba(0,0,0,.15);

  color:#fff;

  cursor:pointer;

  opacity:.7;
}

.message-menu{
  display:none;

  position:fixed;
  box-sizing:border-box;

  z-index:999999;

  width:148px;
  min-width:148px;

  padding:5px;

  border:1px solid rgba(184,143,255,.48);
  border-radius:14px;

  background:rgba(12,6,26,.98);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  box-shadow:
    0 16px 40px rgba(0,0,0,.58),
    0 0 24px rgba(120,60,255,.10);

  transform-origin:top right;
}

.message-menu.open{
  display:block;
}

.message-menu button{
  display:block;

  width:100%;
  min-height:42px;

  padding:10px 12px;

  border:0;
  border-radius:9px;

  background:transparent;

  color:#eee9f8;

  text-align:left;

  font-size:14px;
  font-weight:600;

  cursor:pointer;

  -webkit-tap-highlight-color:transparent;
}

.message-menu button:hover,
.message-menu button:active{
  background:rgba(145,76,255,.18);
}

.message-menu.open{
  display:block;
}

.message-menu button{
  display:block;

  width:100%;

  padding:9px 10px;

  border:0;

  border-radius:7px;

  background:transparent;

  color:#eee9f8;

  text-align:left;

  font-size:12px;

  cursor:pointer;
}

.message-menu button:hover{
  background:rgba(145,76,255,.18);
}

/* =====================================================
   REACTION PICKER
===================================================== */

.reaction-picker{
  display:flex;
  position:fixed;
  z-index:999998;
  align-items:center;
  gap:3px;
  padding:6px;
  border:1px solid rgba(145,76,255,.45);
  border-radius:14px;
  background:rgba(12,6,28,.96);
  box-shadow:0 12px 28px rgba(0,0,0,.45),0 0 24px rgba(132,74,255,.12);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transform:translateY(6px) scale(.94);
  transform-origin:center bottom;
  transition:opacity .14s ease,transform .16s cubic-bezier(.2,.8,.2,1),visibility .14s ease;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}

.reaction-picker.open{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  transform:translateY(0) scale(1);
}

.reaction-picker button{
  min-width:31px;
  height:31px;

  border:0;

  border-radius:8px;

.reply-picker{

.reaction-summary{

.reaction-chip{

/* =====================================================
   INPUT
===================================================== */

.input-area{

  left:12px;
  right:12px;
  bottom:10px;

  z-index:20;

  display:flex;

  gap:8px;

  padding:7px;

  border:
    1px solid
    rgba(145,76,255,.45);

  background:#0b0519;

  box-shadow:
    0 8px 24px rgba(0,0,0,.30);

#messageInput{
  min-width:0;

  flex:1;

  height:40px;

  resize:none;

  outline:none;

  border:0;

  background:transparent;

  color:#fff;

  padding:
    11px 9px;

  font-family:inherit;

  font-size:16px;

  line-height:18px;

  /* Prevent mobile browser weird repaint */

}

#messageInput::placeholder{
  color:#716a7e;
}

#sendButton{
  min-width:68px;

  border:0;

  border-radius:10px;

  background:
    linear-gradient(
      135deg,
      #914cff,
      #aa69ff
    );

  color:#fff;

  font-size:11px;
  font-weight:900;

  cursor:pointer;
}

#sendButton:disabled{
  opacity:.6;
}

/* =====================================================
   SEARCH
===================================================== */

.search-panel{
  position:absolute;

  top:69px;
  right:14px;

  z-index:100;

  width:min(
    310px,
    calc(100% - 28px)
  );

  display:none;

  padding:9px;

  border:
    1px solid
    var(--border);

  border-radius:12px;

  background:#0e071d;

  box-shadow:
    0 12px 28px rgba(0,0,0,.42);
}

.search-panel.open{
  display:flex;
  gap:6px;
}

#searchInput{
  min-width:0;
  flex:1;

  border:
    1px solid
    rgba(145,76,255,.25);

  border-radius:8px;

  outline:none;

  padding:9px;

  background:#080411;

  color:#fff;
}

.search-panel button{
  border:
    1px solid
    rgba(145,76,255,.3);

  border-radius:8px;

  background:#140925;

  color:#fff;

  padding:0 9px;

  cursor:pointer;
}

/* HARD SILENT STATUS FIX
   The status/toast element is intentionally disabled.
   Realtime continues working in the background.
*/
#status, #status.show, #status.realtime-hidden{
  display:none !important;
  visibility:hidden !important;
  opacity:0 !important;
  pointer-events:none !important;
}

/* =====================================================
   STATUS
===================================================== */

#status{
  position:fixed;

  left:50%;
  bottom:78px;

  z-index:999999;

  transform:
    translateX(-50%)
    translateY(10px);

  opacity:0;

  pointer-events:none;

  padding:9px 14px;

  border:
    1px solid
    var(--border);

  border-radius:10px;

  background:#110820;

  color:#ddd4ee;

  font-size:11px;

  transition:
    opacity .2s ease,
    transform .2s ease;
}

/* Realtime connection messages are intentionally invisible. */
#status.realtime-hidden{
  display:none !important;
}

#status.show{
  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);
}

/* =====================================================
   ERROR
===================================================== */

.login-error{

  z-index:5;

  width:min(90%,420px);

  padding:30px;

  background:rgba(10,5,22,.92);

  text-align:center;
}

}

.login-error p{

  font-size:13px;

  line-height:1.5;

  margin-bottom:20px;
}

.back-button{

  padding:10px 18px;

  border-radius:10px;

  background:
    linear-gradient(
      135deg,
      #914cff,
      #aa69ff
    );

  text-decoration:none;

  font-size:12px;

  font-weight:800;
}

/* =====================================================
   PROFILE BUTTON
===================================================== */

.profile-icon{

/* =====================================================
   PRIVATE CONVERSATIONS / USER SEARCH
===================================================== */

.user-search-row{

}

#userSearchInput{

.user-search-info{min-width:0;flex:1;}

/* Avatar-only presence indicator: moon = online, sun = offline. */

.conversation-avatar-wrap .mini-avatar{width:58px;height:58px;flex-basis:58px;font-size:25px;}
.presence-avatar-icon{position:absolute;right:-5px;bottom:-4px;width:29px;height:29px;display:grid;place-items:center;border-radius:50%;background:#080714;font-size:25px;line-height:1;filter:drop-shadow(0 0 5px rgba(0,0,0,.75));}
.presence-avatar-icon.online{color:#10bdf5;}
.presence-avatar-icon.offline{color:#ffc21c;}

.user-search-name{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-search-id{margin-top:3px;color:#a99bbd;font-size:10px;}

.user-search-open{

}

.conversation-list{

}

.conversation-item{

}

.conversation-item:hover{

}

.conversation-item.active{

  border-color:rgba(166,103,255,.72);
}

.conversation-copy{min-width:0;flex:1;color:#fff !important;}
.conversation-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.conversation-name{color:#fff !important;font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.conversation-time{color:#9285a7;font-size:11px;white-space:nowrap;}
.conversation-preview{margin-top:5px;color:#a69ab8;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.conversation-status{display:none!important;}
.conversation-status-icon{display:none!important;}
.unread-badge{min-width:22px;height:22px;padding:0 6px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#a45cff,#6321d8);color:#fff;font-size:11px;font-weight:900;box-shadow:0 0 14px rgba(145,76,255,.4);}
.conversation-empty{
  min-height:190px;
  padding:28px 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:7px;
  text-align:center;
  color:#8f859c;
  font-size:10px;
}

.conversation-empty strong{color:#cfc3df;font-size:12px;}
.conversation-empty span{line-height:1.5;max-width:180px;}
.empty-galaxy{
  position:relative;width:78px;height:78px;margin-bottom:7px;
  display:grid;place-items:center;
  filter:drop-shadow(0 0 14px rgba(145,76,255,.24));
}
.galaxy-moon{
  position:relative;z-index:3;width:43px;height:43px;border-radius:50%;
  display:grid;place-items:center;color:#d9b8ff;font-size:30px;
  background:radial-gradient(circle at 35% 30%,#d9c4ff 0 7%,#9d55ff 38%,#4d1d9a 100%);
  box-shadow:0 0 18px rgba(156,84,255,.65),inset -7px -6px 12px rgba(25,8,62,.55);
  animation:moonFloat 3.2s ease-in-out infinite;
}
.galaxy-orbit{
  position:absolute;width:72px;height:29px;border:1px solid rgba(170,111,255,.7);
  border-radius:50%;transform:rotate(-28deg);
  box-shadow:0 0 10px rgba(145,76,255,.22);
  animation:orbitPulse 3.2s ease-in-out infinite;
}
.galaxy-star{position:absolute;color:#c89aff;font-weight:900;z-index:4;animation:starTwinkle 2.4s ease-in-out infinite;}
.star-one{top:5px;right:8px;font-size:13px;}
.star-two{bottom:10px;left:6px;font-size:22px;animation-delay:.7s;}
.star-three{top:17px;left:4px;font-size:8px;animation-delay:1.2s;}
@keyframes moonFloat{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-4px) rotate(8deg)}}
@keyframes orbitPulse{0%,100%{opacity:.55;transform:rotate(-28deg) scale(1)}50%{opacity:1;transform:rotate(-28deg) scale(1.06)}}
@keyframes starTwinkle{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

.chat-box.empty-chat .input-area{opacity:.45;pointer-events:none;}
.chat-box.empty-chat .chat-actions{opacity:.45;pointer-events:none;}

@media(max-width:800px){
  .conversation-list{height:calc(100% - 157px);padding:4px 8px 20px;}
  .sidebar-title{padding:16px 13px 12px;}
  .conversation-item{min-height:68px;margin:5px 0;padding:12px 10px;}
}

/* =====================================================
   WHEN INPUT IS FOCUSED
   Reduce visual repaint while typing.
===================================================== */

.chat-box:has(#messageInput:focus) .chat-space{
  opacity:.82;
}

.chat-box:has(#messageInput:focus) .chat-moon{
  box-shadow:none;
}

.chat-box:has(#messageInput:focus) .chat-planet{
  box-shadow:none;
}

.chat-box:has(#messageInput:focus) .input-area{
  box-shadow:
    0 5px 15px
    rgba(0,0,0,.22);
}

/* =====================================================
   REDUCED MOTION
===================================================== */

@media(prefers-reduced-motion:reduce){

  *,
  *:before,
  *:after{
    animation:none!important;
    transition:none!important;
    scroll-behavior:auto!important;
  }
}


/* Smooth message sending states */
.message-status{
  min-width:46px;
  transition:opacity .18s ease, color .18s ease;
}
.message-status.send-failed{
  color:#ff9a9a;
}
#sendButton.sending,
#sendButton.sending:hover{
  opacity:.82;
}
.message-row{
  will-change:transform,opacity;
}

/* Final edit UI safety: one editor only, compact glass controls. */
.message.editing{
  position:relative;
  z-index:20;
}
.edit-editor{
  display:block;
  width:100%;
  min-height:78px;
  resize:vertical;
  box-sizing:border-box;
  margin:2px 0 10px;
  padding:12px 14px;
  border:1px solid rgba(170,120,255,.55);
  border-radius:14px;
  outline:none;
  background:rgba(11,7,28,.72);
  color:#fff;
  font:inherit;
  line-height:1.45;
  box-shadow:0 8px 30px rgba(85,35,180,.18), inset 0 1px 0 rgba(255,255,255,.06);
}
.edit-editor:focus{
  border-color:rgba(180,130,255,.95);
  box-shadow:0 0 0 3px rgba(150,90,255,.12), 0 10px 34px rgba(80,30,170,.22);
}
.edit-actions{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:2px;
}
.edit-action{
  border:1px solid rgba(255,255,255,.12);
  border-radius:10px;
  padding:8px 14px;
  font:600 14px/1 system-ui,sans-serif;
  cursor:pointer;
  transition:transform .16s ease,opacity .16s ease,background .16s ease;
}
.edit-action:hover{transform:translateY(-1px);}
.edit-save{
  color:#fff;
  background:linear-gradient(135deg,#7b32ff,#a65cff);
}
.edit-cancel{
  color:rgba(255,255,255,.86);
  background:rgba(255,255,255,.07);
}
.edit-action:disabled{opacity:.55;cursor:not-allowed;transform:none;}

<script>

/* =====================================================
   MOBILE CHAT LIST NAVIGATION
===================================================== */

function isMobileLayout(){
  return window.matchMedia("(max-width:800px)").matches;
}

function openMobileConversation(){
  if(!chatLayout || !isMobileLayout()) return;
  if(!currentConversationId) return;
  chatLayout.classList.add("mobile-chat-open");
  window.setTimeout(()=>{
    if(messages) messages.scrollTop = messages.scrollHeight;
  },40);
}

function closeMobileConversation(){
  if(!chatLayout || !isMobileLayout()) return;
  chatLayout.classList.remove("mobile-chat-open");
  searchPanel?.classList.remove("open");
  currentConversationId = null;
  currentConversationPartner = null;
  document.querySelectorAll(".conversation-item.active").forEach(el=>el.classList.remove("active"));
  setEmptyChatState();
}

if(mobileChatBack){
  mobileChatBack.addEventListener("click",closeMobileConversation);
}

window.addEventListener("resize",()=>{
  if(!chatLayout) return;
  if(!isMobileLayout()) chatLayout.classList.remove("mobile-chat-open");
});

/* Safety guard: realtime connection text can NEVER become a visible toast. */
const realtimeToastGuard = new MutationObserver(()=>{
  if(!statusBox) return;
  const value = String(statusBox.textContent || "");
  if(/realtime/i.test(value)){
    statusBox.classList.remove("show");
    statusBox.classList.add("realtime-hidden");
    statusBox.textContent = "";
  }
});
if(statusBox){
  realtimeToastGuard.observe(statusBox,{childList:true,subtree:true,characterData:true});
}


const searchPanel =
  document.getElementById("searchPanel");

const searchInput =
  document.getElementById("searchInput");

let currentUser = null;

let currentProfile = null;

let currentConversationId = null;
let currentConversationPartner = null;
let conversations = [];

let realtimeChannel = null;

let presenceChannel = null;
let onlineUserIds = new Set();

let replyTarget = null;

const conversationPrefsKey = ()=>`totalk_conversation_prefs_${currentUser?.id || "guest"}`;
function readConversationPrefs(){try{return JSON.parse(localStorage.getItem(conversationPrefsKey())||"{}")}catch{return {}}}
function writeConversationPrefs(value){localStorage.setItem(conversationPrefsKey(),JSON.stringify(value));}
let conversationOptionsTarget = null;
const optionsBackdrop = document.getElementById("conversationOptionsBackdrop");
const optionsTitle = document.getElementById("conversationOptionsTitle");
function closeConversationOptions(){optionsBackdrop?.classList.remove("open");optionsBackdrop?.setAttribute("aria-hidden","true");conversationOptionsTarget=null;}
function openConversationOptions(row,partner){
  conversationOptionsTarget={row,partner};
  if(optionsTitle) optionsTitle.textContent=partner?.name || "Conversation options";
  const prefs=readConversationPrefs(); const id=row.id; const itemPrefs=prefs[id]||{};
  const labels={pin:itemPrefs.pinned?"Unpin conversation":"Pin conversation",mute:itemPrefs.muted?"Unmute notifications":"Mute notifications",unread:"Mark as unread",archive:itemPrefs.archived?"Unarchive conversation":"Archive conversation",delete:"Delete conversation"};
  optionsBackdrop?.querySelectorAll("[data-conversation-action]").forEach(btn=>{const a=btn.dataset.conversationAction;if(labels[a]) btn.querySelector("span").textContent=labels[a];});
  optionsBackdrop?.classList.add("open");optionsBackdrop?.setAttribute("aria-hidden","false");
}
function applyConversationAction(action){
  if(!conversationOptionsTarget) return;
  const id=conversationOptionsTarget.row.id; const prefs=readConversationPrefs(); const item=prefs[id]||{};
  if(action==="cancel"){closeConversationOptions();return;}
  if(action==="pin") item.pinned=!item.pinned;
  if(action==="mute") item.muted=!item.muted;
  if(action==="unread") item.unread=true;
  if(action==="archive") item.archived=!item.archived;
  if(action==="delete"){if(!confirm("Delete this conversation from your chat list?")) return;item.deleted=true;}
  prefs[id]=item;writeConversationPrefs(prefs);closeConversationOptions();loadConversationList();
}
optionsBackdrop?.addEventListener("click",e=>{if(e.target===optionsBackdrop) closeConversationOptions();});
optionsBackdrop?.querySelectorAll("[data-conversation-action]").forEach(btn=>btn.addEventListener("click",()=>applyConversationAction(btn.dataset.conversationAction)));


const messageCache =
  new Map();

const REACTIONS = [
  "👍",
  "❤️",
  "😂",
  "😮",
  "😢",
  "😡"
];

/* =====================================================
   LOADING
===================================================== */

function setLoadingText(
  title,
  subtitle
){

  loadingTitle.textContent =
    title;

  loadingSubtitle.textContent =
    subtitle;

}

function finishLoading(){

  loading.classList.add("hide");

  setTimeout(
    ()=>{
      loading.style.display =
        "none";
    },
    450
  );

}

function showLoading(
  title,
  subtitle
){

  loading.style.display =
    "flex";

  loading.classList.remove(
    "hide"
  );

  setLoadingText(
    title,
    subtitle
  );

}

/* =====================================================
   STATUS
===================================================== */

function showStatus(text){

  /* NEVER show realtime connection notices in the UI. */
  const cleanText = String(text || "");
  if(/realtime/i.test(cleanText)){
    statusBox.classList.remove("show");
    statusBox.classList.add("realtime-hidden");
    statusBox.textContent = "";
    return;
  }

  statusBox.classList.remove("realtime-hidden");

  /* Realtime connection state is intentionally silent.
     It must never appear as a popup/toast to the user. */
  const silentRealtimeStatus =
    /realtime\s+(connected|reconnecting|connection error|timed out)/i.test(
      String(text || "")
    );

  if(silentRealtimeStatus){
    statusBox.classList.remove("show");
    return;
  }

  statusBox.textContent =
    text;

  statusBox.classList.add(
    "show"
  );

  clearTimeout(
    showStatus.timer
  );

  showStatus.timer =
    setTimeout(
      ()=>{
        statusBox.classList.remove(
          "show"
        );
      },
      3000
    );

}

/* =====================================================
   AUTH
===================================================== */

async function getLoggedInUser(){

  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .getSession();

  if(error){

    console.error(
      "Session error:",
      error
    );

    return null;

  }

  return (
    data?.session?.user ||
    null
  );

}

/* =====================================================
   PROFILE
===================================================== */

async function checkProfile(){

  if(!currentUser){
    return null;
  }

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,user_id,name,gender,age,totalk_id,profile_completed,location,location_visibility"
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .maybeSingle();

  if(error){

    console.error(
      "Profile check error:",
      error
    );

    throw error;

  }

  return data || null;

}

   PROFILE REDIRECT

/* =====================================================
   USER UI
===================================================== */

function updateUserUI(){

  const name =
    currentProfile?.name ||
    currentUser?.user_metadata?.full_name ||
    currentUser?.user_metadata?.name ||
    currentUser?.email?.split("@")[0] ||
    "ToTalk User";

function setEmptyChatState(){
  currentConversationId = null;
  currentConversationPartner = null;
  chatBoxEmpty(true);

  if(chatTitle) chatTitle.textContent = "Select a conversation";
  if(chatPresence) chatPresence.textContent = "Choose a person to start";
  if(chatAvatar) chatAvatar.textContent = "T";
  if(messages){
    messages.innerHTML = `
      <div class="welcome-message" id="welcomeMessage">
        <h3>Your ToTalk space</h3>
        <p>Search a ToTalk ID on the left, then open a private conversation.</p>
      </div>
    `;
  }
  if(messageInput){
    messageInput.value = "";
    messageInput.placeholder = "Select a conversation first...";

function chatBoxEmpty(value){
  const box = document.querySelector(".chat-box");
  if(box) box.classList.toggle("empty-chat",!!value);
}

function renderActivePartner(){
  const p = currentConversationPartner;
  if(!p) return;
  const name = p.name || "ToTalk User";
  const first = name.trim().charAt(0).toUpperCase() || "T";
  if(chatTitle) chatTitle.textContent = name;
  if(chatAvatar) chatAvatar.textContent = first;
  if(chatPresence) chatPresence.textContent = "Offline";
  if(messageInput){
    messageInput.disabled = false;
    messageInput.placeholder = "Write a message...";
  }
  if(sendButton) sendButton.disabled = false;
  chatBoxEmpty(false);
}

/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(value){

  if(!value){
    return "";
  }

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){
    return "";
  }

  return date.toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}

/* =====================================================
   REPLY
===================================================== */

function setReplyTarget(data){

  replyTarget =
    data;

  messageInput.placeholder =
    "Reply to message...";

  messageInput.focus();

  showStatus(
    "Replying to message"
  );

}

function clearReplyTarget(){

  replyTarget =
    null;

  messageInput.placeholder =
    "Write a message...";

}

/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(
  data,
  animate=true
){

  if(!data?.id){
    return;
  }

  if(
    document.querySelector(
      `[data-message-id="${data.id}"]`
    )
  ){
    return;
  }

  const welcome =
    document.getElementById(
      "welcomeMessage"
    );

  if(welcome){
    welcome.remove();
  }

  messageCache.set(
    data.id,
    data
  );

  const mine =
    currentUser &&
    data.sender_id ===
      currentUser.id;

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "message-row" +
    (mine ? " mine" : "");

  row.dataset.messageId =
    data.id;

  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "message";

  if(!animate){
    bubble.style.animation =
      "none";
  }

  /* Reply */

  if(data.reply_to_id){

    const replied =
      messageCache.get(
        data.reply_to_id
      );

    if(replied){

      const reply =
        document.createElement(
          "div"
        );

      reply.className =
        "reply-preview";

      const replyName =
        document.createElement(
          "div"
        );

      replyName.className =
        "reply-name";

      replyName.textContent =
        replied.sender_id ===
        currentUser.id
          ? "You"
          : "Message";

      const replyText =
        document.createElement(
          "div"
        );

      replyText.className =
        "reply-text";

      replyText.textContent =
        replied.content || "";

      reply.append(
        replyName,
        replyText
      );

      bubble.appendChild(
        reply
      );

    }

  }

  /* Text */

  const text =
    document.createElement(
      "div"
    );

  text.className =
    "message-text";

  text.textContent =
    data.content || "";

  bubble.appendChild(
    text
  );

  /* Time */

  const time =
    document.createElement(
      "span"
    );

  time.className =
    "message-time";

  time.textContent =
    formatTime(
      data.created_at
    );

  if(data.edited_at){

    time.textContent +=
      " · edited";

  }

  bubble.appendChild(
    time
  );

  /* Status */

  if(mine){

    const status =
      document.createElement(
        "span"
      );

    status.className =
      "message-status";

    status.dataset.status =
      "true";

    status.textContent =
      "Sent";

    bubble.appendChild(
      status
    );

  }

  /* Menu */

  if(mine){

    const menuButton =
      document.createElement(
        "button"
      );

    menuButton.className =
      "message-menu-btn";

    menuButton.type =
      "button";

    menuButton.textContent =
      "⋮";

    menuButton.addEventListener(
      "click",
      event=>{

        event.stopPropagation();

        openMessageMenu(data,bubble);

      }
    );

    bubble.appendChild(
      menuButton
    );

  }

  /* Reaction */

  const picker =
    createReactionPicker(
      data,
      bubble
    );

  bubble._reactionPicker =
    picker;

  row.appendChild(
    bubble
  );

  messages.appendChild(
    row
  );

}

/* =====================================================
   REACTION PICKER
===================================================== */

function createReactionPicker(
  data,
  bubble
){

  const picker = document.createElement("div");
  picker.className = "reaction-picker";

  const reply = document.createElement("button");
  reply.className = "reply-picker";
  reply.type = "button";
  reply.textContent = "Reply";

  reply.addEventListener("click", event=>{
    event.stopPropagation();
    picker.classList.remove("open");
    setReplyTarget(data);
  });

  picker.appendChild(reply);

  REACTIONS.forEach(reaction=>{
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = reaction;
    button.setAttribute("aria-label", "React " + reaction);

    button.addEventListener("click", event=>{
      event.stopPropagation();
      picker.classList.remove("open");

      /* Update the UI immediately. Database work happens in the background. */
      void toggleReaction(data.id, reaction, bubble);
    });

    picker.appendChild(button);
  });

  let timer = null;
  let startX = 0;
  let startY = 0;

  const cancelLongPress = ()=>{
    if(timer){
      clearTimeout(timer);
      timer = null;
    }
  };

  bubble.addEventListener("touchstart", event=>{
    if(event.touches.length !== 1) return;

    startX = event.touches[0].clientX;
    startY = event.touches[0].clientY;
    cancelLongPress();

    timer = setTimeout(()=>{
      timer = null;

      closeMenus();

      const rect = bubble.getBoundingClientRect();

      document.body.appendChild(picker);

      /* Measure after insertion so the picker can be positioned precisely. */
      const pickerWidth = picker.offsetWidth || 250;
      const pickerHeight = picker.offsetHeight || 45;
      const gap = 8;
      const padding = 8;

      let left = rect.left + (rect.width / 2) - (pickerWidth / 2);
      let top = rect.top - pickerHeight - gap;

      if(top < padding){
        top = rect.bottom + gap;
      }

      left = Math.max(
        padding,
        Math.min(left, window.innerWidth - pickerWidth - padding)
      );

      top = Math.max(
        padding,
        Math.min(top, window.innerHeight - pickerHeight - padding)
      );

      picker.style.left = Math.round(left) + "px";
      picker.style.top = Math.round(top) + "px";
      picker.style.right = "auto";
      picker.style.bottom = "auto";

      requestAnimationFrame(()=>picker.classList.add("open"));

      if(navigator.vibrate){
        try{ navigator.vibrate(10); }catch(e){}
      }
    }, 360);
  }, {passive:true});

  bubble.addEventListener("touchmove", event=>{
    if(!timer) return;
    const touch = event.touches[0];
    if(Math.abs(touch.clientX - startX) > 10 || Math.abs(touch.clientY - startY) > 10){
      cancelLongPress();
    }
  }, {passive:true});

  bubble.addEventListener("touchend", cancelLongPress, {passive:true});
  bubble.addEventListener("touchcancel", cancelLongPress, {passive:true});

  return picker;
}

/* =====================================================
   REACTION SAVE
===================================================== */

async function toggleReaction(
  messageId,
  reaction,
  bubble
){

  if(!currentUser || !messageId || String(messageId).startsWith("local-")){
    return;
  }

  /* Keep reaction state on the exact message bubble. */
  if(!bubble._reactionState){
    bubble._reactionState = {
      counts:{},
      mine:null
    };
  }

  const state = bubble._reactionState;
  const previousReaction = state.mine || null;
  const isRemoving = previousReaction === reaction;

  /* OPTIMISTIC UI: update instantly, without waiting for Supabase. */
  if(previousReaction){
    state.counts[previousReaction] = Math.max(
      0,
      (state.counts[previousReaction] || 0) - 1
    );
    if(state.counts[previousReaction] === 0){
      delete state.counts[previousReaction];
    }
  }

  if(isRemoving){
    state.mine = null;
  }else{
    state.counts[reaction] = (state.counts[reaction] || 0) + 1;
    state.mine = reaction;
  }

  renderReactionState(bubble, state);

  try{
    /* Preserve the existing database model, but do it after the UI responds. */
    const {data:existing,error:readError} = await supabaseClient
      .from("message_reactions")
      .select("user_id,reaction")
      .eq("message_id",messageId)
      .eq("user_id",currentUser.id)
      .maybeSingle();

    if(readError) throw readError;

    if(existing && existing.reaction === reaction){
      const {error} = await supabaseClient
        .from("message_reactions")
        .delete()
        .eq("message_id",messageId)
        .eq("user_id",currentUser.id);
      if(error) throw error;
    }else{
      if(existing){
        const {error} = await supabaseClient
          .from("message_reactions")
          .delete()
          .eq("message_id",messageId)
          .eq("user_id",currentUser.id);
        if(error) throw error;
      }

      const {error} = await supabaseClient
        .from("message_reactions")
        .insert({
          message_id:messageId,
          user_id:currentUser.id,
          reaction:reaction
        });
      if(error) throw error;
    }

  }catch(error){
    console.error("Reaction error:",error);
    /* If the server failed, restore the real server state. */
    await refreshReaction(messageId,bubble);
    showStatus("Reaction could not be changed.");
  }
}

function renderReactionState(bubble,state){

  if(!bubble) return;

  bubble.querySelector(".reaction-summary")?.remove();

  const entries = Object.entries(state?.counts || {})
    .filter(([,count])=>Number(count) > 0);

  if(!entries.length) return;

  const summary = document.createElement("div");
  summary.className = "reaction-summary";

  entries.forEach(([reaction,count])=>{
    const chip = document.createElement("span");
    chip.className = "reaction-chip";
    if(state.mine === reaction){
      chip.classList.add("mine");
    }
    chip.textContent = reaction + " " + count;
    summary.appendChild(chip);
  });

  bubble.appendChild(summary);
}

async function refreshReaction(
  messageId,
  bubble
){

  const {data,error} = await supabaseClient
    .from("message_reactions")
    .select("user_id,reaction")
    .eq("message_id",messageId);

  if(error) return;

  const state = {
    counts:{},
    mine:null
  };

  (data || []).forEach(item=>{
    state.counts[item.reaction] =
      (state.counts[item.reaction] || 0) + 1;

    if(currentUser && item.user_id === currentUser.id){
      state.mine = item.reaction;
    }
  });

  bubble._reactionState = state;
  renderReactionState(bubble,state);
}

  } =

  ).forEach(

      renderReactionState(bubble,state);

    }

function createMessageMenu(
  data,
  bubble
){

  /* There must never be more than one floating menu. */
  document
    .querySelectorAll(".message-menu")
    .forEach(element=>element.remove());

  const menu =
    document.createElement("div");

  menu.className = "message-menu";

  const latestData = ()=>{
    const id = bubble?.closest?.("[data-message-id]")?.dataset?.messageId || data?.id;
    return (id && messageCache.get(id)) || data;
  };

  const reply = document.createElement("button");
  reply.type = "button";
  reply.textContent = "Reply";
  reply.onclick = event=>{
    event.stopPropagation();
    menu.remove();
    setReplyTarget(latestData());
  };

  const edit = document.createElement("button");
  edit.type = "button";
  edit.textContent = "Edit";
  edit.onclick = event=>{
    event.stopPropagation();
    const current = latestData();
    menu.remove();
    /* Close any existing editor before opening this one. */
    closeActiveEdit();
    editMessage(current,bubble);
  };

  const remove = document.createElement("button");
  remove.type = "button";
  remove.textContent = "Delete";
  remove.onclick = event=>{
    event.stopPropagation();
    const current = latestData();
    menu.remove();
    deleteMessage(current,bubble);
  };

  menu.append(reply,edit,remove);
  return menu;
}

/* Open the action menu next to the EXACT message.
   It stays inside that message bubble, never in <body>, and
   automatically flips above the bubble when there is not enough
   room below it. */
function openMessageMenu(data,bubble){
  if(!bubble) return;

  closeMenus();
  closeActiveEdit();

  const menu=createMessageMenu(data,bubble);
  document.body.appendChild(menu);
  menu.classList.add("open");

  const menuButton = bubble.querySelector(".message-menu-btn");
  const anchor = menuButton || bubble;
  const gap = 8;
  const padding = 10;

  requestAnimationFrame(()=>{
    if(!menu.isConnected) return;

    const anchorRect = anchor.getBoundingClientRect();
    const menuRect = menu.getBoundingClientRect();

    let left = anchorRect.right - menuRect.width;
    let top = anchorRect.bottom + gap;

    /* Keep the menu beside the exact message button. */
    if(left < padding) left = padding;
    if(left + menuRect.width > window.innerWidth - padding){
      left = window.innerWidth - menuRect.width - padding;
    }

    /* If there is not enough room below, place it above the button. */
    if(top + menuRect.height > window.innerHeight - padding){
      top = anchorRect.top - menuRect.height - gap;
    }

    /* Final viewport safety. */
    if(top < padding) top = padding;
    if(top + menuRect.height > window.innerHeight - padding){
      top = window.innerHeight - menuRect.height - padding;
    }

    menu.style.left = Math.round(left) + "px";
    menu.style.top = Math.round(top) + "px";
    menu.style.right = "auto";
    menu.style.bottom = "auto";
  });
}

   CLOSE MENUS

function closeMenus(){

  /* Remove menus completely. Menus are inline with their message,
     so they can never become detached from the message while scrolling. */
  document
    .querySelectorAll(".message-menu,.reaction-picker")
    .forEach(element=>element.remove());

}

/* Close floating message controls when the user touches/clicks
   anywhere outside the control itself. Also close them on scroll
   so an old action menu can never appear over another message. */
document.addEventListener("pointerdown",event=>{
  const insideAction =
    event.target.closest?.(".message-menu,.message-menu-btn,.reaction-picker");

  if(!insideAction){
    closeMenus();
  }
});

messages.addEventListener("scroll",()=>{
  closeMenus();
},{passive:true});

window.addEventListener("scroll",()=>{
  closeMenus();
},{passive:true});

let activeEditCancel = null;
let activeEditBubble = null;

function closeActiveEdit(){
  if(typeof activeEditCancel === "function"){
    try{ activeEditCancel(true); }catch(error){ console.warn("Close edit:",error); }
  }

  activeEditCancel = null;
  activeEditBubble = null;

  /* Hard guarantee: only one editor can exist. */
  document.querySelectorAll(".message.editing").forEach(bubble=>{
    const row = bubble.closest("[data-message-id]");
    const id = row?.dataset?.messageId;
    const editor = bubble.querySelector(".edit-editor");
    const original = bubble.querySelector(".message-text");
    const actions = bubble.querySelector(".edit-actions");
    const latest = id ? messageCache.get(id) : null;

    if(editor && original){
      original.textContent = latest?.content ?? editor.value ?? "";
      editor.replaceWith(original);
    }else if(editor){
      editor.remove();
    }

    actions?.remove();
    bubble.classList.remove("editing");
  });

  /* Also remove any floating menu left by an earlier tap. */
  document.querySelectorAll(".message-menu").forEach(menu=>menu.remove());
}

function getLatestMessageForBubble(bubble){
  const id = bubble?.closest?.("[data-message-id]")?.dataset?.messageId;
  if(id){
    const cached = messageCache.get(id);
    if(cached) return {...cached};
  }

  const text = bubble?.querySelector?.(".message-text")?.textContent || "";
  return {
    id,
    content:text,
    sender_id:currentUser?.id || null
  };
}

async function editMessage(data,bubble){

  if(!bubble || !currentUser){
    return;
  }

  /* Always close every previous editor before opening a new one. */
  closeActiveEdit();

  const row = bubble.closest("[data-message-id]");
  const messageId = row?.dataset?.messageId || data?.id;
  if(!messageId || messageId.startsWith("local-")){
    return;
  }

  const latest = messageCache.get(messageId) || data || {};
  const originalContent = String(
    latest.content ?? bubble.querySelector(".message-text")?.textContent ?? ""
  );

  const oldText = bubble.querySelector(".message-text");
  if(!oldText){
    return;
  }

  bubble.classList.add("editing");
  activeEditBubble = bubble;

  const editor = document.createElement("textarea");
  editor.className = "edit-editor";
  editor.maxLength = 5000;
  editor.value = originalContent;
  editor.setAttribute("aria-label","Edit message");
  editor.spellcheck = true;

  const actions = document.createElement("div");
  actions.className = "edit-actions";

  const save = document.createElement("button");
  save.type = "button";
  save.className = "edit-action edit-save";
  save.textContent = "Save";

  const cancel = document.createElement("button");
  cancel.type = "button";
  cancel.className = "edit-action edit-cancel";
  cancel.textContent = "Cancel";

  actions.append(save,cancel);
  oldText.replaceWith(editor);
  bubble.appendChild(actions);

  let closed = false;
  let saving = false;

  function closeEditor(restore=true){
    if(closed) return;
    closed = true;

    if(editor.isConnected){
      /* ALWAYS put the message text node back. The previous version
         removed the textarea on Save without restoring this node,
         which made the message disappear. */
      if(oldText){
        const current = messageCache.get(messageId);
        oldText.textContent = current?.content ?? originalContent;
        editor.replaceWith(oldText);
      }else{
        editor.remove();
      }
    }

    if(actions.isConnected){
      actions.remove();
    }

    bubble.classList.remove("editing");

    if(activeEditCancel === closeEditor){
      activeEditCancel = null;
      activeEditBubble = null;
    }
  }

  activeEditCancel = closeEditor;

  cancel.onclick = ()=>closeEditor(true);

  editor.addEventListener("keydown",event=>{
    if(event.key === "Escape"){
      event.preventDefault();
      closeEditor(true);
      return;
    }

    if((event.ctrlKey || event.metaKey) && event.key === "Enter"){
      event.preventDefault();
      save.click();
    }
  });

  save.onclick = async ()=>{
    if(saving) return;

    /* Preserve the user's exact scroll position. Editing must never
       make the message appear to disappear or jump elsewhere. */
    const scrollTopBeforeSave = messages.scrollTop;
    const content = editor.value.trim();
    if(!content){
      showStatus("Message cannot be empty.");
      editor.focus();
      return;
    }

    /* Compare against the LIVE cached value. */
    const liveBeforeSave = messageCache.get(messageId)?.content ?? originalContent;
    if(content === liveBeforeSave){
      closeEditor(true);
      return;
    }

    saving = true;
    save.disabled = true;
    cancel.disabled = true;
    save.textContent = "Saving…";

    try{
      const {data:updated,error} = await supabaseClient
        .from("messages")
        .update({
          content,
          edited_at:new Date().toISOString()
        })
        .eq("id",messageId)
        .eq("sender_id",currentUser.id)
        .select("id,sender_id,content,created_at,edited_at,reply_to_id,conversation_id")
        .single();

      if(error) throw error;

      /* Make the NEW value authoritative everywhere. */
      messageCache.set(updated.id,{...updated});

      const liveRow = document.querySelector(
        `[data-message-id="${CSS.escape(updated.id)}"]`
      );

      if(liveRow){
        liveRow.dataset.messageContent = updated.content || "";
        const liveBubble = liveRow.querySelector(".message");
        const liveText = liveBubble?.querySelector(".message-text");
        if(liveText) liveText.textContent = updated.content || "";

        const time = liveBubble?.querySelector(".message-time");
        if(time){
          time.textContent = formatTime(updated.created_at) +
            (updated.edited_at ? " · edited" : "");
        }
      }

      /* Also update the object captured by the old menu. */
      if(data){
        Object.assign(data, updated);
      }

      closeEditor(false);

      requestAnimationFrame(()=>{
        messages.scrollTop = scrollTopBeforeSave;
      });

    }catch(error){
      console.error("Edit error:",error);
      saving = false;
      save.disabled = false;
      cancel.disabled = false;
      save.textContent = "Save";
      showStatus("Message could not be edited.");
      editor.focus();
    }
  };

  requestAnimationFrame(()=>{
    if(!editor.isConnected) return;
    editor.focus();
    editor.setSelectionRange(editor.value.length,editor.value.length);
  });
}

async function deleteMessage(

){

   LOAD MESSAGES
===================================================== */

async function loadMessages(){

  if(!currentConversationId){
    setEmptyChatState();
    return;
  }

  const {data,error} = await supabaseClient
    .from("messages")
    .select("id,sender_id,content,created_at,edited_at,reply_to_id,conversation_id")
    .eq("conversation_id",currentConversationId)
    .order("created_at",{ascending:true});

  if(error){
    console.error("Message load error:",error);
    throw error;
  }

  messages.innerHTML = "";

  messageCache.clear();

  if(!data || data.length === 0){
    messages.innerHTML = `
      <div class="welcome-message" id="welcomeMessage">
        <h3>Private conversation</h3>
        <p>Say hello to ${escapeHtml(currentConversationPartner?.name || "your new connection")}.</p>
      </div>
    `;
    return;
  }

  data.forEach(message=>messageCache.set(message.id,message));

  data.forEach(message=>addMessage(message,false));

  requestAnimationFrame(()=>{
    messages.scrollTop = messages.scrollHeight;
  });

  await loadAllReactions();
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/\"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* =====================================================
   CONVERSATION SYSTEM
===================================================== */

function normalizedId(value){
  return String(value || "").trim().toUpperCase();
}

function orderedPair(a,b){
  return String(a) < String(b) ? [a,b] : [b,a];
}

async function findUserByToTalkId(raw){
  const id = normalizedId(raw);
  if(!/^TT-[A-Z0-9]{6}$/.test(id)){
    throw new Error("Enter a valid ToTalk ID like TT-ABC123.");
  }

  const {data,error} = await supabaseClient
    .from("profiles")
    .select("id,user_id,name,totalk_id,profile_completed")
    .eq("totalk_id",id)
    .eq("profile_completed",true)
    .neq("user_id",currentUser.id)
    .maybeSingle();

  if(error) throw error;
  return data || null;
}

async function getOrCreateConversation(otherUserId){
  if(!currentUser?.id || !otherUserId){
    throw new Error("A valid user is required.");
  }

  /*
   * Your database uses:
   *   conversations
   *   conversation_participants
   *
   * It does NOT use user1_id/user2_id.
   * The RPC creates/fetches the conversation and adds both users.
   */
  const {data,error} = await supabaseClient
    .rpc("get_or_create_conversation",{
      other_user_id:otherUserId
    });

  if(error) throw error;

  if(!data){
    throw new Error("Conversation could not be created.");
  }

  const {data:conversation,error:conversationError} = await supabaseClient
    .from("conversations")
    .select("id,created_at,updated_at")
    .eq("id",data)
    .single();

  if(conversationError) throw conversationError;

  return conversation;
}

async function loadConversationList(){
  if(!conversationList || !currentUser?.id) return;

  /*
   * First find every conversation in which the current user
   * is a participant.
   */
  const {data:participantRows,error:participantError} = await supabaseClient
    .from("conversation_participants")
    .select("conversation_id,user_id")
    .eq("user_id",currentUser.id);

  if(participantError) throw participantError;

  const conversationIds = [
    ...new Set(
      (participantRows || [])
        .map(row=>row.conversation_id)
        .filter(Boolean)
    )
  ];

  if(!conversationIds.length){
    conversations = [];
    conversationList.innerHTML = `
      <div class="conversation-empty">
        <div class="empty-galaxy" aria-hidden="true">
          <span class="galaxy-star star-one">✦</span>
          <span class="galaxy-star star-two">·</span>
          <span class="galaxy-star star-three">✦</span>
          <span class="galaxy-orbit"></span>
          <span class="galaxy-moon">☾</span>
        </div>
        <strong>No conversations yet</strong>
        <span>Search a ToTalk ID above to start a private chat.</span>
      </div>
    `;
    return;
  }

  /* Load the actual conversation rows. */
  const {data:rows,error:conversationError} = await supabaseClient
    .from("conversations")
    .select("id,created_at,updated_at")
    .in("id",conversationIds)
    .order("updated_at",{ascending:false});

  if(conversationError) throw conversationError;

  let safeRows = rows || [];
  conversations = safeRows;

  if(!safeRows.length){
    conversationList.innerHTML = `
      <div class="conversation-empty">
        <div class="empty-galaxy" aria-hidden="true">
          <span class="galaxy-star star-one">✦</span>
          <span class="galaxy-star star-two">·</span>
          <span class="galaxy-star star-three">✦</span>
          <span class="galaxy-orbit"></span>
          <span class="galaxy-moon">☾</span>
        </div>
        <strong>No conversations yet</strong>
        <span>Search a ToTalk ID above to start a private chat.</span>
      </div>
    `;
    return;
  }

  /*
   * Get all participants for these conversations so we can
   * determine the other person in each 1-to-1 chat.
   */
  const {data:allParticipants,error:allParticipantsError} = await supabaseClient
    .from("conversation_participants")
    .select("conversation_id,user_id")
    .in("conversation_id",conversationIds);

  if(allParticipantsError) throw allParticipantsError;

  const partnerMap = new Map();

  for(const participant of (allParticipants || [])){
    if(participant.user_id !== currentUser.id){
      partnerMap.set(
        participant.conversation_id,
        participant.user_id
      );

  const partnerIds = [
    ...new Set(
      [...partnerMap.values()].filter(Boolean)
    )
  ];

  let profileMap = new Map();

  if(partnerIds.length){
    const {data:profiles,error:profileError} = await supabaseClient
      .from("profiles")
      .select("user_id,name,totalk_id,profile_completed")
      .in("user_id",partnerIds);

    if(profileError) throw profileError;

    profileMap = new Map(
      (profiles || []).map(profile=>[
        profile.user_id,
        profile
      ])
    );
  }

  /* Latest message for each conversation. */
  const latestMap = new Map();

  const {data:latestMessages,error:latestError} = await supabaseClient
    .from("messages")
    .select("conversation_id,sender_id,content,created_at")
    .in("conversation_id",conversationIds)
    .order("created_at",{ascending:false})
    .limit(500);

  if(!latestError){
    for(const item of (latestMessages || [])){
      if(!latestMap.has(item.conversation_id)){
        latestMap.set(item.conversation_id,item);
      }
    }
  }

  const unreadMap = new Map();
  for(const item of (latestMessages || [])){
    if(item.sender_id && item.sender_id !== currentUser.id){
      unreadMap.set(item.conversation_id,(unreadMap.get(item.conversation_id) || 0) + 1);
    }
  }

  conversationList.innerHTML = "";

  const prefs = readConversationPrefs();
  safeRows = safeRows.filter(row=>!prefs[row.id]?.deleted);
  safeRows.sort((a,b)=>Number(!!prefs[b.id]?.pinned)-Number(!!prefs[a.id]?.pinned));

  safeRows.forEach(row=>{
    const partnerId = partnerMap.get(row.id);
    const partner = partnerId
      ? profileMap.get(partnerId)
      : null;

    if(!partner) return;

    const item = document.createElement("button");
    item.type = "button";
    const pref = prefs[row.id] || {};
    item.className =
      "conversation-item" +
      (row.id === currentConversationId ? " active" : "") +
      (pref.muted ? " is-muted" : "") +
      (pref.unread ? " is-unread" : "");
    item.dataset.conversationId = row.id;

    const name = partner.name || "ToTalk User";
    const first =
      name.trim().charAt(0).toUpperCase() || "T";
    const latest = latestMap.get(row.id);

    const isOnline = onlineUserIds.has(partner.user_id);
    const unreadCount = unreadMap.get(row.id) || 0;

    item.innerHTML = `
      <span class="conversation-avatar-wrap">
        <span class="mini-avatar">${escapeHtml(first)}</span>
        <span class="presence-avatar-icon ${isOnline ? "online" : "offline"}" aria-label="${isOnline ? "Online" : "Offline"}">${isOnline ? "🌙" : "☀️"}</span>
      </span>
      <span class="conversation-copy">
        <span class="conversation-top">
          <span class="conversation-name">${escapeHtml(name)}${pref.pinned ? `<span class="conversation-pin">📌</span>` : ""}</span>
          <span class="conversation-time">${latest ? escapeHtml(formatTime(latest.created_at)) : ""}</span>
        </span>
        <span class="conversation-preview">${escapeHtml(latest?.content || "No messages yet")}</span>
      </span>
      ${unreadCount ? `<span class="unread-badge">${unreadCount > 99 ? "99+" : unreadCount}</span>` : ""}
    `;

    item.addEventListener("click",()=>openConversation(row,partner));
    item.addEventListener("contextmenu",event=>{event.preventDefault();openConversationOptions(row,partner);});
    let pressTimer=null;
    item.addEventListener("pointerdown",()=>{pressTimer=setTimeout(()=>openConversationOptions(row,partner),550);});
    ["pointerup","pointerleave","pointercancel"].forEach(type=>item.addEventListener(type,()=>clearTimeout(pressTimer)));

    conversationList.appendChild(item);
  });

  if(!conversationList.children.length){
    conversationList.innerHTML = `
      <div class="conversation-empty">
        <div class="empty-galaxy" aria-hidden="true">
          <span class="galaxy-star star-one">✦</span>
          <span class="galaxy-star star-two">·</span>
          <span class="galaxy-star star-three">✦</span>
          <span class="galaxy-orbit"></span>
          <span class="galaxy-moon">☾</span>
        </div>
        <strong>No conversations yet</strong>
        <span>Search a ToTalk ID above to start a private chat.</span>
      </div>
    `;
  }
}

async function openConversation(row,partner){
  if(!row?.id || !partner) return;

  currentConversationId = row.id;
  currentConversationPartner = partner;
  const openPrefs=readConversationPrefs();
  if(openPrefs[row.id]){openPrefs[row.id].unread=false;writeConversationPrefs(openPrefs);}

  document.querySelectorAll(".conversation-item").forEach(item=>{
    item.classList.toggle("active",item.dataset.conversationId === row.id);
  });

  renderActivePartner();
  showLoading("ToTalk",`Opening ${partner.name || "conversation"}…`);

  try{
    closeMenus();
    closeActiveEdit();
    clearReplyTarget();
    await loadMessages();
    if(isMobileLayout()) openMobileConversation();
  }catch(error){
    console.error("Conversation open error:",error);
    showStatus("This conversation could not be opened.");
  }finally{
    finishLoading();
  }
}

async function startConversationWithUser(partner){
  if(!partner || partner.user_id === currentUser.id) return;

  showLoading("ToTalk",`Opening ${partner.name || "conversation"}…`);

  try{
    const row = await getOrCreateConversation(partner.user_id);
    await loadConversationList();
    await openConversation(row,partner);
  }catch(error){
    console.error("Start conversation error:",error);
    showStatus(error.message || "Could not start the conversation.");
    finishLoading();
  }
}
