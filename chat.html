
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020108">
<title>ToTalk Sameer</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --black:#020108;
  --dark:#070313;
  --panel:#090517;
  --panel2:#0d071b;
  --purple:#914cff;
  --purple2:#aa69ff;
  --purple3:#6324ca;
  --white:#f8f5ff;
  --muted:#928ba8;
  --green:#52e69a;
  --yellow:#ffe34f;
  --border:rgba(145,76,255,.40);
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020108;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--white);
  background:
    radial-gradient(ellipse at 70% 25%,rgba(111,36,191,.25),transparent 32%),
    radial-gradient(ellipse at 15% 85%,rgba(81,29,160,.20),transparent 30%),
    linear-gradient(135deg,#020108,#070313 50%,#020108);
}

/* =====================================================
   BACKGROUND STARS
===================================================== */

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  opacity:.72;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.9) 1px,transparent 1.5px),
    radial-gradient(circle,rgba(210,190,255,.8) 1px,transparent 1.5px),
    radial-gradient(circle,rgba(255,255,255,.65) 1px,transparent 1.5px);
  background-size:115px 115px,175px 175px,245px 245px;
  background-position:15px 25px,70px 90px,130px 45px;
}

/* =====================================================
   PREMIUM TO TALK LOADING
===================================================== */

#loading{
  position:fixed;
  inset:0;
  z-index:999999;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 46%,rgba(118,76,255,.13),transparent 27%),
    radial-gradient(circle at 18% 76%,rgba(70,50,180,.10),transparent 32%),
    #03030b;
  opacity:1;
  visibility:visible;
  transition:opacity .42s ease,visibility .42s ease;
}

#loading.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.loading-stars{
  position:absolute;
  inset:0;
  opacity:.48;
  background-image:
    radial-gradient(circle at 9% 18%,#fff 0 1px,transparent 1.7px),
    radial-gradient(circle at 21% 66%,#b997ff 0 1px,transparent 1.7px),
    radial-gradient(circle at 34% 24%,#fff 0 1px,transparent 1.7px),
    radial-gradient(circle at 48% 78%,#fff 0 1px,transparent 1.7px),
    radial-gradient(circle at 62% 15%,#b997ff 0 1px,transparent 1.7px),
    radial-gradient(circle at 76% 57%,#fff 0 1px,transparent 1.7px),
    radial-gradient(circle at 91% 28%,#fff 0 1px,transparent 1.7px);
}

.loading-nebula{
  position:absolute;
  width:360px;
  height:360px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(125,76,255,.15),rgba(76,42,180,.045) 48%,transparent 70%);
  filter:blur(20px);
  animation:nebulaPulse 5s ease-in-out infinite;
}

.loading-system{
  position:absolute;
  width:118px;
  height:118px;
  top:calc(50% - 104px);
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  justify-content:center;
}

.loading-orbit{
  position:absolute;
  width:112px;
  height:42px;
  border:1px solid rgba(170,130,255,.28);
  border-radius:50%;
  transform:rotate(-17deg);
  box-shadow:0 0 22px rgba(123,72,255,.10);
  animation:orbitOne 7s linear infinite;
}

.loading-orbit.two{
  width:102px;
  height:38px;
  transform:rotate(38deg);
  border-color:rgba(145,95,255,.18);
  animation:orbitTwo 9s linear infinite reverse;
}

.loading-moon{
  width:54px;
  height:54px;
  border-radius:50%;
  position:relative;
  background:radial-gradient(circle at 32% 27%,#fff,#eeeaff 55%,#d2cbe7 100%);
  box-shadow:0 0 14px rgba(255,255,255,.25),0 0 42px rgba(127,72,255,.30);
  animation:moonFloat 4s ease-in-out infinite;
}

.loading-moon:before,.loading-moon:after{
  content:"";
  position:absolute;
  border-radius:50%;
  background:rgba(130,120,160,.16);
}

.loading-moon:before{width:9px;height:9px;left:14px;top:17px}
.loading-moon:after{width:13px;height:13px;right:11px;top:25px}

.loading-title{
  position:absolute;
  top:calc(50% + 8px);
  left:0;
  right:0;
  font-size:25px;
  line-height:1.1;
  font-weight:800;
  letter-spacing:-.5px;
  text-align:center;
}

.loading-subtitle{
  position:absolute;
  top:calc(50% + 46px);
  left:0;
  right:0;
  color:#9e98b0;
  font-size:13px;
  text-align:center;
}

.loading-dots{
  position:absolute;
  top:calc(50% + 78px);
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:7px;
}

.loading-dots span{
  width:5px;
  height:5px;
  border-radius:50%;
  background:#bda7ff;
  animation:dot 1.25s ease-in-out infinite;
}

.loading-dots span:nth-child(2){animation-delay:.16s}
.loading-dots span:nth-child(3){animation-delay:.32s}

@keyframes dot{
  0%,100%{transform:scale(.72);opacity:.28}
  50%{transform:scale(1);opacity:.9}
}

@keyframes moonFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-3px)}
}

@media(max-width:600px){
  .loading-system{top:calc(50% - 96px)}
  .loading-title{top:calc(50% + 6px);font-size:24px}
  .loading-subtitle{top:calc(50% + 43px)}
  .loading-dots{top:calc(50% + 74px)}
}

/* =====================================================
   STATUS
===================================================== */

#status{
  position:fixed;
  left:50%;
  bottom:78px;
  z-index:999999;
  transform:translateX(-50%) translateY(10px);
  opacity:0;
  pointer-events:none;
  padding:9px 14px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#110820;
  color:#ddd4ee;
  font-size:11px;
  transition:.25s ease;
}

#status.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* =====================================================
   ERROR
===================================================== */

.login-error{
  position:relative;
  z-index:5;
  width:min(90%,420px);
  padding:30px;
  border:1px solid var(--border);
  border-radius:20px;
  background:rgba(10,5,22,.92);
  text-align:center;
}

.login-error h2{
  margin-bottom:10px;
}

.login-error p{
  color:#9b94aa;
  font-size:13px;
  line-height:1.5;
  margin-bottom:20px;
}

.back-button{
  display:inline-block;
  padding:10px 18px;
  border-radius:10px;
  background:linear-gradient(135deg,#914cff,#aa69ff);
  color:#fff;
  text-decoration:none;
  font-size:12px;
  font-weight:800;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:800px){

  header{
    height:62px;
    padding:0 13px;
  }

  .brand{
    font-size:20px;
  }

  #userName{
    display:none;
  }

  #logoutBtn{
    padding:7px 11px;
    font-size:10px;
  }

  .chat-layout{
    height:calc(100dvh - 62px);
    padding:7px;
    display:block;
  }

  .sidebar{
    display:none;
  }

  .chat-box{
    width:100%;
    height:100%;
    border-radius:11px;
  }

  .chat-top{
    height:62px;
    padding:9px 11px;
  }

  .chat-avatar{
    width:38px;
    height:38px;
    flex-basis:38px;
  }

  .chat-title{
    font-size:13px;
  }

  .star-btn{
    font-size:20px;
  }

  #messages{
    inset:62px 0 0;
    padding:16px 11px 95px;
  }

  .message{
    max-width:84%;
    padding:10px 11px 7px;
  }

  .message-text{
    font-size:13px;
  }

  .input-area{
    left:7px;
    right:7px;
    bottom:7px;
  }

  #messageInput{
    font-size:13px;
  }

  #sendButton{
    min-width:62px;
  }

  .chat-moon{
    left:30px;
    top:23px;
    width:57px;
    height:57px;
  }

  .chat-moon:after{
    width:57px;
    height:57px;
    left:17px;
  }

  .chat-planet{
    right:17px;
    top:48px;
    width:70px;
    height:70px;
  }

  .chat-planet:after{
    width:115px;
    left:-23px;
    top:21px;
  }

  .nebula{
    width:260px;
    height:190px;
    top:75px;
  }

  .loading-system{
    width:260px;
    height:225px;
  }

  .loading-orbit{
    width:220px;
    height:80px;
  }

  .loading-orbit.two{
    width:240px;
    height:93px;
  }

  .loading-moon{
    width:88px;
    height:88px;
  }

  .loading-title{
    font-size:21px;
  }

  .loading-subtitle{
    font-size:12px;
  }
}

@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation:none!important;
    transition:none!important;
    scroll-behavior:auto!important;
  }
}


/* =====================================================
   TOTAlK PROFILE VISUAL LANGUAGE — CHAT MATCH
   Keep the chat functional, but make it feel like the
   next room of the same ToTalk experience.
===================================================== */
:root{
  --profile-purple:#8f61ff;
  --profile-purple-soft:#b99aff;
  --profile-bg:#03020b;
  --profile-panel:rgba(16,11,35,.88);
  --profile-border:rgba(255,255,255,.14);
  --profile-muted:#8f899f;
}

html,body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 20% 20%,rgba(130,65,255,.18),transparent 35%),
    radial-gradient(circle at 80% 70%,rgba(64,110,255,.12),transparent 35%),
    linear-gradient(135deg,#03020b 0%,#09051b 48%,#02030c 100%);
}

body:before{
  opacity:.8;
  background-image:
    radial-gradient(2px 2px at 12% 18%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 28% 72%,#fff,transparent),
    radial-gradient(2px 2px at 46% 24%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 64% 78%,#fff,transparent),
    radial-gradient(2px 2px at 82% 20%,#fff,transparent),
    radial-gradient(1px 1px at 91% 62%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 38% 48%,#fff,transparent);
}

header{
  height:76px;
  padding:0 30px;
  background:rgba(3,2,11,.68);
  border-bottom:1px solid rgba(255,255,255,.10);
  box-shadow:0 10px 45px rgba(40,15,90,.12);
  backdrop-filter:blur(18px);
}

.brand{
  font-size:18px;
  letter-spacing:-.5px;
}

.brand-main{color:#fff;}
.brand-name{color:var(--profile-purple);}

#userName{
  color:#8f899f;
  font-size:12px;
  font-weight:600;
}

#logoutBtn{
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.035);
  color:#d8d2e4;
  padding:9px 15px;
  border-radius:12px;
  font-size:11px;
  font-weight:700;
  transition:.2s ease;
}

#logoutBtn:hover:not(:disabled){
  border-color:rgba(167,124,255,.55);
  background:rgba(120,75,255,.10);
}

.chat-layout{
  height:calc(100dvh - 76px);
  padding:24px 30px 30px;
  grid-template-columns:275px minmax(0,1fr);
  gap:22px;
}

.sidebar,
.chat-box{
  border:1px solid var(--profile-border);
  border-radius:26px;
  background:linear-gradient(180deg,rgba(16,11,35,.88),rgba(8,6,21,.93));
  backdrop-filter:blur(18px);
  box-shadow:0 30px 90px rgba(0,0,0,.38),0 0 80px rgba(91,47,255,.10);
}

.sidebar{
  box-shadow:0 24px 65px rgba(0,0,0,.30),0 0 50px rgba(91,47,255,.08);
}

.sidebar-title{
  padding:24px 22px 19px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.sidebar-title h2{
  font-size:17px;
  letter-spacing:-.3px;
}

.sidebar-title p{
  color:#77718a;
  font-size:10px;
}

.chat-person{
  margin:18px 16px;
  padding:13px;
  border:1px solid rgba(167,124,255,.25);
  border-radius:15px;
  background:rgba(120,75,255,.07);
}

.avatar,.chat-avatar{
  background:linear-gradient(145deg,#a884ff,#6040d8);
  box-shadow:0 0 24px rgba(143,97,255,.25);
}

.person-name{font-size:13px;}

.presence,
.chat-status{
  color:#9e8bc7;
}

.presence-dot{
  background:#65e5a0;
  box-shadow:0 0 9px rgba(82,230,154,.55);
}

.chat-box{
  box-shadow:0 30px 90px rgba(0,0,0,.45),0 0 80px rgba(91,47,255,.11);
}

.chat-top{
  height:72px;
  padding:11px 20px;
  border-bottom:1px solid rgba(255,255,255,.09);
  background:rgba(16,11,35,.42);
  backdrop-filter:blur(16px);
}

.chat-title{
  font-size:14px;
  letter-spacing:-.2px;
}

.chat-actions{gap:14px;}

.search-btn,.star-btn{
  color:#bcb4cc;
  transition:.2s ease;
}

.search-btn:hover,.star-btn:hover{
  color:#c7aaff;
  transform:translateY(-1px);
}

#messages{
  inset:72px 0 0;
  padding:25px 26px 108px;
}

.chat-space{inset:72px 0 0;}

/* Replace the older yellow/blue decorative planets with the
   same soft moon + orbit language used on profile setup. */
.chat-moon{
  left:75px;
  top:48px;
  width:150px;
  height:150px;
  background:
    radial-gradient(circle at 31% 27%,rgba(255,255,255,.98),transparent 16%),
    radial-gradient(circle at 67% 61%,rgba(115,111,132,.20) 0 12px,transparent 13px),
    radial-gradient(circle at 39% 66%,rgba(115,111,132,.17) 0 10px,transparent 11px),
    linear-gradient(145deg,#ffffff 0%,#eeeefa 34%,#d4d1df 62%,#aaa6b8 82%,#807b8d 100%);
  box-shadow:
    inset -15px -13px 27px rgba(35,31,54,.20),
    inset 11px 10px 20px rgba(255,255,255,.60),
    0 0 35px rgba(205,190,255,.48),
    0 0 100px rgba(107,60,255,.24);
  opacity:.68;
  animation:chatMoonFloat 5s ease-in-out infinite;
}

.chat-moon:after{
  display:none;
}

.chat-space:after{
  content:"";
  position:absolute;
  left:25px;
  top:104px;
  width:280px;
  height:82px;
  border:1px solid rgba(155,113,255,.22);
  border-radius:50%;
  transform:rotate(-7deg);
  box-shadow:0 0 28px rgba(112,67,255,.08);
}

.chat-planet{
  right:70px;
  top:70px;
  width:110px;
  height:110px;
  background:
    radial-gradient(circle at 30% 27%,rgba(255,255,255,.78),transparent 17%),
    linear-gradient(145deg,#eeeefa 0%,#b8b3c4 50%,#6d6878 100%);
  box-shadow:0 0 35px rgba(192,164,255,.20),0 0 80px rgba(100,55,255,.12);
  opacity:.22;
}

.chat-planet:after{
  width:165px;
  height:46px;
  left:-28px;
  top:31px;
  border-color:rgba(173,135,255,.25);
}

.nebula{
  width:520px;
  height:330px;
  top:120px;
  background:radial-gradient(circle,rgba(115,39,190,.17),transparent 68%);
}

.welcome-message h3{
  font-size:21px;
  letter-spacing:-.5px;
}

.welcome-message p{
  color:#77718a;
  font-size:12px;
  line-height:1.6;
}

.message-row{margin-bottom:14px;}

.message{
  max-width:min(68%,560px);
  padding:12px 14px 9px;
  border:1px solid rgba(255,255,255,.10);
  border-radius:17px 17px 17px 5px;
  background:linear-gradient(180deg,rgba(16,11,35,.92),rgba(8,6,21,.94));
  box-shadow:0 12px 30px rgba(0,0,0,.20);
}

.mine .message{
  border-radius:17px 17px 5px 17px;
  border-color:rgba(184,143,255,.36);
  background:linear-gradient(145deg,#6040d8,#8b5cff);
  box-shadow:0 12px 35px rgba(91,47,255,.16);
}

.message-text{font-size:13px;}

.reply-preview{
  border-left-color:#a783ff;
  background:rgba(255,255,255,.055);
}

.reply-name{color:#c8b4ff;}

.message-menu,
.reaction-picker,
.search-panel{
  border-color:rgba(255,255,255,.12);
  border-radius:15px;
  background:rgba(16,11,35,.96);
  box-shadow:0 25px 60px rgba(0,0,0,.42);
  backdrop-filter:blur(18px);
}

.message-menu button:hover,
.reaction-picker button:hover{
  background:rgba(120,75,255,.10);
}

.input-area{
  left:18px;
  right:18px;
  bottom:16px;
  padding:8px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:17px;
  background:rgba(16,11,35,.88);
  box-shadow:0 18px 45px rgba(0,0,0,.35);
  backdrop-filter:blur(18px);
}

#messageInput{
  height:42px;
  padding:11px 10px;
  font-size:13px;
}

#sendButton{
  min-width:76px;
  border-radius:13px;
  background:linear-gradient(135deg,#8b5cff,#6040d8);
  box-shadow:0 10px 25px rgba(105,65,230,.22);
}

.search-panel{
  top:77px;
  right:18px;
  background:rgba(16,11,35,.96);
}

#searchInput{
  border-color:rgba(255,255,255,.10);
  border-radius:10px;
  background:rgba(255,255,255,.035);
}

.search-panel button{
  border-color:rgba(255,255,255,.10);
  border-radius:10px;
  background:rgba(255,255,255,.035);
}

#status{
  border-color:rgba(255,255,255,.12);
  border-radius:13px;
  background:rgba(16,11,35,.94);
  box-shadow:0 15px 35px rgba(0,0,0,.32);
  backdrop-filter:blur(18px);
}

.login-error{
  border-color:rgba(255,255,255,.14);
  border-radius:26px;
  background:linear-gradient(180deg,rgba(16,11,35,.91),rgba(8,6,21,.94));
  backdrop-filter:blur(18px);
  box-shadow:0 30px 90px rgba(0,0,0,.52),0 0 80px rgba(91,47,255,.14);
}

.back-button{
  border-radius:14px;
  background:linear-gradient(135deg,#8b5cff,#6040d8);
}

@keyframes chatMoonFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

@media(max-width:800px){
  header{height:62px;padding:0 15px;}
  .chat-layout{height:calc(100dvh - 62px);padding:8px;}
  .chat-box{border-radius:22px;}
  .chat-top{height:64px;}
  #messages{inset:64px 0 0;padding:17px 12px 100px;}
  .chat-space{inset:64px 0 0;}
  .chat-moon{left:28px;top:32px;width:105px;height:105px;}
  .chat-space:after{left:0;top:72px;width:205px;height:60px;}
  .chat-planet{right:20px;top:45px;width:75px;height:75px;}
  .input-area{left:10px;right:10px;bottom:10px;border-radius:15px;}
}

</style>
</head>

<body>

<!-- =====================================================
     GALAXY LOADING
===================================================== -->

<div id="loading">

  <div class="loading-stars"></div>
  <div class="loading-nebula"></div>

  <div class="loading-system">
    <div class="loading-orbit"></div>
    <div class="loading-orbit two"></div>
    <div class="loading-moon"></div>
  </div>

  <div class="loading-title" id="loadingTitle">
    ToTalk
  </div>

  <div class="loading-subtitle" id="loadingSubtitle">
    Connecting…
  </div>

  <div class="loading-dots">
    <span></span>
    <span></span>
    <span></span>
  </div>

</div>

<!-- =====================================================
     HEADER
===================================================== -->

<header>

  <div class="brand">
    <span class="brand-main">ToTalk</span>
    <span class="brand-name" id="brandName">Sameer</span>
  </div>

  <div class="header-right">

    <div id="userName">
      Loading...
    </div>

    <button id="logoutBtn">
      Logout
    </button>

  </div>

</header>

<!-- =====================================================
     MAIN CHAT
===================================================== -->

<main class="chat-layout">

  <aside class="sidebar">

    <div class="sidebar-title">
      <h2 id="sideTitle">Sameer's Chats</h2>
      <p>Your personal conversation space</p>
    </div>

    <div class="chat-person">

      <div class="avatar" id="sideAvatar">
        S
      </div>

      <div>

        <div class="person-name" id="sideName">
          Sameer
        </div>

        <div class="presence">
          <span class="presence-dot"></span>
          <span id="sidePresence">
            Online
          </span>
        </div>

      </div>

    </div>

  </aside>

  <section class="chat-box">

    <div class="chat-top">

      <div class="chat-avatar" id="chatAvatar">
        S
      </div>

      <div>

        <div class="chat-title" id="chatTitle">
          Sameer's ToTalk
        </div>

        <div class="chat-status">

/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(value){

  if(!value){
    return "";
  }

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){
    return "";
  }

  return date.toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}

function addMessage(data,animate=true){

  if(!data?.id){
    return;

  if(
    document.querySelector(
      `[data-message-id="${data.id}"]`
    )
  ){
    return;

  const welcome =
    document.getElementById(
      "welcomeMessage"
    );

  if(welcome){
    welcome.remove();
  }

  messageCache.set(
    data.id,
    data
  );

  const mine =
    currentUser &&
    data.sender_id ===
      currentUser.id;

  const row =
    document.createElement("div");

  row.className =
    "message-row" +
    (mine ? " mine" : "");

  row.dataset.messageId =
    data.id;

  const bubble =
    document.createElement("div");

  bubble.className =
    "message";

  if(!animate){

    bubble.style.animation =
      "none";

  }

  /* Reply preview */

  if(data.reply_to_id){

    const replied =
      messageCache.get(
        data.reply_to_id
      );

    if(replied){

      const reply =
        document.createElement("div");

      reply.className =
        "reply-preview";

      const replyName =
        document.createElement("div");

      replyName.className =
        "reply-name";

      replyName.textContent =
        replied.sender_id === currentUser.id
          ? "You"
          : "Message";

      const replyText =
        document.createElement("div");

      replyText.className =
        "reply-text";

      replyText.textContent =
        replied.content || "";

      reply.append(
        replyName,
        replyText
      );

      bubble.appendChild(
        reply
      );

    }

  }

  const text =
    document.createElement("div");

  text.className =
    "message-text";

  text.textContent =
    data.content || "";

  bubble.appendChild(
    text
  );

  const time =
    document.createElement("span");

  time.className =
    "message-time";

  time.textContent =
    formatTime(
      data.created_at
    );

  if(data.edited_at){

    time.textContent +=
      " · edited";

  }

  bubble.appendChild(
    time
  );

  /* Sent / Delivered / Seen */

  if(mine){

    const status =
      document.createElement("span");

    status.className =
      "message-status";

    status.dataset.status =
      "true";

    status.textContent =
      "Sent";

    bubble.appendChild(
      status
    );

  }

  /* Own-message menu */

  if(mine){

    const menuButton =
      document.createElement("button");

    menuButton.className =
      "message-menu-btn";

    menuButton.type =
      "button";

    menuButton.textContent =
      "⋮";

    menuButton.addEventListener(
      "click",
      event=>{

        event.stopPropagation();

        closeMenus();

        const menu =
          createMessageMenu(
            data,
            bubble
          );

        document.body.appendChild(
          menu
        );

        const rect =
          bubble.getBoundingClientRect();

        menu.style.left =
          Math.max(
            8,
            Math.min(
              rect.right - 130,
              window.innerWidth - 138
            )
          ) + "px";

        menu.style.top =
          Math.min(
            window.innerHeight - 120,
            rect.bottom + 7
          ) + "px";

        menu.classList.add(
          "open"
        );

      }
    );

    bubble.appendChild(
      menuButton
    );

  }

  /* Reaction picker */

  const picker =
    createReactionPicker(
      data,
      bubble
    );

  row.appendChild(
    bubble
  );

    row

/* =====================================================
   REACTION PICKER
===================================================== */

function createReactionPicker(
  data,
  bubble
){

  const picker =
    document.createElement("div");

  picker.className =
    "reaction-picker";

  const reply =
    document.createElement("button");

  reply.className =
    "reply-picker";

  reply.textContent =
    "Reply";

  reply.addEventListener(
    "click",
    event=>{

      event.stopPropagation();

      picker.classList.remove(
        "open"
      );

      setReplyTarget(
        data
      );

    }
  );

  picker.appendChild(
    reply
  );

  REACTIONS.forEach(
    reaction=>{

      const button =
        document.createElement("button");

      button.type =
        "button";

      button.textContent =
        reaction;

      button.addEventListener(
        "click",
        async event=>{

          event.stopPropagation();

          picker.classList.remove(
            "open"
          );

          await toggleReaction(
            data.id,
            reaction,
            bubble
          );

        }
      );

      picker.appendChild(
        button
      );

    }
  );

  /* Long press */

  let timer = null;

  bubble.addEventListener(
    "touchstart",
    event=>{

      if(
        event.touches.length !== 1
      ){
        return;
      }

      timer =
        setTimeout(()=>{

          closeMenus();

          const rect =
            bubble.getBoundingClientRect();

          document.body.appendChild(
            picker
          );

          picker.style.left =
            Math.max(
              8,
              Math.min(
                rect.left,
                window.innerWidth - 250
              )
            ) + "px";

          picker.style.top =
            Math.max(
              8,
              rect.top - 55
            ) + "px";

          picker.classList.add(
            "open"
          );

        },520);

    },
    {
      passive:true
    }
  );

  bubble.addEventListener(
    "touchend",
    ()=>{

      clearTimeout(timer);

    },
    {
      passive:true
    }
  );

  bubble.addEventListener(
    "touchmove",
    ()=>{

      clearTimeout(timer);

    },
    {
      passive:true
    }
  );

  return picker;

}

/* =====================================================
   REACTION SAVE
===================================================== */

async function toggleReaction(
  messageId,
  reaction,
  bubble
){

  if(!currentUser){
    return;
  }

  try{

    const {
      data:existing,
      error:readError
    } =
      await supabaseClient
        .from("message_reactions")
        .select(
          "user_id,reaction"
        )
        .eq(
          "message_id",
          messageId
        )
        .eq(
          "user_id",
          currentUser.id
        )
        .maybeSingle();

    if(readError){
      throw readError;
    }

    if(
      existing &&
      existing.reaction === reaction
    ){

      const {
        error
      } =
        await supabaseClient
          .from("message_reactions")
          .delete()
          .eq(
            "message_id",
            messageId
          )
          .eq(
            "user_id",
            currentUser.id
          );

      if(error){
        throw error;
      }

    }else{

      await supabaseClient
        .from("message_reactions")
        .delete()
        .eq(
          "message_id",
          messageId
        )
        .eq(
          "user_id",
          currentUser.id
        );

      const {
        error
      } =
        await supabaseClient
          .from("message_reactions")
          .insert({
            message_id:messageId,
            user_id:currentUser.id,
            reaction:reaction
          });

      if(error){
        throw error;
      }

    }

    await refreshReaction(
      messageId,
      bubble
    );

  }catch(error){

    console.error(
      "Reaction error:",
      error
    );

    showStatus(
      "Reaction could not be changed."
    );

  }

}

/* =====================================================
   REACTION DISPLAY
===================================================== */

async function refreshReaction(
  messageId,
  bubble
){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("message_reactions")
      .select(
        "user_id,reaction"
      )
      .eq(
        "message_id",
        messageId
      );

  if(error){
    return;
  }

  const old =
    bubble.querySelector(
      ".reaction-summary"
    );

  if(old){
    old.remove();
  }

  if(!data?.length){
    return;
  }

  const summary =
    document.createElement("div");

  summary.className =
    "reaction-summary";

  const counts = {};

  data.forEach(
    item=>{

      counts[item.reaction] =
        (counts[item.reaction] || 0) + 1;

    }
  );

  Object.entries(
    counts
  ).forEach(
    ([reaction,count])=>{

      const chip =
        document.createElement("span");

      chip.className =
        "reaction-chip";

      chip.textContent =
        reaction + " " + count;

      summary.appendChild(
        chip
      );

    }
  );

  bubble.appendChild(
    summary
  );

}

/* =====================================================
   LOAD REACTIONS
===================================================== */

async function loadAllReactions(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("message_reactions")
      .select(
        "message_id,user_id,reaction"
      );

  if(error){
    console.error(
      "Reaction load error:",
      error
    );
    return;
  }

  const grouped = {};

  (data || []).forEach(
    item=>{

      if(
        !grouped[item.message_id]
      ){
        grouped[item.message_id] =
          [];
      }

      grouped[
        item.message_id
      ].push(item);

    }
  );

  Object.entries(
    grouped
  ).forEach(
    ([id,reactions])=>{

      const row =
        document.querySelector(
          `[data-message-id="${id}"]`
        );

      const bubble =
        row?.querySelector(
          ".message"
        );

      if(!bubble){
        return;
      }

      const old =
        bubble.querySelector(
          ".reaction-summary"
        );

      if(old){
        old.remove();
      }

      const summary =
        document.createElement(
          "div"
        );

      summary.className =
        "reaction-summary";

      const counts = {};

      reactions.forEach(
        item=>{

          counts[item.reaction] =
            (counts[item.reaction] || 0) + 1;

        }
      );

      Object.entries(
        counts
      ).forEach(
        ([reaction,count])=>{

          const chip =
            document.createElement(
              "span"
            );

          chip.className =
            "reaction-chip";

          chip.textContent =
            reaction + " " + count;

          summary.appendChild(
            chip
          );

        }
      );

      bubble.appendChild(
        summary
      );

    }
  );

}

function createMessageMenu(

  const menu =

/* =====================================================
   EDIT MESSAGE
===================================================== */

async function editMessage(
  data,
  bubble
){

  const oldText =
    bubble.querySelector(
      ".message-text"
    );

  if(!oldText){
    return;
  }

  if(
    bubble.classList.contains(
      "editing"
    )
  ){
    return;
  }

  bubble.classList.add(
    "editing"
  );

  const editor =
    document.createElement(
      "textarea"
    );

  editor.value =
    data.content || "";

  editor.maxLength =
    5000;

  editor.style.width =
    "100%";

  editor.style.minHeight =
    "65px";

  editor.style.border =
    "1px solid rgba(255,255,255,.2)";

  editor.style.borderRadius =
    "8px";

  editor.style.padding =
    "8px";

  editor.style.background =
    "rgba(0,0,0,.2)";

  editor.style.color =
    "#fff";

  editor.style.outline =
    "none";

  oldText.replaceWith(
    editor
  );

  const actions =
    document.createElement(
      "div"
    );

  actions.style.display =
    "flex";

  actions.style.gap =
    "6px";

  actions.style.marginTop =
    "6px";

  const save =
    document.createElement(
      "button"
    );

  save.textContent =
    "Save";

  const cancel =
    document.createElement(
      "button"
    );

  cancel.textContent =
    "Cancel";

  [save,cancel].forEach(
    button=>{

      button.style.border =
        "0";

      button.style.borderRadius =
        "7px";

      button.style.padding =
        "6px 9px";

      button.style.cursor =
        "pointer";

    }
  );

  actions.append(
    save,
    cancel
  );

  bubble.appendChild(
    actions
  );

  cancel.onclick =
    ()=>{

      editor.replaceWith(
        oldText
      );

      actions.remove();

      bubble.classList.remove(
        "editing"
      );

    };

  save.onclick =
    async ()=>{

      const content =
        editor.value.trim();

      if(!content){
        showStatus(
          "Message cannot be empty."
        );
        return;
      }

      save.disabled =
        true;

      try{

        const {
          data:updated,
          error
        } =
          await supabaseClient
            .from("messages")
            .update({
              content:content,
              edited_at:
                new Date().toISOString()
            })
            .eq(
              "id",
              data.id
            )
            .eq(
              "sender_id",
              currentUser.id
            )
            .select(
              "id,sender_id,content,created_at,edited_at,reply_to_id"
            )
            .single();

        if(error){
          throw error;
        }

        messageCache.set(
          updated.id,
          updated
        );

        oldText.textContent =
          updated.content;

        editor.replaceWith(
          oldText
        );

        const time =
          bubble.querySelector(
            ".message-time"
          );

        if(time){

          time.textContent =
            formatTime(
              updated.created_at
            ) +
            " · edited";

        }

        actions.remove();

        bubble.classList.remove(
          "editing"
        );

      }catch(error){

        console.error(
          "Edit error:",
          error
        );

        save.disabled =
          false;

        showStatus(
          "Message could not be edited."
        );

      }

    };

}

/* =====================================================
   DELETE MESSAGE
===================================================== */

async function deleteMessage(
  data,
  bubble
){

  if(
    !confirm(
      "Delete this message?"
    )
  ){
    return;
  }

  try{

    const {
      error
    } =
      await supabaseClient
        .from("messages")
        .delete()
        .eq(
          "id",
          data.id
        )
        .eq(
          "sender_id",
          currentUser.id
        );

    if(error){
      throw error;
    }

    const row =
      bubble.parentElement;

    row.classList.add(
      "deleting"
    );

    setTimeout(
      ()=>{

        row.remove();

        if(
          !messages.querySelector(
            ".message-row"
          )
        ){

          messages.innerHTML = `
            <div class="welcome-message" id="welcomeMessage">
              <h3>Welcome to ToTalk</h3>
              <p>Your conversation space is ready. Write a message below to begin.</p>
            </div>
          `;

        }

      },
      220
    );

  }catch(error){

    console.error(
      "Delete error:",
      error
    );

    showStatus(
      "Message could not be deleted."
    );

  }

}

/* =====================================================
   LOAD MESSAGES
===================================================== */

async function loadMessages(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("messages")
      .select(
        "id,sender_id,content,created_at,edited_at,reply_to_id"
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );

  if(error){

    console.error(
      "Message load error:",
      error
    );

    throw error;

  }

  messages.innerHTML =
    "";

  if(
    !data ||
    data.length === 0
  ){

    messages.innerHTML = `
      <div class="welcome-message" id="welcomeMessage">
        <h3>Welcome to ToTalk</h3>
        <p>Your conversation space is ready. Write a message below to begin.</p>
      </div>
    `;

    return;

  }

  data.forEach(
    message=>{

      messageCache.set(
        message.id,
        message
      );

    }
  );

  data.forEach(
    (message,index)=>{

      addMessage(
        message,
        true
      );

    }
  );

  requestAnimationFrame(
    ()=>{

      messages.scrollTop =
        messages.scrollHeight;

    }
  );

  await loadAllReactions();

}

/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  const text =
    messageInput.value.trim();

  if(!text){
    return;
  }

  if(!currentUser){

    showStatus(
      "Your login session is not ready."
    );

    return;

  }

  sendButton.disabled =
    true;

  sendButton.textContent =
    "Saving";

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("messages")
        .insert({
          sender_id:
            currentUser.id,

          content:
            text,

          reply_to_id:
            replyTarget?.id || null
        })
        .select(
          "id,sender_id,content,created_at,edited_at,reply_to_id"
        )
        .single();

    if(error){
      throw error;
    }

    addMessage(
      data,
      true
    );

    messageInput.value =
      "";

    clearReplyTarget();

    requestAnimationFrame(
      ()=>{

        messages.scrollTop =
          messages.scrollHeight;

      }
    );

  }catch(error){

    console.error(
      "Send message error:",
      error
    );

    showStatus(
      "Message was not saved: " +
      (error.message || "")
    );

  }finally{

    sendButton.disabled =
      false;

    sendButton.textContent =
      "Send";

  }

}

/* =====================================================
   REALTIME
===================================================== */

function startRealtime(){

  if(realtimeChannel){
    return;
  }

  realtimeChannel =
    supabaseClient
      .channel(
        "totalk-chat-" +
        currentUser.id
      )

      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages"
        },
        payload=>{

          const data =
            payload.new;

          if(!data?.id){
            return;
          }

          messageCache.set(
            data.id,
            data
          );

          const exists =
            document.querySelector(
              `[data-message-id="${data.id}"]`
            );

          if(!exists){

            addMessage(
              data,
              true
            );

            const nearBottom =
              messages.scrollHeight -
              messages.scrollTop -
              messages.clientHeight <
              160;

            if(nearBottom){

              requestAnimationFrame(
                ()=>{

                  messages.scrollTop =
                    messages.scrollHeight;

                }
              );

            }

          }

        }
      )

      .on(
        "postgres_changes",
        {
          event:"UPDATE",
          schema:"public",
          table:"messages"
        },
        payload=>{

          const data =
            payload.new;

          messageCache.set(
            data.id,
            data
          );

          const row =
            document.querySelector(
              `[data-message-id="${data.id}"]`
            );

          if(!row){
            return;
          }

          const bubble =
            row.querySelector(
              ".message"
            );

          const text =
            bubble?.querySelector(
              ".message-text"
            );

          if(text){
            text.textContent =
              data.content;
          }

        }
      )

      .on(
        "postgres_changes",
        {
          event:"DELETE",
          schema:"public",
          table:"messages"
        },
        payload=>{

          const id =
            payload.old?.id;

          if(!id){
            return;
          }

          document
            .querySelector(
              `[data-message-id="${id}"]`
            )
            ?.remove();

          messageCache.delete(
            id
          );

        }
      )

      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"message_reactions"
        },
        async payload=>{

          const id =
            payload.new?.message_id ||
            payload.old?.message_id;

          if(!id){
            return;
          }

          const row =
            document.querySelector(
              `[data-message-id="${id}"]`
            );

          const bubble =
            row?.querySelector(
              ".message"
            );

          if(bubble){

            await refreshReaction(
              id,
              bubble
            );

          }

        }
      )

      .subscribe(
        status=>{

          console.log(
            "Realtime:",
            status
          );

        }
      );

}

/* =====================================================
   PRESENCE
===================================================== */

function startPresence(){

  if(!currentUser){
    return;
  }

  if(presenceChannel){
    return;
  }

  presenceChannel =
    supabaseClient
      .channel(
        "totalk-presence"
      );

  presenceChannel
    .on(
      "presence",
      {
        event:"sync"
      },
      ()=>{
        updatePresence();
      }
    )
    .on(
      "presence",
      {
        event:"join"
      },
      ()=>{
        updatePresence();
      }
    )
    .on(
      "presence",
      {
        event:"leave"
      },
      ()=>{
        updatePresence();
      }
    )
    .subscribe(
      async status=>{

        if(
          status ===
          "SUBSCRIBED"
        ){

          await presenceChannel.track({
            user_id:
              currentUser.id,

            online_at:
              new Date().toISOString()
          });

        }

      }
    );

}

function updatePresence(){

  document.getElementById(
    "sidePresence"
  ).textContent =
    "Online";

  document.getElementById(
    "chatPresence"
  ).textContent =
    "Online";

}

/* =====================================================
   SEARCH
===================================================== */

let searchMatches = [];
let searchIndex = -1;

function runSearch(){

  const query =
    searchInput.value
      .trim()
      .toLowerCase();

  document
    .querySelectorAll(
      ".message-row"
    )
    .forEach(
      row=>{
        row.style.opacity =
          "1";
      }
    );

  searchMatches = [];

  if(!query){
    return;
  }

  document
    .querySelectorAll(
      ".message-row"
    )
    .forEach(
      row=>{

        const text =
          row
            .querySelector(
              ".message-text"
            )
            ?.textContent
            .toLowerCase() ||
          "";

        if(
          text.includes(query)
        ){

          searchMatches.push(
            row
          );

          row.style.opacity =
            ".55";

        }else{

          row.style.opacity =
            ".15";

        }

      }
    );

  if(searchMatches.length){

    searchIndex =
      0;

    focusSearch();

  }

}

function focusSearch(){

  if(
    !searchMatches.length
  ){
    return;
  }

  searchMatches.forEach(
    row=>{
      row.style.opacity =
        ".55";
    }
  );

  const row =
    searchMatches[
      searchIndex
    ];

  row.style.opacity =
    "1";

  row.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

}

document
  .getElementById(
    "searchBtn"
  )
  .addEventListener(
    "click",
    ()=>{

      searchPanel.classList.toggle(
        "open"
      );

      if(
        searchPanel.classList.contains(
          "open"
        )
      ){

        searchInput.focus();

      }

    }
  );

searchInput.addEventListener(
  "input",
  runSearch
);

document
  .getElementById(
    "searchClose"
  )
  .addEventListener(
    "click",
    ()=>{

      searchPanel.classList.remove(
        "open"
      );

      searchInput.value =
        "";

      document
        .querySelectorAll(
          ".message-row"
        )
        .forEach(
          row=>{
            row.style.opacity =
              "1";
          }
        );

    }
  );

document
  .getElementById(
    "searchNext"
  )
  .addEventListener(
    "click",
    ()=>{

      if(
        !searchMatches.length
      ){
        return;
      }

      searchIndex =
        (searchIndex + 1) %
        searchMatches.length;

      focusSearch();

    }
  );

document
  .getElementById(
    "searchPrev"
  )
  .addEventListener(
    "click",
    ()=>{

      if(
        !searchMatches.length
      ){
        return;
      }

      searchIndex =
        (searchIndex - 1 +
        searchMatches.length) %
        searchMatches.length;

      focusSearch();

    }
  );

/* =====================================================
   GLOBAL CLICK
===================================================== */

document.addEventListener(
  "click",
  event=>{

    if(
      !event.target.closest(
        ".message-menu"
      ) &&
      !event.target.closest(
        ".message-menu-btn"
      ) &&
      !event.target.closest(
        ".reaction-picker"
      ) &&
      !event.target.closest(
        ".message"
      )
    ){

      closeMenus();

    }

  }
);

/* =====================================================
   INPUT
===================================================== */

sendButton.addEventListener(
  "click",
  sendMessage
);

messageInput.addEventListener(
  "keydown",
  event=>{

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);

/* =====================================================
   LOGOUT
===================================================== */

logoutBtn.addEventListener(
  "click",
  async ()=>{

    logoutBtn.disabled =
      true;

    logoutBtn.textContent =
      "Logging out";

    try{

      if(realtimeChannel){

        await supabaseClient
          .removeChannel(
            realtimeChannel
          );

      }

      if(presenceChannel){

        await supabaseClient
          .removeChannel(
            presenceChannel
          );

      }

      await supabaseClient
        .auth
        .signOut();

      window.location.replace(
        "./index.html"
      );

    }catch(error){

      console.error(
        "Logout error:",
        error
      );

      logoutBtn.disabled =
        false;

      logoutBtn.textContent =
        "Logout";

    }

  }
);

/* =====================================================
   AUTH STATE
===================================================== */

supabaseClient.auth.onAuthStateChange(
  (event,session)=>{

    console.log(
      "Auth event:",
      event
    );

    if(
      event ===
      "SIGNED_OUT"
    ){

      window.location.replace(
        "./index.html"
      );

    }

  }
);

/* =====================================================
   START APPLICATION
===================================================== */

async function startApp(){

  try{

    /*
     * Keep galaxy loading visible immediately.
     */
    showLoading(
      "ToTalk",
      "Connecting…"
    );

    /*
     * Give the browser a moment to finish
     * the Google/Supabase callback.
     */
    let user =
      await getLoggedInUser();

    if(!user){

      await new Promise(
        resolve=>
          setTimeout(
            resolve,
            900
          )
      );

      user =
        await getLoggedInUser();

    }

    if(!user){

      showLoading(
        "Login required",
        "Returning to ToTalk"
      );

      setTimeout(
        ()=>{

          window.location.replace(
            "./index.html"
          );

        },
        800
      );

      return;

    }

    currentUser =
      user;

    /*
     * IMPORTANT:
     * Check the profiles table BEFORE
     * opening the chat.
     */
    setLoadingText(
      "ToTalk",
      "Opening your space…"
    );

    currentProfile =
      await checkProfile();

    /*
     * No profile OR incomplete profile:
     * send user to profile maker.
     */
    if(
      !currentProfile ||
      currentProfile.profile_completed !== true
    ){

      goToProfileMaker();

      return;

    }

    /*
     * Profile exists.
     */
    setLoadingText(
      "ToTalk",
      "Almost there…"
    );

    updateUserUI();

    /*
     * Load messages.
     */
    await loadMessages();

    /*
     * Start realtime only AFTER
     * profile + messages are ready.
     */
    startRealtime();
    startPresence();

    /* Short, polished transition — no artificial long wait. */
    await new Promise(
      resolve=>setTimeout(resolve, 280)
    );

    finishLoading();

  }catch(error){

    console.error(
      "ToTalk startup error:",
      error
    );

    loading.innerHTML = `
      <div class="login-error">
        <h2>Unable to open ToTalk</h2>
        <p>
          Something went wrong while preparing your conversation space.
        </p>
        <a class="back-button" href="./index.html">
          Back to ToTalk
        </a>
      </div>
    `;

  }

}

/* =====================================================
   START
===================================================== */

startApp();

</script>
