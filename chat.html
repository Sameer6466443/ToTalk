<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>ToTalk Sameer</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #03030d;
      color: #ffffff;
      overflow: hidden;
    }

    /* =========================================
       GALAXY BACKGROUND
       ========================================= */

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -5;

      background:
        radial-gradient(
          circle at 75% 25%,
          rgba(130, 45, 255, 0.28),
          transparent 20%
        ),
        radial-gradient(
          circle at 25% 75%,
          rgba(75, 20, 180, 0.22),
          transparent 25%
        ),
        radial-gradient(
          ellipse at 65% 45%,
          rgba(110, 35, 190, 0.15),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #02020a 0%,
          #060316 45%,
          #02020b 100%
        );
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -4;
      pointer-events: none;

      background-image:
        radial-gradient(circle, rgba(255,255,255,.9) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(160,110,255,.8) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,.6) 1px, transparent 1.5px);

      background-size:
        115px 115px,
        175px 175px,
        240px 240px;

      background-position:
        15px 25px,
        80px 60px,
        30px 120px;

      opacity: .55;
    }

    /* =========================================
       EXTRA GALAXY GLOW
       ========================================= */

    .universe {
      position: fixed;
      inset: 0;
      z-index: -3;
      pointer-events: none;
      overflow: hidden;
    }

    .galaxy-glow {
      position: absolute;
      width: 65vw;
      height: 22vw;
      right: -10vw;
      top: 28%;
      transform: rotate(-25deg);

      background:
        radial-gradient(
          ellipse,
          rgba(184, 87, 255, .30) 0%,
          rgba(120, 42, 220, .16) 30%,
          rgba(40, 10, 100, .04) 55%,
          transparent 72%
        );

      filter: blur(10px);
    }

    .galaxy-glow::after {
      content: "";
      position: absolute;
      inset: 35% 5%;
      border-radius: 50%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(193, 105, 255, .45),
        rgba(255, 255, 255, .22),
        rgba(193, 105, 255, .45),
        transparent
      );
      filter: blur(15px);
    }

    /* =========================================
       MOONS / PLANETS
       ========================================= */

    .moon {
      position: absolute;
      border-radius: 50%;

      background:
        radial-gradient(
          circle at 30% 28%,
          #ffffff 0%,
          #c9c9e8 15%,
          #77779d 42%,
          #29294a 75%,
          #080817 100%
        );

      box-shadow:
        inset -25px -20px 45px rgba(0,0,0,.7),
        0 0 35px rgba(126,88,255,.18);
    }

    .moon::before {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(30,30,60,.28);
      width: 20%;
      height: 20%;
      left: 25%;
      top: 35%;
      box-shadow:
        25px 20px 0 4px rgba(30,30,60,.20),
        45px -12px 0 2px rgba(30,30,60,.18),
        -12px -25px 0 3px rgba(30,30,60,.18);
    }

    .moon-one {
      width: 145px;
      height: 145px;
      right: 5%;
      top: 19%;
      opacity: .8;
    }

    .moon-two {
      width: 230px;
      height: 230px;
      left: -95px;
      bottom: -55px;
      opacity: .55;
    }

    .planet {
      position: absolute;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      right: -150px;
      bottom: -160px;

      background:
        radial-gradient(
          circle at 35% 30%,
          #7545ba,
          #351467 45%,
          #10052c 75%,
          #03030d 100%
        );

      box-shadow:
        inset -35px -25px 70px rgba(0,0,0,.7),
        0 0 80px rgba(123,55,220,.25);
    }

    .planet::before {
      content: "";
      position: absolute;
      width: 150%;
      height: 30%;
      left: -25%;
      top: 35%;
      border: 2px solid rgba(171,111,255,.25);
      border-radius: 50%;
      transform: rotate(-18deg);
    }

    /* =========================================
       LOADING
       ========================================= */

    #loading {
      position: fixed;
      inset: 0;
      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at center,
          #13052b 0%,
          #05020f 45%,
          #020207 100%
        );

      color: #ffffff;
      font-weight: 700;
      font-size: 18px;
    }

    /* =========================================
       HEADER
       ========================================= */

    header {
      height: 86px;
      padding: 0 28px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid rgba(152, 76, 255, .35);

      background:
        linear-gradient(
          180deg,
          rgba(4,4,17,.94),
          rgba(4,4,17,.72)
        );

      backdrop-filter: blur(14px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0;

      font-size: 31px;
      font-weight: 900;
      letter-spacing: -1.5px;
    }

    .logo-main {
      color: #ffffff;
    }

    .logo-name {
      color: #9b55ff;
      margin-left: 8px;
    }

    .right-header {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .user-name {
      color: #aaa9bf;
      font-size: 15px;
      font-weight: 600;
    }

    .logout {
      border: 1px solid #8f43e8;
      background: rgba(20, 7, 45, .75);
      color: #ffffff;

      padding: 12px 20px;
      border-radius: 12px;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;
      transition: .2s;
    }

    .logout:hover {
      background: rgba(119, 49, 218, .3);
      border-color: #b16aff;
    }

    /* =========================================
       MAIN LAYOUT
       ========================================= */

    .chat-layout {
      width: 100%;
      max-width: 1450px;

      height: calc(100vh - 86px);

      margin: 0 auto;
      padding: 18px;

      display: grid;
      grid-template-columns: 275px minmax(0, 1fr);
      gap: 16px;
    }

    /* =========================================
       SIDEBAR
       ========================================= */

    .sidebar {
      min-width: 0;

      border: 1px solid rgba(147, 71, 238, .55);
      border-radius: 18px;

      background:
        linear-gradient(
          160deg,
          rgba(10,7,28,.88),
          rgba(4,4,16,.78)
        );

      backdrop-filter: blur(10px);

      overflow: hidden;

      box-shadow:
        0 0 35px rgba(91, 32, 160, .12);
    }

    .sidebar-title {
      padding: 27px 24px 22px;

      border-bottom: 1px solid rgba(145, 74, 230, .22);
    }

    .sidebar-title h2 {
      font-size: 20px;
      margin-bottom: 7px;
    }

    .sidebar-title p {
      color: #88879f;
      font-size: 13px;
    }

    .profile {
      margin: 18px;

      padding: 15px;

      border: 1px solid rgba(140, 67, 231, .3);
      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          rgba(86, 34, 160, .24),
          rgba(32, 12, 68, .45)
        );

      display: flex;
      align-items: center;
      gap: 13px;
    }

    .avatar {
      width: 47px;
      height: 47px;

      flex-shrink: 0;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          145deg,
          #b067ff,
          #7132d9
        );

      color: #ffffff;

      font-size: 20px;
      font-weight: 800;

      box-shadow:
        0 0 22px rgba(145, 70, 255, .3);
    }

    .profile strong {
      display: block;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .online {
      color: #6ee7a0;
      font-size: 11px;
      font-weight: 700;
    }

    /* =========================================
       CHAT BOX
       ========================================= */

    .chat-box {
      min-width: 0;
      min-height: 0;

      border: 1px solid rgba(147, 71, 238, .58);
      border-radius: 18px;

      background:
        rgba(3,3,14,.78);

      backdrop-filter: blur(10px);

      overflow: hidden;

      display: flex;
      flex-direction: column;

      box-shadow:
        0 0 40px rgba(91, 32, 160, .12);
    }

    .chat-top {
      min-height: 82px;

      padding: 16px 24px;

      display: flex;
      align-items: center;
      gap: 14px;

      border-bottom: 1px solid rgba(145, 74, 230, .25);

      background:
        linear-gradient(
          90deg,
          rgba(12,7,32,.85),
          rgba(4,4,17,.7)
        );
    }

    .chat-avatar {
      width: 45px;
      height: 45px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          145deg,
          #ae5fff,
          #7133d8
        );

      font-size: 18px;
      font-weight: 800;

      box-shadow:
        0 0 20px rgba(143, 68, 255, .32);
    }

    .chat-top strong {
      display: block;
      font-size: 16px;
      margin-bottom: 5px;
    }

    .chat-top small {
      color: #6ee7a0;
      font-size: 11px;
      font-weight: 700;
    }

    /* =========================================
       MESSAGES / UNIVERSE
       ========================================= */

    .messages {
      position: relative;

      flex: 1;
      min-height: 0;

      overflow-y: auto;

      padding: 30px;

      background:
        radial-gradient(
          ellipse at 75% 25%,
          rgba(104, 38, 181, .20),
          transparent 25%
        ),
        radial-gradient(
          ellipse at 20% 80%,
          rgba(58, 25, 120, .17),
          transparent 28%
        ),
        linear-gradient(
          135deg,
          rgba(1,1,8,.96),
          rgba(7,3,22,.90)
        );
    }

    .messages::before {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      background-image:
        radial-gradient(circle, #ffffff 1px, transparent 1.5px),
        radial-gradient(circle, #a969ff 1px, transparent 1.5px);

      background-size:
        95px 95px,
        155px 155px;

      background-position:
        12px 18px,
        45px 75px;

      opacity: .38;
    }

    .welcome-message {
      position: relative;
      z-index: 2;

      min-height: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 30px;
    }

    /* Pure CSS moon - no emoji/image */

    .welcome-moon {
      width: 92px;
      height: 92px;

      border-radius: 50%;

      margin-bottom: 28px;

      background:
        radial-gradient(
          circle at 35% 30%,
          #fff9d0 0%,
          #f7dc55 18%,
          #c58b18 48%,
          #503408 100%
        );

      box-shadow:
        0 0 18px rgba(255, 215, 65, .75),
        0 0 55px rgba(157, 74, 255, .22);

      position: relative;
    }

    .welcome-moon::after {
      content: "";

      position: absolute;

      width: 18px;
      height: 18px;

      border-radius: 50%;

      background: rgba(100, 63, 10, .25);

      top: 24px;
      left: 27px;

      box-shadow:
        23px 13px 0 3px rgba(100,63,10,.20),
        8px 37px 0 2px rgba(100,63,10,.20);
    }

    .welcome-message h3 {
      font-size: clamp(25px, 3vw, 38px);

      line-height: 1.2;

      margin-bottom: 14px;
    }

    .welcome-message h3 span {
      color: #a35aff;
    }

    .welcome-message p {
      color: #9d9ab5;

      font-size: 15px;
      line-height: 1.7;

      max-width: 600px;
    }

    .space-line {
      width: 180px;
      height: 1px;

      margin-top: 28px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #9b4dff,
          transparent
        );

      position: relative;
    }

    .space-line::after {
      content: "";

      position: absolute;

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #d49cff;

      left: 50%;
      top: -3px;

      box-shadow:
        0 0 12px #b56aff;
    }

    /* =========================================
       MESSAGE BUBBLES
       ========================================= */

    .message {
      position: relative;
      z-index: 5;

      max-width: 72%;

      margin-bottom: 13px;

      padding: 12px 16px;

      border-radius: 16px;

      font-size: 14px;
      line-height: 1.5;

      word-wrap: break-word;
    }

    .message.mine {
      margin-left: auto;

      color: #ffffff;

      background:
        linear-gradient(
          135deg,
          #873de4,
          #5e22b9
        );

      border-bottom-right-radius: 5px;

      box-shadow:
        0 5px 20px rgba(101, 35, 190, .25);
    }

    /* =========================================
       INPUT
       ========================================= */

    .input-area {
      position: relative;
      z-index: 10;

      padding: 13px 18px 18px;

      display: flex;
      gap: 10px;

      border-top: 1px solid rgba(145, 74, 230, .25);

      background:
        rgba(5,3,18,.94);
    }

    #messageInput {
      flex: 1;
      min-width: 0;

      height: 50px;

      border: 1px solid rgba(142, 69, 228, .45);
      outline: none;

      background:
        rgba(20, 9, 40, .88);

      color: #ffffff;

      padding: 0 17px;

      border-radius: 14px;

      font-size: 14px;
    }

    #messageInput::placeholder {
      color: #79768f;
    }

    #messageInput:focus {
      border-color: #9b4dff;

      box-shadow:
        0 0 0 2px rgba(145, 67, 235, .12);
    }

    #sendButton {
      width: 54px;
      height: 50px;

      border: none;
      border-radius: 14px;

      background:
        linear-gradient(
          145deg,
          #a458ff,
          #7029d4
        );

      color: #ffffff;

      font-size: 20px;
      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 0 22px rgba(135, 54, 234, .35);

      transition: .2s;
    }

    #sendButton:hover {
      transform: translateY(-1px);

      box-shadow:
        0 0 30px rgba(150, 70, 255, .5);
    }

    /* =========================================
       LOGIN ERROR
       ========================================= */

    .login-error {
      width: min(92%, 520px);

      padding: 28px;

      border: 1px solid rgba(159, 75, 255, .55);
      border-radius: 18px;

      background:
        rgba(9,5,25,.92);

      box-shadow:
        0 0 40px rgba(105, 40, 190, .18);

      text-align: center;
    }

    .login-error h2 {
      margin-bottom: 12px;
    }

    .login-error p {
      color: #aaa7ba;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .login-error a {
      display: inline-block;

      padding: 12px 18px;

      border-radius: 11px;

      background: #8d43e9;
      color: white;

      text-decoration: none;
      font-weight: 700;
    }

    /* =========================================
       TABLET
       ========================================= */

    @media (max-width: 900px) {

      header {
        height: 70px;
        padding: 0 18px;
      }

      .logo {
        font-size: 25px;
      }

      .right-header {
        gap: 10px;
      }

      .user-name {
        display: none;
      }

      .chat-layout {
        height: calc(100vh - 70px);

        padding: 10px;

        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .chat-box {
        border-radius: 16px;
      }

      .messages {
        padding: 20px 15px;
      }
    }

    /* =========================================
       PHONE
       ========================================= */

    @media (max-width: 600px) {

      body {
        overflow: hidden;
      }

      header {
        height: 62px;

        padding:
          0 12px;

        padding-top: env(safe-area-inset-top);

        height:
          calc(62px + env(safe-area-inset-top));
      }

      .logo {
        font-size: 22px;
        letter-spacing: -1px;
      }

      .logo-name {
        margin-left: 5px;
      }

      .logout {
        padding: 9px 12px;
        font-size: 12px;
        border-radius: 10px;
      }

      .chat-layout {
        height:
          calc(
            100vh -
            62px -
            env(safe-area-inset-top)
          );

        padding: 7px;

        gap: 0;
      }

      .chat-box {
        height: 100%;
        border-radius: 14px;
      }

      .chat-top {
        min-height: 66px;

        padding: 10px 13px;

        gap: 10px;
      }

      .chat-avatar {
        width: 39px;
        height: 39px;

        font-size: 16px;
      }

      .chat-top strong {
        font-size: 14px;
      }

      .chat-top small {
        font-size: 10px;
      }

      .messages {
        padding: 12px 10px;
      }

      .welcome-message {
        padding: 18px 10px;
      }

      .welcome-moon {
        width: 70px;
        height: 70px;

        margin-bottom: 20px;
      }

      .welcome-moon::after {
        width: 13px;
        height: 13px;

        top: 18px;
        left: 20px;

        box-shadow:
          17px 10px 0 2px rgba(100,63,10,.20),
          6px 28px 0 2px rgba(100,63,10,.20);
      }

      .welcome-message h3 {
        font-size: 24px;
      }

      .welcome-message p {
        font-size: 13px;
        max-width: 330px;
      }

      .space-line {
        width: 130px;
        margin-top: 20px;
      }

      .input-area {
        padding:
          8px
          8px
          calc(8px + env(safe-area-inset-bottom));

        gap: 7px;
      }

      #messageInput {
        height: 46px;

        padding: 0 13px;

        border-radius: 12px;

        font-size: 14px;
      }

      #sendButton {
        width: 48px;
        height: 46px;

        border-radius: 12px;

        font-size: 18px;
      }

      .message {
        max-width: 86%;
        font-size: 14px;
      }

      .moon-one {
        width: 90px;
        height: 90px;

        right: -20px;
        top: 18%;
      }

      .moon-two {
        width: 140px;
        height: 140px;

        left: -65px;
        bottom: -40px;
      }

      .planet {
        width: 190px;
        height: 190px;

        right: -95px;
        bottom: -85px;
      }

      .galaxy-glow {
        width: 100vw;
        height: 35vw;

        right: -25vw;
      }
    }

    /* =========================================
       VERY SMALL PHONES
       ========================================= */

    @media (max-width: 380px) {

      .logo {
        font-size: 20px;
      }

      .logout {
        padding: 8px 10px;
      }

      .chat-top {
        min-height: 60px;
      }

      .welcome-message h3 {
        font-size: 21px;
      }

      .welcome-message p {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <!-- Universe decorations -->
  <div class="universe">
    <div class="galaxy-glow"></div>
    <div class="moon moon-one"></div>
    <div class="moon moon-two"></div>
    <div class="planet"></div>
  </div>

  <!-- Login/session loading -->
  <div id="loading">
    Opening ToTalk...
  </div>

  <!-- Header -->
  <header>

    <div class="logo">
      <span class="logo-main">ToTalk</span>
      <span class="logo-name">Sameer</span>
    </div>

    <div class="right-header">

      <div class="user-name" id="userName">
        Loading...
      </div>

      <button
        class="logout"
        id="logoutBtn"
        type="button"
      >
        Logout
      </button>

    </div>

  </header>


  <!-- Chat -->
  <main class="chat-layout">

    <!-- Sidebar -->
    <aside class="sidebar">

      <div class="sidebar-title">
        <h2>Sameer's Chats</h2>
        <p>Your personal conversation space</p>
      </div>

      <div class="profile">

        <div class="avatar">
          S
        </div>

        <div>
          <strong id="sideName">
            Sameer
          </strong>

          <div class="online">
            Online
          </div>
        </div>

      </div>

    </aside>


    <!-- Chat box -->
    <section class="chat-box">

      <div class="chat-top">

        <div class="chat-avatar">
          S
        </div>

        <div>
          <strong>
            Sameer's ToTalk
          </strong>

          <small>
            Online
          </small>
        </div>

      </div>


      <div
        class="messages"
        id="messages"
      >

        <div class="welcome-message">

          <div class="welcome-moon"></div>

          <h3>
            Welcome to
            <span>Sameer's ToTalk</span>
          </h3>

          <p>
            You're signed in.
            This is Sameer's personal chat space.
          </p>

          <div class="space-line"></div>

        </div>

      </div>


      <!-- Message input -->
      <div class="input-area">

        <input
          type="text"
          id="messageInput"
          placeholder="Write a message..."
          autocomplete="off"
          enterkeyhint="send"
        >

        <button
          id="sendButton"
          type="button"
          aria-label="Send message"
        >
          →
        </button>

      </div>

    </section>

  </main>


  <script>

    /* =========================================
       SUPABASE
       DO NOT CHANGE THESE LOGIN SETTINGS
       ========================================= */

    const SUPABASE_URL =
      "https://qiynczbrhpxwuabwuyiy.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_eUPz4c_nYckgINEK-AIWqw_JAXIHozd";


    /*
      IMPORTANT:
      Keep this authentication configuration.

      It allows Supabase to process the Google
      OAuth result and keep the session.
    */

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            flowType: "implicit"
          }
        }
      );


    /* =========================================
       SHOW USER
       ========================================= */

    function showLoggedInUser(user) {

      const name =
        user.user_metadata?.full_name ||
        user.user_metadata?.name ||
        user.email?.split("@")[0] ||
        "Sameer";

      document.getElementById(
        "userName"
      ).textContent = name;

      document.getElementById(
        "sideName"
      ).textContent = name;

      document.getElementById(
        "loading"
      ).style.display = "none";
    }


    /* =========================================
       LOGIN ERROR
       ========================================= */

    function showLoginError(message) {

      const loading =
        document.getElementById("loading");

      loading.innerHTML = `
        <div class="login-error">

          <h2>
            Login problem
          </h2>

          <p>
            ${message}
          </p>

          <a href="./index.html">
            Back to ToTalk
          </a>

        </div>
      `;
    }


    /* =========================================
       START CHAT
       ========================================= */

    async function startChat() {

      try {

        /*
          Register the listener BEFORE getSession.

          This is important because Google may finish
          the OAuth callback while this page is loading.
        */

        let signedIn = false;

        supabaseClient.auth.onAuthStateChange(
          (event, session) => {

            console.log(
              "Supabase auth event:",
              event
            );

            if (
              session &&
              session.user
            ) {

              signedIn = true;

              showLoggedInUser(
                session.user
              );

            }

          }
        );


        /*
          Check for an existing session.
        */

        const {
          data,
          error
        } =
          await supabaseClient.auth.getSession();


        if (error) {

          console.error(
            "Session check error:",
            error
          );

        }


        if (
          data?.session?.user
        ) {

          signedIn = true;

          showLoggedInUser(
            data.session.user
          );

          return;
        }


        /*
          Give Supabase time to finish
          processing Google's callback.
        */

        setTimeout(
          async () => {

            if (signedIn) {
              return;
            }

            const {
              data: retryData,
              error: retryError
            } =
              await supabaseClient.auth.getSession();


            if (retryError) {

              console.error(
                "Final session check error:",
                retryError
              );

            }


            if (
              retryData?.session?.user
            ) {

              showLoggedInUser(
                retryData.session.user
              );

              return;
            }


            showLoginError(
              "Google sign-in completed, but ToTalk did not receive the login session. Please go back and try the Google button once more."
            );

          },
          2500
        );

      } catch (error) {

        console.error(
          "Login error:",
          error
        );

        showLoginError(
          "ToTalk could not finish the Google sign-in. Please go back and try again."
        );

      }

    }


    /* =========================================
       LOGOUT
       ========================================= */

    document
      .getElementById("logoutBtn")
      .addEventListener(
        "click",
        async () => {

          await supabaseClient.auth.signOut();

          window.location.replace(
            "./index.html"
          );

        }
      );


    /* =========================================
       SEND MESSAGE
       ========================================= */

    const input =
      document.getElementById(
        "messageInput"
      );

    const sendButton =
      document.getElementById(
        "sendButton"
      );

    const messages =
      document.getElementById(
        "messages"
      );


    function sendMessage() {

      const text =
        input.value.trim();

      if (!text) {
        return;
      }


      const welcome =
        document.querySelector(
          ".welcome-message"
        );

      if (welcome) {
        welcome.remove();
      }


      const message =
        document.createElement(
          "div"
        );

      message.className =
        "message mine";

      message.textContent =
        text;


      messages.appendChild(
        message
      );


      input.value = "";


      messages.scrollTop =
        messages.scrollHeight;

    }


    sendButton.addEventListener(
      "click",
      sendMessage
    );


    input.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* =========================================
       START
       ========================================= */

    startChat();

  </script>

</body>
</html>
