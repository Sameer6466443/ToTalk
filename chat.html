<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>ToTalk Sameer</title>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    :root {

      --black: #020108;
      --dark: #05020f;
      --panel: rgba(8, 5, 20, 0.95);

      --purple: #914cff;
      --purple-light: #aa69ff;
      --purple-dark: #6324ca;

      --yellow: #ffe34f;

      --white: #f8f5ff;
      --muted: #928ba8;

      --green: #52e69a;

      --border: rgba(145, 76, 255, 0.45);

    }


    html,
    body {

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: var(--black);

    }


    body {

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: var(--white);

      background:

        radial-gradient(
          ellipse at 70% 25%,
          rgba(111, 36, 191, 0.28),
          transparent 32%
        ),

        radial-gradient(
          ellipse at 15% 85%,
          rgba(81, 29, 160, 0.20),
          transparent 30%
        ),

        linear-gradient(
          135deg,
          #020108,
          #070313 50%,
          #020108
        );

      min-height: 100dvh;

    }


    /* ======================================
       GLOBAL STARS
    ====================================== */

    body::before {

      content: "";

      position: fixed;

      inset: 0;

      pointer-events: none;

      z-index: 0;

      opacity: 0.75;

      background-image:

        radial-gradient(
          circle,
          rgba(255,255,255,.9) 1px,
          transparent 1.5px
        ),

        radial-gradient(
          circle,
          rgba(210,190,255,.8) 1px,
          transparent 1.5px
        ),

        radial-gradient(
          circle,
          rgba(255,255,255,.65) 1px,
          transparent 1.5px
        );

      background-size:
        115px 115px,
        175px 175px,
        245px 245px;

      background-position:
        15px 25px,
        70px 90px,
        130px 45px;

    }


    /* ======================================
       HEADER
    ====================================== */

    header {

      position: relative;

      z-index: 20;

      height: 78px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0 24px;

      background:
        rgba(3, 2, 10, 0.96);

      border-bottom:
        1px solid var(--border);

      box-shadow:
        0 0 25px rgba(104, 42, 190, 0.12);

    }


    .brand {

      font-size: 26px;

      font-weight: 900;

      letter-spacing: -0.8px;

    }


    .brand-main {

      color: var(--white);

    }


    .brand-name {

      color: var(--purple-light);

    }


    .header-right {

      display: flex;

      align-items: center;

      gap: 16px;

    }


    #userName {

      color: #aaa3bb;

      font-size: 13px;

      font-weight: 700;

    }


    #logoutBtn {

      padding:
        9px 16px;

      border-radius: 10px;

      border:
        1px solid var(--border);

      background:
        rgba(20, 10, 42, 0.85);

      color: var(--white);

      font-size: 12px;

      font-weight: 800;

      cursor: pointer;

      transition: 0.2s;

    }


    #logoutBtn:hover {

      border-color:
        var(--purple-light);

      box-shadow:
        0 0 20px rgba(145, 76, 255, 0.25);

    }


    /* ======================================
       MAIN
    ====================================== */

    .chat-layout {

      position: relative;

      z-index: 2;

      width: 100%;

      height:
        calc(100dvh - 78px);

      padding: 16px;

      display: grid;

      grid-template-columns:
        235px minmax(0, 1fr);

      gap: 14px;

    }


    /* ======================================
       SIDEBAR
    ====================================== */

    .sidebar {

      position: relative;

      min-width: 0;

      overflow: hidden;

      border:
        1px solid var(--border);

      border-radius: 14px;

      background:
        linear-gradient(
          180deg,
          rgba(9, 6, 23, .97),
          rgba(3, 2, 12, .98)
        );

      box-shadow:
        0 0 30px rgba(95, 35, 180, .10);

    }


    .sidebar-title {

      padding:
        22px 20px 18px;

      border-bottom:
        1px solid rgba(145,76,255,.18);

    }


    .sidebar-title h2 {

      font-size: 18px;

      margin-bottom: 7px;

    }


    .sidebar-title p {

      color: var(--muted);

      font-size: 11px;

    }


    .chat-person {

      margin:
        17px 15px;

      padding: 13px;

      display: flex;

      align-items: center;

      gap: 11px;

      border:
        1px solid rgba(145,76,255,.32);

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          rgba(95,37,165,.35),
          rgba(27,12,59,.65)
        );

    }


    .avatar {

      width: 43px;
      height: 43px;

      flex: 0 0 43px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #a45cff,
          #6321d8
        );

      font-size: 17px;

      font-weight: 900;

      box-shadow:
        0 0 20px rgba(145,76,255,.45);

    }


    .person-name {

      font-size: 13px;

      font-weight: 800;

    }


    .presence-status {

      margin-top: 5px;

      display: inline-flex;

      align-items: center;

      gap: 6px;

      font-size: 10px;

      font-weight: 700;

      transition: color .28s ease, opacity .28s ease;

    }

    .presence-status.online { color: #bda8ff; }
    .presence-status.offline { color: #9a95a9; }

    .presence-icon {
      width: 14px;
      height: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex: 0 0 14px;
    }

    .moon-icon {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #cdbdff;
      box-shadow: 0 0 9px rgba(190,160,255,.65);
      position: relative;
      display: block;
    }

    .moon-icon::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #0b0716;
      left: 3px;
      top: -2px;
    }

    .sun-icon {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #f5d98b;
      box-shadow: 0 0 9px rgba(245,217,139,.45);
      position: relative;
      display: block;
    }

    .sun-icon::before,
    .sun-icon::after {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 1px solid rgba(245,217,139,.55);
    }

    .sun-icon::after {
      transform: rotate(45deg);
      border-color: rgba(245,217,139,.35);
    }

    .presence-status.offline .sun-icon {
      animation: sunBreath 2.8s ease-in-out infinite;
    }

    .presence-status.online .moon-icon {
      animation: moonFloat 3s ease-in-out infinite;
    }

    @keyframes moonFloat {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-1px); }
    }

    @keyframes sunBreath {
      0%,100% { transform: scale(.92); opacity:.72; }
      50% { transform: scale(1); opacity:1; }
    }

    .chat-status {
      margin-top: 4px;
      font-size: 10px;
      font-weight: 700;
    }


    /* ======================================
       CHAT BOX
    ====================================== */


    /* UNREAD MESSAGE INDICATOR */
    .unread-badge{display:none;min-width:17px;height:17px;padding:0 5px;align-items:center;justify-content:center;border-radius:999px;background:linear-gradient(135deg,#b67cff,#6d35e8);color:#fff;font-size:9px;font-weight:900;box-shadow:0 0 12px rgba(155,102,255,.55);animation:unreadPulse 1.8s ease-in-out infinite}.unread-badge.show{display:inline-flex}
    .new-message-indicator{position:absolute;left:50%;bottom:78px;transform:translate(-50%,10px);z-index:30;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid rgba(190,160,255,.28);border-radius:999px;background:rgba(20,13,42,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#eee8ff;font-size:11px;font-weight:800;box-shadow:0 8px 30px rgba(0,0,0,.35),0 0 22px rgba(137,82,255,.18);opacity:0;pointer-events:none;transition:opacity .28s ease,transform .28s cubic-bezier(.2,.75,.25,1)}.new-message-indicator.show{opacity:1;transform:translate(-50%,0)}.new-message-indicator .unread-dot{width:6px;height:6px;border-radius:50%;background:#c9b1ff;box-shadow:0 0 9px rgba(201,177,255,.85)}@keyframes unreadPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

    .chat-box {

      position: relative;

      min-width: 0;
      min-height: 0;

      display: flex;

      flex-direction: column;

      overflow: hidden;

      border:
        1px solid var(--border);

      border-radius: 14px;

      background:
        rgba(3,2,12,.93);

      box-shadow:
        0 0 35px rgba(98,38,190,.14);

    }


    /* ======================================
       CHAT HEADER
    ====================================== */

    .chat-top {

      position: relative;

      z-index: 5;

      min-height: 75px;

      padding:
        13px 20px;

      display: flex;

      align-items: center;

      gap: 12px;

      background:
        rgba(8,5,20,.97);

      border-bottom:
        1px solid rgba(145,76,255,.25);

    }


    .chat-avatar {

      width: 43px;
      height: 43px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #9d56ff,
          #6322d3
        );

      font-weight: 900;

      box-shadow:
        0 0 18px rgba(145,76,255,.38);

    }


    .chat-title {

      font-size: 15px;

      font-weight: 900;

    }


    


    .top-star {

      margin-left: 0;

      color: var(--yellow);

      font-size: 27px;

      line-height: 1;

      text-shadow:
        0 0 12px rgba(255,227,79,.75);

    }




    /* ======================================
       MESSAGE SEARCH
    ====================================== */

    .message-search-toggle {
      margin-left: auto;
      width: 30px; height: 30px; flex: 0 0 30px;
      border: 0; border-radius: 8px;
      background: transparent; cursor: pointer; position: relative;
      display:flex; align-items:center; justify-content:center;
      opacity:.82;
      transition: transform .18s ease, opacity .18s ease, background .18s ease;
    }
    .message-search-toggle:hover,.message-search-toggle:focus-visible {
      transform:scale(1.08); background:rgba(145,76,255,.10);
      opacity:1; outline:none;
    }
    .message-search-toggle .search-glass {
      width:13px;height:13px;border:1.8px solid rgba(255,255,255,.86);
      border-radius:50%;position:relative;opacity:.95;
    }
    .message-search-toggle .search-glass::after {
      content:"";position:absolute;width:6px;height:1.8px;
      background:rgba(255,255,255,.86);right:-5px;bottom:-2px;
      transform:rotate(45deg);border-radius:2px;
    }
    .chat-search-popover {
      position:absolute; top:60px; right:12px; z-index:80;
      width:min(235px,calc(100% - 24px)); padding:6px;
      border:1px solid rgba(165,102,255,.34); border-radius:13px;
      background:rgba(10,6,25,.97);
      box-shadow:0 12px 35px rgba(0,0,0,.45),0 0 25px rgba(125,55,220,.18);
      backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
      opacity:0; transform:translateY(-7px) scale(.98); pointer-events:none;
      transition:opacity .2s ease,transform .2s cubic-bezier(.2,.75,.25,1);
    }
    .chat-search-popover.open { opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
    .message-search-bar {
      width:100%;height:32px;display:flex;align-items:center;gap:6px;padding:0 7px;box-sizing:border-box;
      border:1px solid rgba(181,143,255,.24);border-radius:9px;background:rgba(255,255,255,.045);
    }
    .message-search-input { min-width:0;flex:1;height:28px;padding:0;border:0;background:transparent;color:#fff;outline:none;font:inherit;font-size:10px; }
    .message-search-input::placeholder { color:rgba(255,255,255,.46); }
    .search-count { min-width:30px;text-align:center;color:rgba(255,255,255,.52);font-size:9px;white-space:nowrap; }
    .search-nav-btn { width:23px;height:23px;flex:0 0 23px;border:1px solid rgba(181,143,255,.2);border-radius:7px;background:rgba(255,255,255,.045);color:rgba(255,255,255,.78);cursor:pointer;font-size:10px;transition:background .18s,transform .18s; }
    .search-nav-btn:hover { background:rgba(145,76,255,.15);transform:translateY(-1px); }
    .search-close-btn { width:23px;height:23px;flex:0 0 23px;border:0;border-radius:7px;background:transparent;color:rgba(255,255,255,.5);cursor:pointer;font-size:15px;line-height:1; }
    .search-hit { background:rgba(255,227,79,.28);color:#fff;border-radius:3px;padding:0 2px;box-shadow:0 0 9px rgba(255,227,79,.12); }
    .message.search-active { border-color:rgba(181,143,255,.72);box-shadow:0 0 24px rgba(145,76,255,.24); }
    .message.is-editing .message-menu-wrap { display:none !important; }
    @media (max-width:650px) {
      .message-search-toggle { width:28px;height:28px;flex-basis:28px; }
      .chat-search-popover { top:57px;right:8px;width:min(235px,calc(100% - 16px)); }
    }


    /* ======================================
       SPACE
    ====================================== */

    .space {

      position: relative;

      flex: 1;

      min-height: 0;

      overflow: hidden;

      background:

        radial-gradient(
          ellipse at 58% 27%,
          rgba(124,40,195,.32),
          transparent 30%
        ),

        radial-gradient(
          ellipse at 90% 60%,
          rgba(83,27,148,.18),
          transparent 30%
        ),

        linear-gradient(
          180deg,
          #03020b,
          #050213 55%,
          #020108
        );

    }


    .space::before {

      content: "";

      position: absolute;

      inset: 0;

      pointer-events: none;

      opacity: .75;

      background-image:

        radial-gradient(
          circle,
          rgba(255,255,255,.9) 1px,
          transparent 1.5px
        ),

        radial-gradient(
          circle,
          rgba(220,200,255,.8) 1px,
          transparent 1.5px
        ),

        radial-gradient(
          circle,
          rgba(255,255,255,.7) 1px,
          transparent 1.5px
        );

      background-size:
        125px 125px,
        195px 195px,
        280px 280px;

      background-position:
        15px 20px,
        80px 60px,
        140px 100px;

    }


    /* ======================================
       PURPLE NEBULA
    ====================================== */

    .nebula {

      position: absolute;

      width: 390px;
      height: 280px;

      top: 75px;
      left: 30%;

      pointer-events: none;

      background:
        radial-gradient(
          ellipse,
          rgba(153,54,224,.30),
          rgba(93,29,145,.12),
          transparent 70%
        );

      filter:
        blur(20px);

    }


    /* ======================================
       MOON
    ====================================== */

    .moon {

      position: absolute;

      top: 27px;
      left: 58px;

      width: 76px;
      height: 76px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 35%,
          #fffbd0,
          #ffe43e 58%,
          #e4a700 100%
        );

      box-shadow:
        0 0 28px rgba(255,220,47,.45);

      z-index: 2;

    }


    .moon::after {

      content: "";

      position: absolute;

      width: 75px;
      height: 75px;

      left: 22px;
      top: -5px;

      border-radius: 50%;

      background:
        #03020b;

    }


    /* ======================================
       PLANET
    ====================================== */

    .planet {

      position: absolute;

      top: 64px;
      right: 40px;

      width: 105px;
      height: 105px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 32% 28%,
          #566083,
          #1d2140 45%,
          #050510 78%
        );

      box-shadow:
        0 0 35px rgba(101,75,170,.26);

      z-index: 2;

    }


    .planet::after {

      content: "";

      position: absolute;

      width: 182px;
      height: 43px;

      left: -39px;
      top: 30px;

      border:
        1px solid rgba(181,143,255,.52);

      border-radius: 50%;

      transform:
        rotate(-16deg);

      box-shadow:
        0 0 8px rgba(145,76,255,.22);

    }


    /* ======================================
       SHOOTING STAR
    ====================================== */

    .shooting-star {

      position: absolute;

      width: 90px;
      height: 2px;

      right: 17%;
      bottom: 17%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.9)
        );

      transform:
        rotate(-40deg);

      box-shadow:
        0 0 8px rgba(255,255,255,.75);

      z-index: 2;

    }


    /* ======================================
       MESSAGES
    ====================================== */

    #messages {

      position: absolute;

      z-index: 4;

      inset: 0;

      overflow-y: auto;

      padding:
        24px 22px 115px;

      display: flex;

      flex-direction: column;

      gap: 10px;

      scroll-behavior: smooth;

      -webkit-overflow-scrolling: touch;

    }


    #messages::-webkit-scrollbar {

      width: 5px;

    }


    #messages::-webkit-scrollbar-track {

      background: transparent;

    }


    #messages::-webkit-scrollbar-thumb {

      background:
        rgba(145,76,255,.38);

      border-radius: 10px;

    }


    .welcome-message {

      margin: auto;

      max-width: 430px;

      padding: 30px;

      text-align: center;

      color: var(--muted);

    }


    .welcome-message h3 {

      color: var(--white);

      font-size: 20px;

      margin-bottom: 10px;

    }


    .welcome-message p {

      font-size: 12px;

      line-height: 1.7;

    }


    .message {
      position: relative;
      max-width: min(70%, 520px);
      align-self: flex-start;
      padding: 10px 13px 9px;
      padding-right: 42px;
      border-radius: 15px;
      background: rgba(19,13,40,.94);
      border: 1px solid rgba(145,76,255,.25);
      color: var(--white);
      font-size: 13px;
      line-height: 1.45;
      word-break: break-word;
    }

    .message.mine {
      position: relative;
    }

    .message-text {
      display: block;
      white-space: pre-wrap;
    }

    .message-menu-wrap {
      position: absolute;
      top: 7px;
      right: 7px;
      z-index: 900;
      display: block;
    }

    .message-menu-btn {
      width: 24px;
      height: 24px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
      color: rgba(255,255,255,.72);
      font-size: 16px;
      line-height: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .18s, color .18s;
    }

    .message-menu-btn:hover,
    .message-menu-btn:focus-visible {
      background: rgba(255,255,255,.16);
      color: #fff;
      outline: none;
    }

    .message-menu {
      position: absolute;
      bottom: 29px;
      top: auto;
      right: 0;
      max-height: 180px;
      overflow: auto;
      min-width: 92px;
      padding: 5px;
      border: 1px solid rgba(165,102,255,.35);
      border-radius: 10px;
      background: rgba(13,8,30,.98);
      box-shadow: 0 10px 28px rgba(0,0,0,.45), 0 0 18px rgba(125,55,220,.18);
      display: none;
    }

    .message-menu.open {
      display: block;
      z-index: 10000;
    }

    .message-menu.menu-down {
      top: 29px;
      bottom: auto;
    }

    .message-menu button {
      width: 100%;
      border: 0;
      background: transparent;
      color: rgba(255,255,255,.82);
      text-align: left;
      padding: 7px 9px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .message-menu button:hover,
    .message-menu button:focus-visible {
      background: rgba(145,76,255,.18);
      color: #fff;
      outline: none;
    }

    .message-menu .menu-delete {
      color: rgba(255,190,205,.82);
    }

    .message-menu .menu-delete:hover,
    .message-menu .menu-delete:focus-visible {
      background: rgba(255,90,125,.10);
      color: #ffd6df;
    }


    .message:not(.mine) .message-menu-wrap {
      opacity: .72;
    }

    .message:not(.mine) .message-menu-btn {
      background: rgba(255,255,255,.07);
    }

    .message:not(.mine) .message-menu-btn:hover,
    .message:not(.mine) .message-menu-btn:focus-visible {
      opacity: 1;
      background: rgba(145,76,255,.20);
    }

    .message.mine {
      align-self: flex-end;
      min-width: 118px;
      background: linear-gradient(135deg, #8e47f0, #6226c8);
      border: 1px solid rgba(188,142,255,.45);
      box-shadow: 0 5px 20px rgba(91,35,177,.25);
    }


    .message-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
      margin-top: 7px;
    }

    .message-action-btn {
      border: 0;
      background: rgba(255,255,255,.08);
      color: rgba(255,255,255,.78);
      border-radius: 7px;
      padding: 5px 9px;
      font-size: 10px;
      line-height: 1.2;
      font-weight: 600;
      cursor: pointer;
    }

    .message-action-btn:hover {
      background: rgba(255,255,255,.14);
      color: #fff;
    }

    .message-action-btn:disabled {
      cursor: default;
      opacity: .5;
    }

    .message.is-editing {
      padding-right: 13px;
    }

    .edit-message-area {
      display:block;
      width: 100%;
      box-sizing: border-box;
      min-height: 58px;
      resize: vertical;

    /* ======================================

    /* ======================================

.status-visible{opacity:1;transform:translateX(-50%) translateY(-4px);}


    /* ======================================
       LOADING
    ====================================== */

    #loading {

      position: fixed;

      inset: 0;

      z-index: 9999;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;

      background:
        radial-gradient(circle at 50% 44%, rgba(91,35,170,.28), transparent 34%),
        radial-gradient(circle at 18% 78%, rgba(38,20,100,.20), transparent 30%),
        #03020b;

      color: var(--white);

      text-align: center;

      opacity: 1;

      visibility: visible;

      transition: opacity .7s ease, visibility .7s ease;

    }

    #loading::before,
    #loading::after {

      content: "";

      position: absolute;

      border-radius: 50%;

      pointer-events: none;

    }

    #loading::before {

      width: 2px;
      height: 2px;
      top: 18%;
      left: 17%;
      background: rgba(255,255,255,.9);
      box-shadow:
        72vw 10vh 0 rgba(255,255,255,.65),
        18vw 62vh 0 rgba(255,255,255,.7),
        78vw 72vh 0 rgba(255,255,255,.55),
        44vw 18vh 0 rgba(255,255,255,.5),
        60vw 84vh 0 rgba(255,255,255,.45),
        90vw 38vh 0 rgba(255,255,255,.65),
        8vw 36vh 0 rgba(255,255,255,.5);

    }

    #loading::after {

      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(116,53,220,.10), transparent 68%);
      filter: blur(8px);

    }

    #loading.fade-out {

    .loading-content {

      position: relative;

    .loading-moon {

      width: 82px;
      height: 82px;
      border-radius: 50%;
      position: relative;
      background: radial-gradient(circle at 34% 30%, #ffffff, #ddd8ea 48%, #9d93b9 100%);
      box-shadow: 0 0 28px rgba(194,178,255,.42), 0 0 80px rgba(112,51,220,.24);
      animation: loadingMoonFloat 2.8s ease-in-out infinite;

    }

    .loading-moon::before {

      content: "";
      position: absolute;
      inset: -15px;
      border: 1px solid rgba(187,160,255,.32);
      border-radius: 50%;
      border-left-color: transparent;
      border-bottom-color: transparent;
      animation: loadingOrbit 3.6s linear infinite;

    }

    .loading-moon::after {

      content: "";
      position: absolute;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: rgba(117,91,160,.22);
      top: 22px;
      left: 25px;
      box-shadow: 23px 18px 0 4px rgba(117,91,160,.12), -7px 27px 0 2px rgba(117,91,160,.14);

    .loading-title {

    .loading-dots {

    .loading-dots span {

      height: 5px;
      border-radius: 50%;
      background: #d9d0f0;
      opacity: .35;
      animation: loadingDot 1.2s ease-in-out infinite;

    }

    .loading-dots span:nth-child(2) { animation-delay: .16s; }
    .loading-dots span:nth-child(3) { animation-delay: .32s; }

    @keyframes loadingMoonFloat {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @keyframes loadingOrbit {
      to { transform: rotate(360deg); }
    }

    @keyframes loadingDot {
      0%,100% { opacity: .25; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-3px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .loading-moon, .loading-moon::before, .loading-dots span { animation: none; }
    }


    .login-error {

      width:
        min(430px, calc(100% - 35px));

        1px solid rgba(145,76,255,.45);

    ====================================== */

      body {

          0 13px;

      }

      }

          0 12px;

    }

@keyframes messageSent{0%{opacity:0;transform:translateY(12px) scale(.97);filter:blur(1px)}60%{opacity:1;transform:translateY(-2px) scale(1.008);filter:blur(0)}100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes messageEnter{to{opacity:1;transform:translateY(0);}}
@media (prefers-reduced-motion:reduce){.message.message-enter{animation:none;opacity:1;transform:none;}}
</style>

<body>


  <!-- ======================================

  <!-- STATUS -->

  <div id="status"></div>


  <script>


    /* ======================================
       SUPABASE
    ====================================== */

    const SUPABASE_URL =
      "https://qiynczbrhpxwuabwuyiy.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_eUPz4c_nYckgINEK-AIWqw_JAXIHozd";


    /*
      IMPORTANT

      The homepage uses Supabase OAuth.

      This chat page uses PKCE and manually
      exchanges the Google OAuth code.

      This makes logout -> login again work
      correctly instead of depending on an
      old browser session.
    */

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {

          auth: {

            persistSession: true,

            autoRefreshToken: true,

            detectSessionInUrl: false,

            flowType: "pkce"

          }

        }
      );


    /* ======================================
       ELEMENTS
    ====================================== */

    const loading =
      document.getElementById(
        "loading"
      );


    const userName =
      document.getElementById(
        "userName"
      );


    const sideName =
      document.getElementById(
        "sideName"
      );


    const logoutBtn =
      document.getElementById(
        "logoutBtn"
      );


    const messageInput =
      document.getElementById(
        "messageInput"
      );


    const sendButton =
      document.getElementById(
        "sendButton"
      );


    const messages =
      document.getElementById(
        "messages"
      );


    const status =
      document.getElementById(
        "status"
      );


    let currentUser =
      null;


    let authReady =
      false;


    let realtimeChannel =
      null;


    /* ======================================
       STATUS
    ====================================== */

    function showStatus(text) {

      status.textContent =
        text;

      status.style.display =
        "block";
      requestAnimationFrame(() => {
        status.classList.add("status-visible");
      });


      clearTimeout(
        showStatus.timer
      );


      showStatus.timer =
        setTimeout(
          () => {

            status.classList.remove("status-visible");
            setTimeout(() => {
              status.style.display = "none";
            }, 250);

          },
          3500
        );

    }


    /* ======================================
       LOGIN ERROR
    ====================================== */

    function showLoginError(text) {

      loading.innerHTML = `

        <div class="login-error">

          <h2>
            Unable to open chat
          </h2>

          <p>
            ${text}
          </p>

          <a
            class="back-button"
            href="./index.html"
          >
            Back to ToTalk
          </a>

        </div>

      `;


      loading.style.display =
        "flex";

    }


    /* ======================================
       USER
    ====================================== */

    function showUser(user) {

      currentUser =
        user;


      const name =
        user.user_metadata?.full_name ||
        user.user_metadata?.name ||
        user.email?.split("@")[0] ||
        "Sameer";


      userName.textContent =
        name;


      sideName.textContent =
        name;


      authReady =
        true;

    }


    /* ======================================
       FINISH CHAT LOADING
    ====================================== */

    function finishLoading() {

      if (
        loading.classList.contains("fade-out")
      ) {
        return;
      }

      loading.classList.add("fade-out");

      setTimeout(() => {
        loading.style.display = "none";
      }, 700);

    }


    /* ======================================
       MESSAGE ELEMENT
    ====================================== */

    function closeAllMessageMenus(exceptMenu = null) {
      document.querySelectorAll(".message-menu.open").forEach((menu) => {
        if (menu !== exceptMenu) menu.classList.remove("open");
      });
      document.querySelectorAll(".message-menu-btn[aria-expanded=\"true\"]").forEach((button) => {
        const wrap = button.closest(".message-menu-wrap");
        const menu = wrap ? wrap.querySelector(".message-menu") : null;
        if (!menu || menu !== exceptMenu) button.setAttribute("aria-expanded", "false");
      });
    }

    let activeEditCleanup = null;

    function closeOtherEditors(exceptMessage = null) {
      if (activeEditCleanup) {
        const current = document.querySelector(".message.is-editing");
        if (!exceptMessage || current !== exceptMessage) {
          const cleanup = activeEditCleanup;
          activeEditCleanup = null;
          cleanup();
        }
      }
      document.querySelectorAll(".message.is-editing").forEach((message) => {
        if (message !== exceptMessage) {
          const editor = message.querySelector(".edit-message-area");
          const text = message.querySelector(".message-text");
          const actions = message.querySelector(".message-actions");
          if (editor) editor.remove();
          if (actions) actions.remove();
          if (text) text.style.display = "";
          message.classList.remove("is-editing");
        }
      });
    }

    function addMessage(messageData, animate = false, delay = 0) {

      const welcome =
        document.getElementById(
          "welcomeMessage"
        );


      if (welcome) {

        welcome.remove();

      }


      /*
        Prevent duplicate realtime
        messages.
      */

      if (messageData.id) {

        const existing =
          document.querySelector(
            `[data-message-id="${messageData.id}"]`
          );


        if (existing) {

          return;

        }

      }


      const message =
        document.createElement(
          "div"
        );


      message.className =
        (
          currentUser &&
          messageData.sender_id ===
            currentUser.id
        )
          ? "message mine"
          : "message";

      if (animate) {

        message.style.animationDelay =
          delay + "ms";

        message.classList.add(
          "message-enter"
        );

    /* ======================================
       MESSAGE SEARCH
    ====================================== */

    const messageSearchToggle = document.getElementById("messageSearchToggle");
    const messageSearchBar = document.getElementById("messageSearchBar");
    const messageSearchInput = document.getElementById("messageSearchInput");
    const searchCount = document.getElementById("searchCount");
    const searchPrev = document.getElementById("searchPrev");
    const searchNext = document.getElementById("searchNext");
    const searchClose = document.getElementById("searchClose");
    let searchMatches = [];
    let searchIndex = -1;

    function escapeSearchRegex(value) {
      return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function clearSearchHighlights() {
      document.querySelectorAll(".message.search-active").forEach(el => el.classList.remove("search-active"));
      document.querySelectorAll(".message-text[data-search-original]").forEach(textEl => {
        textEl.textContent = textEl.dataset.searchOriginal;
        delete textEl.dataset.searchOriginal;
      });
    }

    function runMessageSearch() {
      clearSearchHighlights(); searchMatches = []; searchIndex = -1;
      const query = messageSearchInput.value.trim();
      if (!query) { searchCount.textContent = "0"; return; }
      const regex = new RegExp(escapeSearchRegex(query), "gi");
      document.querySelectorAll("#messages .message").forEach(messageEl => {
        if (messageEl.classList.contains("is-editing")) return;
        const textEl = messageEl.querySelector(".message-text");
        if (!textEl) return;
        const original = textEl.textContent || "";
        if (!regex.test(original)) return;
        regex.lastIndex = 0;
        textEl.dataset.searchOriginal = original;
        const fragment = document.createDocumentFragment();
        let last = 0, match;
        while ((match = regex.exec(original)) !== null) {
          fragment.appendChild(document.createTextNode(original.slice(last, match.index)));
          const mark = document.createElement("mark");
          mark.className = "search-hit"; mark.textContent = match[0];
          fragment.appendChild(mark);
          last = match.index + match[0].length;
        }
        fragment.appendChild(document.createTextNode(original.slice(last)));
        textEl.replaceChildren(fragment);
        searchMatches.push(messageEl);
      });
      if (!searchMatches.length) { searchCount.textContent = "0"; return; }
      searchIndex = 0; focusSearchResult();
    }

    function focusSearchResult() {
      searchMatches.forEach(el => el.classList.remove("search-active"));
      if (searchIndex < 0 || searchIndex >= searchMatches.length) return;
      const target = searchMatches[searchIndex];
      target.classList.add("search-active");
      target.scrollIntoView({behavior:"smooth", block:"center"});
      searchCount.textContent = `${searchIndex + 1}/${searchMatches.length}`;
    }

    function openMessageSearch() {
      closeAllMessageMenus();
      document.querySelectorAll(".reaction-picker.open").forEach((picker) => picker.classList.remove("open"));
      document.querySelectorAll(".reaction-target").forEach((el) => el.classList.remove("reaction-target"));
      messageSearchBar.classList.add("open");
      messageSearchBar.setAttribute("aria-hidden", "false");
      messageSearchToggle.setAttribute("aria-expanded", "true");
      messageSearchInput.focus();
    }

    function closeMessageSearch() {
      messageSearchBar.classList.remove("open");
      messageSearchBar.setAttribute("aria-hidden", "true");
      messageSearchToggle.setAttribute("aria-expanded", "false");
      messageSearchInput.value = "";
      clearSearchHighlights(); searchMatches = []; searchIndex = -1; searchCount.textContent = "0";
    }

    messageSearchToggle.addEventListener("click", (event) => {
      event.stopPropagation();
      messageSearchBar.classList.contains("open") ? closeMessageSearch() : openMessageSearch();
    });
    searchClose.addEventListener("click", closeMessageSearch);
    messageSearchInput.addEventListener("input", runMessageSearch);
    messageSearchInput.addEventListener("keydown", event => {
      if (event.key === "Enter" && searchMatches.length) { event.preventDefault(); event.shiftKey ? searchPrev.click() : searchNext.click(); }
      if (event.key === "Escape") closeMessageSearch();
    });
    searchNext.addEventListener("click", () => { if (searchMatches.length) { searchIndex=(searchIndex+1)%searchMatches.length; focusSearchResult(); } });
    searchPrev.addEventListener("click", () => { if (searchMatches.length) { searchIndex=(searchIndex-1+searchMatches.length)%searchMatches.length; focusSearchResult(); } });
    document.addEventListener("click", event => {
      if (messageSearchBar.classList.contains("open") && !event.target.closest(".chat-search-popover") && !event.target.closest("#messageSearchToggle")) closeMessageSearch();
    });

    function isNearBottom(){
      return (messages.scrollHeight - messages.scrollTop - messages.clientHeight) < 90;

    /* ======================================
       REACTIONS
    ====================================== */

    const REACTIONS = ["👍", "❤️", "😂", "😮", "😢", "😡"];

    function createReactionPicker(messageId, messageElement) {
      const picker = document.createElement("div");
      picker.className = "reaction-picker";
      picker.dataset.messageId = messageId || "";
      picker._messageElement = messageElement;

      REACTIONS.forEach((reaction) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = reaction;
        button.setAttribute("aria-label", "React " + reaction);
        button.addEventListener("click", async (event) => {
          event.stopPropagation();
          await toggleReaction(messageId, reaction, messageElement);
          picker.classList.remove("open");
          messageElement.classList.remove("reaction-target");
        });
        picker.appendChild(button);
      });

      return picker;
    }

    function placeReactionPicker(messageElement, picker) {
      if (!messageElement || !picker) return;

      picker.classList.remove("picker-left", "picker-above");

      const messageRect = messageElement.getBoundingClientRect();
      const gap = 8;
      const pickerWidth = Math.min(245, Math.max(190, picker.offsetWidth || 220));
      const pickerHeight = picker.offsetHeight || 48;

      let left = messageRect.right - pickerWidth;
      if (left < gap) {
        left = messageRect.left;
        picker.classList.add("picker-left");
      }

      if (left + pickerWidth > window.innerWidth - gap) {
        left = window.innerWidth - pickerWidth - gap;
      }
      left = Math.max(gap, left);

      let top = messageRect.bottom + 8;
      if (top + pickerHeight > window.innerHeight - gap) {
        top = messageRect.top - pickerHeight - 8;
        picker.classList.add("picker-above");
      }
      if (top < gap) {
        top = Math.min(window.innerHeight - pickerHeight - gap, messageRect.bottom + 8);
      }
      top = Math.max(gap, top);

      picker.style.left = Math.round(left) + "px";
      picker.style.top = Math.round(top) + "px";
    }

    function placeMessageMenu(messageElement, menu) {
      menu.classList.remove("menu-down");
      const messageRect = messageElement.getBoundingClientRect();
      const menuHeight = menu.offsetHeight || 90;
      const topSpace = messageRect.top - 8;
      if (topSpace < menuHeight) {
        menu.classList.add("menu-down");
      }
    }

    function toggleReactionPicker(messageElement, picker) {
      if (!picker) return;
      if (typeof closeMessageSearch === "function") closeMessageSearch();
      document.querySelectorAll(".reaction-picker.open").forEach((other) => {
        if (other !== picker) other.classList.remove("open");
      });
      document.querySelectorAll(".reaction-target").forEach((other) => {
        if (other !== messageElement) other.classList.remove("reaction-target");
      });
      const open = picker.classList.toggle("open");
      messageElement.classList.toggle("reaction-target", open);
      if (open) {
        requestAnimationFrame(() => placeReactionPicker(messageElement, picker));
      }
    }

    window.addEventListener("resize", () => {
      document.querySelectorAll(".reaction-picker.open").forEach((picker) => {
        const message = picker._messageElement;
        if (message) placeReactionPicker(message, picker);
      });
      document.querySelectorAll(".message-menu.open").forEach((menu) => {
        const message = menu.closest(".message");
        if (message) placeMessageMenu(message, menu);
      });
    });

    function attachReactionGestures(messageElement, messageId) {
      if (!messageId) return;
      let pressTimer = null;

      messageElement.addEventListener("contextmenu", (event) => {
        event.preventDefault();
        const picker = messageElement._reactionPicker;
        toggleReactionPicker(messageElement, picker);
      });

      messageElement.addEventListener("touchstart", () => {
        pressTimer = setTimeout(() => {
          const picker = messageElement.querySelector(".reaction-picker");
          toggleReactionPicker(messageElement, picker);
        }, 550);
      }, { passive: true });

      ["touchend", "touchmove", "touchcancel"].forEach((eventName) => {
        messageElement.addEventListener(eventName, () => {
          if (pressTimer) clearTimeout(pressTimer);
          pressTimer = null;
        }, { passive: true });
      });
    }

    async function toggleReaction(messageId, reaction, messageElement) {
      if (!messageId || !currentUser) return;

      // If the user taps the same reaction again, remove it.
      const existingResult = await supabaseClient
        .from("message_reactions")
        .select("id, reaction")
        .eq("message_id", messageId)
        .eq("user_id", currentUser.id);

      if (existingResult.error) {
        console.error("Reaction lookup error:", existingResult.error);
        showStatus("Reaction could not be changed.");
        return;
      }

      const existing = existingResult.data && existingResult.data[0];

      if (existing && existing.reaction === reaction) {
        const removeResult = await supabaseClient
          .from("message_reactions")
          .delete()
          .eq("message_id", messageId)
          .eq("user_id", currentUser.id);

        if (removeResult.error) {
          console.error("Reaction delete error:", removeResult.error);
          showStatus("Reaction could not be changed.");
          return;
        }
      } else {
        // Different reaction: remove the old one first, then save the new one.
        const removeResult = await supabaseClient
          .from("message_reactions")
          .delete()
          .eq("message_id", messageId)
          .eq("user_id", currentUser.id);

        if (removeResult.error) {
          console.error("Reaction delete error:", removeResult.error);
          showStatus("Reaction could not be changed.");
          return;
        }

        const insertResult = await supabaseClient
          .from("message_reactions")
          .insert({
            message_id: messageId,
            user_id: currentUser.id,
            reaction: reaction
          });

        if (insertResult.error) {
          console.error("Reaction insert error:", insertResult.error);
          showStatus("Reaction could not be changed.");
          return;
        }
      }

      await refreshReactionForMessage(messageId);
    }

    async function refreshReactionForMessage(messageId) {
      if (!messageId) return;

      const { data, error } = await supabaseClient
        .from("message_reactions")
        .select("user_id, reaction")
        .eq("message_id", messageId);

      if (error) {
        console.error("Reaction load error:", error);
        return;
      }

      renderReactionSummary(messageId, data || []);
    }

    function renderReactionSummary(messageId, reactions) {
      const messageElement = document.querySelector(`[data-message-id="${messageId}"]`);
      if (!messageElement) return;

      let summary = messageElement.querySelector(".reaction-summary");
      if (!summary) {
        summary = document.createElement("div");
        summary.className = "reaction-summary";
        summary.dataset.reactionSummary = "true";
        messageElement.appendChild(summary);
      }

      const counts = {};
      const mine = new Set();
      reactions.forEach((item) => {
        counts[item.reaction] = (counts[item.reaction] || 0) + 1;
        if (currentUser && item.user_id === currentUser.id) mine.add(item.reaction);
      });

      summary.innerHTML = "";
      REACTIONS.forEach((reaction) => {
        if (!counts[reaction]) return;
        const chip = document.createElement("span");
        chip.className = "reaction-chip" + (mine.has(reaction) ? " mine" : "");
        chip.textContent = reaction + " " + counts[reaction];
        summary.appendChild(chip);
      });

      summary.classList.toggle("has-reactions", Object.keys(counts).length > 0);
    }

    async function loadAllReactions() {
      const { data, error } = await supabaseClient
        .from("message_reactions")
        .select("message_id, user_id, reaction");

      if (error) {
        console.error("Load reactions error:", error);
        return;
      }

      const grouped = {};
      (data || []).forEach((item) => {
        if (!grouped[item.message_id]) grouped[item.message_id] = [];
        grouped[item.message_id].push(item);
      });

      document.querySelectorAll("[data-message-id]").forEach((messageElement) => {
        const id = messageElement.dataset.messageId;
        renderReactionSummary(id, grouped[id] || []);
      });
    }

    document.addEventListener("click", (event) => {
      if (!event.target.closest(".message-menu-wrap") && !event.target.closest(".reaction-picker")) {
        document.querySelectorAll(".message-menu.open").forEach((menu) => menu.classList.remove("open"));
        document.querySelectorAll(".message-menu-btn[aria-expanded=\"true\"]").forEach((button) => button.setAttribute("aria-expanded", "false"));
        document.querySelectorAll(".reaction-picker.open").forEach((picker) => picker.classList.remove("open"));
        document.querySelectorAll(".reaction-target").forEach((message) => message.classList.remove("reaction-target"));
      }
    });

    /* ======================================
       EDIT MESSAGE
    ====================================== */

    async function editMessage(messageId, messageElement, textElement) {
      if (!messageId || !currentUser || !textElement) return;
      if (messageElement.classList.contains("is-editing")) return;

      closeOtherEditors(messageElement);
      closeAllMessageMenus();

      const menuWrap = messageElement.querySelector(".message-menu-wrap");
      const originalContent = textElement.textContent || "";

      const editor = document.createElement("textarea");
      editor.className = "edit-message-area";
      editor.value = originalContent;
      editor.maxLength = 5000;
      editor.setAttribute("aria-label", "Edit message");

      const saveRow = document.createElement("div");
      saveRow.className = "message-actions";

      const saveButton = document.createElement("button");
      saveButton.className = "message-action-btn";
      saveButton.type = "button";
      saveButton.textContent = "Save";

      const cancelButton = document.createElement("button");
      cancelButton.className = "message-action-btn";
      cancelButton.type = "button";
      cancelButton.textContent = "Cancel";

      saveRow.append(saveButton, cancelButton);

      // Replace the text node completely while editing. This prevents the
      // old message text from remaining visible behind the editor.
      textElement.replaceWith(editor);
      messageElement.appendChild(saveRow);
      messageElement.classList.add("is-editing");
      if (menuWrap) menuWrap.style.display = "none";

      const restore = () => {
        if (!messageElement.isConnected) return;
        if (editor.isConnected) editor.replaceWith(textElement);
        if (saveRow.isConnected) saveRow.remove();
        messageElement.classList.remove("is-editing");
        if (menuWrap) menuWrap.style.display = "";
      };

      const cleanup = () => {
        if (activeEditCleanup === cleanup) activeEditCleanup = null;
        restore();
      };
      activeEditCleanup = cleanup;

      editor.focus();
      editor.setSelectionRange(editor.value.length, editor.value.length);

      cancelButton.addEventListener("click", cleanup);

      saveButton.addEventListener("click", async () => {
        const newContent = editor.value.trim();
        if (!newContent) {
          showStatus("Message cannot be empty.");
          editor.focus();
          return;
        }
        if (newContent === originalContent) {
          cleanup();
          return;
        }

        saveButton.disabled = true;
        cancelButton.disabled = true;
        saveButton.textContent = "Saving...";

        const { data, error } = await supabaseClient
          .from("messages")
          .update({ content: newContent, edited_at: new Date().toISOString() })
          .eq("id", messageId)
          .eq("sender_id", currentUser.id)
          .select("id, sender_id, content, created_at, edited_at")
          .single();

        if (error) {
          console.error("Edit message error:", error);
          saveButton.disabled = false;
          cancelButton.disabled = false;
          saveButton.textContent = "Save";
          showStatus("Message could not be edited.");
          return;
        }

        textElement.textContent = data.content;
        const timeElement = messageElement.querySelector(".message-time");
        if (timeElement) {
          const date = data.created_at ? new Date(data.created_at) : null;
          const timeText = date
            ? date.toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" })
            : timeElement.textContent.split(" · ")[0];
          timeElement.textContent = data.edited_at ? timeText + " · edited" : timeText;
        }

        cleanup();
      });

      editor.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          event.preventDefault();
          cleanup();
        }
        if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
          event.preventDefault();
          saveButton.click();
        }
      });
    }

    async function deleteMessage(messageId, messageElement) {
      if (!messageId || !currentUser) return;

      if (!window.confirm("Delete this message?")) return;

      const menuButton = messageElement.querySelector(".message-menu-btn");
      if (menuButton) {

      }

      const { error } = await supabaseClient
        .from("messages")
        .delete()
        .eq("id", messageId)
        .eq("sender_id", currentUser.id);

      if (error) {
        console.error("Delete message error:", error);
        if (menuButton) {
          menuButton.disabled = false;
        }
        showStatus("Message could not be deleted.");

      }

      messageElement.classList.add("deleting");
      setTimeout(() => {
        messageElement.remove();
        if (!messages.querySelector(".message")) {
          messages.innerHTML = `<div class="welcome-message" id="welcomeMessage"><h3>Welcome to ToTalk</h3><p>Your conversation space is ready. Write a message below to begin.</p></div>`;
        }

    /* ======================================
       LOAD SAVED MESSAGES
    ====================================== */

    async function loadMessages() {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("messages")
          .select(
            "id, sender_id, content, created_at, edited_at"
          )
          .order(
            "created_at",
            {
              ascending: true
            }
          );


      if (error) {

        console.error(
          "Load messages error:",
          error
        );


        showStatus(
          "Messages could not be loaded."
        );


        return;

      }


      messages.innerHTML =
        "";


      if (
        !data ||
        data.length === 0
      ) {

        messages.innerHTML = `

          <div
            class="welcome-message"
            id="welcomeMessage"
          >

            <h3>
              Welcome to ToTalk
            </h3>

            <p>
              Your conversation space is ready.
              Write a message below to begin.
            </p>

          </div>

        `;


        return;

      }


      data.forEach(
        (messageData, index) => {

          addMessage(
            messageData,
            true,

          );

        }
      );

      scrollToBottom(
        false
      );

      markMessagesRead();
      await loadAllReactions();

    /* ======================================
       SEND MESSAGE
    ====================================== */

    async function sendMessage() {

      const text =
        messageInput.value.trim();


      if (!text) {

        return;

      }


      if (
        !authReady ||
        !currentUser
      ) {

        showStatus(
          "Your login session is not ready."
        );


        return;

      }


      sendButton.disabled =
        true;


      sendButton.textContent =
        "Saving";


      try {


        /* -------------------------------
           GET CURRENT SESSION
        ------------------------------- */

        const {
          data: sessionData,
          error: sessionError
        } =
          await supabaseClient.auth
            .getSession();


        if (
          sessionError ||
          !sessionData ||
          !sessionData.session ||
          !sessionData.session.user
        ) {

          showStatus(
            "Login session expired. Please sign in again."
          );


          return;

        }


        const user =
          sessionData.session.user;


        currentUser =
          user;


        /* -------------------------------
           SAVE TO SUPABASE
        ------------------------------- */

        const {
          data,
          error
        } =
          await supabaseClient
            .from("messages")
            .insert([
              {

                sender_id:
                  user.id,

                content:
                  text

              }
            ])
            .select(
              "id, sender_id, content, created_at, edited_at"
            )
            .single();


        if (error) {

          console.error(
            "Supabase INSERT ERROR:",
            error
          );


          showStatus(
            "Message was not saved: " +
            error.message
          );


          return;

        }


        /* -------------------------------
           SHOW SAVED MESSAGE
        ------------------------------- */

        addMessage(
          data,
          true,
          0
        );


        messageInput.value =
          "";


        /*
          Automatically scroll to
          newest message.
        */

        scrollToBottom(
          true
        );
        markMessagesRead();


      } catch (error) {

        console.error(
          "Send message error:",
          error
        );


        showStatus(
          "Something went wrong while saving."
        );


      } finally {

        sendButton.disabled =
          false;


        sendButton.textContent =
          "Send";

      }

    }


    /* ======================================
       ONLINE / OFFLINE PRESENCE
    ====================================== */

    let presenceChannel = null;

    function setPresenceUI(isOnline) {

      const statuses = [
        document.getElementById("sidePresence"),
        document.getElementById("chatPresence")
      ];

      statuses.forEach((el) => {
        if (!el) return;

        el.classList.toggle("online", isOnline);
        el.classList.toggle("offline", !isOnline);

        const icon = el.querySelector(".presence-icon");
        const label = el.querySelector(".presence-label");

        if (icon) {
          icon.innerHTML = isOnline
            ? '<span class="moon-icon"></span>'
            : '<span class="sun-icon"></span>';
        }

        if (label) label.textContent = isOnline ? "Online" : "Offline";
      });
    }

    async function startPresence() {

      if (!currentUser) return;

      if (presenceChannel) {
        await supabaseClient.removeChannel(presenceChannel);
      }

      presenceChannel = supabaseClient.channel("totalk-presence", {
        config: {
          presence: { key: currentUser.id }
        }
      });

      presenceChannel.on("presence", { event: "sync" }, () => {
        const state = presenceChannel.presenceState();
        setPresenceUI(Object.keys(state).length > 0);
      });

      presenceChannel.on("presence", { event: "join" }, () => {
        setPresenceUI(true);
      });

      presenceChannel.on("presence", { event: "leave" }, () => {
        const state = presenceChannel.presenceState();
        setPresenceUI(Object.keys(state).length > 0);
      });

      const status = await presenceChannel.subscribe(async (status) => {
        if (status === "SUBSCRIBED") {
          await presenceChannel.track({
            user_id: currentUser.id,
            online_at: new Date().toISOString()
          });
          setPresenceUI(true);
        }
      });

      if (status !== "SUBSCRIBED") {
        setPresenceUI(false);
      }
    }

    /* ======================================
       REAL-TIME MESSAGES
    ====================================== */

    function startRealtime() {

      /*
        Remove old channel if one exists.
      */

      if (realtimeChannel) {

        supabaseClient
          .removeChannel(
            realtimeChannel
          );

      }


      realtimeChannel =
        supabaseClient
          .channel(
            "totalk-messages"
          )


          .on(
            "postgres_changes",
            {
              event: "*",
              schema: "public",
              table: "messages"
            },
            (payload) => {
              if (payload.eventType === "INSERT") {
                const wasNearBottom = isNearBottom();
                addMessage(payload.new);
                if (wasNearBottom) {
                  scrollToBottom(true);
                  markMessagesRead();
                } else {
                  unreadCount += 1;
                  updateUnreadUI();
                }
                return;
              }

              if (payload.eventType === "UPDATE" && payload.new?.id) {
                const updatedMessage = document.querySelector(`[data-message-id="${payload.new.id}"]`);
                if (updatedMessage) {
                  const updatedText = updatedMessage.querySelector(".message-text");
                  if (updatedText) updatedText.textContent = payload.new.content;

                  const updatedTime = updatedMessage.querySelector(".message-time");
                  if (updatedTime && payload.new.created_at) {
                    const updatedDate = new Date(payload.new.created_at);
                    const updatedTimeText = updatedDate.toLocaleTimeString(
                      [],
                      {
                        hour: "2-digit",
                        minute: "2-digit"
                      }
                    );
                    updatedTime.textContent =
                      payload.new.edited_at
                        ? updatedTimeText + " · edited"
                        : updatedTimeText;
                  }
                }
                return;
              }

              if (payload.eventType === "DELETE" && payload.old?.id) {
                const deletedMessage = document.querySelector(`[data-message-id="${payload.old.id}"]`);
                if (deletedMessage) {
                  deletedMessage.classList.add("deleting");
                  setTimeout(() => deletedMessage.remove(), 220);
                }
              }
            }
          )

          .on(
            "postgres_changes",
            {
              event: "*",
              schema: "public",
              table: "message_reactions"
            },
            async (payload) => {
              const messageId = payload.new?.message_id || payload.old?.message_id;
              if (messageId) await refreshReactionForMessage(messageId);
            }
          )

          .subscribe();

    }


    /* ======================================
       START CHAT / GOOGLE CALLBACK
    ====================================== */

    async function startChat() {

      try {


        /*
          Google/Supabase sends us back
          to chat.html with:

          ?code=........
        */

        const params =
          new URLSearchParams(
            window.location.search
          );


        const code =
          params.get("code");


        /* -------------------------------
           EXCHANGE GOOGLE CODE
        ------------------------------- */

        if (code) {


          const {
            data,
            error
          } =
            await supabaseClient.auth
              .exchangeCodeForSession(
                code
              );


          if (error) {

            console.error(
              "OAuth code exchange error:",
              error
            );


            showLoginError(
              "Google login could not be completed. Please return to the homepage and try again."
            );


            return;

          }


          /*
            Remove ?code=... from URL.

            This also prevents the same
            OAuth code being processed again
            if the page is refreshed.
          */

          window.history.replaceState(
            {},
            document.title,
            window.location.pathname
          );


        }


        /* -------------------------------
           GET SESSION
        ------------------------------- */

        const {
          data,
          error
        } =
          await supabaseClient.auth
            .getSession();


        if (error) {

          console.error(
            "Session error:",
            error
          );


          showLoginError(
            "ToTalk could not read your login session. Please return to the homepage and try again."
          );


          return;

        }


        if (
          !data ||
          !data.session ||
          !data.session.user
        ) {


          /*
            Give Supabase a short moment
            in case the browser is still
            finishing the OAuth callback.
          */

          setTimeout(
            async () => {

              const {
                data: retryData,
                error: retryError
              } =
                await supabaseClient
                  .auth
                  .getSession();


              if (
                !retryError &&
                retryData?.session?.user
              ) {

                currentUser =
                  retryData.session.user;


                showUser(
                  retryData.session.user
                );


                await loadMessages();

                finishLoading();


                startRealtime();
                startPresence();


                return;

              }


              showLoginError(
                "No active Google login session was found. Please return to the homepage and tap Continue with Google again."
              );


            },
            1200
          );


          return;

        }


        /* -------------------------------
           LOGIN SUCCESS
        ------------------------------- */

        currentUser =
          data.session.user;


        showUser(
          currentUser
        );


        /* -------------------------------
           LOAD DATABASE MESSAGES
        ------------------------------- */

        await loadMessages();

        finishLoading();


        /* -------------------------------
           START REALTIME
        ------------------------------- */

        startRealtime();
        startPresence();


      } catch (error) {

        console.error(
          "Chat startup error:",
          error
        );


        showLoginError(
          "ToTalk could not finish opening your chat. Please return to the homepage and sign in again."
        );

      }

    }


    /* ======================================
       LOGOUT
    ====================================== */

    logoutBtn.addEventListener(
      "click",
      async () => {

        logoutBtn.disabled =
          true;


        logoutBtn.textContent =
          "Logging out";


        /*
          Stop realtime before logout.
        */

        if (realtimeChannel) {

          await supabaseClient
            .removeChannel(
              realtimeChannel
            );

          realtimeChannel =
            null;

        }


        /*
          Sign out completely.
        */

        const {
          error
        } =
          await supabaseClient.auth
            .signOut();


        if (error) {

          console.error(
            "Logout error:",
            error
          );


          logoutBtn.disabled =
            false;


          logoutBtn.textContent =
            "Logout";


          showStatus(
            "Logout failed. Please try again."
          );


          return;

        }


        /*
          Go back to homepage.
        */

        window.location.replace(
          "./index.html"
        );

      }
    );


    /* ======================================
       SEND BUTTON
    ====================================== */

    sendButton.addEventListener(
      "click",
      sendMessage
    );


    /* ======================================
       ENTER KEY
    ====================================== */

    messageInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* ======================================
       AUTH STATE LISTENER
    ====================================== */

    supabaseClient.auth
      .onAuthStateChange(
        (event, session) => {

          console.log(
            "Supabase auth event:",
            event
          );


          if (
            session &&
            session.user &&
            !currentUser
          ) {

            currentUser =
              session.user;

          }

        }
      );


    /* ======================================
       START EVERYTHING
    ====================================== */

    startChat();

  </script>
