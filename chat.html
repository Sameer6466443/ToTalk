<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020108">
<title>ToTalk</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --black:#020108;
  --dark:#070313;
  --panel:#090517;
  --panel2:#0d071b;
  --purple:#914cff;
  --purple2:#aa69ff;
  --purple3:#6324ca;
  --white:#f8f5ff;
  --muted:#928ba8;
  --green:#52e69a;
  --yellow:#ffe34f;
  --border:rgba(145,76,255,.40);
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020108;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--white);

  background:
    radial-gradient(
      ellipse at 70% 25%,
      rgba(111,36,191,.20),
      transparent 32%
    ),
    radial-gradient(
      ellipse at 15% 85%,
      rgba(81,29,160,.15),
      transparent 30%
    ),
    linear-gradient(
      135deg,
      #020108,
      #070313 50%,
      #020108
    );
}

/* =====================================================
   PERFORMANCE OPTIMIZATION
===================================================== */

button,
input,
textarea{
  -webkit-tap-highlight-color:transparent;
}

.chat-box,
.sidebar,
.input-area,
.chat-top,
#messages{
  transform:translateZ(0);
}

.chat-box{
  contain:layout paint;
}

.sidebar{
  contain:layout paint;
}

/* =====================================================
   BACKGROUND STARS
===================================================== */

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  opacity:.58;

  background-image:
    radial-gradient(
      circle,
      rgba(255,255,255,.78) 1px,
      transparent 1.5px
    ),
    radial-gradient(
      circle,
      rgba(210,190,255,.65) 1px,
      transparent 1.5px
    ),
    radial-gradient(
      circle,
      rgba(255,255,255,.50) 1px,
      transparent 1.5px
    );

  background-size:
    115px 115px,
    175px 175px,
    245px 245px;

  background-position:
    15px 25px,
    70px 90px,
    130px 45px;

  contain:strict;
}

/* =====================================================
   LOADING
===================================================== */

#loading{
  position:fixed;
  inset:0;
  z-index:999999;

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 44%,
      rgba(113,63,255,.16),
      transparent 28%
    ),
    radial-gradient(
      circle at 20% 80%,
      rgba(71,42,175,.10),
      transparent 32%
    ),
    #020108;

  opacity:1;
  visibility:visible;

  transition:
    opacity .42s ease,
    visibility .42s ease;
}

#loading.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.loading-stars{
  position:absolute;
  inset:0;
  pointer-events:none;

  background-image:
    radial-gradient(
      circle at 8% 14%,
      rgba(255,255,255,.75) 0 1px,
      transparent 1.6px
    ),
    radial-gradient(
      circle at 18% 48%,
      rgba(185,151,255,.7) 0 1px,
      transparent 1.6px
    ),
    radial-gradient(
      circle at 28% 82%,
      rgba(255,255,255,.65) 0 1px,
      transparent 1.6px
    ),
    radial-gradient(
      circle at 38% 22%,
      rgba(255,255,255,.72) 0 1px,
      transparent 1.6px
    ),
    radial-gradient(
      circle at 55% 72%,
      rgba(185,151,255,.6) 0 1px,
      transparent 1.6px
    ),
    radial-gradient(
      circle at 66% 16%,
      rgba(255,255,255,.7) 0 1px,
      transparent 1.6px
    ),
    radial-gradient(
      circle at 78% 62%,
      rgba(255,255,255,.65) 0 1px,
      transparent 1.6px
    ),
    radial-gradient(
      circle at 92% 24%,
      rgba(185,151,255,.65) 0 1px,
      transparent 1.6px
    );
}

.loading-nebula{
  position:absolute;
  width:330px;
  height:330px;
  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(126,73,255,.16),
      rgba(76,42,180,.06) 46%,
      transparent 70%
    );

  /* Removed expensive blur */
  animation:loadingNebula 4s ease-in-out infinite;
}

.loading-system{
  position:relative;
  width:190px;
  height:145px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.loading-orbit{
  position:absolute;
  width:170px;
  height:58px;

  border:1px solid rgba(174,132,255,.36);
  border-radius:50%;

  animation:loadingOrbit 7s linear infinite;
}

.loading-orbit.two{
  width:182px;
  height:64px;

  border-color:rgba(145,95,255,.18);

  animation:
    loadingOrbitTwo
    9s linear infinite reverse;
}

.loading-moon{
  width:62px;
  height:62px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 31% 25%,
      #fff,
      #eeeaff 52%,
      #d5d0e5 100%
    );

  box-shadow:
    0 0 15px rgba(255,255,255,.20),
    0 0 35px rgba(127,72,255,.22);

  animation:
    loadingFloat
    3.5s ease-in-out infinite;
}

.loading-moon:before,
.loading-moon:after{
  content:"";
  position:absolute;
  border-radius:50%;
  background:rgba(130,120,160,.16);
}

.loading-moon:before{
  width:10px;
  height:10px;
  left:15px;
  top:19px;
}

.loading-moon:after{
  width:15px;
  height:15px;
  right:12px;
  top:29px;
}

.loading-title{
  position:relative;
  margin-top:4px;

  font-size:25px;
  line-height:1;
  font-weight:800;
  letter-spacing:-.5px;
  text-align:center;
}

.loading-subtitle{
  position:relative;
  margin-top:10px;

  color:#9d96ae;
  font-size:13px;
  text-align:center;
}

.loading-dots{
  position:relative;

  display:flex;
  gap:7px;
  margin-top:15px;
}

.loading-dots span{
  width:6px;
  height:6px;

  border-radius:50%;
  background:#bfa4ff;

  animation:
    loadingDot
    1.25s ease-in-out infinite;
}

.loading-dots span:nth-child(2){
  animation-delay:.16s;
}

.loading-dots span:nth-child(3){
  animation-delay:.32s;
}

@keyframes loadingDot{
  0%,100%{
    transform:translateY(0);
    opacity:.25;
  }

  50%{
    transform:translateY(-4px);
    opacity:.9;
  }
}

@keyframes loadingFloat{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-4px);
  }
}

@keyframes loadingOrbit{
  from{
    transform:rotate(-16deg) rotate(0deg);
  }

  to{
    transform:rotate(-16deg) rotate(360deg);
  }
}

@keyframes loadingOrbitTwo{
  from{
    transform:rotate(25deg) rotate(0deg);
  }

  to{
    transform:rotate(25deg) rotate(360deg);
  }
}

@keyframes loadingNebula{
  0%,100%{
    transform:scale(.96);
    opacity:.65;
  }

  50%{
    transform:scale(1.04);
    opacity:.9;
  }
}

/* =====================================================
   HEADER
===================================================== */

header{
  position:relative;
  z-index:20;

  height:78px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 24px;

  background:rgba(3,2,10,.96);

  border-bottom:1px solid var(--border);

  box-shadow:
    0 0 20px rgba(104,42,190,.10);
}

.brand{
  font-size:26px;
  font-weight:900;
  letter-spacing:-.8px;
}

.brand-main{
  color:#fff;
}

.header-right{
  display:flex;
  align-items:center;
  gap:15px;
}

#userName{
  color:#aaa3bb;
  font-size:13px;
  font-weight:700;
}

#logoutBtn{
  width:104px;
  height:42px;

  border:1px solid rgba(160,120,255,.24);

  background:rgba(255,255,255,.035);

  color:#fff;

  padding:0;

  border-radius:14px;

  font:inherit;
  font-size:13px;
  font-weight:700;

  cursor:pointer;

  transition:
    border-color .18s ease,
    background .18s ease;
}

#logoutBtn:hover{
  border-color:rgba(166,116,255,.52);
  background:rgba(125,76,255,.1);
}

/* =====================================================
   MAIN
===================================================== */

.chat-layout{
  position:relative;
  z-index:2;

  width:100%;
  height:calc(100dvh - 78px);

  padding:16px;

  display:grid;

  grid-template-columns:
    235px
    minmax(0,1fr);

  gap:14px;
}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
  min-width:0;
  overflow:hidden;

  border:1px solid var(--border);
  border-radius:14px;

  background:
    linear-gradient(
      180deg,
      rgba(9,6,23,.97),
      rgba(3,2,12,.98)
    );

  box-shadow:
    0 0 22px rgba(95,35,180,.08);
}

.sidebar-title{
  padding:22px 20px 18px;

  border-bottom:
    1px solid rgba(145,76,255,.18);
}

.sidebar-title h2{
  font-size:18px;
  margin-bottom:7px;
}

.sidebar-title p{
  color:var(--muted);
  font-size:11px;
}

.chat-person{
  position:relative;

  margin:17px 15px;
  padding:13px;

  display:flex;
  align-items:center;
  gap:11px;

  border:1px solid rgba(145,76,255,.32);
  border-radius:12px;

  background:
    linear-gradient(
      135deg,
      rgba(95,37,165,.35),
      rgba(27,12,59,.65)
    );
}

.avatar,
.chat-avatar{
  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      #a45cff,
      #6321d8
    );

  font-weight:900;

  box-shadow:
    0 0 16px rgba(145,76,255,.32);
}

.avatar{
  width:43px;
  height:43px;
  flex:0 0 43px;
}

.person-name{
  font-size:13px;
  font-weight:800;
}

.presence{
  margin-top:5px;

  display:flex;
  align-items:center;
  gap:6px;

  color:#bda8ff;

  font-size:10px;
  font-weight:700;
}

.presence-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--green);

  box-shadow:
    0 0 7px rgba(82,230,154,.55);
}

/* =====================================================
   CHAT BOX
===================================================== */

.chat-box{
  position:relative;

  min-width:0;
  min-height:0;

  overflow:hidden;

  border:1px solid var(--border);
  border-radius:14px;

  background:rgba(3,2,12,.88);

  box-shadow:
    0 0 24px rgba(95,35,180,.10);
}

.chat-top{
  height:64px;

  display:flex;
  align-items:center;
  gap:11px;

  padding:10px 16px;

  border-bottom:
    1px solid rgba(145,76,255,.28);

  background:rgba(5,3,14,.94);

  position:relative;
  z-index:5;
}

.chat-avatar{
  width:40px;
  height:40px;
  flex:0 0 40px;
}

.chat-title{
  font-size:14px;
  font-weight:900;
}

.chat-status{
  display:flex;
  align-items:center;
  gap:6px;

  margin-top:4px;

  color:#bda8ff;

  font-size:10px;
  font-weight:700;
}

.chat-actions{
  margin-left:auto;

  display:flex;
  align-items:center;
  gap:12px;
}

.search-btn,
.star-btn{
  border:0;
  background:transparent;
  color:#d9d0ed;
  cursor:pointer;
  font-size:22px;
}

.search-btn{
  font-size:19px;
}

/* =====================================================
   MESSAGE AREA
===================================================== */

#messages{
  position:absolute;

  inset:64px 0 0 0;

  overflow-y:auto;

  padding:
    20px
    20px
    100px;

  scroll-behavior:auto;

  overscroll-behavior:contain;

  -webkit-overflow-scrolling:touch;

  contain:
    layout
    paint
    style;
}

#messages::-webkit-scrollbar{
  width:5px;
}

#messages::-webkit-scrollbar-thumb{
  background:rgba(145,76,255,.22);
  border-radius:10px;
}

/* =====================================================
   GALAXY CHAT BACKGROUND
===================================================== */

.chat-space{
  position:absolute;

  inset:64px 0 0;

  pointer-events:none;

  overflow:hidden;

  contain:strict;
}

.chat-moon{
  position:absolute;

  left:55px;
  top:28px;

  width:64px;
  height:64px;

  border-radius:50%;

  background:#fff9a8;

  box-shadow:
    0 0 25px rgba(255,225,60,.28);
}

.chat-moon:after{
  content:"";

  position:absolute;

  width:64px;
  height:64px;

  border-radius:50%;

  background:#05020f;

  left:20px;
  top:-4px;
}

.chat-planet{
  position:absolute;

  right:35px;
  top:55px;

  width:78px;
  height:78px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 30% 30%,
      #6d739a,
      #252841 70%,
      #17182b
    );

  box-shadow:
    0 0 20px rgba(100,100,180,.20);
}

.chat-planet:after{
  content:"";

  position:absolute;

  width:130px;
  height:30px;

  border:
    1px solid
    rgba(173,135,255,.40);

  border-radius:50%;

  left:-26px;
  top:23px;

  transform:rotate(-14deg);
}

.nebula{
  position:absolute;

  width:320px;
  height:230px;

  left:50%;
  top:100px;

  transform:translateX(-50%);

  border-radius:50%;

  /* No blur filter */
  background:
    radial-gradient(
      ellipse,
      rgba(115,39,190,.20),
      rgba(80,30,150,.08) 40%,
      transparent 70%
    );
}

.welcome-message{
  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-42%);

  width:min(90%,500px);

  text-align:center;

  z-index:2;
}

.welcome-message h3{
  font-size:18px;
  margin-bottom:8px;
}

.welcome-message p{
  color:#777187;
  font-size:11px;
}

/* =====================================================
   MESSAGES
===================================================== */

.message-row{
  position:relative;

  display:flex;

  margin-bottom:13px;

  z-index:3;

  contain:layout;
}

.message-row.mine{
  justify-content:flex-end;
}

.message{
  position:relative;

  max-width:min(70%,560px);

  padding:11px 13px 8px;

  border:
    1px solid
    rgba(145,76,255,.25);

  border-radius:
    15px 15px 15px 4px;

  background:
    linear-gradient(
      135deg,
      rgba(15,8,31,.96),
      rgba(25,11,47,.94)
    );

  box-shadow:
    0 4px 15px rgba(0,0,0,.16);

  animation:
    messageIn .25s ease both;
}

.mine .message{
  border-radius:
    15px 15px 4px 15px;

  background:
    linear-gradient(
      135deg,
      #5620b0,
      #7c3ee1
    );

  border-color:
    rgba(184,143,255,.55);
}

.message-text{
  white-space:pre-wrap;
  word-break:break-word;

  font-size:13px;
  line-height:1.45;

  padding-right:30px;
}

.message-time{
  display:inline-block;

  margin-top:5px;

  color:rgba(255,255,255,.52);

  font-size:9px;
}

.message-status{
  display:inline-block;

  margin-left:7px;

  color:rgba(255,255,255,.62);

  font-size:9px;
}

.message-status.seen{
  color:#d8c5ff;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(6px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

.message.deleting{
  opacity:0;

  transform:scale(.95);

  transition:
    opacity .18s ease,
    transform .18s ease;
}

/* =====================================================
   REPLY
===================================================== */

.reply-preview{
  margin-bottom:7px;

  padding:6px 8px;

  border-left:
    2px solid
    #c39cff;

  border-radius:5px;

  background:rgba(255,255,255,.08);
}

.reply-name{
  font-size:9px;
  font-weight:800;

  color:#d0b8ff;

  margin-bottom:2px;
}

.reply-text{
  color:rgba(255,255,255,.65);

  font-size:9px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* =====================================================
   MESSAGE MENU
===================================================== */

.message-menu-btn{
  position:absolute;

  right:5px;
  top:5px;

  width:25px;
  height:25px;

  border:0;

  border-radius:50%;

  background:rgba(0,0,0,.15);

  color:#fff;

  cursor:pointer;

  opacity:.7;
}

.message-menu{
  display:none;

  position:fixed;

  z-index:999999;

  min-width:125px;

  padding:5px;

  border:
    1px solid
    var(--border);

  border-radius:10px;

  background:#100820;

  box-shadow:
    0 12px 28px rgba(0,0,0,.40);
}

.message-menu.open{
  display:block;
}

.message-menu button{
  display:block;

  width:100%;

  padding:9px 10px;

  border:0;

  border-radius:7px;

  background:transparent;

  color:#eee9f8;

  text-align:left;

  font-size:12px;

  cursor:pointer;
}

.message-menu button:hover{
  background:rgba(145,76,255,.18);
}

/* =====================================================
   REACTION PICKER
===================================================== */

.reaction-picker{
  display:none;

  position:fixed;

  z-index:999998;

  align-items:center;

  gap:3px;

  padding:6px;

  border:
    1px solid
    rgba(145,76,255,.45);

  border-radius:14px;

  background:#0c061c;

  box-shadow:
    0 12px 28px rgba(0,0,0,.45);
}

.reaction-picker.open{
  display:flex;
}

.reaction-picker button{
  min-width:31px;
  height:31px;

  border:0;

  border-radius:8px;

  background:transparent;

  color:#fff;

  cursor:pointer;

  font-size:17px;
}

.reaction-picker button:hover{
  background:rgba(145,76,255,.2);
}

.reply-picker{
  padding:0 9px!important;

  font-size:10px!important;

  color:#cdb9ff!important;
}

.reaction-summary{
  display:flex;

  flex-wrap:wrap;

  gap:4px;

  margin-top:4px;
}

.reaction-chip{
  padding:3px 6px;

  border-radius:10px;

  background:rgba(0,0,0,.22);

  font-size:10px;
}

.reaction-chip.mine{
  box-shadow:
    0 0 0 1px
    rgba(220,190,255,.25);
}

/* =====================================================
   INPUT
===================================================== */

.input-area{
  position:absolute;

  left:12px;
  right:12px;
  bottom:10px;

  z-index:20;

  display:flex;

  gap:8px;

  padding:7px;

  border:
    1px solid
    rgba(145,76,255,.45);

  border-radius:13px;

  background:#0b0519;

  box-shadow:
    0 8px 24px rgba(0,0,0,.30);
}

#messageInput{
  min-width:0;

  flex:1;

  height:40px;

  resize:none;

  outline:none;

  border:0;

  background:transparent;

  color:#fff;

  padding:
    11px 9px;

  font-family:inherit;

  font-size:16px;

  line-height:18px;

  /* Prevent mobile browser weird repaint */
  -webkit-appearance:none;
}

#messageInput::placeholder{
  color:#716a7e;
}

#sendButton{
  min-width:68px;

  border:0;

  border-radius:10px;

  background:
    linear-gradient(
      135deg,
      #914cff,
      #aa69ff
    );

  color:#fff;

  font-size:11px;
  font-weight:900;

  cursor:pointer;
}

#sendButton:disabled{
  opacity:.6;
}

/* =====================================================
   SEARCH
===================================================== */

.search-panel{
  position:absolute;

  top:69px;
  right:14px;

  z-index:100;

  width:min(
    310px,
    calc(100% - 28px)
  );

  display:none;

  padding:9px;

  border:
    1px solid
    var(--border);

  border-radius:12px;

  background:#0e071d;

  box-shadow:
    0 12px 28px rgba(0,0,0,.42);
}

.search-panel.open{
  display:flex;
  gap:6px;
}

#searchInput{
  min-width:0;
  flex:1;

  border:
    1px solid
    rgba(145,76,255,.25);

  border-radius:8px;

  outline:none;

  padding:9px;

  background:#080411;

  color:#fff;
}

.search-panel button{
  border:
    1px solid
    rgba(145,76,255,.3);

  border-radius:8px;

  background:#140925;

  color:#fff;

  padding:0 9px;

  cursor:pointer;
}

/* =====================================================
   STATUS
===================================================== */

#status{
  position:fixed;

  left:50%;
  bottom:78px;

  z-index:999999;

  transform:
    translateX(-50%)
    translateY(10px);

  opacity:0;

  pointer-events:none;

  padding:9px 14px;

  border:
    1px solid
    var(--border);

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://qiynczbrhpxwuabwuyiy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_eUPz4c_nYckgINEK-AIWqw_JAXIHozd";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true,
        flowType:"pkce"
      }
    }
  );

/* =====================================================
   ELEMENTS
===================================================== */

const loading =
  document.getElementById("loading");

const loadingTitle =
  document.getElementById("loadingTitle");

const loadingSubtitle =
  document.getElementById("loadingSubtitle");

const messages =
  document.getElementById("messages");

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const logoutBtn =
  document.getElementById("logoutBtn");

const userName =
  document.getElementById("userName");

const profileBtn =
  document.getElementById("profileBtn");

const sideName =
  document.getElementById("sideName");

const chatTitle =
  document.getElementById("chatTitle");

const chatAvatar =
  document.getElementById("chatAvatar");

const sideAvatar =
  document.getElementById("sideAvatar");

const statusBox =
  document.getElementById("status");

/* Safety guard: realtime connection text can NEVER become a visible toast. */
const realtimeToastGuard = new MutationObserver(()=>{
  if(!statusBox) return;
  const value = String(statusBox.textContent || "");
  if(/realtime/i.test(value)){
    statusBox.classList.remove("show");
    statusBox.classList.add("realtime-hidden");
    statusBox.textContent = "";
  }
});
if(statusBox){
  realtimeToastGuard.observe(statusBox,{childList:true,subtree:true,characterData:true});
}


const searchPanel =
  document.getElementById("searchPanel");

const searchInput =
  document.getElementById("searchInput");

let currentUser = null;

let currentProfile = null;

let realtimeChannel = null;

let presenceChannel = null;

let replyTarget = null;

const messageCache =
  new Map();

const REACTIONS = [
  "👍",
  "❤️",
  "😂",
  "😮",
  "😢",
  "😡"
];

/* =====================================================
   LOADING
===================================================== */

function setLoadingText(
  title,
  subtitle
){

  loadingTitle.textContent =
    title;

  loadingSubtitle.textContent =
    subtitle;

}

function finishLoading(){

  loading.classList.add("hide");

  setTimeout(
    ()=>{
      loading.style.display =
        "none";
    },
    450
  );

}

function showLoading(
  title,
  subtitle
){

  loading.style.display =
    "flex";

  loading.classList.remove(
    "hide"
  );

  setLoadingText(
    title,
    subtitle
  );

}

/* =====================================================
   STATUS
===================================================== */

function showStatus(text){

  /* NEVER show realtime connection notices in the UI. */
  const cleanText = String(text || "");
  if(/realtime/i.test(cleanText)){
    statusBox.classList.remove("show");
    statusBox.classList.add("realtime-hidden");
    statusBox.textContent = "";
    return;
  }

  statusBox.classList.remove("realtime-hidden");

  /* Realtime connection state is intentionally silent.
     It must never appear as a popup/toast to the user. */
  const silentRealtimeStatus =
    /realtime\s+(connected|reconnecting|connection error|timed out)/i.test(
      String(text || "")
    );

  if(silentRealtimeStatus){
    statusBox.classList.remove("show");
    return;
  }

  statusBox.textContent =
    text;

  statusBox.classList.add(
    "show"
  );

  clearTimeout(
    showStatus.timer
  );

  showStatus.timer =
    setTimeout(
      ()=>{
        statusBox.classList.remove(
          "show"
        );
      },
      3000
    );

}

/* =====================================================
   AUTH
===================================================== */

async function getLoggedInUser(){

  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .getSession();

  if(error){

    console.error(
      "Session error:",
      error
    );

    return null;

  }

  return (
    data?.session?.user ||
    null
  );

}

/* =====================================================
   PROFILE
===================================================== */

async function checkProfile(){

  if(!currentUser){
    return null;
  }

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,user_id,name,gender,age,totalk_id,profile_completed,location,location_visibility"
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .maybeSingle();

  if(error){

    console.error(
      "Profile check error:",
      error
    );

    throw error;

  }

  return data || null;

}

/* =====================================================
   PROFILE REDIRECT
===================================================== */

function goToProfileMaker(){

  showLoading(
    "Connecting…",
    "Create your ToTalk identity"
  );

  setTimeout(
    ()=>{
      window.location.replace(
        "./profile-maker.html"
      );
    },
    500
  );

}

/* =====================================================
   USER UI
===================================================== */

function updateUserUI(){

  const name =
    currentProfile?.name ||
    currentUser?.user_metadata?.full_name ||
    currentUser?.user_metadata?.name ||
    currentUser?.email?.split("@")[0] ||
    "ToTalk User";

  const first =
    name.trim().charAt(0).toUpperCase() ||
    "T";

  if(userName){
    userName.textContent =
      name;
  }

  sideName.textContent =
    name;

  chatTitle.textContent =
    name + "'s ToTalk";

  sideAvatar.textContent =
    first;

  chatAvatar.textContent =
    first;

  const sideTitle =
    document.getElementById(
      "sideTitle"
    );

  if(sideTitle){
    sideTitle.textContent =
      name + "'s Chats";
  }

  document.title =
    "ToTalk";

}

/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(value){

  if(!value){
    return "";
  }

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){
    return "";
  }

  return date.toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}

/* =====================================================
   REPLY
===================================================== */

function setReplyTarget(data){

  replyTarget =
    data;

  messageInput.placeholder =
    "Reply to message...";

  messageInput.focus();

  showStatus(
    "Replying to message"
  );

}

function clearReplyTarget(){

  replyTarget =
    null;

  messageInput.placeholder =
    "Write a message...";

}

/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(
  data,
  animate=true
){

  if(!data?.id){
    return;
  }

  if(
    document.querySelector(
      `[data-message-id="${data.id}"]`
    )
  ){
    return;
  }

  const welcome =
    document.getElementById(
      "welcomeMessage"
    );

  if(welcome){
    welcome.remove();
  }

  messageCache.set(
    data.id,
    data
  );

  const mine =
    currentUser &&
    data.sender_id ===
      currentUser.id;

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "message-row" +
    (mine ? " mine" : "");

  row.dataset.messageId =
    data.id;

  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "message";

  if(!animate){
    bubble.style.animation =
      "none";
  }

  /* Reply */

  if(data.reply_to_id){

    const replied =
      messageCache.get(
        data.reply_to_id
      );

    if(replied){

      const reply =
        document.createElement(
          "div"
        );

      reply.className =
        "reply-preview";

      const replyName =
        document.createElement(
          "div"
        );

      replyName.className =
        "reply-name";

      replyName.textContent =
        replied.sender_id ===
        currentUser.id
          ? "You"
          : "Message";

      const replyText =
        document.createElement(
          "div"
        );

      replyText.className =
        "reply-text";

      replyText.textContent =
        replied.content || "";

      reply.append(
        replyName,
        replyText
      );

      bubble.appendChild(
        reply
      );

    }

  }

  /* Text */

  const text =
    document.createElement(
      "div"
    );

  text.className =
    "message-text";

  text.textContent =
    data.content || "";

  bubble.appendChild(
    text
  );

  /* Time */

  const time =
    document.createElement(
      "span"
    );

  time.className =
    "message-time";

  time.textContent =
    formatTime(
      data.created_at
    );

  if(data.edited_at){

    time.textContent +=
      " · edited";

  }

  bubble.appendChild(
    time
  );

  /* Status */

  if(mine){

    const status =
      document.createElement(
        "span"
      );

    status.className =
      "message-status";

    status.dataset.status =
      "true";

    status.textContent =
      "Sent";

    bubble.appendChild(
      status
    );

  }

  /* Menu */

  if(mine){

    const menuButton =
      document.createElement(
        "button"
      );

    menuButton.className =
      "message-menu-btn";

    menuButton.type =
      "button";

    menuButton.textContent =
      "⋮";

    menuButton.addEventListener(
      "click",
      event=>{

        event.stopPropagation();

        closeMenus();

        const menu =
          createMessageMenu(
            data,
            bubble
          );

        document.body.appendChild(
          menu
        );

        const rect =
          bubble.getBoundingClientRect();

        menu.style.left =
          Math.max(
            8,
            Math.min(
              rect.right - 130,
              window.innerWidth - 138
            )
          ) + "px";

        menu.style.top =
          Math.min(
            window.innerHeight - 120,
            rect.bottom + 7
          ) + "px";

        menu.classList.add(
          "open"
        );

      }
    );

    bubble.appendChild(
      menuButton
    );

  }

  /* Reaction */

  const picker =
    createReactionPicker(
      data,
      bubble
    );

  bubble._reactionPicker =
    picker;

  row.appendChild(
    bubble
  );

  messages.appendChild(
    row
  );

}

/* =====================================================
   REACTION PICKER
===================================================== */

function createReactionPicker(
  data,
  bubble
){

  const picker =
    document.createElement(
      "div"
    );

  picker.className =
    "reaction-picker";

  const reply =
    document.createElement(
      "button"
    );

  reply.className =
    "reply-picker";

  reply.textContent =
    "Reply";

  reply.addEventListener(
    "click",
    event=>{

      event.stopPropagation();

      picker.classList.remove(
        "open"
      );

      setReplyTarget(
        data
      );

    }
  );

  picker.appendChild(
    reply
  );

  REACTIONS.forEach(
    reaction=>{

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.textContent =
        reaction;

      button.addEventListener(
        "click",
        async event=>{

          event.stopPropagation();

          picker.classList.remove(
            "open"
          );

          await toggleReaction(
            data.id,
            reaction,
            bubble
          );

        }
      );

      picker.appendChild(
        button
      );

    }
  );

  /* Long press */

  let timer = null;

  bubble.addEventListener(
    "touchstart",
    event=>{

      if(
        event.touches.length !== 1
      ){
        return;
      }

      timer =
        setTimeout(
          ()=>{

            closeMenus();

            const rect =
              bubble.getBoundingClientRect();

            document.body.appendChild(
              picker
            );

            picker.style.left =
              Math.max(
                8,
                Math.min(
                  rect.left,
                  window.innerWidth - 250
                )
              ) + "px";

            picker.style.top =
              Math.max(
                8,
                rect.top - 55
              ) + "px";

            picker.classList.add(
              "open"
            );

          },
          520
        );

    },
    {
      passive:true
    }
  );

  bubble.addEventListener(
    "touchend",
    ()=>{
      clearTimeout(timer);
    },
    {
      passive:true
    }
  );

  bubble.addEventListener(
    "touchmove",
    ()=>{
      clearTimeout(timer);
    },
    {
      passive:true
    }
  );

  return picker;

}

/* =====================================================
   REACTION SAVE
===================================================== */

async function toggleReaction(
  messageId,
  reaction,
  bubble
){

  if(!currentUser){
    return;
  }

  try{

    const {
      data:existing,
      error:readError
    } =
      await supabaseClient
        .from("message_reactions")
        .select(
          "user_id,reaction"
        )
        .eq(
          "message_id",
          messageId
        )
        .eq(
          "user_id",
          currentUser.id
        )
        .maybeSingle();

    if(readError){
      throw readError;
    }

    if(
      existing &&
      existing.reaction ===
      reaction
    ){

      const {
        error
      } =
        await supabaseClient
          .from("message_reactions")
          .delete()
          .eq(
            "message_id",
            messageId
          )
          .eq(
            "user_id",
            currentUser.id
          );

      if(error){
        throw error;
      }

    }else{

      await supabaseClient
        .from("message_reactions")
        .delete()
        .eq(
          "message_id",
          messageId
        )
        .eq(
          "user_id",
          currentUser.id
        );

      const {
        error
      } =
        await supabaseClient
          .from("message_reactions")
          .insert({
            message_id:messageId,
            user_id:currentUser.id,
            reaction:reaction
          });

      if(error){
        throw error;
      }

    }

    await refreshReaction(
      messageId,
      bubble
    );

  }catch(error){

    console.error(
      "Reaction error:",
      error
    );

    showStatus(
      "Reaction could not be changed."
    );

  }

}

/* =====================================================
   REACTION DISPLAY
===================================================== */

async function refreshReaction(
  messageId,
  bubble
){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("message_reactions")
      .select(
        "user_id,reaction"
      )
      .eq(
        "message_id",
        messageId
      );

  if(error){
    return;
  }

  const old =
    bubble.querySelector(
      ".reaction-summary"
    );

  if(old){
    old.remove();
  }

  if(!data?.length){
    return;
  }

  const summary =
    document.createElement(
      "div"
    );

  summary.className =
    "reaction-summary";

  const counts = {};

  data.forEach(
    item=>{

      counts[item.reaction] =
        (counts[item.reaction] || 0) +
        1;

    }
  );

  Object.entries(
    counts
  ).forEach(
    ([reaction,count])=>{

      const chip =
        document.createElement(
          "span"
        );

      chip.className =
        "reaction-chip";

      chip.textContent =
        reaction +
        " " +
        count;

      summary.appendChild(
        chip
      );

    }
  );

  bubble.appendChild(
    summary
  );

}

===================================================== */

async function editMessage(
  data,
  bubble
){

  const oldText =
    bubble.querySelector(
      ".message-text"
    );

  if(!oldText){
    return;
  }

  if(
    bubble.classList.contains(
      "editing"
    )
  ){
    return;
  }

  bubble.classList.add(
    "editing"
  );

  const editor =
    document.createElement(
      "textarea"
    );

  editor.value =
    data.content || "";

  editor.maxLength =
    5000;

  editor.style.width =
    "100%";

  editor.style.minHeight =
    "65px";

  editor.style.border =
    "1px solid rgba(255,255,255,.2)";

  editor.style.borderRadius =
    "8px";

  editor.style.padding =
    "8px";

  editor.style.background =
    "rgba(0,0,0,.2)";

  editor.style.color =
    "#fff";

  editor.style.outline =
    "none";

  oldText.replaceWith(
    editor
  );

  const actions =
    document.createElement(
      "div"
    );

  actions.style.display =
    "flex";

  actions.style.gap =
    "6px";

  actions.style.marginTop =
    "6px";

  const save =
    document.createElement(
      "button"
    );

  save.textContent =
    "Save";

  const cancel =
    document.createElement(
      "button"
    );

  cancel.textContent =
    "Cancel";

  [save,cancel].forEach(
    button=>{

      button.style.border =
        "0";

      button.style.borderRadius =
        "7px";

      button.style.padding =
        "6px 9px";

      button.style.cursor =
        "pointer";

    }
  );

  actions.append(
    save,
    cancel
  );

  bubble.appendChild(
    actions
  );

  cancel.onclick =
    ()=>{

      editor.replaceWith(
        oldText
      );

      actions.remove();

      bubble.classList.remove(
        "editing"
      );

    };

  save.onclick =
    async ()=>{

      const content =
        editor.value.trim();

      if(!content){

        showStatus(
          "Message cannot be empty."
        );

        return;

      }

      save.disabled =
        true;

      try{

        const {
          data:updated,
          error
        } =
          await supabaseClient
            .from("messages")
            .update({
              content:content,
              edited_at:
                new Date().toISOString()
            })
            .eq(
              "id",
              data.id
            )
            .eq(
              "sender_id",
              currentUser.id
            )
            .select(
              "id,sender_id,content,created_at,edited_at,reply_to_id"
            )
            .single();

        if(error){
          throw error;
        }

        messageCache.set(
          updated.id,
          updated
        );

        oldText.textContent =
          updated.content;

        editor.replaceWith(
          oldText
        );

        const time =
          bubble.querySelector(
            ".message-time"
          );

        if(time){

          time.textContent =
            formatTime(
              updated.created_at
            ) +
            " · edited";

        }

        actions.remove();

        bubble.classList.remove(
          "editing"
        );

      }catch(error){

        console.error(
          "Edit error:",
          error
        );

        save.disabled =
          false;

        showStatus(
          "Message could not be edited."
        );

      }

    };

}

async function loadMessages(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("messages")
      .select(
        "id,sender_id,content,created_at,edited_at,reply_to_id"
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );

  if(error){

    console.error(
      "Message load error:",
      error
    );

    throw error;

  }

  messages.innerHTML =
    "";

  if(
    !data ||
    data.length === 0
  ){

    messages.innerHTML = `
      <div
        class="welcome-message"
        id="welcomeMessage"
      >
        <h3>
          Welcome to ToTalk
        </h3>

        <p>
          Your conversation space is ready.
          Write a message below to begin.
        </p>
      </div>
    `;

    return;

  }

  /* Cache first */

  data.forEach(
    message=>{
      messageCache.set(
        message.id,
        message
      );
    }
  );

  /*
   * Use a fragment so the browser performs
   * fewer layout/repaint operations.
   */

  const fragment =
    document.createDocumentFragment();

  const originalAppend =
    messages.appendChild;

  /*
   * Build messages normally.
   * Layout is contained, so this is much
   * cheaper than forcing scroll/layout each time.
   */

  data.forEach(
    message=>{

      addMessage(
        message,
        false
      );

    }
  );

  requestAnimationFrame(
    ()=>{

      messages.scrollTop =
        messages.scrollHeight;

    }
  );

  await loadAllReactions();

}

/* =====================================================
   CONNECTION WARM-UP
   Prevents the first message from waiting for a cold
   Supabase HTTP connection.
===================================================== */

let supabaseWarmedUp = false;

async function warmUpSupabase(){
  if(supabaseWarmedUp || !currentUser){
    return;
  }

  try{
    const started = performance.now();

    await supabaseClient
      .from("messages")
      .select("id")
      .limit(1);

    supabaseWarmedUp = true;

    console.log(
      "Supabase connection warmed in",
      Math.round(performance.now() - started),
      "ms"
    );
  }catch(error){
    /*
     * Warm-up is only an optimization.
     * A failed warm-up must never block the chat.
     */
    console.warn(
      "Supabase warm-up failed:",
      error?.message || error
    );
  }
}

/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  const text = messageInput.value.trim();
  if(!text) return;

  if(!currentUser){
    showStatus("Your login session is not ready.");
    return;
  }

  const replyId = replyTarget?.id || null;
  const tempId = "local-" + Date.now() + "-" + Math.random().toString(36).slice(2);

  /*
   * Put the message on screen immediately.
   * The small "Sending…" state makes it feel natural instead of
   * looking like the message magically appeared before saving.
   */
  const optimistic = {
    id: tempId,
    sender_id: currentUser.id,
    content: text,
    created_at: new Date().toISOString(),
    edited_at: null,
    reply_to_id: replyId,
    _optimistic: true
  };

  addMessage(optimistic, true);

  const optimisticRow = document.querySelector(
    `[data-message-id="${tempId}"]`
  );

  const optimisticStatus = optimisticRow?.querySelector(
    ".message-status"
  );

  if(optimisticStatus){
    optimisticStatus.textContent = "Sending…";
    optimisticStatus.classList.remove("seen");
  }

  messageInput.value = "";
  clearReplyTarget();

  requestAnimationFrame(()=>{
    messages.scrollTop = messages.scrollHeight;
  });

  sendButton.disabled = true;
  sendButton.classList.add("sending");

  try{

    const payload = {
      sender_id: currentUser.id,
      content: text,
      reply_to_id: replyId
    };

    const {data,error} = await supabaseClient
      .from("messages")
      .insert(payload)
      .select("id,sender_id,content,created_at,edited_at,reply_to_id")
      .single();

    if(error){
      console.error("Supabase send error:", error);
      throw error;
    }

    /* Convert the optimistic row into the real database message. */
    messageCache.delete(tempId);
    messageCache.set(data.id, data);

    if(optimisticRow){
      optimisticRow.dataset.messageId = data.id;

      const status = optimisticRow.querySelector(".message-status");
      if(status){
        status.textContent = "Sent";
      }

      /* Keep the same smooth visual row; do not remove/re-add it. */
      const menuButton = optimisticRow.querySelector(".message-menu-btn");
      if(menuButton){
        menuButton.replaceWith(menuButton.cloneNode(true));
        const newMenuButton = optimisticRow.querySelector(".message-menu-btn");
        newMenuButton.addEventListener("click", event=>{
          event.stopPropagation();
          closeMenus();
          const bubble = optimisticRow.querySelector(".message");
          const menu = createMessageMenu(data, bubble);
          document.body.appendChild(menu);
          const rect = bubble.getBoundingClientRect();
          menu.style.left = Math.max(8, Math.min(rect.right - 130, window.innerWidth - 138)) + "px";
          menu.style.top = Math.min(window.innerHeight - 120, rect.bottom + 7) + "px";
          menu.classList.add("open");
        });
      }

      /* Reaction picker keeps the real message id. */
      const bubble = optimisticRow.querySelector(".message");
      if(bubble){
        const oldPicker = bubble._reactionPicker;
        if(oldPicker) oldPicker.remove();
        const picker = createReactionPicker(data, bubble);
        bubble._reactionPicker = picker;
      }
    }

  }catch(error){

    console.error("Send message error:", error);

    /* Failed messages stay visible briefly with a useful state. */
    if(optimisticStatus){
      optimisticStatus.textContent = "Not sent";
      optimisticStatus.classList.add("send-failed");
    }

    showStatus(
      "Message was not saved: " +
      (error.message || "Unknown error")
    );

    /* Restore text so the user does not lose what they typed. */
    messageInput.value = text;

  }finally{
    sendButton.disabled = false;
    sendButton.classList.remove("sending");
  }

}

/* =====================================================
   REALTIME
===================================================== */

function startRealtime(){

  if(!currentUser){
    console.warn("Realtime: no current user");
    return;
  }

  if(realtimeChannel){
    try{ supabaseClient.removeChannel(realtimeChannel); }catch(e){}
    realtimeChannel = null;
  }

  const channelName = "totalk-messages-" + currentUser.id;

  console.log("Realtime: creating channel", channelName);

  const channel = supabaseClient.channel(channelName, {
    config:{
      broadcast:{self:false},
      presence:{key:currentUser.id}
    }
  });

  channel
    .on(
      "postgres_changes",
      {event:"INSERT",schema:"public",table:"messages"},
      payload=>{
        const data = payload?.new;
        if(!data?.id) return;

        console.log("Realtime INSERT:", data);

        messageCache.set(data.id, data);

        const exists = document.querySelector(
          `[data-message-id="${data.id}"]`
        );

        if(exists) return;

        const nearBottom =
          messages.scrollHeight - messages.scrollTop - messages.clientHeight < 180;

        addMessage(data, true);

        if(nearBottom){
          requestAnimationFrame(()=>{
            messages.scrollTo({
              top:messages.scrollHeight,
              behavior:"smooth"
            });
          });
        }
      }
    )
    .on(
      "postgres_changes",
      {event:"UPDATE",schema:"public",table:"messages"},
      payload=>{
        const data = payload?.new;
        if(!data?.id) return;

        console.log("Realtime UPDATE:", data);
        messageCache.set(data.id, data);

        const row = document.querySelector(
          `[data-message-id="${data.id}"]`
        );
        if(!row) return;

        const text = row.querySelector(".message-text");
        if(text) text.textContent = data.content || "";

        const time = row.querySelector(".message-time");
        if(time){
          time.textContent = formatTime(data.created_at) +
            (data.edited_at ? " · edited" : "");
        }
      }
    )
    .on(
      "postgres_changes",
      {event:"DELETE",schema:"public",table:"messages"},
      payload=>{
        const id = payload?.old?.id;
        if(!id) return;

        console.log("Realtime DELETE:", id);
        document.querySelector(`[data-message-id="${id}"]`)?.remove();
        messageCache.delete(id);
      }
    )
    .on(
      "postgres_changes",
      {event:"*",schema:"public",table:"message_reactions"},
      async payload=>{
        const id = payload?.new?.message_id || payload?.old?.message_id;
        if(!id) return;

        console.log("Realtime REACTION:", payload);

        const row = document.querySelector(
          `[data-message-id="${id}"]`
        );
        const bubble = row?.querySelector(".message");

        if(bubble){
          try{
            await refreshReaction(id, bubble);
          }catch(error){
            console.error("Realtime reaction refresh:", error);
          }
        }
      }
    );

  realtimeChannel = channel;

  channel.subscribe(status=>{
    console.log("ToTalk Realtime status:", status);

    if(status === "SUBSCRIBED"){
      console.log("ToTalk Realtime connected");
      // Keep realtime status silent in the UI.
      // Do not show a popup/toast when the realtime channel connects.
      return;
    }

    if(status === "CHANNEL_ERROR" || status === "TIMED_OUT"){
      console.error("ToTalk Realtime connection problem:", status);
      /* Realtime reconnects silently. Never show a toast. */

      /* Retry without requiring a page refresh. */
      setTimeout(()=>{
        if(realtimeChannel === channel){
          realtimeChannel = null;
          startRealtime();
        }
      }, 1500);
    }
  });
}

function startPresence(){

  if(!currentUser){
    return;
  }

  if(presenceChannel){
    return;
  }

  presenceChannel =
    supabaseClient
      .channel(
        "totalk-presence"
      );

  presenceChannel
    .on(
      "presence",
      {
        event:"sync"
      },
      ()=>{
        updatePresence();
      }
    )
    .on(
      "presence",
      {
        event:"join"
      },
      ()=>{
        updatePresence();
      }
    )
    .on(
      "presence",
      {
        event:"leave"
      },
      ()=>{
        updatePresence();
      }
    )
    .subscribe(
      async status=>{

        if(
          status ===
          "SUBSCRIBED"
        ){

          await presenceChannel.track({

            user_id:
              currentUser.id,

            online_at:
              new Date().toISOString()

          });

        }

      }
    );

}

/* =====================================================
   SEARCH
===================================================== */

let searchMatches = [];

let searchIndex = -1;

function runSearch(){

  const query =
    searchInput.value
      .trim()
      .toLowerCase();

  const rows =
    document.querySelectorAll(
      ".message-row"
    );

  rows.forEach(
    row=>{
      row.style.opacity =
        "1";
    }
  );

  searchMatches = [];

  if(!query){
    return;
  }

  rows.forEach(
    row=>{

      const text =
        row
          .querySelector(
            ".message-text"
          )
          ?.textContent
          .toLowerCase() ||
        "";

      if(
        text.includes(query)
      ){

        searchMatches.push(
          row
        );

        row.style.opacity =
          ".55";

      }else{

        row.style.opacity =
          ".15";

      }

    }
  );

  if(searchMatches.length){

    searchIndex =
      0;

    focusSearch();

  }

}

function focusSearch(){

  if(
    !searchMatches.length
  ){
    return;
  }

  searchMatches.forEach(
    row=>{
      row.style.opacity =
        ".55";
    }
  );

  const row =
    searchMatches[
      searchIndex
    ];

  row.style.opacity =
    "1";

  row.scrollIntoView({
    behavior:"auto",
    block:"center"
  });

}

    "click",
    ()=>{

      if(
        !searchMatches.length
      ){
        return;
      }

      searchIndex =
        (
          searchIndex + 1
        ) %
        searchMatches.length;

      focusSearch();

    }
  );

/* Search previous */

document
  .getElementById(
    "searchPrev"
  )
  .addEventListener(
    "click",
    ()=>{

      if(
        !searchMatches.length
      ){
        return;
      }

      searchIndex =
        (
          searchIndex -
          1 +
          searchMatches.length
        ) %
        searchMatches.length;

      focusSearch();

    }
  );

/* =====================================================
   GLOBAL CLICK
===================================================== */

document.addEventListener(
  "click",
  event=>{

    if(
      !event.target.closest(
        ".message-menu"
      ) &&
      !event.target.closest(
        ".message-menu-btn"
      ) &&
      !event.target.closest(
        ".reaction-picker"
      ) &&
      !event.target.closest(
        ".message"
      )
    ){

      closeMenus();

    }

  }
);

/* =====================================================
   INPUT
===================================================== */

sendButton.addEventListener(
  "click",
  sendMessage
);

messageInput.addEventListener(
  "keydown",
  event=>{

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);

/*
 * IMPORTANT:
 * There is intentionally NO input
 * event doing DOM work on every
 * keystroke.
 *
 * This keeps typing lightweight.
 */

/* =====================================================
   PROFILE
===================================================== */

profileBtn?.addEventListener(
  "click",
  ()=>{
    window.location.href =
      "./profile-maker.html";
  }
);

/* =====================================================
   LOGOUT
===================================================== */

logoutBtn.addEventListener(
  "click",
  async ()=>{

    logoutBtn.disabled =
      true;

    logoutBtn.textContent =
      "Logging out";

    try{

      if(realtimeChannel){

        await supabaseClient
          .removeChannel(
            realtimeChannel
          );

        realtimeChannel =
          null;

      }

      if(presenceChannel){

        await supabaseClient
          .removeChannel(
            presenceChannel
          );

        presenceChannel =
          null;

      }

      await supabaseClient
        .auth
        .signOut();

      window.location.replace(
        "./index.html"
      );

    }catch(error){

      console.error(
        "Logout error:",
        error
      );

      logoutBtn.disabled =
        false;

      logoutBtn.textContent =
        "Logout";

    }

  }
);

/* =====================================================
   AUTH STATE
===================================================== */

supabaseClient.auth.onAuthStateChange(
  (event,session)=>{

    console.log(
      "Auth event:",
      event
    );

    if(
      event ===
      "SIGNED_OUT"
    ){

      window.location.replace(
        "./index.html"
      );

    }

  }
);


/* Smooth message sending states */
.message-status{
  min-width:46px;
  transition:opacity .18s ease, color .18s ease;
}

.message-status.send-failed{
  color:#ff9a9a;
}

#sendButton.sending,
#sendButton.sending:hover{
  opacity:.82;
}

.message-row{
  will-change:transform,opacity;
}

/* =====================================================
   START APPLICATION
===================================================== */

async function startApp(){

  try{

    showLoading(
      "ToTalk",
      "Checking your account"
    );

    let user =
      await getLoggedInUser();

    if(!user){

      await new Promise(
        resolve=>
          setTimeout(
            resolve,
            300
          )
      );

      user =
        await getLoggedInUser();

    }

    if(!user){

      showLoading(
        "Login required",
        "Returning to ToTalk"
      );

      setTimeout(
        ()=>{
          window.location.replace(
            "./index.html"
          );
        },
        800
      );

      return;

    }

    currentUser =
      user;

    /*
     * Start the database connection warm-up immediately.
     * It runs in the background while the rest of the
     * chat is loading, so the first real message does not
     * pay the cold-connection delay.
     */
    void warmUpSupabase();

    setLoadingText(
      "ToTalk",
      "Connecting…"
    );

    currentProfile =
      await checkProfile();

    /*
     * Keep your current behavior:
     * existing profile opens chat directly.
     *
     * If no profile exists, create a
     * lightweight profile.
     */

    if(!currentProfile){

      const fallbackName =
        currentUser?.user_metadata?.full_name ||
        currentUser?.user_metadata?.name ||
        currentUser?.email?.split("@")[0] ||
        "ToTalk User";

      /*
       * Generate a permanent-looking ID.
       * This function was missing in the
       * previous file, so define it here.
       */

      function makeTTId(){

        const chars =
          "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

        let result =
          "";

        for(
          let i=0;
          i<6;
          i++
        ){

          result +=
            chars[
              Math.floor(
                Math.random() *
                chars.length
              )
            ];

        }

        return "TT-" + result;

      }

      const newId =
        makeTTId();

      const {
        data:created,
        error:createError
      } =
        await supabaseClient
          .from("profiles")
          .insert({

            user_id:
              currentUser.id,

            name:
              fallbackName,

            gender:
              null,

            age:
              null,

            totalk_id:
              newId,

            profile_completed:
              true,

            location:
              "",

            location_visibility:
              "city_country"

          })
          .select(
            "id,user_id,name,gender,age,totalk_id,profile_completed,location,location_visibility"
          )
          .single();

      if(createError){

        currentProfile =
          await checkProfile();

        if(!currentProfile){

          throw createError;

        }

      }else{

        currentProfile =
          created;

      }

    }else if(
      currentProfile.profile_completed !==
      true
    ){

      const {
        data:completed,
        error:completeError
      } =
        await supabaseClient
          .from("profiles")
          .update({
            profile_completed:true
          })
          .eq(
            "id",
            currentProfile.id
          )
          .eq(
            "user_id",
            currentUser.id
          )
          .select(
            "id,user_id,name,gender,age,totalk_id,profile_completed,location,location_visibility"
          )
          .maybeSingle();

      if(completeError){
        throw completeError;
      }

      if(completed){
        currentProfile =
          completed;
      }

    }

    setLoadingText(
      "ToTalk",
      "Opening your space…"
    );

    updateUserUI();

    /*
     * Connect realtime BEFORE loading the message history.
     * This removes the startup gap where a new message could
     * arrive while history was still being fetched.
     */

    startRealtime();

    /* Load the existing chat history. */
    await loadMessages();

    startPresence();

    /*
     * Hide loading only after
     * everything is ready.
     */

    finishLoading();

    /*
     * Focus input after loading
     * without forcing keyboard open
     * on mobile.
     */

    setTimeout(
      ()=>{
        messageInput.focus({
          preventScroll:true
        });
        messageInput.blur();
      },
      500
    );

  }catch(error){

    console.error(
      "ToTalk startup error:",
      error
    );

    loading.innerHTML = `
      <div class="login-error">

        <h2>
          Unable to open ToTalk
        </h2>

        <p>
          Something went wrong while
          preparing your conversation space.
        </p>

        <a
          class="back-button"
          href="./index.html"
        >
          Back to ToTalk
        </a>

      </div>
    `;

  }

}

/* =====================================================
   START
===================================================== */

startApp();

</script>
