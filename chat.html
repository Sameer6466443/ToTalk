<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ToTalk Chat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      color: #173d57;
      background:
        radial-gradient(circle at 5% 5%, #c9f0ff, transparent 25%),
        radial-gradient(circle at 95% 95%, #fff3a6, transparent 25%),
        linear-gradient(135deg, #eefbff, #fffef1);
    }

    header {
      height: 75px;
      padding: 0 5%;
      background: rgba(255,255,255,.92);
      border-bottom: 1px solid #e4f0f5;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 24px;
      font-weight: 900;
      color: #0b5d91;
    }

    .logo-box {
      width: 42px;
      height: 42px;
      background: #ffe36a;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
    }

    .right-header {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .user-name {
      font-size: 14px;
      font-weight: 800;
      color: #78909f;
    }

    .logout {
      border: none;
      background: #edf8fd;
      color: #0b5d91;
      padding: 10px 15px;
      border-radius: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .chat-layout {
      max-width: 1150px;
      height: calc(100vh - 115px);
      min-height: 600px;
      margin: 20px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 18px;
    }

    .sidebar {
      background: rgba(255,255,255,.92);
      border: 1px solid #e2eff5;
      border-radius: 25px;
      overflow: hidden;
      box-shadow: 0 15px 45px rgba(27,105,139,.08);
    }

    .sidebar-title {
      padding: 22px;
      border-bottom: 1px solid #edf3f6;
    }

    .sidebar-title h2 {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .sidebar-title p {
      color: #78909f;
      font-size: 12px;
    }

    .profile {
      margin: 15px 8px;
      padding: 14px;
      border-radius: 17px;
      background: #eaf8ff;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #ffe36a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
    }

    .profile strong {
      display: block;
      font-size: 14px;
    }

    .online {
      color: #35b867;
      font-size: 11px;
      font-weight: 700;
      margin-top: 4px;
    }

    .chat-box {
      background: rgba(255,255,255,.95);
      border: 1px solid #e2eff5;
      border-radius: 25px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 15px 45px rgba(27,105,139,.08);
    }

    .chat-top {
      min-height: 75px;
      padding: 15px 22px;
      border-bottom: 1px solid #edf3f6;
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .chat-avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #dff6ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
    }

    .chat-top strong {
      display: block;
      font-size: 15px;
    }

    .chat-top small {
      color: #35b867;
      font-weight: 700;
      font-size: 11px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
      background: #fbfeff;
    }

    .welcome-message {
      text-align: center;
      margin: 35px auto;
      max-width: 390px;
    }

    .welcome-icon {
      width: 65px;
      height: 65px;
      margin: auto auto 15px;
      border-radius: 20px;
      background: #ffe36a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    .welcome-message h3 {
      margin-bottom: 8px;
    }

    .welcome-message p {
      color: #78909f;
      font-size: 13px;
      line-height: 1.6;
    }

    .message {
      max-width: 70%;
      margin-bottom: 14px;
      padding: 12px 16px;
      border-radius: 17px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message:not(.mine) {
      background: #eef5f8;
      color: #263238;
    }

    .message.mine {
      margin-left: auto;
      background: #168bd1;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .input-area {
      padding: 15px;
      border-top: 1px solid #edf3f6;
      display: flex;
      gap: 10px;
      background: white;
    }

    #messageInput {
      flex: 1;
      border: none;
      outline: none;
      background: #f2f8fb;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 14px;
    }

    #sendButton {
      width: 50px;
      border: none;
      border-radius: 14px;
      background: #168bd1;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    #loading {
      position: fixed;
      inset: 0;
      background: #f2fbff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      font-weight: 900;
      color: #0b5d91;
    }

    @media(max-width: 800px) {
      .user-name {
        display: none;
      }

      .chat-layout {
        height: calc(100vh - 95px);
        min-height: 0;
        margin: 10px auto;
        padding: 0 10px;
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .chat-box {
        border-radius: 20px;
      }

      .message {
        max-width: 82%;
      }
    }
  </style>
</head>

<body>

  <div id="loading">
    Opening ToTalk...
  </div>

  <header>
    <div class="logo">
      <div class="logo-box">💬</div>
      ToTalk
    </div>

    <div class="right-header">
      <div class="user-name" id="userName">
        Loading...
      </div>

      <button class="logout" id="logoutBtn">
        Logout
      </button>
    </div>
  </header>

  <main class="chat-layout">

    <aside class="sidebar">

      <div class="sidebar-title">
        <h2>Chats</h2>
        <p>Your conversations</p>
      </div>

      <div class="profile">
        <div class="avatar">
          😊
        </div>

        <div>
          <strong id="sideName">You</strong>
          <div class="online">● Online</div>
        </div>
      </div>

    </aside>

    <section class="chat-box">

      <div class="chat-top">

        <div class="chat-avatar">
          💬
        </div>

        <div>
          <strong>ToTalk Chat</strong>
          <small>● Ready to chat</small>
        </div>

      </div>

      <div class="messages" id="messages">

        <div class="welcome-message">

          <div class="welcome-icon">
            💬
          </div>

          <h3>
            Welcome to ToTalk
          </h3>

          <p>
            You're in! This is your chat space.
            Start by writing a message below.
          </p>

        </div>

      </div>

      <div class="input-area">

        <input
          type="text"
          id="messageInput"
          placeholder="Write a message..."
          autocomplete="off"
        >

        <button id="sendButton">
          ➤
        </button>

      </div>

    </section>

  </main>


  <script>

    const SUPABASE_URL =
      "https://qiynczbrhpxwuabwuyiy.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_eUPz4c_nYckgINEK-AIWqw_JAXIHozd";

    /*
      ToTalk uses the browser OAuth flow.

      The homepage creates the Supabase client with the normal
      browser flow. The old chat page was using PKCE manually,
      which did not match the homepage and caused the user to be
      sent back to index.html.

      This page now lets Supabase automatically read the OAuth
      result from the URL and create/persist the session.
    */

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            flowType: "implicit"
          }
        }
      );


    function showLoggedInUser(user) {

      currentUser = user;

      const name =
        user.user_metadata?.full_name ||
        user.user_metadata?.name ||
        user.email?.split("@")[0] ||
        "Sameer";

      document.getElementById("userName").textContent = name;
      document.getElementById("sideName").textContent = name;

      document.getElementById("loading").style.display = "none";

      loadMessages();
    }


    function showLoginError(message) {

      const loading =
        document.getElementById("loading");

      loading.innerHTML = `
        <div style="
          max-width:520px;
          margin:0 auto;
          padding:28px;
          border:1px solid rgba(255,255,255,.15);
          border-radius:18px;
          background:rgba(10,10,25,.8);
        ">
          <h2 style="margin-top:0;">Login problem</h2>
          <p style="opacity:.8;line-height:1.6;">
            ${message}
          </p>
          <a
            href="./index.html"
            style="
              display:inline-block;
              margin-top:12px;
              padding:12px 18px;
              border-radius:12px;
              text-decoration:none;
              background:#fff;
              color:#111;
              font-weight:700;
            "
          >
            Back to ToTalk
          </a>
        </div>
      `;
    }


    async function startChat() {

      try {

        /*
          IMPORTANT:
          The listener is registered before getSession() so we
          don't miss the OAuth SIGNED_IN event while Supabase is
          processing the Google callback.
        */

        let signedIn = false;

        supabaseClient.auth.onAuthStateChange(
          (event, session) => {

            console.log("Supabase auth event:", event);

            if (session && session.user) {
              signedIn = true;
              showLoggedInUser(session.user);
            }
          }
        );


        /*
          If a session already exists, use it immediately.
        */

        const {
          data,
          error
        } =
          await supabaseClient.auth.getSession();

        if (error) {
          console.error(
            "Session check error:",
            error
          );
        }

        if (data?.session?.user) {
          signedIn = true;
          showLoggedInUser(data.session.user);
          return;
        }


        /*
          Give Supabase a moment to finish processing the OAuth
          result from Google's redirect.
        */

        setTimeout(async () => {

          if (signedIn) return;

          const {
            data: retryData,
            error: retryError
          } =
            await supabaseClient.auth.getSession();

          if (retryError) {
            console.error(
              "Final session check error:",
              retryError
            );
          }

          if (retryData?.session?.user) {
            showLoggedInUser(
              retryData.session.user
            );
            return;
          }

          showLoginError(
            "Google sign-in completed, but ToTalk did not receive the login session. Please go back and try the Google button once more."
          );

        }, 2500);

      } catch (error) {

        console.error(
          "Login error:",
          error
        );

        showLoginError(
          "ToTalk could not finish the Google sign-in. Please go back and try again."
        );
      }
    }


    /*
      LOGOUT
    */


    document
      .getElementById("logoutBtn")
      .addEventListener(
        "click",
        async () => {

          await supabaseClient.auth.signOut();

          window.location.replace(
            "./index.html"
          );

        }
      );


    /*
      SEND MESSAGE
    */

    const input =
      document.getElementById(
        "messageInput"
      );

    const sendButton =
      document.getElementById(
        "sendButton"
      );

    const messages =
      document.getElementById(
        "messages"
      );

    let currentUser = null;


    function renderMessage(row) {

      const welcome =
        document.querySelector(
          ".welcome-message"
        );

      if (welcome) {
        welcome.remove();
      }

      const message =
        document.createElement("div");

      message.className =
        "message" +
        (currentUser && row.sender_id === currentUser.id ? " mine" : "");

      message.textContent = row.content;

      messages.appendChild(message);

    }


    async function loadMessages() {

      const { data, error } =
        await supabaseClient
          .from("messages")
          .select("id, sender_id, content, created_at")
          .order("created_at", { ascending: true });

      if (error) {
        console.error("Could not load messages:", error);
        return;
      }

      messages.innerHTML = "";

      if (!data || data.length === 0) {
        messages.innerHTML = `
          <div class="welcome-message">
            <div class="welcome-icon">💬</div>
            <h3>Start a conversation</h3>
            <p>Your messages will now be saved here.</p>
          </div>
        `;
      } else {
        data.forEach(renderMessage);
      }

      messages.scrollTop =
        messages.scrollHeight;
    }


    async function sendMessage() {

      const text =
        input.value.trim();

      if (!text || !currentUser) return;

      sendButton.disabled = true;

      const { data, error } =
        await supabaseClient
          .from("messages")
          .insert({
            sender_id: currentUser.id,
            content: text
          })
          .select("id, sender_id, content, created_at")
          .single();

      sendButton.disabled = false;

      if (error) {
        console.error("Could not save message:", error);
        alert("Message could not be saved. Please try again.");
        return;
      }

      renderMessage(data);

      input.value = "";

      messages.scrollTop =
        messages.scrollHeight;

    }


    sendButton.addEventListener(
      "click",
      sendMessage
    );


    input.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /*
      START
    */

    startChat();

  </script>

</body>
</html>
