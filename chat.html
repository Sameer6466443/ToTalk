/* =====================================================
   CONNECTION WARM-UP
   Prevents the first message from waiting for a cold
   Supabase HTTP connection.
===================================================== */

let supabaseWarmedUp = false;

async function warmUpSupabase(){
  if(supabaseWarmedUp || !currentUser){
    return;
  }

  try{
    const started = performance.now();

    await supabaseClient
      .from("messages")
      .select("id")
      .limit(1);

    supabaseWarmedUp = true;

    console.log(
      "Supabase connection warmed in",
      Math.round(performance.now() - started),
      "ms"
    );
  }catch(error){
    /*
     * Warm-up is only an optimization.
     * A failed warm-up must never block the chat.
     */
    console.warn(
      "Supabase warm-up failed:",
      error?.message || error
    );
  }
}

/* =====================================================
   SEND MESSAGE
===================================================== */

let messageSendInFlight = false;

async function sendMessage(){

  /* Prevent duplicate sends from rapid taps, Enter + click, or
     browser/mobile event combinations. */
  if(messageSendInFlight){
    return;
  }

  const text = messageInput.value.trim();
  if(!text) return;

  if(!currentUser){
    showStatus("Your login session is not ready.");
    return;
  }

  const replyId = replyTarget?.id || null;
  const tempId = "local-" + Date.now() + "-" + Math.random().toString(36).slice(2);

  /*
   * Put the message on screen immediately.
   * The small "Sending…" state makes it feel natural instead of
   * looking like the message magically appeared before saving.
   */
  const optimistic = {
    id: tempId,
    sender_id: currentUser.id,
    content: text,
    created_at: new Date().toISOString(),
    edited_at: null,
    reply_to_id: replyId,
    conversation_id: currentConversationId,
    _optimistic: true
  };

  messageSendInFlight = true;

  addMessage(optimistic, true);

  const optimisticRow = document.querySelector(
    `[data-message-id="${tempId}"]`
  );

  const optimisticStatus = optimisticRow?.querySelector(
    ".message-status"
  );

  if(optimisticStatus){
    optimisticStatus.textContent = "Sending…";
    optimisticStatus.classList.remove("seen");
  }

  messageInput.value = "";
  clearReplyTarget();

  requestAnimationFrame(()=>{
    messages.scrollTop = messages.scrollHeight;
  });

  sendButton.disabled = true;
  sendButton.classList.add("sending");

  try{

    if(!currentConversationId){
      throw new Error("Select a conversation first.");
    }

    const payload = {
      sender_id: currentUser.id,
      content: text,
      reply_to_id: replyId,
      conversation_id: currentConversationId
    };

    const {data,error} = await supabaseClient
      .from("messages")
      .insert(payload)
      .select("id,sender_id,content,created_at,edited_at,reply_to_id,conversation_id")
      .single();

    if(error){
      console.error("Supabase send error:", error);
      throw error;
    }

    /* Convert the optimistic row into the real database message. */
    messageCache.delete(tempId);
    messageCache.set(data.id, data);

    if(optimisticRow){
      optimisticRow.dataset.messageId = data.id;

      const status = optimisticRow.querySelector(".message-status");
      if(status){
        status.textContent = "Sent";
      }

      /* Keep the same smooth visual row; do not remove/re-add it. */
      const menuButton = optimisticRow.querySelector(".message-menu-btn");
      if(menuButton){
        menuButton.replaceWith(menuButton.cloneNode(true));
        const newMenuButton = optimisticRow.querySelector(".message-menu-btn");
        newMenuButton.addEventListener("click", event=>{
          event.stopPropagation();
          const bubble = optimisticRow.querySelector(".message");
          openMessageMenu(data,bubble);
        });
      }

      /* Reaction picker keeps the real message id. */
      const bubble = optimisticRow.querySelector(".message");
      if(bubble){
        const oldPicker = bubble._reactionPicker;
        if(oldPicker) oldPicker.remove();
        const picker = createReactionPicker(data, bubble);
        bubble._reactionPicker = picker;
      }
    }

    /* Keep the sidebar preview/order current after a successful send. */
    void loadConversationList();

  }catch(error){

    console.error("Send message error:", error);

    /* Failed messages stay visible briefly with a useful state. */
    if(optimisticStatus){
      optimisticStatus.textContent = "Not sent";
      optimisticStatus.classList.add("send-failed");
    }

    showStatus(
      "Message was not saved: " +
      (error.message || "Unknown error")
    );

    /* Restore text so the user does not lose what they typed. */
    messageInput.value = text;

  }finally{
    sendButton.disabled = false;
    sendButton.classList.remove("sending");
    messageSendInFlight = false;
  }

}

/* =====================================================
   REALTIME
===================================================== */

function startRealtime(){

  if(!currentUser){
    console.warn("Realtime: no current user");
    return;
  }

  if(realtimeChannel){
    try{ supabaseClient.removeChannel(realtimeChannel); }catch(e){}
    realtimeChannel = null;
  }

  const channelName = "totalk-messages-" + currentUser.id;

  console.log("Realtime: creating channel", channelName);

  const channel = supabaseClient.channel(channelName, {
    config:{
      broadcast:{self:false},
      presence:{key:currentUser.id}
    }
  });

  channel
    .on(
      "postgres_changes",
      {event:"INSERT",schema:"public",table:"messages"},
      payload=>{
        const data = payload?.new;
        if(!data?.id) return;
        if(!currentConversationId || data.conversation_id !== currentConversationId) return;

        console.log("Realtime INSERT:", data);

        messageCache.set(data.id, data);

        /*
         * IMPORTANT: our own INSERT can arrive through Realtime before
         * the HTTP insert request finishes. Reconcile that event with
         * the optimistic local row instead of creating a second bubble.
         */
        if(currentUser && data.sender_id === currentUser.id){
          const localRows = document.querySelectorAll(
            '[data-message-id^="local-"]'
          );

          for(const row of localRows){
            const localText =
              row.querySelector(".message-text")?.textContent || "";

            const localMessage = messageCache.get(row.dataset.messageId);

            if(
              localText === (data.content || "") &&
              localMessage?.sender_id === data.sender_id &&
              (localMessage?.reply_to_id || null) === (data.reply_to_id || null)
            ){
              row.dataset.messageId = data.id;
  row.dataset.messageContent = data.content || "";
              messageCache.delete(localMessage.id);
              messageCache.set(data.id, data);

              const status = row.querySelector(".message-status");
              if(status) status.textContent = "Sent";

              return;
            }
          }
        }

        const exists = document.querySelector(
          `[data-message-id="${data.id}"]`
        );

        if(exists) return;

        const nearBottom =
          messages.scrollHeight - messages.scrollTop - messages.clientHeight < 180;

        addMessage(data, true);

        if(nearBottom){
          requestAnimationFrame(()=>{
            messages.scrollTo({
              top:messages.scrollHeight,
              behavior:"smooth"
            });
          });
        }
      }
    )
    .on(
      "postgres_changes",
      {event:"UPDATE",schema:"public",table:"messages"},
      payload=>{
        const data = payload?.new;
        if(!data?.id) return;
        if(!currentConversationId || data.conversation_id !== currentConversationId) return;

        console.log("Realtime UPDATE:", data);
        messageCache.set(data.id, data);

        const row = document.querySelector(
          `[data-message-id="${data.id}"]`
        );
        if(!row) return;

        /* If this message is currently being edited, leave the textarea
           alone. The cache is already updated and Save will reconcile
           the latest value when the editor closes. */
        if(!row.querySelector(".message.editing")){
          const text = row.querySelector(".message-text");
          if(text) text.textContent = data.content || "";
        }

        const time = row.querySelector(".message-time");
        if(time){
          time.textContent = formatTime(data.created_at) +
            (data.edited_at ? " · edited" : "");
        }
      }
    )
    .on(
      "postgres_changes",
      {event:"DELETE",schema:"public",table:"messages"},
      payload=>{
        const id = payload?.old?.id;
        if(!id) return;
        const oldConversationId = payload?.old?.conversation_id;
        if(!currentConversationId || oldConversationId !== currentConversationId) return;

        console.log("Realtime DELETE:", id);
        document.querySelector(`[data-message-id="${id}"]`)?.remove();
        messageCache.delete(id);
      }
    )
    .on(
      "postgres_changes",
      {event:"*",schema:"public",table:"message_reactions"},
      async payload=>{
        const id = payload?.new?.message_id || payload?.old?.message_id;
        if(!id || !messageCache.has(id)) return;

        console.log("Realtime REACTION:", payload);

        const row = document.querySelector(
          `[data-message-id="${id}"]`
        );
        const bubble = row?.querySelector(".message");

        if(bubble){
          try{
            await refreshReaction(id, bubble);
          }catch(error){
            console.error("Realtime reaction refresh:", error);
          }
        }
      }
    );

  realtimeChannel = channel;

  channel.subscribe(status=>{
    console.log("ToTalk Realtime status:", status);

    if(status === "SUBSCRIBED"){
      console.log("ToTalk Realtime connected");
      // Keep realtime status silent in the UI.
      // Do not show a popup/toast when the realtime channel connects.
      return;
    }

    if(status === "CHANNEL_ERROR" || status === "TIMED_OUT"){
      console.error("ToTalk Realtime connection problem:", status);
      /* Realtime reconnects silently. Never show a toast. */

      /* Retry without requiring a page refresh. */
      setTimeout(()=>{
        if(realtimeChannel === channel){
          realtimeChannel = null;
          startRealtime();
        }
      }, 1500);
    }
  });
}

/* =====================================================
   PRESENCE
===================================================== */

function startPresence(){

  if(!currentUser){
    return;
  }

  if(presenceChannel){
    return;
  }

  presenceChannel =
    supabaseClient
      .channel(
        "totalk-presence"
      );

  presenceChannel
    .on(
      "presence",
      {
        event:"sync"
      },
      ()=>{
        updatePresence();
      }
    )
    .on(
      "presence",
      {
        event:"join"
      },
      ()=>{
        updatePresence();
      }
    )
    .on(
      "presence",
      {
        event:"leave"
      },
      ()=>{
        updatePresence();
      }
    )
    .subscribe(
      async status=>{

        if(
          status ===
          "SUBSCRIBED"
        ){

          await presenceChannel.track({

            user_id:
              currentUser.id,

            online_at:
              new Date().toISOString()

          });

        }

      }
    );

}

function updatePresence(){

  onlineUserIds = new Set();

  if(presenceChannel){
    const state = presenceChannel.presenceState();
    Object.values(state || {}).forEach(entries=>{
      (entries || []).forEach(entry=>{
        if(entry?.user_id) onlineUserIds.add(entry.user_id);
      });
    });
  }

  const sidePresence = document.getElementById("sidePresence");
  const chatPresence = document.getElementById("chatPresence");

  const partnerOnline = currentConversationPartner
    ? onlineUserIds.has(currentConversationPartner.user_id)
    : false;

  if(sidePresence){
    sidePresence.textContent = partnerOnline ? "Online" : "Offline";
  }

  if(chatPresence){
    chatPresence.textContent = partnerOnline ? "Online" : "Offline";
  }

  const chatPresenceIcon = document.getElementById("chatPresenceIcon");
  if(chatPresenceIcon){
    chatPresenceIcon.textContent = partnerOnline ? "🌙" : "☀️";
  }

  loadConversationList().catch(()=>{});
}


/* =====================================================
   SEARCH
===================================================== */

let searchMatches = [];

let searchIndex = -1;

function runSearch(){

  const query =
    searchInput.value
      .trim()
      .toLowerCase();

  const rows =
    document.querySelectorAll(
      ".message-row"
    );

  rows.forEach(
    row=>{
      row.style.opacity =
        "1";
    }
  );

  searchMatches = [];

  if(!query){
    return;
  }

  rows.forEach(
    row=>{

      const text =
        row
          .querySelector(
            ".message-text"
          )
          ?.textContent
          .toLowerCase() ||
        "";

      if(
        text.includes(query)
      ){

        searchMatches.push(
          row
        );

        row.style.opacity =
          ".55";

      }else{

        row.style.opacity =
          ".15";

      }

    }
  );

  if(searchMatches.length){

    searchIndex =
      0;

    focusSearch();

  }

}

function focusSearch(){

  if(
    !searchMatches.length
  ){
    return;
  }

  searchMatches.forEach(
    row=>{
      row.style.opacity =
        ".55";
    }
  );

  const row =
    searchMatches[
      searchIndex
    ];

  row.style.opacity =
    "1";

  row.scrollIntoView({
    behavior:"auto",
    block:"center"
  });

}

document

      searchPanel.classList.toggle(

document

      searchPanel.classList.remove(

        );

    }

/* Search next */

document
  .getElementById(

    ()=>{

      if(
        !searchMatches.length
      ){
        return;
      }

      searchIndex =

          searchIndex + 1
        ) %
        searchMatches.length;

      focusSearch();

    }
  );

/* Search previous */

document

      if(
        !searchMatches.length
      ){
        return;
      }

      searchIndex =

        ) %
        searchMatches.length;

      focusSearch();

    }
  );

async function startApp(){

  try{

    showLoading(
      "ToTalk",
      "Checking your account"
    );

    let user =
      await getLoggedInUser();

    if(!user){

      await new Promise(
        resolve=>
          setTimeout(
            resolve,
            300
          )
      );

      user =
        await getLoggedInUser();

    }

    if(!user){

      showLoading(
        "Login required",
        "Returning to ToTalk"
      );

      setTimeout(
        ()=>{
          window.location.replace(
            "./index.html"
          );
        },
        800
      );

      return;

    }

    currentUser =
      user;

    /*
     * Start the database connection warm-up immediately.
     * It runs in the background while the rest of the
     * chat is loading, so the first real message does not
     * pay the cold-connection delay.
     */
    void warmUpSupabase();

    setLoadingText(
      "ToTalk",
      "Connecting…"
    );

    currentProfile =
      await checkProfile();

    /*
     * Keep your current behavior:
     * existing profile opens chat directly.
     *
     * If no profile exists, create a
     * lightweight profile.
     */

    if(!currentProfile){

      const fallbackName =
        currentUser?.user_metadata?.full_name ||
        currentUser?.user_metadata?.name ||
        currentUser?.email?.split("@")[0] ||
        "ToTalk User";

      /*
       * Generate a permanent-looking ID.
       * This function was missing in the
       * previous file, so define it here.
       */

      function makeTTId(){

        const chars =
          "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

        let result =
          "";

        for(
          let i=0;
          i<6;
          i++
        ){

          result +=
            chars[
              Math.floor(
                Math.random() *
                chars.length
              )
            ];

        }

        return "TT-" + result;

      }

      const newId =
        makeTTId();

      const {
        data:created,
        error:createError
      } =
        await supabaseClient
          .from("profiles")
          .insert({

            user_id:
              currentUser.id,

            name:
              fallbackName,

            gender:
              null,

            age:
              null,

            totalk_id:
              newId,

            profile_completed:
              true,

            location:
              "",

            location_visibility:
              "city_country"

          })
          .select(
            "id,user_id,name,gender,age,totalk_id,profile_completed,location,location_visibility"
          )
          .single();

      if(createError){

        currentProfile =
          await checkProfile();

        if(!currentProfile){

          throw createError;

        }

      }else{

        currentProfile =
          created;

      }

    }else if(
      currentProfile.profile_completed !==
      true
    ){

      const {
        data:completed,
        error:completeError
      } =
        await supabaseClient
          .from("profiles")
          .update({
            profile_completed:true
          })
          .eq(
            "id",
            currentProfile.id
          )
          .eq(
            "user_id",
            currentUser.id
          )
          .select(
            "id,user_id,name,gender,age,totalk_id,profile_completed,location,location_visibility"
          )
          .maybeSingle();

      if(completeError){
        throw completeError;
      }

      if(completed){
        currentProfile =
          completed;
      }

    }

    setLoadingText(
      "ToTalk",
      "Opening your space…"
    );

    updateUserUI();

    /* Load the real private conversation list. */
    await loadConversationList();

    /* Realtime stays connected, but only the active conversation is rendered. */
    startRealtime();

    startPresence();

    /*
     * Hide loading only after
     * everything is ready.
     */

    finishLoading();

    /*
     * Focus input after loading
     * without forcing keyboard open
     * on mobile.
     */

    setTimeout(
      ()=>{
        messageInput.focus({
          preventScroll:true
        });
        messageInput.blur();
      },
      500
    );

  }catch(error){

    console.error(
      "ToTalk startup error:",
      error
    );

    loading.innerHTML = `
      <div class="login-error">

        <h2>
          Unable to open ToTalk
        </h2>

        <p>
          Something went wrong while
          preparing your conversation space.
        </p>

        <a
          class="back-button"
          href="./index.html"
        >
          Back to ToTalk
        </a>

      </div>
    `;

  }

}

/* =====================================================
   START
===================================================== */

startApp();

</script>
