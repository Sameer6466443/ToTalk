<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05020f">
<title>ToTalk Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#050711;--panel:rgba(15,20,42,.72);--panel2:rgba(10,14,31,.88);--line:rgba(133,166,255,.18);--line2:rgba(133,166,255,.10);--text:#f5f7ff;--muted:#8e9ab8;--violet:#8b7cff;--cyan:#54d8ff;--pink:#ff72c8;--green:#65e6b0;--yellow:#ffd66b;--red:#ff6f9f}
html,body{min-height:100%;background:#050711;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding:28px;overflow-x:hidden;background-image:radial-gradient(ellipse at 50% -15%,rgba(90,105,255,.26),transparent 42%),radial-gradient(circle at 8% 80%,rgba(0,213,255,.08),transparent 28%),radial-gradient(circle at 92% 30%,rgba(190,70,255,.10),transparent 30%)}
body:before,body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1}body:before{opacity:.35;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:83px 83px;mask-image:linear-gradient(to bottom,black,transparent 85%)}body:after{background:linear-gradient(115deg,transparent 20%,rgba(84,216,255,.025),transparent 60%)}
button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:auto}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:25px}.brand{display:flex;align-items:center;gap:14px}.logo{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,#9c8cff 0%,#5b55e9 45%,#1a9ed0 100%);border:1px solid rgba(255,255,255,.4);box-shadow:0 0 0 6px rgba(139,124,255,.06),0 0 45px rgba(89,126,255,.35)}.logo svg{width:29px;height:29px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.brand h1{font-size:25px;letter-spacing:-.04em}.brand p{font-size:12px;color:var(--muted);margin-top:3px;letter-spacing:.13em;text-transform:uppercase}.actions{display:flex;gap:10px}.icon-btn{width:46px;height:46px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.035);color:#dce5ff;display:grid;place-items:center;transition:.2s;backdrop-filter:blur(14px)}.icon-btn:hover{transform:translateY(-2px);border-color:rgba(139,124,255,.6);background:rgba(139,124,255,.13);box-shadow:0 10px 30px rgba(0,0,0,.25)}.icon-btn.danger{color:#ff9fc8}
.banner{display:none;padding:13px 16px;border:1px solid rgba(255,111,159,.4);background:rgba(255,111,159,.08);border-radius:16px;margin-bottom:18px;color:#ffc4db}.banner.show{display:block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:22px}.stat{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(22,29,59,.82),rgba(8,12,27,.82));border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.18);backdrop-filter:blur(18px)}.stat:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-35px;top:-35px;background:currentColor;opacity:.06;filter:blur(3px)}.stat-top{display:flex;align-items:center;gap:10px}.stat-icon{width:35px;height:35px;border-radius:12px;display:grid;place-items:center;border:1px solid currentColor;background:rgba(255,255,255,.035)}.stat span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em}.stat strong{font-size:28px;margin-left:auto;letter-spacing:-.05em}.stat.pending{color:var(--yellow)}.stat.investigating{color:var(--cyan)}.stat.resolved{color:var(--green)}.stat.dismissed{color:#aeb7d1}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid var(--line2);background:rgba(255,255,255,.025);color:var(--muted);border-radius:999px;padding:10px 15px;font-size:12px;transition:.2s}.tab:hover{color:#fff;border-color:rgba(139,124,255,.45)}.tab.active{color:#fff;background:linear-gradient(135deg,rgba(139,124,255,.25),rgba(84,216,255,.10));border-color:rgba(139,124,255,.65);box-shadow:0 0 25px rgba(139,124,255,.12)}
.reports{display:grid;gap:15px}.card{position:relative;background:linear-gradient(145deg,rgba(18,25,53,.86),rgba(7,11,25,.92));border:1px solid rgba(139,157,255,.18);border-radius:24px;padding:19px;box-shadow:0 25px 75px rgba(0,0,0,.25);backdrop-filter:blur(20px);overflow:hidden}.card:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(139,124,255,.05),transparent 35%,rgba(84,216,255,.025));pointer-events:none}.card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.report-title{display:flex;align-items:center;gap:11px}.report-badge{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(139,124,255,.24),rgba(84,216,255,.08));border:1px solid rgba(139,124,255,.42);color:#c3bcff}.card-head strong{font-size:16px}.idline{font-size:11px;color:#7785a6;margin-top:4px}.status{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:8px 11px;font-size:11px;border:1px solid}.status-dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}.status.pending{color:var(--yellow);border-color:rgba(255,214,107,.35);background:rgba(255,214,107,.06)}.status.investigating{color:var(--cyan);border-color:rgba(84,216,255,.35);background:rgba(84,216,255,.06)}.status.resolved{color:var(--green);border-color:rgba(101,230,176,.35);background:rgba(101,230,176,.06)}.status.dismissed{color:#aeb7d1;border-color:rgba(174,183,209,.25);background:rgba(174,183,209,.04)}
.people{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:17px 0 12px}.person,.info-box{border:1px solid var(--line2);background:rgba(255,255,255,.025);border-radius:16px;padding:12px}.person label,.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:#8491b0;margin-bottom:8px}.person-main{display:flex;align-items:center;gap:10px}.avatar{width:37px;height:37px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#7064ed,#1e8dbb);border:1px solid rgba(180,205,255,.35)}.person strong{font-size:13px;display:block}.person code{font-size:10px;color:#9eaaff;display:block;margin-top:3px}.info-box{margin-top:9px}.info-label{display:flex;align-items:center;gap:8px;font-size:11px;color:#e8edff;font-weight:700}.info-value{font-size:12px;color:#b4bfd8;line-height:1.55;margin-top:6px;padding-left:23px;word-break:break-word}.meta{font-size:10px;color:#697794;margin:11px 0}.btn{border:1px solid var(--line);background:rgba(255,255,255,.035);color:#fff;border-radius:14px;padding:11px 15px;transition:.2s}.btn:hover{background:rgba(139,124,255,.13);border-color:rgba(139,124,255,.55);transform:translateY(-1px)}.btn.primary{background:linear-gradient(110deg,#6b5bed,#9b6cff 48%,#39bde3);border-color:rgba(255,255,255,.35);box-shadow:0 10px 30px rgba(90,93,235,.25)}.view{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;height:48px;font-weight:800;letter-spacing:.01em}.view .arrow{margin-left:auto;font-size:22px}.controls{margin-top:15px;padding-top:16px;border-top:1px solid var(--line2);display:grid;grid-template-columns:1fr 1fr;gap:11px}.field select,.field textarea{width:100%;border:1px solid var(--line);background:#080d20;color:#fff;border-radius:13px;padding:11px;outline:none}.field select:focus,.field textarea:focus{border-color:#8b7cff;box-shadow:0 0 0 3px rgba(139,124,255,.1)}.notes{grid-column:1/-1}.field textarea{min-height:70px;resize:vertical}.counter{position:absolute;right:10px;bottom:8px;color:#65718c;font-size:9px}.note-wrap{position:relative}.save{grid-column:1/-1;width:100%;height:44px}
.empty,.loading{padding:65px 20px;text-align:center;border:1px dashed rgba(139,157,255,.25);border-radius:22px;color:var(--muted);background:rgba(255,255,255,.02)}.empty strong{display:block;color:#fff;margin-bottom:6px}
.modal{position:fixed;inset:0;z-index:500;display:none;background:rgba(1,3,12,.78);backdrop-filter:blur(18px);padding:16px}.modal.show{display:flex;align-items:center;justify-content:center}.modal-box{width:min(940px,100%);height:min(92vh,850px);display:flex;flex-direction:column;background:linear-gradient(145deg,#111936,#060a19);border:1px solid rgba(139,157,255,.35);border-radius:28px;box-shadow:0 35px 120px rgba(0,0,0,.7),0 0 80px rgba(89,93,255,.12);overflow:hidden}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:13px;background:rgba(255,255,255,.025)}.modal-logo{width:45px;height:45px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#8b7cff,#38bde3);border:1px solid rgba(255,255,255,.4);box-shadow:0 0 28px rgba(84,216,255,.18)}.modal-title strong{display:block;font-size:18px}.modal-title span{display:block;color:#8996b5;font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.close-btn{margin-left:auto;width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#fff;display:grid;place-items:center}.conversation{overflow:auto;padding:20px 22px 32px;min-height:0}.date-divider{display:flex;align-items:center;gap:10px;color:#8e9ab8;font-size:10px;margin:14px 0 20px}.date-divider:before,.date-divider:after{content:"";height:1px;background:var(--line2);flex:1}.date-pill{border:1px solid var(--line);background:rgba(139,124,255,.08);padding:6px 11px;border-radius:99px}.message{display:flex;margin:0 0 19px}.message.right{justify-content:flex-end}.message-inner{max-width:min(680px,90%)}.message-info{display:flex;align-items:center;gap:8px;margin:0 0 7px 5px}.sender-name{font-size:12px;font-weight:800}.sender-id{font-size:9px;color:#aeb7ff;background:rgba(139,124,255,.1);border:1px solid rgba(139,124,255,.22);padding:3px 7px;border-radius:99px}.bubble{border:1px solid rgba(139,157,255,.17);background:linear-gradient(145deg,rgba(84,216,255,.08),rgba(139,124,255,.10));border-radius:17px;padding:12px 14px;color:#eef2ff;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}.message.right .bubble{background:linear-gradient(145deg,rgba(139,124,255,.24),rgba(84,216,255,.08));border-color:rgba(139,124,255,.35)}.message-time{font-size:9px;color:#687694;margin:7px 0 0 5px}.deleted-card{border:1px solid rgba(255,114,200,.42);background:linear-gradient(145deg,rgba(255,114,200,.10),rgba(20,12,36,.8));border-radius:18px;padding:15px;box-shadow:inset 0 0 40px rgba(255,114,200,.035)}.deleted-head{display:flex;align-items:center;gap:8px;color:#ff86c9;font-size:11px;font-weight:900;letter-spacing:.08em}.deleted-author{display:flex;align-items:center;gap:8px;margin:13px 0 9px}.deleted-original{color:#f0eaff;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}.deleted-original.missing{color:#b8aec9;font-style:italic}.preserved{display:flex;align-items:center;gap:8px;margin-top:13px;padding-top:11px;border-top:1px solid rgba(255,114,200,.15);font-size:10px;color:#c9b3d0}.deleted-time{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:10px;color:#8e7d99}.conversation-empty{min-height:280px;display:grid;place-items:center;text-align:center;color:var(--muted)}
.login{position:relative;max-width:470px;margin:12vh auto;background:linear-gradient(145deg,rgba(22,29,62,.9),rgba(6,10,24,.96));border:1px solid rgba(139,157,255,.3);border-radius:30px;padding:42px 34px;text-align:center;box-shadow:0 30px 110px rgba(0,0,0,.55),0 0 70px rgba(84,216,255,.08);backdrop-filter:blur(22px);overflow:hidden}.login:before{content:"";position:absolute;width:230px;height:230px;border-radius:50%;background:linear-gradient(135deg,rgba(139,124,255,.22),rgba(84,216,255,.08));filter:blur(5px);top:-120px;left:50%;transform:translateX(-50%)}.login:after{content:"✦  ·  ✧  ·  ✦";position:absolute;top:22px;left:0;right:0;color:#aab7ff;letter-spacing:13px;font-size:14px}.login h2{position:relative;margin:18px 0 10px;font-size:27px;letter-spacing:-.04em}.login p{position:relative;color:var(--muted);line-height:1.65;font-size:13px}.login .btn{position:relative;margin-top:24px;width:100%;height:48px;font-weight:800}.toast{position:fixed;right:18px;bottom:18px;max-width:360px;padding:13px 16px;border:1px solid rgba(101,230,176,.4);background:#081b19;color:#d8ffea;border-radius:15px;box-shadow:0 15px 40px rgba(0,0,0,.35);opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;z-index:1000}.toast.show{opacity:1;transform:none}
@media(max-width:760px){body{padding:15px}.stats{grid-template-columns:1fr 1fr}.people{grid-template-columns:1fr}.modal{padding:8px}.modal-box{height:95vh;border-radius:22px}.conversation{padding:15px}.login{margin:8vh auto;padding:35px 22px}}@media(max-width:480px){.topbar{align-items:flex-start}.brand h1{font-size:22px}.stats{gap:8px}.stat{padding:13px}.stat strong{font-size:22px}.controls{grid-template-columns:1fr}.notes,.save{grid-column:1}.message-inner{max-width:95%}}

</style>
</head>

<body>

<div class="shell" id="app" style="display:none">
<header class="topbar">
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M5 5.5h14v9H11l-4 4v-4H5z"/><path d="M8 9.5h8M8 12h5"/></svg>
    </div>
    <div><h1>ToTalk</h1><p>Admin Panel</p></div>
  </div>
  <div class="actions">
    <button class="icon-btn" id="refreshBtn" title="Refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-4"/><path d="M5 3v4h4"/><path d="M4 13a8 8 0 0 0 14.9 4"/><path d="M19 21v-4h-4"/></svg>
    </button>
    <button class="icon-btn danger" id="signOutBtn" title="Sign out" aria-label="Sign out">
      <svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M21 3v18"/></svg>
    </button>
  </div>
</header>

<div class="banner" id="errorBanner"></div>

<section class="stats">
  <div class="stat pending"><div class="stat-top"><div class="stat-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></svg></div><span>Pending</span><strong id="countPending">0</strong></div></div>
  <div class="stat investigating"><div class="stat-top"><div class="stat-icon"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg></div><span>Investigating</span><strong id="countInvestigating">0</strong></div></div>
  <div class="stat resolved"><div class="stat-top"><div class="stat-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="m8.5 12 2.3 2.3 4.8-5"/></svg></div><span>Resolved</span><strong id="countResolved">0</strong></div></div>
  <div class="stat dismissed"><div class="stat-top"><div class="stat-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M8 12h8"/></svg></div><span>Dismissed</span><strong id="countDismissed">0</strong></div></div>
</section>

<div class="toolbar">
  <div class="tabs" id="tabs">
    <button class="tab active" data-status="pending">Pending</button>
    <button class="tab" data-status="investigating">Investigating</button>
    <button class="tab" data-status="resolved">Resolved</button>
    <button class="tab" data-status="dismissed">Dismissed</button>
    <button class="tab" data-status="all">All</button>
  </div>
</div>

<main class="reports" id="reports"><div class="loading">Loading reports…</div></main>
</div>

<div class="login" id="loginBox" style="display:none">
  <h2>Owner access required</h2>
  <p>You must be signed in with a ToTalk account that has an owner, admin, or moderator role.</p>
  <button class="btn primary" id="goChatBtn">Open ToTalk</button>
</div>

<div class="modal" id="conversationModal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-brand">
        <div class="modal-logo"><svg viewBox="0 0 24 24"><path d="M5 5.5h14v9H11l-4 4v-4H5z"/><path d="M8 9.5h8M8 12h5"/></svg></div>
        <div class="modal-title"><strong>Conversation</strong><span id="conversationIdLabel">Loading…</span></div>
      </div>
      <button class="close-btn" id="closeConversationBtn" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="conversation" id="conversation"><div class="conversation-empty">Loading conversation…</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL="https://qiynczbrhpxwuabwuyiy.supabase.co";
const SUPABASE_KEY="sb_publishable_eUPz4c_nYckgINEK-AIWqw_JAXIHozd";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

const app=document.getElementById("app"),loginBox=document.getElementById("loginBox"),reportsEl=document.getElementById("reports");
const errorBanner=document.getElementById("errorBanner"),toast=document.getElementById("toast");
const conversationModal=document.getElementById("conversationModal"),conversationEl=document.getElementById("conversation"),conversationIdLabel=document.getElementById("conversationIdLabel");

let currentStatus="pending",allReports=[],conversationTimer=null;

function esc(v){return String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]))}
function fmtDate(v){if(!v)return "—";const d=new Date(v);return isNaN(d.getTime())?String(v):d.toLocaleString([],{dateStyle:"medium",timeStyle:"short"})}
function fmtTime(v){if(!v)return "";const d=new Date(v);return isNaN(d.getTime())?"":d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}
function showError(m){errorBanner.textContent=m||"";errorBanner.classList.toggle("show",!!m)}
function showToast(m){toast.textContent=m;toast.classList.add("show");clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove("show"),2600)}

function avatar(){
 return `<div class="avatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 20c.8-4 3-6 6.5-6s5.7 2 6.5 6"/></svg></div>`;
}
function reportIcon(){
 return `<svg viewBox="0 0 24 24"><path d="M12 3 4 6v5c0 5 3.2 8.2 8 10 4.8-1.8 8-5 8-10V6z"/><path d="M12 8v4M12 15h.01"/></svg>`;
}
function setCounts(rows){
 const c={pending:0,investigating:0,resolved:0,dismissed:0};
 rows.forEach(r=>{if(c[r.status]!==undefined)c[r.status]++});
 for(const k of Object.keys(c))document.getElementById("count"+k[0].toUpperCase()+k.slice(1)).textContent=c[k];
}
function person(label,name,id){
 return `<div class="person"><label>${esc(label)}</label><div class="person-main">${avatar()}<div><strong>${esc(name||"Unknown user")}</strong><code>${esc(id||"No ToTalk ID")}</code></div></div></div>`;
}

function card(r){
 const status=["pending","investigating","resolved","dismissed"].includes(r.status)?r.status:"pending";
 return `<article class="card" data-id="${esc(r.id)}">
  <div class="card-head">
   <div class="report-title"><div class="report-badge">${reportIcon()}</div><div><strong>Report #${esc(r.id)}</strong><div class="idline">Submitted ${esc(fmtDate(r.created_at))}</div></div></div>
   <span class="status ${status}"><i class="status-dot"></i>${esc(status[0].toUpperCase()+status.slice(1))}</span>
  </div>
  <div class="people">${person("Reporter",r.reporter_name,r.reporter_totalk_id)}${person("Reported user",r.reported_name,r.reported_totalk_id)}</div>
  <div class="info-box"><div class="info-label"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M8 8h8M8 12h6"/></svg>Reason</div><div class="info-value">${esc(r.reason||"Not specified")}</div></div>
  ${r.details?`<div class="info-box"><div class="info-label"><svg viewBox="0 0 24 24"><path d="M5 5h14v10H9l-4 4z"/><path d="M8 9h8M8 12h5"/></svg>Details</div><div class="info-value">${esc(r.details)}</div></div>`:""}
  <div class="info-box"><div class="info-label"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5l2 2"/><path d="M20 12a8 8 0 0 1-14 5l-2-2"/></svg>Conversation ID</div><div class="info-value">${esc(r.conversation_id||"—")}</div></div>
  ${r.conversation_id?`<button class="btn primary view" data-view-conversation="1" data-conversation-id="${esc(r.conversation_id)}">
   <svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></svg>
   View Conversation <span class="arrow">›</span></button>`:""}
  <div class="controls">
   <div class="field"><label>Status</label><select class="statusSelect"><option value="pending">Pending</option><option value="investigating">Investigating</option><option value="resolved">Resolved</option><option value="dismissed">Dismissed</option></select></div>
   <div class="field"><label>Action</label><select class="actionSelect"><option value="">No action</option><option value="warning">Warning</option><option value="restrict">Restrict</option><option value="suspend">Suspend</option><option value="ban">Ban</option></select></div>
   <div class="field notes"><label>Admin Notes</label><div class="note-wrap"><textarea maxlength="500" class="notesInput" placeholder="Add a private note…"></textarea><span class="counter">0/500</span></div></div>
   <button class="btn primary save" data-save="1"><svg viewBox="0 0 24 24"><path d="M5 4h12l2 2v14H5z"/><path d="M8 4v6h8V4M8 20v-5h8v5"/></svg> Save Changes</button>
  </div>
 </article>`;
}

function render(){
 const rows=currentStatus==="all"?allReports:allReports.filter(r=>r.status===currentStatus);
 if(!rows.length){reportsEl.innerHTML=`<div class="empty"><strong>${currentStatus==="all"?"No reports.":currentStatus+" reports."}</strong>You're all caught up here.</div>`;return}
 reportsEl.innerHTML=rows.map(card).join("");
 rows.forEach(r=>{
  const el=reportsEl.querySelector(`[data-id="${CSS.escape(String(r.id))}"]`);if(!el)return;
  el.querySelector(".statusSelect").value=["pending","investigating","resolved","dismissed"].includes(r.status)?r.status:"pending";
  el.querySelector(".actionSelect").value=r.action||"";
  el.querySelector(".notesInput").value=r.admin_notes||"";
  updateCounter(el.querySelector(".notesInput"));
 });
}
function updateCounter(t){if(!t)return;t.parentElement.querySelector(".counter").textContent=`${t.value.length}/500`}

async function loadReports(){
 showError("");reportsEl.innerHTML=`<div class="loading">Loading reports…</div>`;
 const {data,error}=await supabaseClient.rpc("admin_list_reports",{p_status:null});
 if(error){console.error(error);showError("Could not load reports: "+error.message);reportsEl.innerHTML=`<div class="empty"><strong>Could not load reports.</strong>Check your admin permissions and Supabase function setup.</div>`;return}
 allReports=Array.isArray(data)?data:[];setCounts(allReports);render();
}

async function saveReport(el){
 const id=el.dataset.id,status=el.querySelector(".statusSelect").value,action=el.querySelector(".actionSelect").value||null,notes=el.querySelector(".notesInput").value.trim()||null,button=el.querySelector("[data-save]");
 button.disabled=true;button.textContent="Saving…";showError("");
 const {data,error}=await supabaseClient.rpc("admin_update_report",{p_report_id:Number(id),p_status:status,p_action:action,p_admin_notes:notes});
 if(error||data!==true){showError("Could not update report #"+id+": "+(error?.message||"Update was not accepted."));button.disabled=false;button.innerHTML=`<svg viewBox="0 0 24 24"><path d="M5 4h12l2 2v14H5z"/><path d="M8 4v6h8V4M8 20v-5h8v5"/></svg> Save Changes`;return}
 showToast("Report #"+id+" updated");await loadReports();
}

function getOriginalText(m){
 // Supports the common names returned by different RPC versions.
 return m.deleted_message_content ?? m.original_content ?? m.content_before_delete ?? m.preserved_content ?? m.original_message ?? m.message_text ?? m.content ?? "";
}
function isDeleted(m){return !!(m.is_deleted||m.deleted_at)}
function dateKey(v){const d=new Date(v);return isNaN(d.getTime())?"":d.toLocaleDateString([],{day:"numeric",month:"short",year:"numeric"})}

function deletedMessage(m){
 const original=getOriginalText(m);
 const hasOriginal=String(original||"").trim().length>0;
 return `<div class="message deleted">
  <div class="message-inner">
   <div class="deleted-card">
    <div class="deleted-head">
      <svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"/></svg>
      DELETED MESSAGE
    </div>
    <div class="deleted-author">${avatar()}<div><span class="sender-name">${esc(m.sender_name||"Unknown user")}</span><span class="sender-id">${esc(m.totalk_id||"No ToTalk ID")}</span></div></div>
    <div class="deleted-original ${hasOriginal?"":"missing"}">${esc(hasOriginal?original:"Original text was not preserved in the database.")}</div>
    <div class="preserved">
      <svg viewBox="0 0 24 24"><path d="M12 3 4 6v5c0 5 3.2 8.2 8 10 4.8-1.8 8-5 8-10V6z"/><path d="m8.5 12 2.2 2.2 4.8-5"/></svg>
      ${hasOriginal?"Original message preserved for moderation":"Only deletion metadata is available"}
    </div>
    ${m.deleted_at?`<div class="deleted-time"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></svg>Deleted ${esc(fmtDate(m.deleted_at))}</div>`:""}
   </div>
  </div>
 </div>`;
}

function normalMessage(m){
 return `<div class="message ${m.sender_side==="right"?"right":"left"}"><div class="message-inner">
  <div class="message-info"><span class="sender-name">${esc(m.sender_name||"Unknown user")}</span><span class="sender-id">${esc(m.totalk_id||"No ToTalk ID")}</span></div>
  <div class="bubble">${esc(m.message_text??m.content??"")}</div>
  <div class="message-time">${esc(fmtDate(m.created_at))}${m.edited_at?" · Edited":""}</div>
 </div></div>`;
}

async function openConversation(conversationId){
 conversationModal.classList.add("show");conversationIdLabel.textContent="Conversation ID: "+conversationId;
 conversationEl.innerHTML=`<div class="conversation-empty">Loading conversation…</div>`;
 const {data,error}=await supabaseClient.rpc("admin_view_conversation",{p_conversation_id:conversationId});
 if(error){conversationEl.innerHTML=`<div class="conversation-empty"><div><strong style="display:block;color:#fff;margin-bottom:6px">Could not load conversation</strong><span>${esc(error.message)}</span></div></div>`;return}
 const rows=Array.isArray(data)?data:[];
 if(!rows.length){conversationEl.innerHTML=`<div class="conversation-empty">No messages found in this conversation.</div>`;return}
 let lastDate="";
 conversationEl.innerHTML=rows.map(m=>{
   const k=dateKey(m.created_at);let divider="";
   if(k&&k!==lastDate){lastDate=k;divider=`<div class="date-divider"><span class="date-pill">${esc(k)}</span></div>`}
   return divider+(isDeleted(m)?deletedMessage(m):normalMessage(m));
 }).join("");
}

function closeConversation(){conversationModal.classList.remove("show")}

document.getElementById("refreshBtn").addEventListener("click",loadReports);
document.getElementById("signOutBtn").addEventListener("click",async()=>{await supabaseClient.auth.signOut();location.reload()});
document.getElementById("goChatBtn").addEventListener("click",()=>location.href="chat.html");

document.getElementById("tabs").addEventListener("click",e=>{
 const b=e.target.closest(".tab");if(!b)return;
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");
 currentStatus=b.dataset.status;render();
});

reportsEl.addEventListener("click",e=>{
 const v=e.target.closest("[data-view-conversation]");if(v){openConversation(v.dataset.conversationId);return}
 const s=e.target.closest("[data-save]");if(s){const c=s.closest(".card");if(c)saveReport(c)}
});
reportsEl.addEventListener("input",e=>{if(e.target.classList.contains("notesInput"))updateCounter(e.target)});

document.getElementById("closeConversationBtn").addEventListener("click",closeConversation);
conversationModal.addEventListener("click",e=>{if(e.target===conversationModal)closeConversation()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&conversationModal.classList.contains("show"))closeConversation()});

supabaseClient.auth.onAuthStateChange(event=>{if(event==="SIGNED_OUT")location.reload()});

async function boot(){
 const {data:{session}}=await supabaseClient.auth.getSession();
 if(!session){loginBox.style.display="block";return}
 const {data,error}=await supabaseClient.rpc("is_totalk_admin");
 if(error||data!==true){loginBox.style.display="block";showError(error?.message||"This account does not have admin access.");return}
 app.style.display="block";await loadReports();
}
boot();
</script>
</body>
</html>
