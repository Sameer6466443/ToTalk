<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05030b">
<title>ToTalk Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#05030b;
  --bg2:#090512;
  --card:#0d0818;
  --card2:#120b20;
  --purple:#914cff;
  --purple2:#b978ff;
  --purple3:#7134db;

  --white:#faf8ff;
  --text:#e9e4f2;
  --muted:#92899f;
  --dim:#625a70;

  --yellow:#ffe45c;
  --blue:#69baff;
  --green:#51e69a;
  --red:#ff6387;
  --gray:#aaa3b5;

  --border:rgba(145,76,255,.25);
  --borderStrong:rgba(145,76,255,.5);
}

html{
  min-height:100%;
  background:var(--bg);
}

body{
  min-height:100vh;
  background:
    radial-gradient(
      circle at 50% -15%,
      rgba(145,76,255,.20),
      transparent 40%
    ),
    linear-gradient(
      180deg,
      #05030b 0%,
      #07030e 50%,
      #05030b 100%
    );
  color:var(--white);
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  padding:18px;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.shell{
  width:100%;
  max-width:1050px;
  margin:0 auto;
}

/* =========================================================
   HEADER
========================================================= */

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:22px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.logo{
  width:46px;
  height:46px;
  flex:0 0 46px;
  border-radius:15px;

  display:grid;
  place-items:center;

  border:1px solid rgba(145,76,255,.55);

  background:
    linear-gradient(
      145deg,
      rgba(145,76,255,.22),
      rgba(145,76,255,.06)
    );

  box-shadow:
    0 0 30px rgba(145,76,255,.14),
    inset 0 0 20px rgba(145,76,255,.05);
}

.logo svg{
  width:24px;
  height:24px;
  fill:none;
  stroke:var(--purple2);
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.brand-text{
  min-width:0;
}

.brand h1{
  font-size:20px;
  line-height:1.1;
  font-weight:750;
  letter-spacing:-.3px;
}

.brand p{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.icon-btn{
  width:43px;
  height:43px;

  display:grid;
  place-items:center;

  border-radius:13px;

  border:1px solid var(--border);
  background:rgba(145,76,255,.07);

  color:var(--text);

  transition:
    background .18s ease,
    border-color .18s ease,
    transform .18s ease;
}

.icon-btn:hover{
  background:rgba(145,76,255,.15);
  border-color:var(--borderStrong);
}

.icon-btn:active{
  transform:scale(.95);
}

.icon-btn svg{
  width:19px;
  height:19px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.icon-btn.danger{
  color:#ff9eb5;
  border-color:rgba(255,99,135,.25);
  background:rgba(255,99,135,.055);
}

.icon-btn.danger:hover{
  background:rgba(255,99,135,.11);
  border-color:rgba(255,99,135,.45);
}

/* =========================================================
   ERROR
========================================================= */

.banner{
  display:none;

  margin-bottom:16px;
  padding:12px 14px;

  border-radius:13px;

  border:1px solid rgba(255,99,135,.35);
  background:rgba(255,99,135,.07);

  color:#ffc1cf;
  font-size:12px;
  line-height:1.5;
}

.banner.show{
  display:block;
}

/* =========================================================
   STATS
========================================================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin-bottom:18px;
}

.stat{
  position:relative;
  overflow:hidden;

  min-width:0;

  padding:13px 14px;

  border-radius:14px;

  background:
    linear-gradient(
      145deg,
      rgba(17,10,30,.98),
      rgba(9,5,17,.98)
    );

  border:1px solid var(--border);

  box-shadow:
    0 12px 35px rgba(0,0,0,.2);
}

.stat::after{
  content:"";
  position:absolute;
  right:-25px;
  bottom:-30px;

  width:75px;
  height:75px;

  border-radius:50%;

  background:currentColor;
  opacity:.045;
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:10px;
  font-weight:550;
  letter-spacing:.02em;
}

.stat strong{
  display:block;
  margin-top:4px;
  font-size:23px;
  line-height:1;
}

.stat.pending{
  color:var(--yellow);
}

.stat.investigating{
  color:var(--blue);
}

.stat.resolved{
  color:var(--green);
}

.stat.dismissed{
  color:var(--gray);
}

/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:13px;
}

.tabs{
  display:flex;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:none;
  padding-bottom:2px;
  width:100%;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  flex:0 0 auto;

  border:1px solid rgba(145,76,255,.22);

  background:rgba(145,76,255,.045);

  color:var(--muted);

  border-radius:999px;

  padding:8px 12px;

  font-size:11px;
  font-weight:600;

  transition:.18s ease;
}

.tab:hover{
  color:var(--text);
  background:rgba(145,76,255,.09);
}

.tab.active{
  color:var(--white);

  background:
    linear-gradient(
      135deg,
      rgba(145,76,255,.25),
      rgba(145,76,255,.11)
    );

  border-color:rgba(145,76,255,.65);

  box-shadow:
    0 0 20px rgba(145,76,255,.08);
}

/* =========================================================
   REPORT LIST
========================================================= */

.reports{
  display:grid;
  gap:11px;
}

.card{
  overflow:hidden;

  background:
    linear-gradient(
      145deg,
      rgba(16,9,28,.99),
      rgba(7,4,14,.99)
    );

  border:1px solid rgba(145,76,255,.25);

  border-radius:18px;

  box-shadow:
    0 16px 50px rgba(0,0,0,.28);

  transition:
    border-color .2s ease,
    box-shadow .2s ease;
}

.card:hover{
  border-color:rgba(145,76,255,.4);

  box-shadow:
    0 18px 55px rgba(0,0,0,.35),
    0 0 30px rgba(145,76,255,.035);
}

/* =========================================================
   CARD HEADER
========================================================= */

.card-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;

  padding:16px 16px 13px;
}

.report-title{
  min-width:0;
}

.report-number{
  display:flex;
  align-items:center;
  gap:7px;

  font-size:15px;
  font-weight:750;
  letter-spacing:-.15px;
}

.report-icon{
  width:25px;
  height:25px;

  display:grid;
  place-items:center;

  border-radius:8px;

  color:var(--purple2);

  background:rgba(145,76,255,.10);
  border:1px solid rgba(145,76,255,.18);
}

.report-icon svg{
  width:13px;
  height:13px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.idline{
  margin-top:4px;
  color:var(--dim);
  font-size:10px;
}

.status{
  flex:0 0 auto;

  display:inline-flex;
  align-items:center;
  gap:6px;

  padding:6px 9px;

  border-radius:999px;

  border:1px solid;

  font-size:10px;
  font-weight:650;
}

.status-dot{
  width:5px;
  height:5px;
  border-radius:50%;
  background:currentColor;
  box-shadow:0 0 8px currentColor;
}

.status.pending{
  color:var(--yellow);
  border-color:rgba(255,228,92,.30);
  background:rgba(255,228,92,.055);
}

.status.investigating{
  color:var(--blue);
  border-color:rgba(105,186,255,.30);
  background:rgba(105,186,255,.055);
}

.status.resolved{
  color:var(--green);
  border-color:rgba(81,230,154,.30);
  background:rgba(81,230,154,.055);
}

.status.dismissed{
  color:var(--gray);
  border-color:rgba(170,163,181,.25);
  background:rgba(170,163,181,.045);
}

/* =========================================================
   PEOPLE
========================================================= */

.people{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;

  padding:0 16px;
}

.person{
  min-width:0;

  padding:12px;

  border-radius:13px;

  background:
    linear-gradient(
      145deg,
      rgba(145,76,255,.065),
      rgba(145,76,255,.025)
    );

  border:1px solid rgba(145,76,255,.16);
}

.person-head{
  display:flex;
  align-items:center;
  gap:7px;

  margin-bottom:8px;
}

.person-avatar{
  width:26px;
  height:26px;

  display:grid;
  place-items:center;

  border-radius:8px;

  background:rgba(145,76,255,.11);

  color:var(--purple2);
}

.person-avatar.reported{
  color:#ff8eaa;
  background:rgba(255,99,135,.08);
}

.person-avatar svg{
  width:14px;
  height:14px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.person-label{
  color:var(--muted);

  font-size:9px;
  font-weight:650;

  letter-spacing:.11em;
  text-transform:uppercase;
}

.person-name{
  display:block;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;

  color:var(--white);

  font-size:13px;
  font-weight:700;
}

.person-id{
  display:flex;
  align-items:center;
  gap:5px;

  margin-top:5px;

  min-width:0;
}

.person-id-label{
  color:var(--dim);
  font-size:9px;
}

.person-id code{
  min-width:0;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;

  color:var(--purple2);

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    monospace;

  font-size:9px;
}

/* =========================================================
   REPORT DETAILS
========================================================= */

.report-body{
  padding:14px 16px 0;
}

.reason-row{
  display:flex;
  align-items:flex-start;
  gap:8px;
}

.reason-label{
  flex:0 0 auto;

  color:var(--purple2);

  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.reason-value{
  min-width:0;

  color:var(--text);

  font-size:12px;
  line-height:1.45;
}

.details{
  margin-top:8px;

  color:#aaa3b5;

  font-size:11px;
  line-height:1.55;

  white-space:pre-wrap;
  word-break:break-word;
}

.conversation{
  display:flex;
  align-items:center;
  gap:7px;

  margin-top:10px;

  color:var(--dim);

  font-size:9px;
}

.conversation svg{
  width:12px;
  height:12px;
  flex:0 0 12px;

  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* =========================================================
   DECISION AREA
========================================================= */

.decision{
  margin-top:14px;

  padding:14px 16px 16px;

  border-top:1px solid rgba(145,76,255,.13);

  background:
    linear-gradient(
      180deg,
      rgba(145,76,255,.025),
      transparent
    );
}

.decision-title{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:10px;
}

.decision-title strong{
  font-size:11px;
  font-weight:700;
}

.decision-title span{
  color:var(--dim);
  font-size:9px;
}

.controls{
  display:grid;

  grid-template-columns:
    minmax(0,170px)
    minmax(0,170px)
    1fr
    auto;

  gap:8px;

  align-items:end;
}

.field{
  min-width:0;
}

.field label{
  display:block;

  margin-bottom:5px;

  color:var(--muted);

  font-size:8px;
  font-weight:700;

  text-transform:uppercase;
  letter-spacing:.1em;
}

.field select,
.field textarea{
  width:100%;

  border:1px solid rgba(145,76,255,.25);

  background:#08040f;

  color:var(--white);

  border-radius:10px;

  outline:none;

  transition:
    border-color .18s ease,
    background .18s ease;
}

.field select{
  height:40px;
  padding:0 10px;

  appearance:auto;

  font-size:11px;
}

.field textarea{
  min-height:40px;
  height:40px;

  resize:vertical;

  padding:10px;

  font-size:11px;

  line-height:1.4;
}

.field select:focus,
.field textarea:focus{
  border-color:rgba(145,76,255,.65);
  background:#0a0513;
}

.save{
  height:40px;

  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;

  padding:0 16px;

  border-radius:10px;

  border:1px solid #a86bff;

  background:
    linear-gradient(
      135deg,
      #7130d8,
      #9a4cff
    );

  color:white;

  font-size:11px;
  font-weight:700;

  box-shadow:
    0 7px 20px rgba(113,48,216,.18);

  transition:
    transform .18s ease,
    filter .18s ease;
}

.save:hover{
  filter:brightness(1.08);
}

.save:active{
  transform:scale(.98);
}

.save:disabled{
  cursor:not-allowed;
  opacity:.6;
}

.save svg{
  width:14px;
  height:14px;

  fill:none;
  stroke:currentColor;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* =========================================================
   EMPTY / LOADING
========================================================= */

.empty,
.loading{
  padding:48px 20px;

  text-align:center;

  border:1px dashed rgba(145,76,255,.22);

  border-radius:16px;

  color:var(--muted);

  font-size:12px;
}

.empty strong{
  display:block;

  margin-bottom:5px;

  color:var(--white);

  font-size:13px;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;

  left:50%;
  bottom:22px;

  transform:
    translate(-50%,15px);

  width:
    min(calc(100% - 28px),420px);

  padding:12px 15px;

  border-radius:12px;

  border:1px solid rgba(81,230,154,.35);

  background:#0b1712;

  color:#d8ffea;

  font-size:11px;

  box-shadow:
    0 15px 45px rgba(0,0,0,.4);

  opacity:0;

  pointer-events:none;

  transition:.2s ease;

  z-index:1000;
}

.toast.show{
  opacity:1;

  transform:
    translate(-50%,0);
}

/* =========================================================
   LOGIN
========================================================= */

.login{
  width:
    min(calc(100% - 30px),420px);

  margin:15vh auto;

  padding:28px 22px;

  text-align:center;

  background:
    linear-gradient(
      145deg,
      rgba(16,9,28,.99),
      rgba(8,4,15,.99)
    );

  border:1px solid var(--border);

  border-radius:20px;

  box-shadow:
    0 25px 80px rgba(0,0,0,.45);
}

.login-icon{
  width:55px;
  height:55px;

  margin:0 auto 15px;

  display:grid;
  place-items:center;

  border-radius:17px;

  color:var(--purple2);

  border:1px solid rgba(145,76,255,.4);

  background:rgba(145,76,255,.10);
}

.login-icon svg{
  width:25px;
  height:25px;

  fill:none;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.login h2{
  font-size:18px;
}

.login p{
  margin-top:8px;

  color:var(--muted);

  font-size:11px;
  line-height:1.6;
}

.login .login-btn{
  margin-top:18px;

  width:100%;
  height:42px;

  border:1px solid #a86bff;

  border-radius:11px;

  background:
    linear-gradient(
      135deg,
      #7130d8,
      #9a4cff
    );

  color:white;

  font-weight:700;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:800px){

  body{
    padding:13px;
  }

  .topbar{
    margin-bottom:16px;
  }

  .stats{
    gap:7px;
    margin-bottom:14px;
  }

  .stat{
    padding:11px 12px;
  }

  .stat strong{
    font-size:21px;
  }

  .controls{
    grid-template-columns:1fr 1fr;
  }

  .field.notes{
    grid-column:1/-1;
  }

  .save{
    width:100%;
    grid-column:1/-1;
  }
}

@media(max-width:520px){

  .brand h1{
    font-size:18px;
  }

  .brand p{
    font-size:10px;
  }

  .logo{
    width:42px;
    height:42px;
    flex-basis:42px;
  }

  .icon-btn{
    width:40px;
    height:40px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .toolbar{
    margin-bottom:10px;
  }

  .people{
    grid-template-columns:1fr;
  }

  .card-head{
    padding:14px 13px 11px;
  }

  .people{
    padding:0 13px;
  }

  .report-body{
    padding-left:13px;
    padding-right:13px;
  }

  .decision{
    padding-left:13px;
    padding-right:13px;
  }

  .controls{
    grid-template-columns:1fr;
  }

  .field.notes{
    grid-column:auto;
  }

  .save{
    grid-column:auto;
  }

  .person{
    padding:11px;
  }
}

@media(max-width:360px){

  body{
    padding:10px;
  }

  .brand p{
    display:none;
  }

  .header-actions{
    gap:5px;
  }

  .icon-btn{
    width:37px;
    height:37px;
  }

  .tab{
    padding:7px 10px;
  }
}
</style>
</head>

<body>

<!-- =======================================================
     ADMIN APP
======================================================= -->

<div class="shell" id="app" style="display:none">

  <!-- HEADER -->
  <header class="topbar">

    <div class="brand">

      <div class="logo">
        <svg viewBox="0 0 24 24">
          <path d="M5 5.5h14v9H11l-4 4v-4H5z"/>
          <path d="M8 9.5h8"/>
          <path d="M8 12h5"/>
        </svg>
      </div>

      <div class="brand-text">
        <h1>ToTalk Admin</h1>
        <p>Moderation Center</p>
      </div>

    </div>

    <div class="header-actions">

      <!-- Refresh -->
      <button
        class="icon-btn"
        id="refreshBtn"
        type="button"
        title="Refresh reports"
        aria-label="Refresh reports"
      >
        <svg viewBox="0 0 24 24">
          <path d="M20 11a8.1 8.1 0 0 0-14.9-4L3 10"/>
          <path d="M3 5v5h5"/>
          <path d="M4 13a8.1 8.1 0 0 0 14.9 4L21 14"/>
          <path d="M21 19v-5h-5"/>
        </svg>
      </button>

      <!-- Sign out -->
      <button
        class="icon-btn danger"
        id="signOutBtn"
        type="button"
        title="Sign out"
        aria-label="Sign out"
      >
        <svg viewBox="0 0 24 24">
          <path d="M10 5H6.5A1.5 1.5 0 0 0 5 6.5v11A1.5 1.5 0 0 0 6.5 19H10"/>
          <path d="M14 8l4 4-4 4"/>
          <path d="M18 12H9"/>
        </svg>
      </button>

    </div>

  </header>


  <!-- ERROR -->
  <div
    class="banner"
    id="errorBanner"
  ></div>


  <!-- =====================================================
       STATS
  ====================================================== -->

  <section class="stats">

    <div class="stat pending">
      <span>Pending</span>
      <strong id="countPending">0</strong>
    </div>

    <div class="stat investigating">
      <span>Investigating</span>
      <strong id="countInvestigating">0</strong>
    </div>

    <div class="stat resolved">
      <span>Resolved</span>
      <strong id="countResolved">0</strong>
    </div>

    <div class="stat dismissed">
      <span>Dismissed</span>
      <strong id="countDismissed">0</strong>
    </div>

  </section>


  <!-- =====================================================
       FILTER TABS
  ====================================================== -->

  <div class="toolbar">

    <div
      class="tabs"
      id="tabs"
    >

      <button
        class="tab active"
        data-status="pending"
        type="button"
      >
        Pending
      </button>

      <button
        class="tab"
        data-status="investigating"
        type="button"
      >
        Investigating
      </button>

      <button
        class="tab"
        data-status="resolved"
        type="button"
      >
        Resolved
      </button>

      <button
        class="tab"
        data-status="dismissed"
        type="button"
      >
        Dismissed
      </button>

      <button
        class="tab"
        data-status="all"
        type="button"
      >
        All
      </button>

    </div>

  </div>


  <!-- =====================================================
       REPORTS
  ====================================================== -->

  <main
    class="reports"
    id="reports"
  >

    <div class="loading">
      Loading reports…
    </div>

  </main>

</div>


<!-- =======================================================
     LOGIN
======================================================= -->

<div
  class="login"
  id="loginBox"
  style="display:none"
>

  <div class="login-icon">

    <svg viewBox="0 0 24 24">
      <path d="M12 3l7 3v5c0 4.6-2.9 8.4-7 10-4.1-1.6-7-5.4-7-10V6l7-3z"/>
      <path d="M9 12l2 2 4-4"/>
    </svg>

  </div>

  <h2>Owner access required</h2>

  <p>
    You must be signed in with a ToTalk account
    that has owner, admin, or moderator access.
  </p>

  <button
    class="login-btn"
    id="goChatBtn"
    type="button"
  >
    Open ToTalk
  </button>

</div>


<!-- TOAST -->

<div
  class="toast"
  id="toast"
></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://qiynczbrhpxwuabwuyiy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_eUPz4c_nYckgINEK-AIWqw_JAXIHozd";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );


/* =========================================================
   ELEMENTS
========================================================= */

const app =
  document.getElementById("app");

const loginBox =
  document.getElementById("loginBox");

const reportsEl =
  document.getElementById("reports");

const errorBanner =
  document.getElementById("errorBanner");

const toast =
  document.getElementById("toast");


/* =========================================================
   STATE
========================================================= */

let currentStatus = "pending";

let allReports = [];


/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>'"]/g,
      function(char){

        return {
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          "'":"&#39;",
          '"':"&quot;"
        }[char];

      }
    );

}


/* =========================================================
   DATE FORMAT
========================================================= */

function fmtDate(value){

  if(!value){
    return "—";
  }

  const date =
    new Date(value);

  if(Number.isNaN(date.getTime())){
    return String(value);
  }

  return date.toLocaleString(
    [],
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );

}


/* =========================================================
   SHOW ERROR
========================================================= */

function showError(message){

  errorBanner.textContent =
    message || "";

  errorBanner.classList.toggle(
    "show",
    Boolean(message)
  );

}


/* =========================================================
   TOAST
========================================================= */

function showToast(message){

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    showToast.timer
  );

  showToast.timer =
    setTimeout(
      function(){
        toast.classList.remove(
          "show"
        );
      },
      2600
    );

}


/* =========================================================
   SAFE VALUE HELPER
========================================================= */

function firstValue(object, keys){

  for(const key of keys){

    const value =
      object?.[key];

    if(
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ){
      return value;
    }

  }

  return null;

}


/* =========================================================
   GET REPORTER ID
========================================================= */

function getReporterId(report){

  return firstValue(
    report,
    [
      "reporter_id",
      "reporter_user_id",
      "reporter_totalk_id",
      "reporter_uid",
      "from_user_id",
      "from_id"
    ]
  );

}


/* =========================================================
   GET REPORTED USER ID
========================================================= */

function getReportedUserId(report){

  return firstValue(
    report,
    [
      "reported_user_id",
      "reported_id",
      "reported_totalk_id",
      "reported_uid",
      "target_user_id",
      "target_id"
    ]
  );

}


/* =========================================================
   ICONS
========================================================= */

const icons = {

  user:`
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="3.2"/>
      <path d="M5.5 20c.8-4 3-6 6.5-6s5.7 2 6.5 6"/>
    </svg>
  `,

  flag:`
    <svg viewBox="0 0 24 24">
      <path d="M6 21V4"/>
      <path d="M6 5c4-3 7 3 12 0v9c-5 3-8-3-12 0"/>
    </svg>
  `,

  report:`
    <svg viewBox="0 0 24 24">
      <path d="M6 4h12v13H9l-3 3V4z"/>
      <path d="M9 8h6"/>
      <path d="M9 11h6"/>
    </svg>
  `,

  chat:`
    <svg viewBox="0 0 24 24">
      <path d="M5 5h14v10H9l-4 4V5z"/>
      <path d="M8 9h8"/>
      <path d="M8 12h5"/>
    </svg>
  `,

  save:`
    <svg viewBox="0 0 24 24">
      <path d="M5 4h11l3 3v13H5z"/>
      <path d="M8 4v6h8V4"/>
      <path d="M8 20v-6h8v6"/>
    </svg>
  `

};


/* =========================================================
   PERSON CARD
========================================================= */

function personCard(
  label,
  name,
  id,
  reported
){

  const icon =
    reported
      ? icons.flag
      : icons.user;

  const safeName =
    name || "Unknown user";

  const safeId =
    id || "ID unavailable";

  return `

    <div class="person">

      <div class="person-head">

        <div class="
          person-avatar
          ${reported ? "reported" : ""}
        ">
          ${icon}
        </div>

        <span class="person-label">
          ${esc(label)}
        </span>

      </div>

      <strong class="person-name">
        ${esc(safeName)}
      </strong>

      <div class="person-id">

        <span class="person-id-label">
          ToTalk ID
        </span>

        <code>
          ${esc(safeId)}
        </code>

      </div>

    </div>

  `;

}


/* =========================================================
   REPORT CARD
========================================================= */

function card(report){

  const allowedStatuses = [
    "pending",
    "investigating",
    "resolved",
    "dismissed"
  ];

  const status =
    allowedStatuses.includes(
      report.status
    )
      ? report.status
      : "pending";


  const statusText =
    status.charAt(0).toUpperCase()
    + status.slice(1);


  const reporterName =
    firstValue(
      report,
      [
        "reporter_name",
        "reporter_display_name",
        "from_name"
      ]
    );


  const reportedName =
    firstValue(
      report,
      [
        "reported_name",
        "reported_user_name",
        "reported_display_name",
        "target_name"
      ]
    );


  const reporterId =
    getReporterId(report);


  const reportedId =
    getReportedUserId(report);


  const reason =
    report.reason ||
    "Not specified";


  const details =
    report.details ||
    "";


  const conversationId =
    report.conversation_id ||
    "";


  const action =
    report.action ||
    "";


  const adminNotes =
    report.admin_notes ||
    "";


  return `

    <article
      class="card"
      data-id="${esc(report.id)}"
    >

      <!-- HEADER -->

      <div class="card-head">

        <div class="report-title">

          <div class="report-number">

            <span class="report-icon">
              ${icons.report}
            </span>

            <span>
              Report #${esc(report.id)}
            </span>

          </div>

          <div class="idline">
            Submitted ${esc(
              fmtDate(report.created_at)
            )}
          </div>

        </div>


        <span class="
          status
          ${status}
        ">

          <span class="status-dot"></span>

          ${esc(statusText)}

        </span>

      </div>


      <!-- PEOPLE -->

      <div class="people">

        ${personCard(
          "Reporter",
          reporterName,
          reporterId,
          false
        )}

        ${personCard(
          "Reported user",
          reportedName,
          reportedId,
          true
        )}

      </div>


      <!-- REPORT CONTENT -->

      <div class="report-body">

        <div class="reason-row">

          <span class="reason-label">
            Reason
          </span>

          <span class="reason-value">
            ${esc(reason)}
          </span>

        </div>


        ${
          details
            ? `
              <div class="details">
                ${esc(details)}
              </div>
            `
            : ""
        }


        ${
          conversationId
            ? `
              <div class="conversation">
                ${icons.chat}
                <span>
                  Conversation:
                  ${esc(conversationId)}
                </span>
              </div>
            `
            : ""
        }

      </div>


      <!-- DECISION -->

      <div class="decision">

        <div class="decision-title">

          <strong>
            Moderation decision
          </strong>

          <span>
            Private admin controls
          </span>

        </div>


        <div class="controls">

          <!-- STATUS -->

          <div class="field">

            <label>
              Status
            </label>

            <select class="statusSelect">

              <option value="pending">
                Pending
              </option>

              <option value="investigating">
                Investigating
              </option>

              <option value="resolved">
                Resolved
              </option>

              <option value="dismissed">
                Dismissed
              </option>

            </select>

          </div>


          <!-- ACTION -->

          <div class="field">

            <label>
              Action
            </label>

            <select class="actionSelect">

              <option value="">
                No action
              </option>

              <option value="warning">
                Warning
              </option>

              <option value="restrict">
                Restrict
              </option>

              <option value="suspend">
                Suspend
              </option>

              <option value="ban">
                Ban
              </option>

            </select>

          </div>


          <!-- NOTES -->

          <div class="
            field
            notes
          ">

            <label>
              Admin note
            </label>

            <textarea
              class="notesInput"
              placeholder="Add a private moderation note…"
            >${esc(adminNotes)}</textarea>

          </div>


          <!-- SAVE -->

          <button
            class="save"
            data-save="1"
            type="button"
          >

            ${icons.save}

            <span>
              Save
            </span>

          </button>

        </div>

      </div>

    </article>

  `;

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const rows =
    currentStatus === "all"
      ? allReports
      : allReports.filter(
          function(report){
            return report.status ===
              currentStatus;
          }
        );


  if(!rows.length){

    const label =
      currentStatus === "all"
        ? "reports"
        : currentStatus + " reports";


    reportsEl.innerHTML = `

      <div class="empty">

        <strong>
          No ${esc(label)}.
        </strong>

        Everything is clear here.

      </div>

    `;

    return;
  }


  reportsEl.innerHTML =
    rows
      .map(card)
      .join("");


  rows.forEach(
    function(report){

      const element =
        reportsEl.querySelector(
          `[data-id="${CSS.escape(
            String(report.id)
          )}"]`
        );


      if(!element){
        return;
      }


      const statusSelect =
        element.querySelector(
          ".statusSelect"
        );


      const actionSelect =
        element.querySelector(
          ".actionSelect"
        );


      const notesInput =
        element.querySelector(
          ".notesInput"
        );


      if(statusSelect){

        statusSelect.value =
          [
            "pending",
            "investigating",
            "resolved",
            "dismissed"
          ].includes(report.status)
            ? report.status
            : "pending";

      }


      if(actionSelect){

        actionSelect.value =
          report.action || "";

      }


      if(notesInput){

        notesInput.value =
          report.admin_notes || "";

      }

    }
  );

}


/* =========================================================
   COUNTS
========================================================= */

function setCounts(rows){

  const counts = {

    pending:0,

    investigating:0,

    resolved:0,

    dismissed:0

  };


  rows.forEach(
    function(report){

      if(
        Object.prototype.hasOwnProperty.call(
          counts,
          report.status
        )
      ){

        counts[report.status]++;

      }

    }
  );


  document.getElementById(
    "countPending"
  ).textContent =
    counts.pending;


  document.getElementById(
    "countInvestigating"
  ).textContent =
    counts.investigating;


  document.getElementById(
    "countResolved"
  ).textContent =
    counts.resolved;


  document.getElementById(
    "countDismissed"
  ).textContent =
    counts.dismissed;

}


/* =========================================================
   LOAD REPORTS
========================================================= */

async function loadReports(){

  showError("");

  reportsEl.innerHTML = `
    <div class="loading">
      Loading reports…
    </div>
  `;


  const {
    data,
    error
  } =
    await supabaseClient.rpc(
      "admin_list_reports",
      {
        p_status:null
      }
    );


  if(error){

    console.error(
      "admin_list_reports error:",
      error
    );


    showError(
      "Could not load reports: "
      + error.message
    );


    reportsEl.innerHTML = `

      <div class="empty">

        <strong>
          Could not load reports.
        </strong>

        Check your admin permissions
        and Supabase function setup.

      </div>

    `;

    return;
  }


  allReports =
    Array.isArray(data)
      ? data
      : [];


  console.log(
    "Reports returned by RPC:",
    allReports
  );


  setCounts(
    allReports
  );


  render();

}


/* =========================================================
   SAVE REPORT
========================================================= */

async function saveReport(cardElement){

  const id =
    cardElement.dataset.id;


  const status =
    cardElement.querySelector(
      ".statusSelect"
    ).value;


  const action =
    cardElement.querySelector(
      ".actionSelect"
    ).value || null;


  const notes =
    cardElement.querySelector(
      ".notesInput"
    ).value.trim() || null;


  const button =
    cardElement.querySelector(
      "[data-save]"
    );


  /*
    Ban/Suspend are currently NOT enforcing
    anything on the user account.

    We only save the moderation decision.
  */

  if(
    action === "ban" ||
    action === "suspend"
  ){

    const actionName =
      action === "ban"
        ? "Ban"
        : "Suspend";


    const confirmed =
      window.confirm(
        `${actionName} is not enforcing an account restriction yet.\n\n`
        +
        `This will only save "${actionName}" as the moderation action.\n\n`
        +
        `Continue?`
      );


    if(!confirmed){
      return;
    }

  }


  button.disabled = true;

  button.innerHTML = `
    <span>
      Saving…
    </span>
  `;


  showError("");


  const {
    data,
    error
  } =
    await supabaseClient.rpc(
      "admin_update_report",
      {
        p_report_id:Number(id),

        p_status:status,

        p_action:action,

        p_admin_notes:notes
      }
    );


  if(
    error ||
    data !== true
  ){

    console.error(
      "admin_update_report error:",
      error,
      data
    );


    showError(
      "Could not update report #"
      + id
      + ": "
      + (
        error?.message ||
        "Update was not accepted."
      )
    );


    button.disabled = false;

    button.innerHTML = `
      ${icons.save}
      <span>
        Save
      </span>
    `;

    return;
  }


  showToast(
    "Report #"
    + id
    + " updated"
  );


  await loadReports();

}


/* =========================================================
   BOOT
========================================================= */

async function boot(){

  try{

    const {
      data:{
        session
      }
    } =
      await supabaseClient
        .auth
        .getSession();


    if(!session){

      loginBox.style.display =
        "block";

      return;
    }


    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "is_totalk_admin"
      );


    if(
      error ||
      data !== true
    ){

      loginBox.style.display =
        "block";


      showError(
        error?.message ||
        "This account does not have admin access."
      );


      return;
    }


    app.style.display =
      "block";


    await loadReports();


  }catch(error){

    console.error(
      "Boot error:",
      error
    );


    loginBox.style.display =
      "block";


    showError(
      error?.message ||
      "Could not initialize admin dashboard."
    );

  }

}


/* =========================================================
   REFRESH
========================================================= */

document
  .getElementById("refreshBtn")
  .addEventListener(
    "click",
    async function(){

      const button =
        this;

      button.disabled =
        true;


      await loadReports();


      button.disabled =
        false;

    }
  );


/* =========================================================
   SIGN OUT
========================================================= */

document
  .getElementById("signOutBtn")
  .addEventListener(
    "click",
    async function(){

      const confirmed =
        window.confirm(
          "Sign out of ToTalk Admin?"
        );


      if(!confirmed){
        return;
      }


      await supabaseClient
        .auth
        .signOut();


      location.reload();

    }
  );


/* =========================================================
   OPEN CHAT
========================================================= */

document
  .getElementById("goChatBtn")
  .addEventListener(
    "click",
    function(){

      location.href =
        "chat.html";

    }
  );


/* =========================================================
   TABS
========================================================= */

document
  .getElementById("tabs")
  .addEventListener(
    "click",
    function(event){

      const button =
        event.target.closest(
          ".tab"
        );


      if(!button){
        return;
      }


      document
        .querySelectorAll(
          ".tab"
        )
        .forEach(
          function(tab){

            tab.classList.remove(
              "active"
            );

          }
        );


      button.classList.add(
        "active"
      );


      currentStatus =
        button.dataset.status;


      render();

    }
  );


/* =========================================================
   SAVE EVENT
========================================================= */

reportsEl.addEventListener(
  "click",
  function(event){

    const button =
      event.target.closest(
        "[data-save]"
      );


    if(!button){
      return;
    }


    const cardElement =
      button.closest(
        ".card"
      );


    if(cardElement){

      saveReport(
        cardElement
      );

    }

  }
);


/* =========================================================
   AUTH STATE
========================================================= */

supabaseClient
  .auth
  .onAuthStateChange(
    function(
      event,
      session
    ){

      if(
        event ===
        "SIGNED_OUT"
      ){

        location.reload();

      }

    }
  );


/* =========================================================
   START
========================================================= */

boot();

</script>

</body>
</html>
