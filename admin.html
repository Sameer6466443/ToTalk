<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020108">
<title>ToTalk Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --black:#020108;
  --dark:#070313;
  --panel:#0b0617;
  --panel2:#10091d;
  --purple:#914cff;
  --purple2:#b878ff;
  --purple3:#6f35d9;
  --green:#52e69a;
  --yellow:#ffe34f;
  --red:#ff557d;
  --blue:#66b8ff;
  --white:#f8f5ff;
  --muted:#958da9;
  --muted2:#70687d;
  --border:rgba(145,76,255,.32);
}

html,
body{
  min-height:100%;
  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(145,76,255,.18),
      transparent 38%
    ),
    var(--black);
  color:var(--white);
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body{
  padding:18px;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.shell{
  width:100%;
  max-width:1180px;
  margin:0 auto;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-bottom:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
  min-width:0;
}

.logo{
  width:58px;
  height:58px;
  flex:0 0 58px;
  border:1px solid rgba(145,76,255,.72);
  border-radius:18px;
  display:grid;
  place-items:center;
  background:
    linear-gradient(
      145deg,
      rgba(145,76,255,.18),
      rgba(145,76,255,.05)
    );
  box-shadow:
    0 0 30px rgba(145,76,255,.18),
    inset 0 0 18px rgba(145,76,255,.06);
}

.logo svg{
  width:29px;
  height:29px;
  fill:none;
  stroke:var(--purple2);
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.brand h1{
  font-size:25px;
  line-height:1.1;
  letter-spacing:-.5px;
}

.brand p{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:58px;
  height:58px;
  border-radius:18px;
  display:grid;
  place-items:center;
  border:1px solid rgba(145,76,255,.38);
  background:
    linear-gradient(
      145deg,
      rgba(145,76,255,.13),
      rgba(145,76,255,.04)
    );
  color:var(--white);
  transition:.18s ease;
}

.icon-btn:hover{
  background:rgba(145,76,255,.18);
  border-color:rgba(145,76,255,.7);
  transform:translateY(-1px);
}

.icon-btn svg{
  width:25px;
  height:25px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.icon-btn.danger{
  color:#ff9bb3;
  border-color:rgba(255,85,125,.38);
  background:rgba(255,85,125,.06);
}

.icon-btn.danger:hover{
  background:rgba(255,85,125,.12);
  border-color:rgba(255,85,125,.65);
}

/* =========================
   ERROR
========================= */

.banner{
  display:none;
  padding:13px 15px;
  border:1px solid rgba(255,85,125,.4);
  background:rgba(255,85,125,.08);
  border-radius:14px;
  margin-bottom:18px;
  color:#ffc0cf;
  font-size:13px;
}

.banner.show{
  display:block;
}

/* =========================
   STATS
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:18px;
}

.stat{
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(
      180deg,
      rgba(16,9,29,.96),
      rgba(8,4,15,.96)
    );
  border:1px solid var(--border);
  border-radius:18px;
  padding:17px;
  min-height:112px;
  box-shadow:0 12px 40px rgba(0,0,0,.22);
}

.stat::after{
  content:"";
  position:absolute;
  width:120px;
  height:120px;
  right:-58px;
  bottom:-65px;
  border-radius:50%;
  background:rgba(145,76,255,.08);
  pointer-events:none;
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:13px;
  font-weight:600;
}

.stat strong{
  display:block;
  font-size:34px;
  line-height:1;
  margin-top:9px;
  letter-spacing:-1px;
}

.stat.pending strong{
  color:var(--yellow);
}

.stat.investigating strong{
  color:var(--blue);
}

.stat.resolved strong{
  color:var(--green);
}

.stat.dismissed strong{
  color:#aaa2b7;
}

/* =========================
   TABS
========================= */

.toolbar{
  margin-bottom:15px;
  overflow:hidden;
}

.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:3px;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  flex:0 0 auto;
  border:1px solid rgba(145,76,255,.28);
  background:rgba(145,76,255,.055);
  color:var(--muted);
  border-radius:999px;
  padding:9px 17px;
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
  transition:.18s ease;
}

.tab:hover{
  color:var(--white);
  border-color:rgba(145,76,255,.5);
}

.tab.active{
  color:var(--white);
  background:
    linear-gradient(
      135deg,
      rgba(145,76,255,.23),
      rgba(145,76,255,.11)
    );
  border-color:rgba(145,76,255,.72);
  box-shadow:0 0 20px rgba(145,76,255,.12);
}

/* =========================
   REPORTS
========================= */

.reports{
  display:grid;
  gap:14px;
}

.card{
  background:
    linear-gradient(
      180deg,
      rgba(15,8,27,.98),
      rgba(8,4,15,.98)
    );
  border:1px solid rgba(145,76,255,.3);
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 15px 55px rgba(0,0,0,.25);
}

.card-head{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:flex-start;
  padding:19px 19px 15px;
}

.report-title{
  display:flex;
  align-items:center;
  gap:11px;
}

.report-icon{
  width:40px;
  height:40px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:rgba(145,76,255,.1);
  border:1px solid rgba(145,76,255,.25);
  color:var(--purple2);
}

.report-icon svg{
  width:19px;
  height:19px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.report-number{
  font-size:20px;
  font-weight:750;
  letter-spacing:-.3px;
}

.idline{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.status{
  display:inline-flex;
  align-items:center;
  gap:7px;
  border-radius:999px;
  padding:8px 12px;
  font-size:12px;
  font-weight:650;
  border:1px solid;
  white-space:nowrap;
}

.status::before{
  content:"";
  width:7px;
  height:7px;
  border-radius:50%;
  background:currentColor;
  box-shadow:0 0 9px currentColor;
}

.status.pending{
  color:var(--yellow);
  border-color:rgba(255,227,79,.35);
  background:rgba(255,227,79,.07);
}

.status.investigating{
  color:var(--blue);
  border-color:rgba(102,184,255,.35);
  background:rgba(102,184,255,.07);
}

.status.resolved{
  color:var(--green);
  border-color:rgba(82,230,154,.35);
  background:rgba(82,230,154,.07);
}

.status.dismissed{
  color:#aaa2b7;
  border-color:rgba(170,162,183,.3);
  background:rgba(170,162,183,.05);
}

/* =========================
   PEOPLE
========================= */

.people{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:0 19px;
}

.person{
  border:1px solid rgba(145,76,255,.2);
  background:
    linear-gradient(
      145deg,
      rgba(145,76,255,.055),
      rgba(145,76,255,.025)
    );
  border-radius:15px;
  padding:15px;
}

.person-top{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.person-icon{
  width:38px;
  height:38px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:rgba(145,76,255,.1);
  color:var(--purple2);
}

.person-icon.reported{
  color:#ff8fac;
  background:rgba(255,85,125,.08);
}

.person-icon svg{
  width:19px;
  height:19px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.person label{
  display:block;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.13em;
  color:var(--muted);
  font-weight:700;
}

.person strong{
  display:block;
  font-size:16px;
  line-height:1.25;
  margin-bottom:8px;
}

.totalk-id{
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
  color:var(--muted);
  font-size:11px;
}

.totalk-id span{
  color:var(--muted);
}

.totalk-id code{
  color:var(--purple2);
  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    monospace;
  font-size:12px;
  letter-spacing:.5px;
  background:rgba(145,76,255,.07);
  border:1px solid rgba(145,76,255,.16);
  padding:4px 7px;
  border-radius:7px;
}

/* =========================
   REPORT INFORMATION
========================= */

.report-info{
  padding:17px 19px 18px;
}

.info-row{
  display:grid;
  grid-template-columns:120px 1fr;
  align-items:center;
  gap:12px;
  padding:10px 0;
  border-bottom:1px solid rgba(145,76,255,.08);
}

.info-row:last-child{
  border-bottom:0;
  padding-bottom:2px;
}

.info-label{
  color:var(--muted);
  font-size:11px;
  font-weight:750;
  text-transform:uppercase;
  letter-spacing:.1em;
}

.info-value{
  min-width:0;
  font-size:14px;
  color:#eee9f5;
}

/* FIXED REASON DESIGN */

.reason-value{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:6px 10px;
  border-radius:8px;
  background:rgba(145,76,255,.09);
  border:1px solid rgba(145,76,255,.2);
  color:#ddd1ee;
  font-size:13px;
  font-weight:600;
}

.reason-value::before{
  content:"";
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--purple2);
  box-shadow:0 0 8px rgba(184,120,255,.7);
}

.conversation-value{
  color:#7e758e;
  font-size:11px;
  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    monospace;
  word-break:break-all;
}

/* =========================
   DETAILS
========================= */

.details-box{
  margin:0 19px 18px;
  padding:13px 14px;
  border-radius:13px;
  background:rgba(145,76,255,.035);
  border:1px solid rgba(145,76,255,.13);
}

.details-label{
  color:var(--muted);
  font-size:10px;
  font-weight:750;
  text-transform:uppercase;
  letter-spacing:.1em;
  margin-bottom:7px;
}

.details-text{
  color:#bcb4c9;
  font-size:13px;
  line-height:1.55;
  white-space:pre-wrap;
}

/* =========================
   MODERATION
========================= */

.moderation{
  border-top:1px solid rgba(145,76,255,.16);
  background:
    linear-gradient(
      180deg,
      rgba(145,76,255,.025),
      rgba(0,0,0,.04)
    );
  padding:18px 19px 20px;
}

.moderation-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:16px;
}

.moderation-title{
  font-size:17px;
  font-weight:750;
  letter-spacing:-.2px;
}

.moderation-subtitle{
  color:var(--muted2);
  font-size:11px;
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.field{
  min-width:0;
}

.field.notes{
  grid-column:1 / -1;
}

.field label{
  display:block;
  color:var(--muted);
  font-size:10px;
  font-weight:750;
  text-transform:uppercase;
  letter-spacing:.11em;
  margin-bottom:7px;
}

.field select,
.field textarea{
  width:100%;
  border:1px solid rgba(145,76,255,.28);
  background:#08040f;
  color:var(--white);
  border-radius:12px;
  padding:12px 13px;
  outline:none;
  transition:.18s ease;
}

.field select{
  height:48px;
}

.field select:focus,
.field textarea:focus{
  border-color:rgba(145,76,255,.7);
  box-shadow:0 0 0 3px rgba(145,76,255,.08);
}

.field textarea{
  min-height:82px;
  resize:vertical;
  line-height:1.45;
}

.field textarea::placeholder{
  color:#625a6c;
}

.save{
  grid-column:1 / -1;
  width:100%;
  height:48px;
  border:1px solid #a86bff;
  border-radius:12px;
  color:white;
  font-weight:700;
  background:
    linear-gradient(
      135deg,
      #7130d8,
      #9b4dff
    );
  box-shadow:
    0 8px 25px rgba(145,76,255,.2);
  transition:.18s ease;
}

.save:hover{
  transform:translateY(-1px);
  box-shadow:
    0 10px 30px rgba(145,76,255,.3);
}

.save:disabled{
  opacity:.65;
  cursor:not-allowed;
  transform:none;
}

/* =========================
   EMPTY / LOADING
========================= */

.empty,
.loading{
  padding:60px 20px;
  text-align:center;
  border:1px dashed rgba(145,76,255,.28);
  border-radius:18px;
  color:var(--muted);
}

.empty strong{
  display:block;
  color:var(--white);
  margin-bottom:6px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:20;
  max-width:360px;
  padding:12px 15px;
  border:1px solid rgba(82,230,154,.4);
  background:#0b1712;
  color:#d8ffea;
  border-radius:12px;
  box-shadow:0 15px 40px rgba(0,0,0,.35);
  opacity:0;
  transform:translateY(8px);
  pointer-events:none;
  transition:.2s;
  font-size:13px;
}

.toast.show{
  opacity:1;
  transform:none;
}

/* =========================
   LOGIN
========================= */

.login{
  max-width:440px;
  margin:12vh auto;
  background:
    linear-gradient(
      180deg,
      rgba(15,8,27,.98),
      rgba(8,4,15,.98)
    );
  border:1px solid var(--border);
  border-radius:20px;
  padding:28px;
  text-align:center;
  box-shadow:0 25px 80px rgba(0,0,0,.4);
}

.login h2{
  margin-bottom:8px;
}

.login p{
  color:var(--muted);
  line-height:1.5;
  font-size:13px;
}

.login .btn{
  margin-top:18px;
}

.btn{
  border:1px solid var(--border);
  background:rgba(145,76,255,.1);
  color:var(--white);
  border-radius:11px;
  padding:10px 14px;
}

/* =========================
   DESKTOP
========================= */

@media(min-width:801px){

  .card-head{
    padding:20px 21px 16px;
  }

  .people{
    padding:0 21px;
  }

  .report-info{
    padding-left:21px;
    padding-right:21px;
  }

  .details-box{
    margin-left:21px;
    margin-right:21px;
  }

  .moderation{
    padding-left:21px;
    padding-right:21px;
  }
}

/* =========================
   TABLET
========================= */

@media(max-width:800px){

  body{
    padding:14px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .people{
    grid-template-columns:1fr;
  }

  .topbar{
    align-items:center;
  }

  .brand p{
    display:none;
  }

  .brand h1{
    font-size:22px;
  }

  .logo{
    width:52px;
    height:52px;
    flex-basis:52px;
    border-radius:17px;
  }

  .icon-btn{
    width:52px;
    height:52px;
    border-radius:17px;
  }

  .controls{
    grid-template-columns:1fr;
  }

  .field.notes{
    grid-column:auto;
  }

  .save{
    grid-column:auto;
  }
}

/* =========================
   PHONE
========================= */

@media(max-width:520px){

  body{
    padding:10px;
  }

  .topbar{
    margin-bottom:16px;
  }

  .brand{
    gap:10px;
  }

  .brand h1{
    font-size:20px;
  }

  .logo{
    width:49px;
    height:49px;
    flex-basis:49px;
    border-radius:16px;
  }

  .logo svg{
    width:25px;
    height:25px;
  }

  .actions{
    gap:6px;
  }

  .icon-btn{
    width:49px;
    height:49px;
    border-radius:16px;
  }

  .icon-btn svg{
    width:23px;
    height:23px;
  }

  .stats{
    gap:9px;
    margin-bottom:14px;
  }

  .stat{
    min-height:105px;
    padding:14px;
    border-radius:16px;
  }

  .stat span{
    font-size:12px;
  }

  .stat strong{
    font-size:30px;
    margin-top:8px;
  }

  .tab{
    padding:9px 15px;
  }

  .card{
    border-radius:18px;
  }

  .card-head{
    padding:16px 14px 14px;
  }

  .report-icon{
    width:37px;
    height:37px;
    border-radius:11px;
  }

  .report-number{
    font-size:18px;
  }

  .status{
    padding:7px 9px;
    font-size:11px;
  }

  .people{
    padding:0 14px;
    gap:9px;
  }

  .person{
    padding:13px;
  }

  .person strong{
    font-size:15px;
  }

  .report-info{
    padding:13px 14px 16px;
  }

  .info-row{
    grid-template-columns:92px 1fr;
    gap:8px;
  }

  .info-label{
    font-size:9px;
  }

  .info-value{
    font-size:13px;
  }

  .details-box{
    margin:0 14px 16px;
  }

  .moderation{
    padding:16px 14px 17px;
  }

  .moderation-title{
    font-size:16px;
  }

  .moderation-subtitle{
    font-size:10px;
  }
}

/* =========================
   VERY SMALL PHONE
========================= */

@media(max-width:380px){

  .brand h1{
    font-size:18px;
  }

  .logo,
  .icon-btn{
    width:45px;
    height:45px;
    flex-basis:45px;
  }

  .actions{
    gap:4px;
  }

  .status{
    padding:6px 8px;
  }

  .info-row{
    grid-template-columns:82px 1fr;
  }
}
</style>
</head>

<body>

<div class="shell" id="app" style="display:none">

  <!-- TOP BAR -->
  <header class="topbar">

    <div class="brand">

      <div class="logo">
        <svg viewBox="0 0 24 24">
          <path d="M5 5.5h14v9H11l-4 4v-4H5z"/>
          <path d="M8 9.5h8"/>
          <path d="M8 12h5"/>
        </svg>
      </div>

      <div>
        <h1>ToTalk Admin</h1>
        <p>Owner moderation dashboard</p>
      </div>

    </div>

    <div class="actions">

      <!-- REFRESH -->
      <button
        class="icon-btn"
        id="refreshBtn"
        title="Refresh"
        aria-label="Refresh"
      >
        <svg viewBox="0 0 24 24">
          <path d="M20 11a8 8 0 0 0-14.9-4"/>
          <path d="M5 3v4h4"/>
          <path d="M4 13a8 8 0 0 0 14.9 4"/>
          <path d="M19 21v-4h-4"/>
        </svg>
      </button>

      <!-- SIGN OUT -->
      <button
        class="icon-btn danger"
        id="signOutBtn"
        title="Sign out"
        aria-label="Sign out"
      >
        <svg viewBox="0 0 24 24">
          <path d="M10 17l5-5-5-5"/>
          <path d="M15 12H3"/>
          <path d="M13 4h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/>
        </svg>
      </button>

    </div>

  </header>


  <!-- ERROR -->
  <div class="banner" id="errorBanner"></div>


  <!-- STATS -->
  <section class="stats">

    <div class="stat pending">
      <span>Pending</span>
      <strong id="countPending">0</strong>
    </div>

    <div class="stat investigating">
      <span>Investigating</span>
      <strong id="countInvestigating">0</strong>
    </div>

    <div class="stat resolved">
      <span>Resolved</span>
      <strong id="countResolved">0</strong>
    </div>

    <div class="stat dismissed">
      <span>Dismissed</span>
      <strong id="countDismissed">0</strong>
    </div>

  </section>


  <!-- TABS -->
  <div class="toolbar">

    <div class="tabs" id="tabs">

      <button class="tab active" data-status="pending">
        Pending
      </button>

      <button class="tab" data-status="investigating">
        Investigating
      </button>

      <button class="tab" data-status="resolved">
        Resolved
      </button>

      <button class="tab" data-status="dismissed">
        Dismissed
      </button>

      <button class="tab" data-status="all">
        All
      </button>

    </div>

  </div>


  <!-- REPORTS -->
  <main class="reports" id="reports">
    <div class="loading">
      Loading reports…
    </div>
  </main>

</div>


<!-- LOGIN -->
<div class="login" id="loginBox" style="display:none">

  <h2>Owner access required</h2>

  <p>
    You must be signed in with a ToTalk account that has
    an owner, admin, or moderator role.
  </p>

  <button class="btn" id="goChatBtn">
    Open ToTalk
  </button>

</div>


<!-- TOAST -->
<div class="toast" id="toast"></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://qiynczbrhpxwuabwuyiy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_eUPz4c_nYckgINEK-AIWqw_JAXIHozd";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );


/* =========================================================
   ELEMENTS
========================================================= */

const app =
  document.getElementById("app");

const loginBox =
  document.getElementById("loginBox");

const reportsEl =
  document.getElementById("reports");

const errorBanner =
  document.getElementById("errorBanner");

const toast =
  document.getElementById("toast");


/* =========================================================
   STATE
========================================================= */

let currentStatus = "pending";
let allReports = [];


/* =========================================================
   ESCAPE HTML
========================================================= */

const esc = value =>
  String(value ?? "")
    .replace(
      /[&<>'"]/g,
      character =>
        ({
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          "'":"&#39;",
          '"':"&quot;"
        })[character]
    );


/* =========================================================
   DATE
========================================================= */

const fmtDate = value => {

  if(!value){
    return "—";
  }

  const date = new Date(value);

  if(isNaN(date)){
    return String(value);
  }

  return date.toLocaleString(
    [],
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );
};


/* =========================================================
   ERROR
========================================================= */

function showError(message){

  errorBanner.textContent =
    message || "";

  errorBanner.classList.toggle(
    "show",
    !!message
  );
}


/* =========================================================
   TOAST
========================================================= */

function showToast(message){

  toast.textContent = message;

  toast.classList.add("show");

  clearTimeout(showToast.t);

  showToast.t =
    setTimeout(
      () => toast.classList.remove("show"),
      2600
    );
}


/* =========================================================
   TOTAlK ID FORMAT
=========================================================

   If your RPC already returns a real ToTalk ID such as:

   TT-ABC123

   it will use that.

   If the RPC currently only returns a UUID, we display
   a clean ToTalk-style identifier instead of the UUID.

========================================================= */

function makeToTalkId(value){

  if(!value){
    return "TT-UNKNOWN";
  }

  const raw =
    String(value).trim();

  /* Already a ToTalk ID */
  if(/^TT-[A-Za-z0-9]+$/i.test(raw)){
    return raw.toUpperCase();
  }

  /* UUID / existing user ID */
  const cleaned =
    raw.replace(/[^a-zA-Z0-9]/g,"");

  if(!cleaned){
    return "TT-UNKNOWN";
  }

  return (
    "TT-" +
    cleaned
      .substring(0,6)
      .toUpperCase()
  );
}


/* =========================================================
   GET USER ID FROM REPORT
========================================================= */

function getReporterId(report){

  return (
    report.reporter_totalk_id ||
    report.reporter_to_talk_id ||
    report.reporter_id ||
    report.reporter_user_id ||
    report.reporter_uuid ||
    null
  );
}


function getReportedUserId(report){

  return (
    report.reported_totalk_id ||
    report.reported_to_talk_id ||
    report.reported_id ||
    report.reported_user_id ||
    report.reported_uuid ||
    null
  );
}


/* =========================================================
   PERSON CARD
========================================================= */

function person(
  type,
  name,
  id,
  reported = false
){

  const finalName =
    name || "Unknown user";

  const finalId =
    makeToTalkId(id);

  return `

    <div class="person">

      <div class="person-top">

        <div class="person-icon ${reported ? "reported" : ""}">

          ${
            reported
            ?
            `
            <svg viewBox="0 0 24 24">
              <path d="M5 20V4"/>
              <path d="M5 5h10l-2 3 2 3H5"/>
            </svg>
            `
            :
            `
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="8" r="3"/>
              <path d="M5 20c.8-3.3 3.1-5 7-5s6.2 1.7 7 5"/>
            </svg>
            `
          }

        </div>

        <label>
          ${esc(type)}
        </label>

      </div>

      <strong>
        ${esc(finalName)}
      </strong>

      <div class="totalk-id">

        <span>ToTalk ID</span>

        <code>
          ${esc(finalId)}
        </code>

      </div>

    </div>

  `;
}


/* =========================================================
   STATUS LABEL
========================================================= */

function statusName(status){

  const valid =
    [
      "pending",
      "investigating",
      "resolved",
      "dismissed"
    ];

  const safe =
    valid.includes(status)
      ? status
      : "pending";

  return (
    safe.charAt(0).toUpperCase() +
    safe.slice(1)
  );
}


/* =========================================================
   REPORT CARD
========================================================= */

function card(report){

  const status =
    [
      "pending",
      "investigating",
      "resolved",
      "dismissed"
    ].includes(report.status)
      ? report.status
      : "pending";


  const reporterId =
    getReporterId(report);

  const reportedUserId =
    getReportedUserId(report);


  return `

    <article
      class="card"
      data-id="${esc(report.id)}"
    >

      <!-- HEADER -->

      <div class="card-head">

        <div class="report-title">

          <div class="report-icon">

            <svg viewBox="0 0 24 24">
              <path d="M6 4h12v12H10l-4 4z"/>
              <path d="M9 8h6"/>
              <path d="M9 11h4"/>
            </svg>

          </div>

          <div>

            <div class="report-number">
              Report #${esc(report.id)}
            </div>

            <div class="idline">
              Submitted ${esc(fmtDate(report.created_at))}
            </div>

          </div>

        </div>


        <span class="status ${status}">
          ${esc(statusName(status))}
        </span>

      </div>


      <!-- PEOPLE -->

      <div class="people">

        ${person(
          "REPORTER",
          report.reporter_name,
          reporterId,
          false
        )}

        ${person(
          "REPORTED USER",
          report.reported_name,
          reportedUserId,
          true
        )}

      </div>


      <!-- REPORT INFORMATION -->

      <div class="report-info">

        <!-- REASON -->

        <div class="info-row">

          <div class="info-label">
            Reason
          </div>

          <div class="info-value">

            <span class="reason-value">
              ${esc(report.reason || "Not specified")}
            </span>

          </div>

        </div>


        <!-- CONVERSATION -->

        <div class="info-row">

          <div class="info-label">
            Conversation
          </div>

          <div class="info-value conversation-value">
            ${esc(report.conversation_id || "—")}
          </div>

        </div>

      </div>


      <!-- DETAILS -->

      ${
        report.details
        ?
        `
        <div class="details-box">

          <div class="details-label">
            Report details
          </div>

          <div class="details-text">
            ${esc(report.details)}
          </div>

        </div>
        `
        :
        ""
      }


      <!-- MODERATION -->

      <div class="moderation">

        <div class="moderation-head">

          <div class="moderation-title">
            Moderation decision
          </div>

          <div class="moderation-subtitle">
            Private admin controls
          </div>

        </div>


        <div class="controls">

          <!-- STATUS -->

          <div class="field">

            <label>
              Status
            </label>

            <select class="statusSelect">

              <option value="pending">
                Pending
              </option>

              <option value="investigating">
                Investigating
              </option>

              <option value="resolved">
                Resolved
              </option>

              <option value="dismissed">
                Dismissed
              </option>

            </select>

          </div>


          <!-- ACTION -->

          <div class="field">

            <label>
              Action
            </label>

            <select class="actionSelect">

              <option value="">
                No action
              </option>

              <option value="warning">
                Warning
              </option>

              <option value="restrict">
                Restrict
              </option>

              <option value="suspend">
                Suspend
              </option>

              <option value="ban">
                Ban
              </option>

            </select>

          </div>


          <!-- NOTES -->

          <div class="field notes">

            <label>
              Admin note
            </label>

            <textarea
              class="notesInput"
              placeholder="Add a private moderation note…"
            ></textarea>

          </div>


          <!-- SAVE -->

          <button
            class="save"
            data-save="1"
          >
            Save decision
          </button>

        </div>

      </div>

    </article>

  `;
}


/* =========================================================
   COUNTS
========================================================= */

function setCounts(rows){

  const counts = {
    pending:0,
    investigating:0,
    resolved:0,
    dismissed:0
  };


  rows.forEach(report => {

    if(
      counts[report.status] !== undefined
    ){

      counts[report.status]++;

    }

  });


  document.getElementById(
    "countPending"
  ).textContent =
    counts.pending;


  document.getElementById(
    "countInvestigating"
  ).textContent =
    counts.investigating;


  document.getElementById(
    "countResolved"
  ).textContent =
    counts.resolved;


  document.getElementById(
    "countDismissed"
  ).textContent =
    counts.dismissed;
}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const rows =
    currentStatus === "all"
      ? allReports
      : allReports.filter(
          report =>
            report.status === currentStatus
        );


  if(!rows.length){

    reportsEl.innerHTML = `

      <div class="empty">

        <strong>
          ${
            currentStatus === "all"
              ? "No reports."
              : `No ${currentStatus} reports.`
          }
        </strong>

        You're all caught up here.

      </div>

    `;

    return;
  }


  reportsEl.innerHTML =
    rows.map(card).join("");


  rows.forEach(report => {

    const element =
      reportsEl.querySelector(
        `[data-id="${CSS.escape(String(report.id))}"]`
      );


    if(!element){
      return;
    }


    element.querySelector(
      ".statusSelect"
    ).value =
      [
        "pending",
        "investigating",
        "resolved",
        "dismissed"
      ].includes(report.status)
        ? report.status
        : "pending";


    element.querySelector(
      ".actionSelect"
    ).value =
      report.action || "";


    element.querySelector(
      ".notesInput"
    ).value =
      report.admin_notes || "";

  });
}


/* =========================================================
   LOAD REPORTS
========================================================= */

async function loadReports(){

  showError("");

  reportsEl.innerHTML = `
    <div class="loading">
      Loading reports…
    </div>
  `;


  const {
    data,
    error
  } =
    await supabaseClient.rpc(
      "admin_list_reports",
      {
        p_status:null
      }
    );


  if(error){

    console.error(error);

    showError(
      "Could not load reports: " +
      error.message
    );


    reportsEl.innerHTML = `

      <div class="empty">

        <strong>
          Could not load reports.
        </strong>

        Check your admin permissions
        and Supabase function setup.

      </div>

    `;

    return;
  }


  allReports =
    Array.isArray(data)
      ? data
      : [];


  setCounts(allReports);

  render();
}


/* =========================================================
   SAVE REPORT
========================================================= */

async function saveReport(element){

  const id =
    element.dataset.id;


  const status =
    element.querySelector(
      ".statusSelect"
    ).value;


  const action =
    element.querySelector(
      ".actionSelect"
    ).value || null;


  const notes =
    element.querySelector(
      ".notesInput"
    ).value.trim() || null;


  const button =
    element.querySelector(
      "[data-save]"
    );


  button.disabled = true;

  button.textContent =
    "Saving…";

  showError("");


  const {
    data,
    error
  } =
    await supabaseClient.rpc(
      "admin_update_report",
      {
        p_report_id:Number(id),
        p_status:status,
        p_action:action,
        p_admin_notes:notes
      }
    );


  if(
    error ||
    data !== true
  ){

    console.error(error);

    showError(
      "Could not update report #" +
      id +
      ": " +
      (
        error?.message ||
        "Update was not accepted."
      )
    );


    button.disabled = false;

    button.textContent =
      "Save decision";

    return;
  }


  showToast(
    "Report #" +
    id +
    " updated"
  );


  await loadReports();
}


/* =========================================================
   BOOT
========================================================= */

async function boot(){

  const {
    data:{
      session
    }
  } =
    await supabaseClient.auth.getSession();


  if(!session){

    loginBox.style.display =
      "block";

    return;
  }


  const result =
    await supabaseClient.rpc(
      "is_totalk_admin"
    );


  if(
    result.error ||
    result.data !== true
  ){

    loginBox.style.display =
      "block";


    showError(
      result.error?.message ||
      "This account does not have admin access."
    );

    return;
  }


  app.style.display =
    "block";


  await loadReports();
}


/* =========================================================
   REFRESH
========================================================= */

document
  .getElementById("refreshBtn")
  .addEventListener(
    "click",
    loadReports
  );


/* =========================================================
   SIGN OUT
========================================================= */

document
  .getElementById("signOutBtn")
  .addEventListener(
    "click",
    async () => {

      await supabaseClient.auth.signOut();

      location.reload();

    }
  );


/* =========================================================
   OPEN CHAT
========================================================= */

document
  .getElementById("goChatBtn")
  .addEventListener(
    "click",
    () => {

      location.href =
        "chat.html";

    }
  );


/* =========================================================
   TABS
========================================================= */

document
  .getElementById("tabs")
  .addEventListener(
    "click",
    event => {

      const button =
        event.target.closest(
          ".tab"
        );


      if(!button){
        return;
      }


      document
        .querySelectorAll(".tab")
        .forEach(
          item =>
            item.classList.remove(
              "active"
            )
        );


      button.classList.add(
        "active"
      );


      currentStatus =
        button.dataset.status;


      render();

    }
  );


/* =========================================================
   SAVE CLICK
========================================================= */

reportsEl.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        "[data-save]"
      );


    if(!button){
      return;
    }


    const cardElement =
      button.closest(".card");


    if(cardElement){

      saveReport(cardElement);

    }

  }
);


/* =========================================================
   AUTH LISTENER
========================================================= */

supabaseClient.auth.onAuthStateChange(
  (event, session) => {

    if(
      event === "SIGNED_OUT"
    ){

      location.reload();

    }

  }
);


/* =========================================================
   START
========================================================= */

boot();

</script>

</body>
</html>
