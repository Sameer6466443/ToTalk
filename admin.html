<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05020b">
<title>ToTalk Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

:root{
  --bg:#05020b;
  --panel:#0b0615;
  --panel2:#10091c;
  --purple:#914cff;
  --purple2:#b777ff;
  --green:#50e59a;
  --yellow:#ffe34f;
  --red:#ff6b91;
  --blue:#68baff;
  --text:#f8f5ff;
  --muted:#8e879e;
  --border:rgba(145,76,255,.28)
}

html,body{
  min-height:100%;
  background:
    radial-gradient(circle at 50% -10%,rgba(145,76,255,.18),transparent 38%),
    var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

body{
  padding:18px
}

button,input,textarea,select{
  font:inherit
}

button{
  cursor:pointer
}

.shell{
  width:100%;
  max-width:1150px;
  margin:auto
}

/* ================= HEADER ================= */

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px
}

.brand{
  display:flex;
  align-items:center;
  gap:12px
}

.logo{
  width:54px;
  height:54px;
  border-radius:17px;
  border:1px solid rgba(145,76,255,.65);
  background:rgba(145,76,255,.1);
  display:grid;
  place-items:center;
  box-shadow:0 0 28px rgba(145,76,255,.15)
}

.logo svg{
  width:28px;
  height:28px;
  fill:none;
  stroke:var(--purple2);
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round
}

.brand h1{
  font-size:24px;
  letter-spacing:-.5px
}

.brand p{
  color:var(--muted);
  font-size:12px;
  margin-top:2px
}

.actions{
  display:flex;
  gap:8px
}

.icon-btn{
  width:54px;
  height:54px;
  border-radius:17px;
  border:1px solid var(--border);
  background:rgba(145,76,255,.07);
  color:white;
  display:grid;
  place-items:center;
  transition:.2s
}

.icon-btn:hover{
  background:rgba(145,76,255,.17);
  transform:translateY(-1px)
}

.icon-btn svg{
  width:24px;
  height:24px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round
}

.icon-btn.danger{
  color:#ff9ab6;
  border-color:rgba(255,85,125,.3)
}

/* ================= ERROR ================= */

.banner{
  display:none;
  padding:13px 15px;
  border:1px solid rgba(255,85,125,.35);
  background:rgba(255,85,125,.07);
  border-radius:13px;
  margin-bottom:15px;
  color:#ffc4d2;
  font-size:13px
}

.banner.show{
  display:block
}

/* ================= STATS ================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:11px;
  margin-bottom:17px
}

.stat{
  position:relative;
  overflow:hidden;
  min-height:112px;
  padding:17px;
  border:1px solid var(--border);
  border-radius:18px;
  background:linear-gradient(180deg,rgba(16,9,29,.96),rgba(8,4,15,.96));
}

.stat:after{
  content:"";
  position:absolute;
  width:110px;
  height:110px;
  right:-45px;
  bottom:-60px;
  border-radius:50%;
  background:rgba(145,76,255,.08)
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:600
}

.stat strong{
  display:block;
  font-size:30px;
  margin-top:7px
}

.stat.pending strong{
  color:var(--yellow)
}

.stat.investigating strong{
  color:var(--blue)
}

.stat.resolved strong{
  color:var(--green)
}

.stat.dismissed strong{
  color:#aaa3b7
}

/* ================= TABS ================= */

.toolbar{
  margin-bottom:15px;
  overflow:hidden
}

.tabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:3px;
  scrollbar-width:none
}

.tabs::-webkit-scrollbar{
  display:none
}

.tab{
  flex:0 0 auto;
  border:1px solid rgba(145,76,255,.27);
  background:rgba(145,76,255,.055);
  color:#91899f;
  border-radius:999px;
  padding:9px 15px;
  font-size:13px;
  font-weight:600
}

.tab.active{
  color:white;
  background:rgba(145,76,255,.19);
  border-color:rgba(145,76,255,.65);
  box-shadow:0 0 18px rgba(145,76,255,.12)
}

/* ================= REPORTS ================= */

.reports{
  display:grid;
  gap:13px
}

.card{
  border:1px solid rgba(145,76,255,.27);
  border-radius:20px;
  background:
    linear-gradient(180deg,rgba(15,8,27,.98),rgba(7,3,14,.98));
  overflow:hidden;
  box-shadow:0 14px 45px rgba(0,0,0,.2)
}

.card-inner{
  padding:17px
}

.card-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px
}

.report-title{
  display:flex;
  align-items:center;
  gap:10px
}

.report-icon{
  width:38px;
  height:38px;
  border-radius:12px;
  display:grid;
  place-items:center;
  border:1px solid rgba(145,76,255,.28);
  background:rgba(145,76,255,.1);
  color:var(--purple2)
}

.report-icon svg{
  width:19px;
  height:19px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round
}

.report-title strong{
  font-size:18px
}

.idline{
  color:#726b7e;
  font-size:11px;
  margin-top:3px
}

.status{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border-radius:999px;
  padding:7px 11px;
  font-size:11px;
  font-weight:700;
  border:1px solid
}

.status:before{
  content:"";
  width:6px;
  height:6px;
  border-radius:50%;
  background:currentColor
}

.status.pending{
  color:var(--yellow);
  border-color:rgba(255,227,79,.35);
  background:rgba(255,227,79,.06)
}

.status.investigating{
  color:var(--blue);
  border-color:rgba(102,184,255,.35);
  background:rgba(102,184,255,.06)
}

.status.resolved{
  color:var(--green);
  border-color:rgba(82,230,154,.35);
  background:rgba(82,230,154,.06)
}

.status.dismissed{
  color:#aaa2b7;
  border-color:rgba(170,162,183,.3);
  background:rgba(170,162,183,.05)
}

/* ================= PEOPLE ================= */

.people{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px
}

.person{
  border:1px solid rgba(145,76,255,.18);
  background:rgba(145,76,255,.045);
  border-radius:15px;
  padding:13px
}

.person-top{
  display:flex;
  align-items:center;
  gap:8px;
  color:#928aa1;
  font-size:10px;
  font-weight:700;
  letter-spacing:.12em
}

.person-icon{
  width:28px;
  height:28px;
  border-radius:9px;
  display:grid;
  place-items:center;
  background:rgba(145,76,255,.1);
  color:var(--purple2)
}

.person-icon svg{
  width:15px;
  height:15px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round
}

.person-name{
  font-size:15px;
  font-weight:700;
  margin-top:9px
}

.totalk-id{
  margin-top:5px;
  font-size:11px;
  color:var(--purple2);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  word-break:break-all
}

/* ================= REASON ================= */

.reason{
  margin-top:15px;
  font-size:14px;
  color:#ddd7e7
}

.reason-label{
  color:var(--purple2);
  font-size:11px;
  font-weight:800;
  letter-spacing:.1em;
  margin-right:8px
}

.details{
  margin-top:8px;
  color:#a9a1b5;
  font-size:13px;
  line-height:1.5;
  white-space:pre-wrap
}

.meta{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:12px;
  color:#716a7c;
  font-size:11px
}

.meta svg{
  width:15px;
  height:15px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round
}

.conversation-id{
  word-break:break-all
}

/* ================= VIEW CONVERSATION ================= */

.conversation-btn{
  width:100%;
  margin-top:13px;
  height:43px;
  border-radius:12px;
  border:1px solid rgba(145,76,255,.4);
  background:rgba(145,76,255,.09);
  color:#d9baff;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-size:13px;
  font-weight:700
}

.conversation-btn:hover{
  background:rgba(145,76,255,.17)
}

.conversation-btn svg{
  width:18px;
  height:18px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round
}

/* ================= CONTROLS ================= */

.decision{
  margin-top:17px;
  border-top:1px solid rgba(145,76,255,.14);
  padding-top:16px
}

.decision-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:13px
}

.decision-head strong{
  font-size:15px
}

.decision-head span{
  color:#6f687b;
  font-size:11px
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.field.full{
  grid-column:1/-1
}

.field label{
  display:block;
  color:#938b9f;
  font-size:10px;
  font-weight:800;
  letter-spacing:.1em;
  margin-bottom:6px
}

.field select,
.field textarea{
  width:100%;
  border:1px solid rgba(145,76,255,.3);
  background:#08040f;
  color:white;
  border-radius:12px;
  padding:11px 12px;
  outline:none
}

.field select{
  height:44px
}

.field textarea{
  min-height:78px;
  resize:vertical
}

.field select:focus,
.field textarea:focus{
  border-color:rgba(145,76,255,.7);
  box-shadow:0 0 0 3px rgba(145,76,255,.08)
}

.save{
  grid-column:1/-1;
  height:44px;
  border-radius:12px;
  border:1px solid #a86bff;
  background:linear-gradient(135deg,#7130d8,#9b4dff);
  color:white;
  font-weight:700;
  box-shadow:0 8px 25px rgba(145,76,255,.18)
}

.save:disabled{
  opacity:.6;
  cursor:not-allowed
}

/* ================= EMPTY ================= */

.empty,
.loading{
  padding:50px 20px;
  text-align:center;
  border:1px dashed rgba(145,76,255,.25);
  border-radius:18px;
  color:var(--muted)
}

.empty strong{
  display:block;
  color:white;
  margin-bottom:5px
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  background:rgba(0,0,0,.76);
  backdrop-filter:blur(8px);
  padding:15px
}

.modal.show{
  display:flex;
  align-items:center;
  justify-content:center
}

.modal-box{
  width:100%;
  max-width:720px;
  max-height:90vh;
  display:flex;
  flex-direction:column;
  border:1px solid rgba(145,76,255,.4);
  border-radius:21px;
  background:
    linear-gradient(180deg,#10091c,#07030d);
  box-shadow:0 30px 100px rgba(0,0,0,.6);
  overflow:hidden
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:16px 17px;
  border-bottom:1px solid rgba(145,76,255,.16)
}

.modal-title{
  display:flex;
  align-items:center;
  gap:10px
}

.modal-title-icon{
  width:39px;
  height:39px;
  border-radius:12px;
  background:rgba(145,76,255,.1);
  border:1px solid rgba(145,76,255,.25);
  display:grid;
  place-items:center;
  color:var(--purple2)
}

.modal-title-icon svg{
  width:20px;
  height:20px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round
}

.modal-title h2{
  font-size:16px
}

.modal-title p{
  color:#716a7c;
  font-size:10px;
  margin-top:2px;
  word-break:break-all
}

.close-modal{
  width:38px;
  height:38px;
  border-radius:11px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);
  color:#aaa2b7;
  display:grid;
  place-items:center
}

.close-modal svg{
  width:18px;
  height:18px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round
}

.messages{
  padding:16px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:9px
}

.message{
  max-width:82%;
  border:1px solid rgba(145,76,255,.17);
  background:rgba(145,76,255,.055);
  border-radius:15px;
  padding:10px 12px
}

.message.mine{
  align-self:flex-end;
  background:rgba(145,76,255,.13);
  border-color:rgba(145,76,255,.27)
}

.message-user{
  color:var(--purple2);
  font-size:10px;
  font-weight:800;
  margin-bottom:4px
}

.message-text{
  color:#eeeaf4;
  font-size:13px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere
}

.message-time{
  color:#6e6779;
  font-size:9px;
  margin-top:5px
}

.no-messages{
  padding:45px 20px;
  text-align:center;
  color:#777080
}

.modal-loading{
  padding:45px 20px;
  text-align:center;
  color:#92899d
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:2000;
  max-width:340px;
  padding:12px 15px;
  border:1px solid rgba(82,230,154,.35);
  background:#0b1712;
  color:#d8ffea;
  border-radius:12px;
  box-shadow:0 15px 40px rgba(0,0,0,.35);
  opacity:0;
  transform:translateY(8px);
  pointer-events:none;
  transition:.2s;
  font-size:13px
}

.toast.show{
  opacity:1;
  transform:none
}

/* ================= LOGIN ================= */

.login{
  max-width:440px;
  margin:15vh auto;
  background:linear-gradient(180deg,rgba(15,8,27,.98),rgba(8,4,15,.98));
  border:1px solid var(--border);
  border-radius:20px;
  padding:28px;
  text-align:center
}

.login h2{
  margin-bottom:8px
}

.login p{
  color:var(--muted);
  line-height:1.5;
  font-size:13px
}

.login button{
  margin-top:18px;
  height:43px;
  padding:0 18px;
  border-radius:11px;
  border:1px solid #a86bff;
  background:linear-gradient(135deg,#7130d8,#9b4dff);
  color:white
}

/* ================= MOBILE ================= */

@media(max-width:700px){

  body{
    padding:12px
  }

  .topbar{
    margin-bottom:16px
  }

  .logo{
    width:50px;
    height:50px
  }

  .brand h1{
    font-size:21px
  }

  .brand p{
    font-size:11px
  }

  .icon-btn{
    width:48px;
    height:48px;
    border-radius:15px
  }

  .stats{
    grid-template-columns:1fr 1fr;
    gap:9px
  }

  .stat{
    min-height:100px;
    padding:15px
  }

  .stat strong{
    font-size:27px
  }

  .people{
    grid-template-columns:1fr
  }

  .controls{
    grid-template-columns:1fr
  }

  .field.full{
    grid-column:auto
  }

  .save{
    grid-column:auto
  }

  .card-inner{
    padding:14px
  }

  .message{
    max-width:90%
  }

  .modal{
    padding:8px
  }

  .modal-box{
    max-height:94vh;
    border-radius:18px
  }
}

@media(max-width:430px){

  .brand p{
    max-width:130px
  }

  .report-title strong{
    font-size:17px
  }

  .status{
    padding:6px 8px
  }
}
</style>
</head>

<body>

<div class="shell" id="app" style="display:none">

  <!-- HEADER -->
  <header class="topbar">

    <div class="brand">

      <div class="logo">
        <svg viewBox="0 0 24 24">
          <path d="M5 5.5h14v9H11l-4 4v-4H5z"/>
          <path d="M8 9.5h8M8 12h5"/>
        </svg>
      </div>

      <div>
        <h1>ToTalk Admin</h1>
        <p>Owner moderation dashboard</p>
      </div>

    </div>

    <div class="actions">

      <button class="icon-btn" id="refreshBtn" title="Refresh">
        <svg viewBox="0 0 24 24">
          <path d="M20 11a8.1 8.1 0 0 0-14.8-4L3 10"/>
          <path d="M3 5v5h5"/>
          <path d="M4 13a8.1 8.1 0 0 0 14.8 4L21 14"/>
          <path d="M21 19v-5h-5"/>
        </svg>
      </button>

      <button class="icon-btn danger" id="signOutBtn" title="Sign out">
        <svg viewBox="0 0 24 24">
          <path d="M10 17l5-5-5-5"/>
          <path d="M15 12H3"/>
          <path d="M13 4h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/>
        </svg>
      </button>

    </div>

  </header>

  <div class="banner" id="errorBanner"></div>

  <!-- STATS -->
  <section class="stats">

    <div class="stat pending">
      <span>Pending</span>
      <strong id="countPending">0</strong>
    </div>

    <div class="stat investigating">
      <span>Investigating</span>
      <strong id="countInvestigating">0</strong>
    </div>

    <div class="stat resolved">
      <span>Resolved</span>
      <strong id="countResolved">0</strong>
    </div>

    <div class="stat dismissed">
      <span>Dismissed</span>
      <strong id="countDismissed">0</strong>
    </div>

  </section>

  <!-- TABS -->
  <div class="toolbar">

    <div class="tabs" id="tabs">

      <button class="tab active" data-status="pending">
        Pending
      </button>

      <button class="tab" data-status="investigating">
        Investigating
      </button>

      <button class="tab" data-status="resolved">
        Resolved
      </button>

      <button class="tab" data-status="dismissed">
        Dismissed
      </button>

      <button class="tab" data-status="all">
        All
      </button>

    </div>

  </div>

  <main class="reports" id="reports">
    <div class="loading">Loading reports…</div>
  </main>

</div>


<!-- LOGIN -->
<div class="login" id="loginBox" style="display:none">

  <h2>Owner access required</h2>

  <p>
    You must be signed in with a ToTalk account that has
    an owner, admin, or moderator role.
  </p>

  <button id="goChatBtn">
    Open ToTalk
  </button>

</div>


<!-- CONVERSATION MODAL -->
<div class="modal" id="conversationModal">

  <div class="modal-box">

    <div class="modal-head">

      <div class="modal-title">

        <div class="modal-title-icon">
          <svg viewBox="0 0 24 24">
            <path d="M5 5.5h14v9H11l-4 4v-4H5z"/>
            <path d="M8 9.5h8M8 12h5"/>
          </svg>
        </div>

        <div>
          <h2>Conversation</h2>
          <p id="modalConversationId">Loading…</p>
        </div>

      </div>

      <button class="close-modal" id="closeModal">

        <svg viewBox="0 0 24 24">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>

      </button>

    </div>

    <div class="messages" id="messages">
      <div class="modal-loading">
        Loading conversation…
      </div>
    </div>

  </div>

</div>


<div class="toast" id="toast"></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://qiynczbrhpxwuabwuyiy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_eUPz4c_nYckgINEK-AIWqw_JAXIHozd";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );


/* =========================================================
   ELEMENTS
========================================================= */

const app =
  document.getElementById("app");

const loginBox =
  document.getElementById("loginBox");

const reportsEl =
  document.getElementById("reports");

const errorBanner =
  document.getElementById("errorBanner");

const toast =
  document.getElementById("toast");

const conversationModal =
  document.getElementById("conversationModal");

const messagesEl =
  document.getElementById("messages");

const modalConversationId =
  document.getElementById("modalConversationId");


/* =========================================================
   STATE
========================================================= */

let currentStatus = "pending";

let allReports = [];


/* =========================================================
   HELPERS
========================================================= */

const esc = value => {

  return String(value ?? "")
    .replace(
      /[&<>'"]/g,
      char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "'":"&#39;",
        '"':"&quot;"
      }[char])
    );

};


const fmtDate = value => {

  if(!value) return "—";

  const d = new Date(value);

  if(isNaN(d)) return String(value);

  return d.toLocaleString(
    [],
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );

};


function showError(message){

  errorBanner.textContent = message || "";

  errorBanner.classList.toggle(
    "show",
    !!message
  );

}


function showToast(message){

  toast.textContent = message;

  toast.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer =
    setTimeout(
      () => toast.classList.remove("show"),
      2600
    );

}


/* =========================================================
   COUNTS
========================================================= */

function setCounts(rows){

  const counts = {
    pending:0,
    investigating:0,
    resolved:0,
    dismissed:0
  };

  rows.forEach(row => {

    if(
      counts[row.status] !== undefined
    ){
      counts[row.status]++;
    }

  });

  document.getElementById(
    "countPending"
  ).textContent = counts.pending;

  document.getElementById(
    "countInvestigating"
  ).textContent = counts.investigating;

  document.getElementById(
    "countResolved"
  ).textContent = counts.resolved;

  document.getElementById(
    "countDismissed"
  ).textContent = counts.dismissed;

}


/* =========================================================
   PERSON CARD
========================================================= */

function person(type,name,id){

  const isReporter =
    type === "Reporter";

  return `

    <div class="person">

      <div class="person-top">

        <div class="person-icon">

          <svg viewBox="0 0 24 24">

            ${
              isReporter
              ?
              `<circle cx="12" cy="8" r="3"/>
               <path d="M5 20c.8-4 3.1-6 7-6s6.2 2 7 6"/>`
              :
              `<path d="M5 4h14v12H9l-4 4V4z"/>`
            }

          </svg>

        </div>

        ${esc(type)}

      </div>

      <div class="person-name">
        ${esc(name || "Unknown user")}
      </div>

      <div class="totalk-id">
        ToTalk ID:
        ${esc(id || "Not available")}
      </div>

    </div>

  `;

}


/* =========================================================
   REPORT CARD
========================================================= */

function card(report){

  const allowedStatuses = [
    "pending",
    "investigating",
    "resolved",
    "dismissed"
  ];

  const status =
    allowedStatuses.includes(report.status)
    ? report.status
    : "pending";


  return `

    <article
      class="card"
      data-id="${esc(report.id)}"
      data-conversation="${esc(report.conversation_id || "")}"
    >

      <div class="card-inner">

        <div class="card-head">

          <div class="report-title">

            <div class="report-icon">

              <svg viewBox="0 0 24 24">
                <path d="M5 5.5h14v9H11l-4 4v-4H5z"/>
                <path d="M8 9.5h8M8 12h5"/>
              </svg>

            </div>

            <div>

              <strong>
                Report #${esc(report.id)}
              </strong>

              <div class="idline">
                Submitted ${esc(fmtDate(report.created_at))}
              </div>

            </div>

          </div>

          <span class="status ${status}">
            ${esc(
              status.charAt(0).toUpperCase()
              + status.slice(1)
            )}
          </span>

        </div>


        <div class="people">

          ${person(
            "Reporter",
            report.reporter_name,
            report.reporter_totalk_id ||
            report.reporter_id
          )}

          ${person(
            "Reported user",
            report.reported_name,
            report.reported_totalk_id ||
            report.reported_id
          )}

        </div>


        <div class="reason">

          <span class="reason-label">
            REASON
          </span>

          ${esc(
            report.reason || "Not specified"
          )}

        </div>


        ${
          report.details
          ?
          `
            <div class="details">
              ${esc(report.details)}
            </div>
          `
          :
          ""
        }


        <div class="meta">

          <svg viewBox="0 0 24 24">
            <path d="M5 5.5h14v9H11l-4 4v-4H5z"/>
          </svg>

          <span>
            Conversation:
          </span>

          <span class="conversation-id">
            ${esc(
              report.conversation_id || "—"
            )}
          </span>

        </div>


        ${
          report.conversation_id
          ?
          `
            <button
              class="conversation-btn"
              data-view-conversation="1"
            >

              <svg viewBox="0 0 24 24">
                <path d="M5 5.5h14v9H11l-4 4v-4H5z"/>
                <path d="M8 9.5h8M8 12h5"/>
              </svg>

              View Conversation

            </button>
          `
          :
          ""
        }


        <!-- MODERATION -->

        <div class="decision">

          <div class="decision-head">

            <strong>
              Moderation decision
            </strong>

            <span>
              Private admin controls
            </span>

          </div>


          <div class="controls">


            <div class="field">

              <label>
                STATUS
              </label>

              <select class="statusSelect">

                <option value="pending">
                  Pending
                </option>

                <option value="investigating">
                  Investigating
                </option>

                <option value="resolved">
                  Resolved
                </option>

                <option value="dismissed">
                  Dismissed
                </option>

              </select>

            </div>


            <div class="field">

              <label>
                ACTION
              </label>

              <select class="actionSelect">

                <option value="">
                  No action
                </option>

                <option value="warning">
                  Warning
                </option>

                <option value="restrict">
                  Restrict
                </option>

                <option value="suspend">
                  Suspend
                </option>

                <option value="ban">
                  Ban
                </option>

              </select>

            </div>


            <div class="field full">

              <label>
                ADMIN NOTE
              </label>

              <textarea
                class="notesInput"
                placeholder="Add a private moderation note..."
              ></textarea>

            </div>


            <button
              class="save"
              data-save="1"
            >
              Save decision
            </button>


          </div>

        </div>

      </div>

    </article>

  `;

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const rows =
    currentStatus === "all"
    ?
    allReports
    :
    allReports.filter(
      report =>
        report.status === currentStatus
    );


  if(!rows.length){

    reportsEl.innerHTML = `

      <div class="empty">

        <strong>
          No ${
            currentStatus === "all"
            ? "reports"
            : currentStatus + " reports"
          }.
        </strong>

        You're all caught up here.

      </div>

    `;

    return;

  }


  reportsEl.innerHTML =
    rows.map(card).join("");


  rows.forEach(report => {

    const selector =
      `[data-id="${CSS.escape(
        String(report.id)
      )}"]`;

    const element =
      reportsEl.querySelector(selector);

    if(!element) return;


    element.querySelector(
      ".statusSelect"
    ).value =
      [
        "pending",
        "investigating",
        "resolved",
        "dismissed"
      ].includes(report.status)
      ?
      report.status
      :
      "pending";


    element.querySelector(
      ".actionSelect"
    ).value =
      report.action || "";


    element.querySelector(
      ".notesInput"
    ).value =
      report.admin_notes || "";

  });

}


/* =========================================================
   LOAD REPORTS
========================================================= */

async function loadReports(){

  showError("");

  reportsEl.innerHTML =
    `<div class="loading">
      Loading reports…
    </div>`;


  const {
    data,
    error
  } =
    await supabaseClient.rpc(
      "admin_list_reports",
      {
        p_status:null
      }
    );


  if(error){

    console.error(error);

    showError(
      "Could not load reports: "
      + error.message
    );

    reportsEl.innerHTML =
      `<div class="empty">
        <strong>
          Could not load reports.
        </strong>
        Check your admin permissions and Supabase function setup.
      </div>`;

    return;

  }


  allReports =
    Array.isArray(data)
    ? data
    : [];


  setCounts(allReports);

  render();

}


/* =========================================================
   SAVE REPORT
========================================================= */

async function saveReport(element){

  const id =
    element.dataset.id;

  const status =
    element.querySelector(
      ".statusSelect"
    ).value;

  const action =
    element.querySelector(
      ".actionSelect"
    ).value || null;

  const notes =
    element.querySelector(
      ".notesInput"
    ).value.trim() || null;

  const button =
    element.querySelector(
      "[data-save]"
    );


  button.disabled = true;

  button.textContent =
    "Saving…";

  showError("");


  const {
    data,
    error
  } =
    await supabaseClient.rpc(
      "admin_update_report",
      {
        p_report_id:Number(id),
        p_status:status,
        p_action:action,
        p_admin_notes:notes
      }
    );


  if(error || data !== true){

    console.error(error);

    showError(
      "Could not update report #"
      + id
      + ": "
      + (
        error?.message ||
        "Update was not accepted."
      )
    );

    button.disabled = false;

    button.textContent =
      "Save decision";

    return;

  }


  showToast(
    "Report #" + id + " updated"
  );


  await loadReports();

}


/* =========================================================
   VIEW CONVERSATION
========================================================= */

async function viewConversation(
  conversationId,
  report
){

  if(!conversationId){

    showError(
      "This report does not have a conversation ID."
    );

    return;

  }


  conversationModal.classList.add(
    "show"
  );


  modalConversationId.textContent =
    conversationId;


  messagesEl.innerHTML =
    `<div class="modal-loading">
      Loading conversation…
    </div>`;


  /*
    We search the messages table using
    the exact conversation_id from the report.
  */

  const {
    data,
    error
  } =
    await supabaseClient
      .from("messages")
      .select("*")
      .eq(
        "conversation_id",
        conversationId
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(error){

    console.error(error);

    messagesEl.innerHTML = `

      <div class="no-messages">

        <strong style="display:block;color:#fff;margin-bottom:6px">
          Could not load conversation
        </strong>

        <span>
          ${esc(error.message)}
        </span>

      </div>

    `;

    return;

  }


  if(!data || !data.length){

    messagesEl.innerHTML = `

      <div class="no-messages">
        No messages found for this conversation.
      </div>

    `;

    return;

  }


  messagesEl.innerHTML = "";


  data.forEach(message => {

    /*
      Different chat systems use different
      column names.

      This automatically checks common names.
    */

    const text =
      message.content ??
      message.message ??
      message.body ??
      message.text ??
      "";


    const sender =
      message.sender_id ??
      message.user_id ??
      message.from_user_id ??
      "Unknown sender";


    const created =
      message.created_at ??
      message.sent_at ??
      message.inserted_at ??
      null;


    const messageElement =
      document.createElement("div");


    messageElement.className =
      "message";


    /*
      If the sender is the reporter,
      show the bubble on the right.

      This is only a visual fallback.
    */

    if(
      report &&
      (
        sender === report.reporter_id ||
        sender === report.reporter_totalk_id
      )
    ){

      messageElement.classList.add(
        "mine"
      );

    }


    messageElement.innerHTML = `

      <div class="message-user">
        ${esc(sender)}
      </div>

      <div class="message-text">
        ${esc(
          text || "[No text content]"
        )}
      </div>

      ${
        created
        ?
        `
          <div class="message-time">
            ${esc(fmtDate(created))}
          </div>
        `
        :
        ""
      }

    `;


    messagesEl.appendChild(
      messageElement
    );

  });


  messagesEl.scrollTop =
    messagesEl.scrollHeight;

}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeConversation(){

  conversationModal.classList.remove(
    "show"
  );

  messagesEl.innerHTML = "";

}


/* =========================================================
   BOOT
========================================================= */

async function boot(){

  const {
    data:{
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();


  if(!session){

    loginBox.style.display =
      "block";

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient.rpc(
      "is_totalk_admin"
    );


  if(error || data !== true){

    loginBox.style.display =
      "block";

    showError(
      error?.message ||
      "This account does not have admin access."
    );

    return;

  }


  app.style.display =
    "block";


  await loadReports();

}


/* =========================================================
   EVENTS
========================================================= */


/* Refresh */

document
  .getElementById("refreshBtn")
  .addEventListener(
    "click",
    loadReports
  );


/* Sign out */

document
  .getElementById("signOutBtn")
  .addEventListener(
    "click",
    async () => {

      await supabaseClient
        .auth
        .signOut();

      location.reload();

    }
  );


/* Open ToTalk */

document
  .getElementById("goChatBtn")
  .addEventListener(
    "click",
    () => {

      location.href =
        "chat.html";

    }
  );


/* Tabs */

document
  .getElementById("tabs")
  .addEventListener(
    "click",
    event => {

      const button =
        event.target.closest(".tab");

      if(!button) return;


      document
        .querySelectorAll(".tab")
        .forEach(
          tab =>
            tab.classList.remove(
              "active"
            )
        );


      button.classList.add(
        "active"
      );


      currentStatus =
        button.dataset.status;


      render();

    }
  );


/* Report buttons */

reportsEl
  .addEventListener(
    "click",
    event => {

      /* View conversation */

      const conversationButton =
        event.target.closest(
          "[data-view-conversation]"
        );


      if(conversationButton){

        const cardElement =
          conversationButton.closest(
            ".card"
          );

        if(!cardElement) return;


        const conversationId =
          cardElement.dataset.conversation;


        const report =
          allReports.find(
            item =>
              String(item.id) ===
              String(cardElement.dataset.id)
          );


        viewConversation(
          conversationId,
          report
        );

        return;

      }


      /* Save report */

      const saveButton =
        event.target.closest(
          "[data-save]"
        );


      if(saveButton){

        const cardElement =
          saveButton.closest(
            ".card"
          );

        if(cardElement){

          saveReport(
            cardElement
          );

        }

      }

    }
  );


/* Close modal */

document
  .getElementById("closeModal")
  .addEventListener(
    "click",
    closeConversation
  );


/* Click outside modal */

conversationModal
  .addEventListener(
    "click",
    event => {

      if(
        event.target ===
        conversationModal
      ){

        closeConversation();

      }

    }
  );


/* Escape key */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Escape"
    ){

      closeConversation();

    }

  }
);


/* Auth */

supabaseClient
  .auth
  .onAuthStateChange(
    (event) => {

      if(
        event === "SIGNED_OUT"
      ){

        location.reload();

      }

    }
  );


/* Start */

boot();

</script>

</body>
</html>
