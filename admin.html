<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#020108"
>

<title>ToTalk Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --black:#020108;
  --dark:#070313;
  --panel:#0a0616;
  --panel2:#10091d;

  --purple:#914cff;
  --purple2:#b878ff;

  --green:#52e69a;
  --yellow:#ffe34f;
  --red:#ff557d;
  --blue:#66b8ff;

  --white:#f8f5ff;
  --muted:#958da9;

  --border:rgba(145,76,255,.35);
}

html,
body{
  min-height:100%;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(145,76,255,.18),
      transparent 38%
    ),
    var(--black);

  color:var(--white);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body{
  padding:24px;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.shell{
  max-width:1200px;
  margin:auto;
}


/* =====================================================
   TOP BAR
===================================================== */

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  margin-bottom:22px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:44px;
  height:44px;

  border:1px solid rgba(145,76,255,.7);
  border-radius:14px;

  display:grid;
  place-items:center;

  background:rgba(145,76,255,.12);

  box-shadow:
    0 0 28px rgba(145,76,255,.2);
}

.logo svg{
  width:25px;
  height:25px;

  fill:none;
  stroke:var(--purple2);
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.brand h1{
  font-size:22px;
  letter-spacing:.2px;
}

.brand p{
  font-size:12px;
  color:var(--muted);
  margin-top:2px;
}

.actions{
  display:flex;
  gap:9px;
}

.icon-btn{
  width:42px;
  height:42px;

  display:grid;
  place-items:center;

  border:1px solid var(--border);
  background:rgba(145,76,255,.08);

  color:var(--white);

  border-radius:12px;

  transition:.18s;
}

.icon-btn:hover{
  background:rgba(145,76,255,.18);
  transform:translateY(-1px);
}

.icon-btn svg{
  width:18px;
  height:18px;

  fill:none;
  stroke:currentColor;
  stroke-width:1.8;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.icon-btn.danger{
  color:#ff9bb3;
  border-color:rgba(255,85,125,.35);
}

.icon-btn.danger:hover{
  background:rgba(255,85,125,.1);
}


/* =====================================================
   ERROR
===================================================== */

.banner{
  display:none;

  padding:14px 16px;

  border:1px solid rgba(255,85,125,.4);

  background:rgba(255,85,125,.08);

  border-radius:14px;

  margin-bottom:18px;

  color:#ffc0cf;
}

.banner.show{
  display:block;
}


/* =====================================================
   STATS
===================================================== */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);

  gap:12px;

  margin-bottom:18px;
}

.stat{
  background:
    linear-gradient(
      180deg,
      rgba(16,9,29,.96),
      rgba(9,5,18,.96)
    );

  border:1px solid var(--border);

  border-radius:15px;

  padding:16px;

  box-shadow:
    0 12px 40px rgba(0,0,0,.22);
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:12px;
}

.stat strong{
  display:block;
  font-size:25px;
  margin-top:5px;
}

.stat.pending strong{
  color:var(--yellow);
}

.stat.investigating strong{
  color:var(--blue);
}

.stat.resolved strong{
  color:var(--green);
}

.stat.dismissed strong{
  color:#aaa2b7;
}


/* =====================================================
   TOOLBAR
===================================================== */

.toolbar{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:12px;

  margin-bottom:14px;
}

.tabs{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.tab{
  border:1px solid rgba(145,76,255,.28);

  background:rgba(145,76,255,.06);

  color:var(--muted);

  border-radius:999px;

  padding:8px 12px;
}

.tab.active{
  color:var(--white);

  background:rgba(145,76,255,.2);

  border-color:rgba(145,76,255,.65);

  box-shadow:
    0 0 18px rgba(145,76,255,.12);
}


/* =====================================================
   REPORTS
===================================================== */

.reports{
  display:grid;
  gap:12px;
}

.card{
  background:
    linear-gradient(
      180deg,
      rgba(15,8,27,.98),
      rgba(8,4,15,.98)
    );

  border:1px solid rgba(145,76,255,.3);

  border-radius:17px;

  padding:17px;

  box-shadow:
    0 12px 50px rgba(0,0,0,.25);
}

.card-head{
  display:flex;

  justify-content:space-between;

  gap:15px;

  align-items:flex-start;
}

.idline{
  font-size:11px;
  color:#756d84;
  margin-top:5px;
}

.status{
  display:inline-flex;

  align-items:center;

  gap:6px;

  border-radius:999px;

  padding:6px 9px;

  font-size:11px;

  border:1px solid;
}

.status.pending{
  color:var(--yellow);

  border-color:rgba(255,227,79,.35);

  background:rgba(255,227,79,.07);
}

.status.investigating{
  color:var(--blue);

  border-color:rgba(102,184,255,.35);

  background:rgba(102,184,255,.07);
}

.status.resolved{
  color:var(--green);

  border-color:rgba(82,230,154,.35);

  background:rgba(82,230,154,.07);
}

.status.dismissed{
  color:#aaa2b7;

  border-color:rgba(170,162,183,.3);

  background:rgba(170,162,183,.05);
}


/* =====================================================
   PEOPLE
===================================================== */

.people{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px;

  margin:15px 0;
}

.person{
  border:1px solid rgba(145,76,255,.18);

  background:rgba(145,76,255,.045);

  border-radius:13px;

  padding:12px;
}

.person label{
  display:block;

  font-size:10px;

  text-transform:uppercase;

  letter-spacing:.12em;

  color:var(--muted);

  margin-bottom:5px;
}

.person strong{
  font-size:14px;
  display:block;
}

.person code{
  font-size:11px;

  color:var(--purple2);

  display:block;

  margin-top:3px;
}


/* =====================================================
   REPORT TEXT
===================================================== */

.reason{
  font-size:13px;
  color:#ddd7e7;
}

.reason b{
  color:var(--purple2);
}

.details{
  margin-top:9px;

  color:#aaa2b7;

  font-size:13px;

  line-height:1.55;

  white-space:pre-wrap;
}

.meta{
  font-size:11px;

  color:#716a7c;

  margin-top:10px;
}


/* =====================================================
   BUTTONS
===================================================== */

.btn{
  border:1px solid var(--border);

  background:rgba(145,76,255,.1);

  color:var(--white);

  border-radius:11px;

  padding:10px 14px;

  transition:.18s;
}

.btn:hover{
  background:rgba(145,76,255,.18);
}

.btn.primary{
  background:
    linear-gradient(
      135deg,
      #7130d8,
      #9b4dff
    );

  border-color:#a86bff;
}

.btn.view{
  display:flex;

  align-items:center;

  justify-content:center;

  gap:8px;

  margin-top:13px;

  width:100%;

  min-height:42px;

  font-size:13px;

  font-weight:600;
}

.btn.view:hover{
  box-shadow:
    0 8px 25px rgba(145,76,255,.18);
}

.btn.view svg{
  width:17px;
  height:17px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.8;

  stroke-linecap:round;

  stroke-linejoin:round;
}


/* =====================================================
   CONTROLS
===================================================== */

.controls{
  margin-top:15px;

  padding-top:15px;

  border-top:1px solid rgba(145,76,255,.16);

  display:grid;

  grid-template-columns:
    180px
    180px
    1fr
    auto;

  gap:9px;

  align-items:end;
}

.field label{
  display:block;

  font-size:10px;

  text-transform:uppercase;

  letter-spacing:.1em;

  color:var(--muted);

  margin-bottom:6px;
}

.field select,
.field textarea{
  width:100%;

  border:1px solid rgba(145,76,255,.3);

  background:#08040f;

  color:var(--white);

  border-radius:10px;

  padding:9px 10px;

  outline:none;
}

.field select:focus,
.field textarea:focus{
  border-color:rgba(145,76,255,.75);

  box-shadow:
    0 0 0 3px rgba(145,76,255,.08);
}

.field textarea{
  min-height:40px;

  resize:vertical;
}

.save{
  height:40px;
}


/* =====================================================
   EMPTY / LOADING
===================================================== */

.empty,
.loading{
  padding:55px 20px;

  text-align:center;

  border:1px dashed rgba(145,76,255,.28);

  border-radius:17px;

  color:var(--muted);
}

.empty strong{
  display:block;

  color:var(--white);

  margin-bottom:5px;
}


/* =====================================================
   TOAST
===================================================== */

.toast{
  position:fixed;

  right:20px;
  bottom:20px;

  max-width:360px;

  padding:12px 15px;

  border:1px solid rgba(82,230,154,.4);

  background:#0b1712;

  color:#d8ffea;

  border-radius:12px;

  box-shadow:
    0 15px 40px rgba(0,0,0,.35);

  opacity:0;

  transform:translateY(8px);

  pointer-events:none;

  transition:.2s;

  z-index:1000;
}

.toast.show{
  opacity:1;
  transform:none;
}


/* =====================================================
   LOGIN
===================================================== */

.login{
  max-width:480px;

  margin:12vh auto;

  background:
    linear-gradient(
      180deg,
      rgba(15,8,27,.98),
      rgba(8,4,15,.98)
    );

  border:1px solid var(--border);

  border-radius:20px;

  padding:28px;

  text-align:center;

  box-shadow:
    0 25px 80px rgba(0,0,0,.4);
}

.login h2{
  margin-bottom:8px;
}

.login p{
  color:var(--muted);

  line-height:1.5;

  font-size:13px;
}

.login .btn{
  margin-top:18px;
}


/* =====================================================
   CONVERSATION MODAL
===================================================== */

.modal{
  position:fixed;

  inset:0;

  z-index:500;

  display:none;

  background:
    rgba(0,0,0,.78);

  backdrop-filter:
    blur(14px);

  padding:20px;
}

.modal.show{
  display:flex;

  align-items:center;

  justify-content:center;
}

.modal-box{
  width:min(900px,100%);

  height:min(760px,90vh);

  display:flex;

  flex-direction:column;

  background:
    linear-gradient(
      180deg,
      #10091d,
      #07030e
    );

  border:1px solid rgba(145,76,255,.42);

  border-radius:22px;

  box-shadow:
    0 30px 100px rgba(0,0,0,.65),
    0 0 50px rgba(91,38,170,.08);

  overflow:hidden;
}


/* =====================================================
   MODAL HEADER
===================================================== */

.modal-head{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;

  padding:17px 18px;

  border-bottom:1px solid rgba(145,76,255,.18);

  background:
    linear-gradient(
      180deg,
      rgba(145,76,255,.07),
      transparent
    );
}

.modal-title{
  min-width:0;
}

.modal-title strong{
  display:block;

  font-size:17px;
}

.modal-title span{
  display:block;

  color:var(--muted);

  font-size:11px;

  margin-top:4px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.close-btn{
  flex:none;

  width:38px;
  height:38px;

  border-radius:11px;

  border:1px solid rgba(145,76,255,.3);

  background:rgba(145,76,255,.08);

  color:var(--white);

  display:grid;

  place-items:center;

  transition:.18s;
}

.close-btn:hover{
  background:rgba(145,76,255,.2);

  border-color:rgba(145,76,255,.55);

  transform:scale(1.03);
}

.close-btn svg{
  width:17px;
  height:17px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.8;

  stroke-linecap:round;
}


/* =====================================================
   CONVERSATION
===================================================== */

.conversation{
  overflow:auto;

  flex:1;

  padding:22px 20px 30px;

  min-height:280px;

  scroll-behavior:smooth;
}

.conversation::-webkit-scrollbar{
  width:7px;
}

.conversation::-webkit-scrollbar-track{
  background:transparent;
}

.conversation::-webkit-scrollbar-thumb{
  background:rgba(145,76,255,.28);

  border-radius:999px;
}

.conversation-loading,
.conversation-empty{
  min-height:260px;

  display:grid;

  place-items:center;

  text-align:center;

  color:var(--muted);
}


/* =====================================================
   MESSAGE
===================================================== */

.message{
  display:flex;

  width:100%;

  margin-bottom:18px;

  animation:
    messageIn .18s ease-out;
}

@keyframes messageIn{

  from{
    opacity:0;
    transform:translateY(4px);
  }

  to{
    opacity:1;
    transform:none;
  }

}

.message.left{
  justify-content:flex-start;
}

.message.right{
  justify-content:flex-end;
}


/*
 IMPORTANT:
 The old design allowed the message container
 to become unnecessarily large.

 This version keeps the container compact.
*/

.message-inner{
  width:max-content;

  max-width:min(680px,88%);

  min-width:0;
}


/* =====================================================
   MESSAGE HEADER
===================================================== */

.message-info{
  display:flex;

  align-items:center;

  gap:7px;

  margin-bottom:6px;

  min-height:22px;
}

.message.right .message-info{
  justify-content:flex-end;
}

.sender-avatar{
  width:23px;
  height:23px;

  flex:none;

  display:grid;

  place-items:center;

  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      rgba(145,76,255,.35),
      rgba(184,120,255,.15)
    );

  border:1px solid rgba(145,76,255,.4);

  color:var(--purple2);

  font-size:10px;

  font-weight:800;

  text-transform:uppercase;
}

.sender-name{
  font-size:12px;

  font-weight:700;

  color:var(--white);

  white-space:nowrap;
}

.sender-id{
  font-size:10px;

  color:var(--purple2);

  background:rgba(145,76,255,.08);

  border:1px solid rgba(145,76,255,.18);

  padding:3px 7px;

  border-radius:999px;

  white-space:nowrap;
}


/* =====================================================
   BUBBLE
===================================================== */

.bubble{
  display:inline-block;

  width:auto;

  min-width:0;

  min-height:0;

  height:auto;

  border:1px solid rgba(145,76,255,.22);

  background:
    linear-gradient(
      135deg,
      rgba(145,76,255,.095),
      rgba(145,76,255,.045)
    );

  border-radius:14px;

  padding:9px 12px;

  color:#e8e3ee;

  font-size:13px;

  line-height:1.45;

  white-space:pre-wrap;

  overflow-wrap:anywhere;

  word-break:break-word;

  box-shadow:
    0 5px 18px rgba(0,0,0,.12);
}

.message.right .bubble{
  background:
    linear-gradient(
      135deg,
      rgba(145,76,255,.2),
      rgba(145,76,255,.11)
    );

  border-color:rgba(145,76,255,.34);
}


/* =====================================================
   MESSAGE TIME
===================================================== */

.message-time{
  font-size:9px;

  color:#716a7c;

  margin-top:5px;

  line-height:1.2;
}

.message.right .message-time{
  text-align:right;
}


/* =====================================================
   DELETED MESSAGE
===================================================== */

.message.deleted .bubble{
  color:#aaa2b7;

  font-style:italic;

  border-color:rgba(255,85,125,.22);

  background:
    rgba(255,85,125,.045);
}

.deleted-label{
  display:inline-flex;

  align-items:center;

  gap:5px;

  margin-top:6px;

  font-size:9px;

  color:#ff9bb3;
}

.deleted-label svg{
  width:12px;
  height:12px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.8;

  stroke-linecap:round;

  stroke-linejoin:round;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:800px){

  body{
    padding:14px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .people{
    grid-template-columns:1fr;
  }

  .controls{
    grid-template-columns:1fr 1fr;
  }

  .controls .field.notes{
    grid-column:1/-1;
  }

  .controls .save{
    grid-column:1/-1;
    width:100%;
  }

  .topbar{
    align-items:flex-start;
  }

  .toolbar{
    align-items:flex-start;
    flex-direction:column;
  }

  .modal{
    padding:8px;
  }

  .modal-box{
    width:100%;
    height:95vh;
    max-height:95vh;

    border-radius:18px;
  }

  .conversation{
    padding:18px 13px 25px;
  }

  .message-inner{
    max-width:92%;
  }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:480px){

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .controls{
    grid-template-columns:1fr;
  }

  .controls .field.notes{
    grid-column:auto;
  }

  .controls .save{
    grid-column:auto;
  }

  .actions{
    gap:6px;
  }

  .icon-btn{
    width:40px;
    height:40px;
  }

  .brand h1{
    font-size:19px;
  }

  .card{
    padding:14px;
  }

  .message-inner{
    max-width:94%;
  }

  .sender-id{
    font-size:9px;
  }

  .bubble{
    font-size:13px;
    padding:8px 11px;
  }

}

</style>

</head>

<body>


<div
  class="shell"
  id="app"
  style="display:none"
>


<!-- =====================================================
     TOP BAR
===================================================== -->

<header class="topbar">

  <div class="brand">

    <div class="logo">

      <svg viewBox="0 0 24 24">

        <path d="M5 5.5h14v9H11l-4 4v-4H5z"/>

        <path d="M8 9.5h8M8 12h5"/>

      </svg>

    </div>

    <div>

      <h1>ToTalk Admin</h1>

      <p>Owner moderation dashboard</p>

    </div>

  </div>


  <div class="actions">

    <button
      class="icon-btn"
      id="refreshBtn"
      title="Refresh reports"
      aria-label="Refresh reports"
    >

      <svg viewBox="0 0 24 24">

        <path d="M20 11a8 8 0 0 0-14.9-4"/>

        <path d="M5 3v4h4"/>

        <path d="M4 13a8 8 0 0 0 14.9 4"/>

        <path d="M19 21v-4h-4"/>

      </svg>

    </button>


    <button
      class="icon-btn danger"
      id="signOutBtn"
      title="Sign out"
      aria-label="Sign out"
    >

      <svg viewBox="0 0 24 24">

        <path d="M10 17l5-5-5-5"/>

        <path d="M15 12H3"/>

        <path d="M21 3v18"/>

      </svg>

    </button>

  </div>

</header>


<div
  class="banner"
  id="errorBanner"
></div>


<!-- =====================================================
     STATS
===================================================== -->

<section class="stats">

  <div class="stat pending">

    <span>Pending</span>

    <strong id="countPending">
      0
    </strong>

  </div>


  <div class="stat investigating">

    <span>Investigating</span>

    <strong id="countInvestigating">
      0
    </strong>

  </div>


  <div class="stat resolved">

    <span>Resolved</span>

    <strong id="countResolved">
      0
    </strong>

  </div>


  <div class="stat dismissed">

    <span>Dismissed</span>

    <strong id="countDismissed">
      0
    </strong>

  </div>

</section>


<!-- =====================================================
     FILTER TABS
===================================================== -->

<div class="toolbar">

  <div
    class="tabs"
    id="tabs"
  >

    <button
      class="tab active"
      data-status="pending"
    >
      Pending
    </button>

    <button
      class="tab"
      data-status="investigating"
    >
      Investigating
    </button>

    <button
      class="tab"
      data-status="resolved"
    >
      Resolved
    </button>

    <button
      class="tab"
      data-status="dismissed"
    >
      Dismissed
    </button>

    <button
      class="tab"
      data-status="all"
    >
      All
    </button>

  </div>

</div>


<main
  class="reports"
  id="reports"
>

  <div class="loading">
    Loading reports…
  </div>

</main>

</div>


<!-- =====================================================
     LOGIN
===================================================== -->

<div
  class="login"
  id="loginBox"
  style="display:none"
>

  <h2>
    Owner access required
  </h2>

  <p>
    You must be signed in with a ToTalk account
    that has an owner, admin, or moderator role.
  </p>

  <button
    class="btn primary"
    id="goChatBtn"
  >
    Open ToTalk
  </button>

</div>


<!-- =====================================================
     CONVERSATION MODAL
===================================================== -->

<div
  class="modal"
  id="conversationModal"
>

  <div class="modal-box">


    <div class="modal-head">

      <div class="modal-title">

        <strong>
          Conversation
        </strong>

        <span id="conversationIdLabel">
          Loading…
        </span>

      </div>


      <button
        class="close-btn"
        id="closeConversationBtn"
        aria-label="Close conversation"
      >

        <svg viewBox="0 0 24 24">

          <path d="M6 6l12 12"/>

          <path d="M18 6L6 18"/>

        </svg>

      </button>

    </div>


    <div
      class="conversation"
      id="conversation"
    >

      <div class="conversation-loading">

        Loading conversation…

      </div>

    </div>

  </div>

</div>


<!-- =====================================================
     TOAST
===================================================== -->

<div
  class="toast"
  id="toast"
></div>


<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://qiynczbrhpxwuabwuyiy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_eUPz4c_nYckgINEK-AIWqw_JAXIHozd";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );


/* =====================================================
   ELEMENTS
===================================================== */

const app =
  document.getElementById("app");

const loginBox =
  document.getElementById("loginBox");

const reportsEl =
  document.getElementById("reports");

const errorBanner =
  document.getElementById("errorBanner");

const toast =
  document.getElementById("toast");

const conversationModal =
  document.getElementById(
    "conversationModal"
  );

const conversationEl =
  document.getElementById(
    "conversation"
  );

const conversationIdLabel =
  document.getElementById(
    "conversationIdLabel"
  );


/* =====================================================
   STATE
===================================================== */

let currentStatus =
  "pending";

let allReports = [];


/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>'"]/g,
    char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "'":"&#39;",
      '"':"&quot;"
    })[char]
  );

}


/* =====================================================
   DATE
===================================================== */

function fmtDate(value){

  if(!value){
    return "—";
  }

  const date =
    new Date(value);

  if(
    isNaN(date.getTime())
  ){
    return String(value);
  }

  return date.toLocaleString(
    [],
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );

}


/* =====================================================
   ERROR
===================================================== */

function showError(message){

  errorBanner.textContent =
    message || "";

  errorBanner.classList.toggle(
    "show",
    !!message
  );

}


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    showToast.timer
  );

  showToast.timer =
    setTimeout(
      ()=>{
        toast.classList.remove(
          "show"
        );
      },
      2600
    );

}


/* =====================================================
   COUNTS
===================================================== */

function setCounts(rows){

  const counts = {
    pending:0,
    investigating:0,
    resolved:0,
    dismissed:0
  };

  rows.forEach(
    row => {

      if(
        counts[row.status] !== undefined
      ){
        counts[row.status]++;
      }

    }
  );


  document.getElementById(
    "countPending"
  ).textContent =
    counts.pending;

  document.getElementById(
    "countInvestigating"
  ).textContent =
    counts.investigating;

  document.getElementById(
    "countResolved"
  ).textContent =
    counts.resolved;

  document.getElementById(
    "countDismissed"
  ).textContent =
    counts.dismissed;

}


/* =====================================================
   PERSON
===================================================== */

function person(
  label,
  name,
  id
){

  return `

    <div class="person">

      <label>
        ${esc(label)}
      </label>

      <strong>
        ${esc(name || "Unknown user")}
      </strong>

      <code>
        ${esc(id || "No ToTalk ID")}
      </code>

    </div>

  `;

}


/* =====================================================
   REPORT CARD
===================================================== */

function card(report){

  const status =
    [
      "pending",
      "investigating",
      "resolved",
      "dismissed"
    ].includes(
      report.status
    )
      ? report.status
      : "pending";


  return `

    <article
      class="card"
      data-id="${esc(report.id)}"
    >

      <div class="card-head">

        <div>

          <strong>
            Report #${esc(report.id)}
          </strong>

          <div class="idline">

            Submitted
            ${esc(
              fmtDate(
                report.created_at
              )
            )}

          </div>

        </div>


        <span
          class="status ${status}"
        >

          ${esc(
            status
              .charAt(0)
              .toUpperCase() +
            status.slice(1)
          )}

        </span>

      </div>


      <div class="people">

        ${person(
          "Reporter",
          report.reporter_name,
          report.reporter_totalk_id
        )}

        ${person(
          "Reported user",
          report.reported_name,
          report.reported_totalk_id
        )}

      </div>


      <div class="reason">

        <b>Reason:</b>

        ${esc(
          report.reason ||
          "Not specified"
        )}

      </div>


      ${
        report.details
          ? `

            <div class="details">

              <b>Details:</b>

              ${esc(
                report.details
              )}

            </div>

          `
          : ""
      }


      <div class="meta">

        Conversation:
        ${esc(
          report.conversation_id ||
          "—"
        )}

      </div>


      ${
        report.conversation_id
          ? `

            <button
              class="btn view"
              data-view-conversation="1"
              data-conversation-id="${esc(
                report.conversation_id
              )}"
            >

              <svg viewBox="0 0 24 24">

                <rect
                  x="4"
                  y="4"
                  width="16"
                  height="16"
                  rx="4"
                />

                <path
                  d="M8 10h8M8 14h5"
                />

              </svg>

              View Conversation

            </button>

          `
          : ""
      }


      <div class="controls">


        <div class="field">

          <label>
            Status
          </label>

          <select
            class="statusSelect"
          >

            <option value="pending">
              Pending
            </option>

            <option value="investigating">
              Investigating
            </option>

            <option value="resolved">
              Resolved
            </option>

            <option value="dismissed">
              Dismissed
            </option>

          </select>

        </div>


        <div class="field">

          <label>
            Action
          </label>

          <select
            class="actionSelect"
          >

            <option value="">
              No action
            </option>

            <option value="warning">
              Warning
            </option>

            <option value="restrict">
              Restrict
            </option>

            <option value="suspend">
              Suspend
            </option>

            <option value="ban">
              Ban
            </option>

          </select>

        </div>


        <div class="field notes">

          <label>
            Admin notes
          </label>

          <textarea
            class="notesInput"
            placeholder="Private moderation note…"
          ></textarea>

        </div>


        <button
          class="btn primary save"
          data-save="1"
        >
          Save
        </button>

      </div>

    </article>

  `;

}


/* =====================================================
   RENDER REPORTS
===================================================== */

function render(){

  const rows =
    currentStatus === "all"
      ? allReports
      : allReports.filter(
          report =>
            report.status ===
            currentStatus
        );


  if(!rows.length){

    reportsEl.innerHTML = `

      <div class="empty">

        <strong>

          ${
            currentStatus === "all"
              ? "No reports."
              : currentStatus +
                " reports."
          }

        </strong>

        You're all caught up here.

      </div>

    `;

    return;

  }


  reportsEl.innerHTML =
    rows.map(
      card
    ).join("");


  rows.forEach(
    report => {

      const element =
        reportsEl.querySelector(
          `[data-id="${CSS.escape(
            String(report.id)
          )}"]`
        );


      if(!element){
        return;
      }


      element.querySelector(
        ".statusSelect"
      ).value =
        [
          "pending",
          "investigating",
          "resolved",
          "dismissed"
        ].includes(
          report.status
        )
          ? report.status
          : "pending";


      element.querySelector(
        ".actionSelect"
      ).value =
        report.action ||
        "";


      element.querySelector(
        ".notesInput"
      ).value =
        report.admin_notes ||
        "";

    }
  );

}


/* =====================================================
   LOAD REPORTS
===================================================== */

async function loadReports(){

  showError("");

  reportsEl.innerHTML = `

    <div class="loading">
      Loading reports…
    </div>

  `;


  const {
    data,
    error
  } =
    await supabaseClient
      .rpc(
        "admin_list_reports",
        {
          p_status:null
        }
      );


  if(error){

    console.error(error);

    showError(
      "Could not load reports: " +
      error.message
    );


    reportsEl.innerHTML = `

      <div class="empty">

        <strong>
          Could not load reports.
        </strong>

        Check your admin permissions
        and Supabase function setup.

      </div>

    `;

    return;

  }


  allReports =
    Array.isArray(data)
      ? data
      : [];


  setCounts(
    allReports
  );


  render();

}


/* =====================================================
   SAVE REPORT
===================================================== */

async function saveReport(
  element
){

  const id =
    element.dataset.id;


  const status =
    element.querySelector(
      ".statusSelect"
    ).value;


  const action =
    element.querySelector(
      ".actionSelect"
    ).value ||
    null;


  const notes =
    element.querySelector(
      ".notesInput"
    ).value.trim() ||
    null;


  const button =
    element.querySelector(
      "[data-save]"
    );


  button.disabled =
    true;

  button.textContent =
    "Saving…";

  showError("");


  const {
    data,
    error
  } =
    await supabaseClient
      .rpc(
        "admin_update_report",
        {
          p_report_id:Number(id),
          p_status:status,
          p_action:action,
          p_admin_notes:notes
        }
      );


  if(
    error ||
    data !== true
  ){

    console.error(error);

    showError(
      "Could not update report #" +
      id +
      ": " +
      (
        error?.message ||
        "Update was not accepted."
      )
    );


    button.disabled =
      false;

    button.textContent =
      "Save";

    return;

  }


  showToast(
    "Report #" +
    id +
    " updated"
  );


  await loadReports();

}


/* =====================================================
   OPEN CONVERSATION
===================================================== */

async function openConversation(
  conversationId
){

  if(!conversationId){
    return;
  }


  conversationModal.classList.add(
    "show"
  );


  conversationIdLabel.textContent =
    "Conversation ID: " +
    conversationId;


  conversationEl.innerHTML = `

    <div class="conversation-loading">

      Loading conversation…

    </div>

  `;


  const {
    data,
    error
  } =
    await supabaseClient
      .rpc(
        "admin_view_conversation",
        {
          p_conversation_id:
            conversationId
        }
      );


  if(error){

    console.error(
      "Conversation error:",
      error
    );


    conversationEl.innerHTML = `

      <div class="conversation-empty">

        <div>

          <strong
            style="
              display:block;
              color:var(--white);
              margin-bottom:6px;
            "
          >

            Could not load conversation

          </strong>

          <span>

            ${esc(
              error.message
            )}

          </span>

        </div>

      </div>

    `;

    return;

  }


  const rows =
    Array.isArray(data)
      ? data
      : [];


  if(!rows.length){

    conversationEl.innerHTML = `

      <div class="conversation-empty">

        No messages found
        in this conversation.

      </div>

    `;

    return;

  }


  conversationEl.innerHTML =
    rows.map(
      message => {


        const deleted =
          !!message.is_deleted ||
          !!message.deleted_at;


        const messageText =
          deleted
            ? "[Message deleted by user]"
            : (
                message.message_text ||
                ""
              );


        const senderName =
          message.sender_name ||
          "Unknown user";


        const totalkId =
          message.totalk_id ||
          "No ToTalk ID";


        /*
         * First letter avatar.
         */

        const avatarLetter =
          senderName
            .trim()
            .charAt(0)
            .toUpperCase() ||
          "?";


        return `

          <div
            class="
              message
              ${
                deleted
                  ? "deleted"
                  : ""
              }
            "
          >

            <div class="message-inner">


              <div class="message-info">

                <span
                  class="sender-avatar"
                >
                  ${esc(
                    avatarLetter
                  )}
                </span>


                <span class="sender-name">

                  ${esc(
                    senderName
                  )}

                </span>


                <span class="sender-id">

                  ${esc(
                    totalkId
                  )}

                </span>

              </div>


              <div class="bubble">

                ${esc(
                  messageText
                )}

              </div>


              ${
                deleted
                  ? `

                    <div class="deleted-label">

                      <svg viewBox="0 0 24 24">

                        <path d="M4 7h16"/>

                        <path d="M9 7V4h6v3"/>

                        <path d="M7 7l1 13h8l1-13"/>

                      </svg>

                      Deleted message preserved
                      for moderation

                    </div>

                  `
                  : ""
              }


              <div class="message-time">

                ${esc(
                  fmtDate(
                    message.created_at
                  )
                )}

                ${
                  message.edited_at &&
                  !deleted
                    ? " · Edited"
                    : ""
                }

              </div>

            </div>

          </div>

        `;

      }
    ).join("");

}


/* =====================================================
   CLOSE CONVERSATION
===================================================== */

function closeConversation(){

  conversationModal.classList.remove(
    "show"
  );

}


/* =====================================================
   BOOT
===================================================== */

async function boot(){

  const {
    data:{
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();


  if(!session){

    loginBox.style.display =
      "block";

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .rpc(
        "is_totalk_admin"
      );


  if(
    error ||
    data !== true
  ){

    loginBox.style.display =
      "block";


    showError(
      error?.message ||
      "This account does not have admin access."
    );


    return;

  }


  app.style.display =
    "block";


  await loadReports();

}


/* =====================================================
   REFRESH
===================================================== */

document
  .getElementById(
    "refreshBtn"
  )
  .addEventListener(
    "click",
    loadReports
  );


/* =====================================================
   SIGN OUT
===================================================== */

document
  .getElementById(
    "signOutBtn"
  )
  .addEventListener(
    "click",
    async ()=>{

      await supabaseClient
        .auth
        .signOut();

      location.reload();

    }
  );


/* =====================================================
   OPEN CHAT
===================================================== */

document
  .getElementById(
    "goChatBtn"
  )
  .addEventListener(
    "click",
    ()=>{
      location.href =
        "chat.html";
    }
  );


/* =====================================================
   TABS
===================================================== */

document
  .getElementById(
    "tabs"
  )
  .addEventListener(
    "click",
    event => {

      const button =
        event.target.closest(
          ".tab"
        );


      if(!button){
        return;
      }


      document
        .querySelectorAll(
          ".tab"
        )
        .forEach(
          item =>
            item.classList.remove(
              "active"
            )
        );


      button.classList.add(
        "active"
      );


      currentStatus =
        button.dataset.status;


      render();

    }
  );


/* =====================================================
   REPORT BUTTONS
===================================================== */

reportsEl.addEventListener(
  "click",
  event => {


    const viewButton =
      event.target.closest(
        "[data-view-conversation]"
      );


    if(viewButton){

      openConversation(
        viewButton.dataset
          .conversationId
      );

      return;

    }


    const saveButton =
      event.target.closest(
        "[data-save]"
      );


    if(!saveButton){
      return;
    }


    const reportCard =
      saveButton.closest(
        ".card"
      );


    if(reportCard){

      saveReport(
        reportCard
      );

    }

  }
);


/* =====================================================
   CLOSE MODAL
===================================================== */

document
  .getElementById(
    "closeConversationBtn"
  )
  .addEventListener(
    "click",
    closeConversation
  );


conversationModal.addEventListener(
  "click",
  event => {

    if(
      event.target ===
      conversationModal
    ){

      closeConversation();

    }

  }
);


/* =====================================================
   ESCAPE
===================================================== */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Escape" &&
      conversationModal.classList.contains(
        "show"
      )
    ){

      closeConversation();

    }

  }
);


/* =====================================================
   AUTH
===================================================== */

supabaseClient
  .auth
  .onAuthStateChange(
    event => {

      if(
        event ===
        "SIGNED_OUT"
      ){

        location.reload();

      }

    }
  );


/* =====================================================
   START
===================================================== */

boot();

</script>

</body>
</html>
