<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ToTalk — Talk. Connect. Be You.</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4fbff;
      color: #12304a;
      min-height: 100vh;
    }

    /* TOP BAR */

    nav {
      height: 78px;
      padding: 0 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid #e0edf3;
      position: relative;
      z-index: 5;
    }

    .logo {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .logo span {
      color: #f2c230;
    }

    /* THE ONLY LOGIN BUTTON */

    .login-btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 30px;
      background: #12304a;
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      transition: 0.25s;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(18,48,74,0.2);
    }

    /* HERO */

    .hero {
      min-height: calc(100vh - 78px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 70px 20px;
      position: relative;
      overflow: hidden;

      background:
        radial-gradient(circle at 10% 15%, #ccefff 0, transparent 28%),
        radial-gradient(circle at 90% 20%, #fff0a8 0, transparent 27%),
        linear-gradient(135deg, #f7fdff, #e9f8ff);
    }

    /* DECORATIVE CIRCLES */

    .circle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .circle-one {
      width: 240px;
      height: 240px;
      background: #d8f5ff;
      left: -110px;
      bottom: -70px;
    }

    .circle-two {
      width: 150px;
      height: 150px;
      background: #fff3b7;
      right: -55px;
      bottom: 80px;
    }

    .circle-three {
      width: 65px;
      height: 65px;
      background: #ffe77c;
      left: 13%;
      top: 18%;
    }

    .content {
      max-width: 850px;
      position: relative;
      z-index: 2;
    }

    .tag {
      display: inline-block;
      padding: 9px 17px;
      border-radius: 30px;
      background: #fff2ad;
      border: 1px solid #f5df70;
      color: #705900;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(52px, 9vw, 94px);
      line-height: 0.98;
      letter-spacing: -5px;
      font-weight: 900;
      margin-bottom: 28px;
    }

    h1 .yellow {
      color: #edbd22;
    }

    .description {
      max-width: 650px;
      margin: auto;
      color: #5d7485;
      font-size: 19px;
      line-height: 1.7;
    }

    .creator {
      margin-top: 28px;
      color: #718998;
      font-size: 14px;
    }

    .creator strong {
      color: #12304a;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      nav {
        padding: 0 5%;
      }

      .logo {
        font-size: 24px;
      }

      .login-btn {
        padding: 10px 19px;
      }

      .hero {
        min-height: calc(100vh - 78px);
        padding: 50px 20px;
      }

      h1 {
        font-size: 56px;
        letter-spacing: -3px;
      }

      .description {
        font-size: 17px;
      }

      .circle-three {
        left: 5%;
      }
    }
  </style>
</head>

<body>

  <!-- NAVIGATION -->

  <nav>
    <div class="logo">
      To<span>Talk</span>
    </div>

    <!-- ONLY LOGIN BUTTON ON THE WHOLE WEBSITE -->
    <a href="#" class="login-btn" id="loginBtn">
      Login
    </a>
  </nav>


  <!-- MAIN HOMEPAGE -->

  <main class="hero">

    <div class="circle circle-one"></div>
    <div class="circle circle-two"></div>
    <div class="circle circle-three"></div>

    <div class="content">

      <div class="tag">
        ✦ Welcome to ToTalk
      </div>

      <h1>
        Talk.<br>
        <span class="yellow">Connect.</span><br>
        Be You.
      </h1>

      <p class="description">
        A simple place to chat, connect and enjoy
        real conversations. Nothing complicated.
        Just ToTalk.
      </p>

      <p class="creator">
        Created by <strong>Sameer</strong>
      </p>

    </div>

  </main>


  <script>

    /*
      GOOGLE LOGIN WILL BE CONNECTED TO THIS
      SINGLE LOGIN BUTTON.

      We are keeping the button ready now.
    */

    document.getElementById("loginBtn").addEventListener("click", function(event) {
      event.preventDefault();

      alert("Google Login connection will be added here.");
    });

  </script>

</body>
</html>
