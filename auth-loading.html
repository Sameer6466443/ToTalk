<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>ToTalk</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
}

body{

  overflow:hidden;

  color:#fff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:

    radial-gradient(
      circle at 50% 45%,
      rgba(111,66,255,.20),
      transparent 25%
    ),

    radial-gradient(
      circle at 20% 80%,
      rgba(72,38,180,.16),
      transparent 32%
    ),

    linear-gradient(
      180deg,
      #01020a 0%,
      #050817 52%,
      #010109 100%
    );

}


/* STARS */

body::before{

  content:"";

  position:fixed;

  inset:0;

  pointer-events:none;

  opacity:.9;

  background-image:

    radial-gradient(
      circle at 7% 14%,
      #fff 0 1px,
      transparent 1.5px
    ),

    radial-gradient(
      circle at 19% 72%,
      #cdb4ff 0 1px,
      transparent 1.5px
    ),

    radial-gradient(
      circle at 31% 24%,
      #fff 0 1px,
      transparent 1.5px
    ),

    radial-gradient(
      circle at 44% 82%,
      #fff 0 1px,
      transparent 1.5px
    ),

    radial-gradient(
      circle at 58% 13%,
      #d9c4ff 0 1px,
      transparent 1.5px
    ),

    radial-gradient(
      circle at 70% 67%,
      #fff 0 1px,
      transparent 1.5px
    ),

    radial-gradient(
      circle at 83% 20%,
      #cdb4ff 0 1px,
      transparent 1.5px
    ),

    radial-gradient(
      circle at 94% 84%,
      #fff 0 1px,
      transparent 1.5px
    );

  animation:
    stars 3s ease-in-out infinite alternate;

}


/* NEBULA */

body::after{

  content:"";

  position:absolute;

  width:90vmax;

  height:55vmax;

  left:50%;

  top:45%;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  background:

    radial-gradient(
      ellipse,
      rgba(129,77,255,.20),
      rgba(73,40,190,.07) 45%,
      transparent 72%
    );

  filter:blur(28px);

  animation:
    nebula 7s ease-in-out infinite alternate;

}


/* PAGE */

.loading-page{

  position:relative;

  z-index:5;

  width:100%;

  height:100%;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

}


/* MOON SYSTEM */

.login-system{

  width:300px;

  height:300px;

  position:relative;

  display:grid;

  place-items:center;

  animation:
    float 4s ease-in-out infinite;

}


/* ORBIT */

.login-orbit{

  position:absolute;

  width:330px;

  height:105px;

  border:
    1px solid
    rgba(178,121,255,.48);

  border-radius:50%;

  transform:
    rotate(-22deg);

  box-shadow:
    0 0 28px
    rgba(118,67,255,.15);

  animation:
    orbit 5s linear infinite;

}

.login-orbit.two{

  width:300px;

  height:155px;

  transform:
    rotate(32deg);

  opacity:.55;

  animation-duration:7s;

  animation-direction:reverse;

}


/* MOON */

.login-moon{

  width:145px;

  height:145px;

  border-radius:50%;

  position:relative;

  overflow:hidden;

  background:

    radial-gradient(
      circle at 28% 30%,
      rgba(80,80,100,.28) 0 11px,
      transparent 12px
    ),

    radial-gradient(
      circle at 67% 28%,
      rgba(80,80,100,.22) 0 19px,
      transparent 20px
    ),

    radial-gradient(
      circle at 40% 66%,
      rgba(80,80,100,.20) 0 16px,
      transparent 17px
    ),

    radial-gradient(
      circle at 70% 70%,
      rgba(80,80,100,.18) 0 13px,
      transparent 14px
    ),

    radial-gradient(
      circle at 42% 40%,
      rgba(255,255,255,.68),
      transparent 38%
    ),

    linear-gradient(
      145deg,
      #fafaff,
      #aaaab8 72%,
      #686876
    );

  box-shadow:

    inset -18px -16px 30px
    rgba(25,25,45,.24),

    inset 10px 10px 22px
    rgba(255,255,255,.65),

    0 0 55px
    rgba(177,135,255,.52);

  animation:
    moonRotate 12s linear infinite;

}


.login-moon::after{

  content:"";

  position:absolute;

  inset:-15%;

  border-radius:50%;

  background:

    linear-gradient(
      110deg,
      transparent 35%,
      rgba(255,255,255,.22) 48%,
      transparent 60%
    );

  animation:
    light 4s ease-in-out infinite;

}


/* MOON DETAILS */

.login-moon span{

  position:absolute;

  border-radius:50%;

  background:
    rgba(90,90,105,.18);

  z-index:2;

}

.login-moon span:nth-child(1){

  width:9px;

  height:9px;

  left:28px;

  top:70px;

}

.login-moon span:nth-child(2){

  width:15px;

  height:15px;

  right:28px;

  top:47px;

}

.login-moon span:nth-child(3){

  width:11px;

  height:11px;

  left:73px;

  bottom:25px;

}


/* TEXT */

.loading-title{

  margin-top:30px;

  font-size:28px;

  font-weight:800;

  letter-spacing:-.8px;

  text-shadow:
    0 0 25px
    rgba(177,126,255,.65);

  animation:
    textIn 1s ease both;

}

.loading-sub{

  margin-top:10px;

  color:#aaa8ba;

  font-size:14px;

  letter-spacing:1px;

  animation:
    textIn 1s .15s ease both;

}


/* DOTS */

.loading-dots{

  display:flex;

  gap:7px;

  margin-top:22px;

}

.loading-dots i{

  width:6px;

  height:6px;

  border-radius:50%;

  background:#b875ff;

  box-shadow:
    0 0 12px
    rgba(184,117,255,.9);

  animation:
    dot 1s ease-in-out infinite;

}

.loading-dots i:nth-child(2){

  animation-delay:.15s;

}

.loading-dots i:nth-child(3){

  animation-delay:.3s;

}


/* ANIMATIONS */

@keyframes stars{

  to{

    opacity:.5;

    transform:
      scale(1.015);

  }

}

@keyframes nebula{

  to{

    transform:
      translate(-45%,-46%)
      scale(1.08);

  }

}

@keyframes float{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-10px);
  }

}

@keyframes orbit{

  from{
    transform:rotate(-22deg);
  }

  to{
    transform:rotate(338deg);
  }

}

@keyframes moonRotate{

  from{
    transform:rotate(0);
  }

  to{
    transform:rotate(360deg);
  }

}

@keyframes light{

  0%,100%{
    transform:translateX(-100%);
  }

  50%{
    transform:translateX(100%);
  }

}

@keyframes textIn{

  from{

    opacity:0;

    transform:
      translateY(8px);

  }

  to{

    opacity:1;

    transform:
      translateY(0);

  }

}

@keyframes dot{

  0%,100%{

    transform:
      translateY(0);

    opacity:.4;

  }

  50%{

    transform:
      translateY(-5px);

    opacity:1;

  }

}


/* MOBILE */

@media(max-width:800px){

  .login-system{

    width:250px;

    height:250px;

  }

  .login-orbit{

    width:285px;

    height:92px;

  }

  .login-orbit.two{

    width:260px;

    height:135px;

  }

  .login-moon{

    width:125px;

    height:125px;

  }

  .loading-title{

    font-size:24px;

  }

  .loading-sub{

    font-size:12px;

  }

}


/* REDUCED MOTION */

@media(prefers-reduced-motion:reduce){

  *{

    animation-duration:.01ms!important;

    animation-iteration-count:1!important;

  }

}

</style>
</head>


<body>


<div class="loading-page">


  <div class="login-system">


    <div class="login-orbit"></div>


    <div class="login-orbit two"></div>


    <div class="login-moon">

      <span></span>

      <span></span>

      <span></span>

    </div>


  </div>


  <div
    class="loading-title"
    id="loadingTitle"
  >
    Welcome to ToTalk
  </div>


  <div
    class="loading-sub"
    id="loadingSub"
  >
    Checking your account
  </div>


  <div
    class="loading-dots"
  >

    <i></i>

    <i></i>

    <i></i>

  </div>


</div>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
  "https://qiynczbrhpxwuabwuyiy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_eUPz4c_nYckgINEK-AIWqw_JAXIHozd";


const supabaseClient =
  supabase.createClient(

    SUPABASE_URL,

    SUPABASE_KEY,

    {

      auth:{

        persistSession:true,

        autoRefreshToken:true,

        detectSessionInUrl:true,

        flowType:"pkce"

      }

    }

  );


/* =========================================================
   TEXT ELEMENTS
   ========================================================= */

const loadingTitle =
  document.getElementById(
    "loadingTitle"
  );


const loadingSub =
  document.getElementById(
    "loadingSub"
  );


/* =========================================================
   GET USER
   ========================================================= */

async function getUser(){

  for(
    let attempt = 0;
    attempt < 12;
    attempt++
  ){

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();


    if(

      !error &&

      data &&

      data.session &&

      data.session.user

    ){

      return data.session.user;

    }


    await new Promise(
      function(resolve){

        setTimeout(
          resolve,
          400
        );

      }
    );

  }


  return null;

}


/* =========================================================
   GET PROFILE
   ========================================================= */

async function getProfile(
  userId
){

  const {
    data,
    error
  } =
    await supabaseClient

      .from("profiles")

      .select(
        "profile_completed"
      )

      .eq(
        "user_id",
        userId
      )

      .maybeSingle();


  if(error){

    console.error(
      "Profile check error:",
      error
    );

    return null;

  }


  return data;

}


/* =========================================================
   START
   ========================================================= */

async function start(){

  const user =
    await getUser();


  /* =======================================================
     NO USER
     ======================================================= */

  if(!user){

    loadingTitle.textContent =
      "Sign-in failed";

    loadingSub.textContent =
      "Returning to ToTalk";


    setTimeout(
      function(){

        window.location.replace(
          "./index.html"
        );

      },
      1500
    );


    return;

  }


  /* =======================================================
     PROFILE CHECK
     ======================================================= */

  const profile =
    await getProfile(
      user.id
    );


  /* =======================================================
     EXISTING USER
     ======================================================= */

  if(

    profile &&

    profile.profile_completed === true

  ){

    loadingTitle.textContent =
      "Welcome back";


    loadingSub.textContent =
      "Opening your conversations";


    await new Promise(
      function(resolve){

        setTimeout(
          resolve,
          1400
        );

      }
    );


    window.location.replace(
      "./chat.html"
    );


    return;

  }


  /* =======================================================
     NEW USER
     ======================================================= */

  loadingTitle.textContent =
    "Welcome to ToTalk";


  loadingSub.textContent =
    "Let's create your profile";


  await new Promise(
    function(resolve){

      setTimeout(
        resolve,
        1400
      );

    }
  );


  window.location.replace(
    "./profile-maker.html"
  );

}


/* =========================================================
   RUN
   ========================================================= */

start();

</script>

</body>
</html>
